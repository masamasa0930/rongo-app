かった。たまたまふれられると、必ず天命とか仁とかいうことと結びつけて話された。",["gi"]],[207,8,2,"達巷党人曰：「大哉孔子！博学而無所成名。」子聞之，謂門弟子曰：「吾何執？執御乎？執射乎？吾執御矣！」","達巷党の人曰く、大なるかな孔子。博く学びて名を成す所無し。子之を聞き、門弟子に謂いて曰く、吾何をか執らん。御を執らんか、射を執らんか。吾は御を執らん。","博学ゆえ専門の名がないと言われ、孔子は「では御者でも名乗ろうか」と軽く受けた。","看板になる専門がないことを、弱みだと決めつけていないか。",["lonely"],[],1,"達巷という村のある人がいった。――\n「孔先生はすばらしい先生だ。博学で何ごとにも通じてお出でなので、これという特長が目立たず、そのために、却って有名におなりになることがない。」\n　先師はこれを聞かれ、門人たちにたわむれていわれた。――\n「さあ、何で有名になってやろう。御にするかな、射にするかな。やっぱり一番たやすい御ぐらいにしておこう。」",["rei"]],[208,8,3,"子曰：「麻冕，礼也；今也純，儉，吾従眾。拝下，礼也；今拝乎上，泰也。雖違眾，吾従下。」","子曰く、麻冕は礼なり。今や純なるは倹なり。吾は衆に従わん。下に拝するは礼なり。今上に拝するは泰なり。衆に違うと雖も、吾は下に従わん。","倹約になる変化には従い、驕りから来る変化には、一人でも従わない。","時流に合わせる点と、一人でも譲らない点を分けているか。",["decide"],["迷い"],1,"先師がいわれた。――\n「麻の冠をかぶるのが古礼だが、今では絹糸の冠をかぶる風習になった。これは節約のためだ。私はみんなのやり方に従おう。臣下は堂下で君主を拝するのが古礼だが、今では堂上で拝する風習になった。これは臣下の増長だ。私は、みんなのやり方とはちがうが、やはり堂下で拝することにしよう。」",["rei"]],[209,8,4,"子絕四：「毋意，毋必，毋固，毋我。」","子、四を絶つ。意毋く、必毋く、固毋く、我毋し。","思い込み、無理押し、固執、我を張ること。孔子はこの四つを断っていた。","いまの判断に、思い込みや意地がどれだけ混じっているか。",["self","decide"],["慢心","怒り"],3,"先師に絶無といえるものが四つあった。それは、独善、執着、固陋、利己である。",["chi"]],[210,8,5,"子畏於匡。曰：「文王既没，文不在茲乎？天之将喪斯文也，後死者，不得与於斯文也。天之未喪斯文也，匡人其如予何？」","子、匡に畏す。曰く、文王既に没したれども、文茲に在らずや。天の将に斯の文を喪ぼさんとするや、後死の者、斯の文に与るを得ざるなり。天の未だ斯の文を喪ぼさざるや、匡人其れ予を如何せん。","命の危機にあっても、自分が担う使命を信じて動じなかった。","窮地でも揺らがないと言える、自分の使命は何か。",["fail","vision"],["不安"],2,"先師が匡で遭難された時いわれた。――\n「文王がなくなられた後、文という言葉の内容をなす古聖の道は、天意によってこの私に継承されているではないか。もしその文をほろぼそうとするのが天意であるならば、何で、後の世に生れたこの私に、文に親しむ機会が与えられよう。文をほろぼすまいというのが天意であるかぎり、匡の人たちが、いったい私に対して何が出来るというのだ。」",["gi"]],[211,8,6,"大宰問於子貢曰：「夫子聖者与？何其多能也？」子貢曰：「固天縦之将聖，又多能也。」子聞之曰：「大宰知我乎！吾少也賎，故多能鄙事。君子多乎哉？不多也！」牢曰：「子云：『吾不試，故芸。』」","大宰、子貢に問いて曰く、夫子は聖者か。何ぞ其れ多能なるや。子貢曰く、固より天之を縦して将に聖ならしめんとす。又多能なり。子之を聞きて曰く、大宰は我を知れるか。吾少くして賤し。故に鄙事に多能なり。君子、多ならんや。多ならざるなり。牢曰く、子云う、吾試いられず、故に芸ありと。","多芸なのは若い頃の苦労のせい。人の上に立つ者の本質は器用さではない。","何でも自分でこなせることを、リーダーの価値と取り違えていないか。",["grow","self"],[],1,"大宰が子貢にたずねていった。――\n「孔先生のような人をこそ聖人というのでしょう。実に多能であられる。」\n　子貢がこたえた。――\n「もとより天意にかなった大徳のお方で、まさに聖人の域に達しておられます。しかも、その上に多能でもあられます。」\n　この問答の話をきかれて、先師はいわれた。――\n「大宰はよく私のことを知っておられる。私は若いころには微賎な身分だったので、つまらぬ仕事をいろいろと覚えこんだものだ。しかし、多能だから君子だと思われたのでは赤面する。いったい君子というものの本質が多能ということにあっていいものだろうか。決してそんなことはない。」\n　先師のこの言葉に関連したことで、門人の牢も、こんなことをいった。――\n「先生は、自分は世に用いられなかったために、諸芸に習熟した、といわれたことがある。」",["chi"]],[212,8,7,"子曰：「吾有知乎哉？無知也。有鄙夫問於我，空空如也，我扣其両端而竭焉。」","子曰く、吾知ること有らんや。知ること無きなり。鄙夫有りて我に問う、空空如たり。我其の両端を叩きて竭くす。","自分は物知りではない。ただ真剣な問いには、両面から突き詰めて応える。","部下の素朴な問いに、端から端まで考え抜いて応えているか。",["grow","self"],["慢心"],2,"先師がいわれた。\n「私が何を知っていよう。何も知ってはいないのだ。だが、もし、田舎の無知な人が私に物をたずねることがあるとして、それが本気で誠実でさえあれば、私は、物事の両端をたたいて徹底的に教えてやりたいと思う。」",["chi"]],[213,8,8,"子曰：「鳳鳥不至，河不出図，吾已矣夫！」","子曰く、鳳鳥至らず、河、図を出ださず。吾已んぬるかな。","良い時代の兆しが現れない。孔子でさえ「もう終わりか」と嘆いた。","嘆きたくなる日、その落胆を誰かに打ち明けられているか。",["fail","lonely"],["落胆","疲れ"],1,"先師がいわれた。――\n「鳳鳥も飛んで来なくなった。河からは図も出なくなった。これでは私も生きている力がない。」",[]],[214,8,9,"子見斉衰者，冕衣裳者，与瞽者，見之，雖少必作，過之必趨。","子、斉衰の者と冕衣裳の者と瞽者とを見れば、之を見ては少しと雖も必ず作ち、之を過ぐれば必ず趨る。","喪中の人、礼装の人、目の不自由な人には、相手が年下でも必ず敬意を示した。","",[],[],0,"先師は、喪服を着た人や、衣冠束帯をした人や、盲人に出会われると、相手がご自分より年少者のものであっても、必ず起って道をゆずられ、ご自分がその人たちの前を通られる時には、必ず足を早められた。",["rei","jin"]],[215,8,10,"顔淵喟然歎曰：「仰之弥高，鑽之弥堅，瞻之在前，忽焉在後！夫子循循然善誘人：博我以文，約我以礼。欲罷不能，既竭吾才，如有所立卓爾，雖欲従之，末由也已！」","顔淵、喟然として歎じて曰く、之を仰げば弥高く、之を鑽れば弥堅し。之を瞻れば前に在り、忽焉として後に在り。夫子、循循然として善く人を誘う。我を博むるに文を以てし、我を約するに礼を以てす。罷めんと欲すれども能わず。既に吾が才を竭くす。立つ所有りて卓爾たるが如し。之に従わんと欲すと雖も、由末きのみ。","師は高く捉えがたいが、順を追って導くので、やめたくてもやめられない。","部下が「やめたくてもやめられない」と思う導き方をしているか。",["grow","lead"],[],2,"顔渕がため息をつきながら讃歎していった。――\n「先生の徳は高山のようなものだ。仰げば仰ぐほど高い。先生の信念は金石のようなものだ。鑚れば鑚るほど堅い。捕捉しがたいのは先生の高遠な道だ。前にあるかと思うと、たちまち後ろにある。先生は順序を立てて、一歩一歩とわれわれを導き、われわれの知識をひろめるには各種の典籍、文物制度を以てせられ、われわれの行動を規制するには礼を以てせられる。私はそのご指導の精妙さに魅せられて、やめようとしてもやめることが出来ず、今日まで私の才能のかぎりをつくして努力して来た。そして今では、どうなり先生の道の本体をはっきり眼の前に見ることが出来るような気がする。しかし、いざそれに追いついて捉えようとすると、やはりどうにもならない。」",["chi"]],[216,8,11,"子疾病，子路使門人為臣。病間，曰：「久矣哉，由之行詐也！無臣而為有臣，吾誰欺？欺天乎？且予与其死於臣之手也，無寧死於二三子之手乎！且予縦不得大葬，予死於道路乎？」","子の疾、病なり。子路、門人をして臣為らしむ。病間なるとき曰く、久しいかな、由の詐りを行うや。臣無くして臣有りと為す。吾誰をか欺かん。天を欺かんか。且つ予其の臣の手に死せんよりは、無寧二三子の手に死せんか。且つ予縦い大葬を得ずとも、予道路に死せんや。","家臣がいるかのような葬儀の準備を叱った。見栄で天は欺けない。","実態以上に大きく見せようとして、誰を欺こうとしているのか。",["self","profit"],["慢心"],1,"先師のご病気が重くなった時、子路は、いざという場合のことを考慮して、門人たちが臣下の礼をとって葬儀をとり行うように手はずをきめていた。その後、病気がいくらか軽くなった時、先師はそのことを知られて、子路にいわれた。――\n「由よ、お前のこしらえ事も、今にはじまったことではないが、困ったものだ。臣下のない者があるように見せかけて、いったいだれをだまそうとするのだ。天を欺こうとでもいうのか。それに第一、私は、臣下の手で葬ってもらうより、むしろ二三人の門人の手で葬ってもらいたいと思っているのだ。堂々たる葬儀をしてもらわなくても、まさか道ばたでのたれ死したことにもなるまいではないか。」",["shin","rei"]],[217,8,12,"子貢曰：「有美玉於斯，韞櫝而蔵諸？求善賈而沽諸？」子曰：「沽之哉！沽之哉！我待賈者也！」","子貢曰く、斯に美玉有り。櫝に韞めて諸を蔵せんか、善賈を求めて諸を沽らんか。子曰く、之を沽らんかな、之を沽らんかな。我は賈を待つ者なり。","才は隠さず世に出す。ただし安売りせず、価値のわかる相手を待つ。","自分の力を、安売りも出し惜しみもせず世に出せているか。",["decide","lonely"],["焦り"],2,"子貢が先師にいった。――\n「ここに美玉があります。箱におさめて大切にしまっておきましょうか。それとも、よい買手を求めてそれを売りましょうか。」\n　先師はこたえられた。――\n「売ろうとも、売ろうとも。私はよい買手を待っているのだ。」",["gi"]],[218,8,13,"子欲居九夷。或曰：「陋，如之何？」子曰：「君子居之，何陋之有？」","子、九夷に居らんと欲す。或るひと曰く、陋しきこと之を如何せん。子曰く、君子之に居らば、何の陋しきことか之有らん。","辺境でも、そこに立派な人が住めば粗野な土地ではなくなる。","環境のせいにする前に、自分がその場をどう変えられるか。",["fail","lead"],["落胆"],2,"先師が道の行われないのを歎じて九夷の地に居をうつしたいといわれたことがあった。ある人がそれをきいて先師にいった。――\n「野蠻なところでございます。あんなところに、どうしてお住居が出来ましょう。」\n　すると先師はいわれた。――\n「君子が行って住めば、いつまでも野蠻なこともあるまい。」",["shin"]],[219,8,14,"子曰：「吾自衛反魯，然後楽正，雅頌各得其所。」","子曰く、吾衛より魯に反りて、然る後に楽正しく、雅頌各其の所を得たり。","魯に帰国してから音楽を整理し、雅と頌をあるべき位置に正した。","",[],[],0,"先師がいわれた。――\n「音楽が正しくなり、雅も頌もそれぞれその所を得て誤用されないようになったのは、私が衛から魯に帰って来たあとのことだ。」",[]],[220,8,15,"子曰：「出則事公卿，入則事父兄，喪事不敢不勉，不為酒困，何有於我哉？」","子曰く、出でては則ち公卿に事え、入りては則ち父兄に事う。喪の事は敢えて勉めずんばあらず。酒の困れを為さず。何か我に有らんや。","外では上に仕え、家では年長者に仕え、葬儀に努め、酒に乱れない。それだけのこと。","当たり前のことを、当たり前に続けられているか。",["self"],[],1,"先師がいわれた。――\n「出でては国君上長に仕える。家庭にあっては父母兄姉に仕える。死者に対する礼は誠意のかぎりをつくして行う。酒は飲んでもみだれない。――私に出来ることは、先ずこのくらいなことであろうか。」",["rei"]],[221,8,16,"子在川上曰：「逝者如斯夫！不舎昼夜。」","子、川の上に在りて曰く、逝く者は斯くの如きか。昼夜を舎かず。","過ぎゆくものは川の流れのようだ。昼も夜も止まることがない。","止まらずに流れる時間を、いま何に注いでいるか。",["vision","decide"],["焦り"],2,"先師が川のほとりに立っていわれた。――\n「流転の相はこの通りだ。昼となく夜となく流れてやまない。」",[]],[222,8,17,"子曰：「吾未見好徳如好色者也。」","子曰く、吾未だ徳を好むこと色を好むが如くする者を見ざるなり。","色恋に夢中になるほどの熱で、徳を求める人には会ったことがない。","欲に向ける熱量と同じだけ、自分を磨くことに注いでいるか。",["self"],["慢心"],1,"先師がいわれた。――\n「私はまだ色事を好むほど徳を好む者を見たことがない。」",["chi"]],[223,8,18,"子曰：「譬如為山，未成一簣，止，吾止也！譬如平地，雖覆一簣，進，吾往也！」","子曰く、譬えば山を為るが如し。未だ一簣を成さざるも、止むは吾が止むなり。譬えば地を平らかにするが如し。一簣を覆すと雖も、進むは吾が往くなり。","あと一杯でやめるのも、最初の一杯を運ぶのも、決めているのは自分だ。","あと一歩のところで止めているのは、本当は誰なのか。",["fail","vision"],["落胆","疲れ"],3,"先師がいわれた。――\n「修行というものは、たとえば山を築くようなものだ。あと一簣というところで挫折しても、目的の山にはならない。そしてその罪は自分にある。また、たとえば地ならしをするようなものだ。一簣でもそこにあけたら、それだけ仕事がはかどったことになる。そしてそれは自分が進んだのだ。」",["gi"]],[224,8,19,"子曰：「語之而不惰者，其回也与！」","子曰く、之に語げて惰らざる者は、其れ回なるか。","教えたことを怠らず実行し続けるのは、顔回くらいだろうか。","聞いた教えを、その日のうちに行動に移しているか。",["grow"],[],1,"先師がいわれた。――\n「何か一つ話してやると、つぎからつぎへと精進して行くのは囘だけかな。」",["chi"]],[225,8,20,"子謂顔淵，曰：「惜乎！吾見其進也，未見其止也！」","子、顔淵を謂いて曰く、惜しいかな。吾其の進むを見るも、未だ其の止むを見ざるなり。","亡き顔淵を惜しむ。進む姿は見たが、立ち止まる姿は一度も見なかった。","周りから「止まった姿を見たことがない」と言われる歩みか。",["grow","vision"],[],1,"先師が顔淵のことをこういわれた。――\n「惜しい人物だった。私は彼が進んでいるところは見たが、彼が止まっているところを見たことがなかったのだ。」",["chi"]],[226,8,21,"子曰：「苗而不秀者，有矣夫！秀而不実者，有矣夫！」","子曰く、苗にして秀でざる者有るかな。秀でて実らざる者有るかな。","芽が出ても花が咲かない者、花が咲いても実を結ばない者がいる。","芽が出たところで満足して、実を結ぶまで続けているか。",["grow","fail"],["焦り"],2,"先師がいわれた。――\n「苗にはなつても、花が咲かないものがある。花は咲いても実を結ばないものがある。」",["chi"]],[227,8,22,"子曰：「後生可畏，焉知来者之不如今也？四十、五十而無聞焉，斯亦不足畏也已！」","子曰く、後生畏るべし。焉んぞ来者の今に如かざるを知らんや。四十五十にして聞こゆること無くんば、斯れ亦畏るるに足らざるのみ。","若い者は侮れない。だが四十、五十で名が聞こえないなら、恐れるに足りない。","若手の可能性を、自分の物差しで小さく見積もっていないか。",["grow","judge"],["慢心","焦り"],2,"先師がいわれた。\n「後輩をばかにしてはならない。彼等の将来がわれわれの現在に及ばないと誰がいい得よう。だが、四十歳にも五十歳にもなって注目をひくに足りないようでは、おそるるに足りない。」",["chi"]],[228,8,23,"子曰：「法語之言，能無従乎？改之為貴。巽与之言，能無説乎？繹之為貴。説而不繹，従而不改，吾末如之何也已矣！」","子曰く、法語の言は、能く従うこと無からんや。之を改むるを貴しと為す。巽与の言は、能く説ぶこと無からんや。之を繹ぬるを貴しと為す。説びて繹ねず、従いて改めずんば、吾之を如何ともする末きのみ。","正論にうなずくだけ、優しい言葉に喜ぶだけで、改めないなら手の施しようがない。","耳の痛い忠告にうなずいたあと、実際に何を変えたか。",["self","grow"],["慢心"],2,"先師がいわれた。――\n「正面切って道理を説かれると、誰でもその場はなるほどとうなずかざるを得ない。だが大事なのは過を改めることだ。やさしく婉曲に注意してもらうと、誰でも気持よくそれに耳を傾けることが出来る。だが、大事なのは、その真意のあるところをよく考えて見ることだ。いい気になって真意を考えて見ようともせず、表面だけ従って過を改めようとしない人は、私には全く手のつけようがない。」",["chi"]],[229,8,24,"子曰：「主忠信，毋友不如己者，過則勿憚改。」","子曰く、忠信を主とし、己に如かざる者を友とすること毋かれ。過てば則ち改むるに憚ること勿かれ。","誠実を軸にし、学べる相手と交わり、過ちはためらわずに改める。","過ちに気づいたとき、体面より先に改められるか。",["fail","judge","self"],["落胆"],2,"先師がいわれた。――\n「忠実に信義を第一義として一切の言動を貫くがいい。安易に自分より知徳の劣った人と交って、いい気になるのは禁物だ。人間だから過失はあるだろうが、大事なのは、その過失を即座に勇敢に改めることだ。」",["shin"]],[230,8,25,"子曰：「三軍可奪帥也，匹夫不可奪志也。」","子曰く、三軍も帥を奪うべきなり。匹夫も志を奪うべからざるなり。","大軍の大将は奪えても、一人の人間の志は誰にも奪えない。","すべてを失っても、誰にも奪えない自分の志は何か。",["vision","fail"],["不安","落胆"],3,"先師がいわれた。――\n「大軍の主将でも、それを捕虜に出来ないことはない。しかし、一個の平凡人でも、その人の自由な意志を奪うことは出来ない。」",["gi"]],[231,8,26,"子曰：「衣敝縕袍，与衣狐貉者立，而不恥者，其由也与！『不忮不求，何用不臧？』子路終身誦之。子曰：「是道也，何足以臧？」","子曰く、敝れたる縕袍を衣て、狐貉を衣たる者と立ちて恥じざる者は、其れ由なるか。忮わず求めず、何を用てか臧からざらん。子路終身之を誦す。子曰く、是の道や、何ぞ以て臧しとするに足らん。","身なりの差を恥じない子路を褒めたが、得意になるとすぐ戒めた。","褒められた一点に、いつまでも安住していないか。",["self","profit"],["慢心"],2,"先師がいわれた。――\n「やぶれた綿入を着て、上等の毛皮を着ている者と並んでいても、平気でいられるのは由だろうか。詩経に、\n有るをねたみて\nこころやぶれず\n無きを恥じらい\nこころまどわず、\nよきかなや、\nよきかなや。\nとあるが、由の顔を見ると私にはこの詩が思い出される。」\n　子路は、先師にそういわれたのがよほど嬉しかったと見えて、それ以来、たえずこの詩を口ずさんでいた。すると、先師はいわれた。――\n「その程度のことが何で得意になるねうちがあろう。」",["gi"]],[232,8,27,"子曰：「歳寒，然後知松柏之後凋也。」","子曰く、歳寒くして、然る後に松柏の彫むに後るるを知るなり。","厳しい寒さが来て初めて、松や柏が最後まで葉を落とさないとわかる。","逆境のいま、最後まで変わらずにいるのは誰か、自分はどうか。",["fail","judge"],["不安","落胆"],3,"先師がいわれた。――\n「寒さに向うと、松柏の常盤木であることがよくわかる。ふだんはどの木も一様に青い色をしているが。」",["gi"]],[233,8,28,"子曰：「知者不惑，仁者不憂，勇者不懼。」","子曰く、知者は惑わず、仁者は憂えず、勇者は懼れず。","道理を知れば迷わず、思いやりがあれば憂えず、勇気があれば恐れない。","いまの迷いは、知・仁・勇のどれが足りないせいか。",["decide","self"],["迷い","不安"],3,"先師がいわれた。――\n「知者には迷いがない。仁者には憂いがない。勇者にはおそれがない。」",["chi","jin"]],[234,8,29,"子曰：「可与共学，未可与適道；可与適道，未可与立；可与立，未可与権。」","子曰く、与に共に学ぶべし、未だ与に道に適くべからず。与に道に適くべし、未だ与に立つべからず。与に立つべし、未だ与に権るべからず。","共に学べる人が、共に歩み、共に立ち、臨機の判断まで共にできるとは限らない。","その人と共有できるのは、学びか、志か、それとも判断までか。",["judge","grow"],["迷い"],2,"先師がいわれた。――\n「共に学ぶことの出来る人はあろう。しかし、その人たちが共に道に精進することの出来る人であるとは限らない。共に道に精進することの出来る人はあろう。しかし、その人たちが、いざという時に確乎たる信念に立って行動を共にしうる人であるとは限らない。確乎たる信念に立って行動を共にしうる人はあろう。しかし、その人たちが、複雑な現実の諸問題に当面して、なお事を誤らないで共に進みうる人であるとは限らない。」",["chi"]],[235,8,30,"「唐棣之華，偏其反而；豈不爾思？室是遠而」。子曰：「未之思也，夫何遠之有？」","唐棣の華、偏として其れ反せり。豈爾を思わざらんや、室是れ遠ければなり。子曰く、未だ之を思わざるなり。夫れ何の遠きことか之有らん。","遠いから会えないという歌に、孔子は言う。本気で思えば遠くはない。","「遠い」「難しい」は、本気で求めていない言い訳ではないか。",["vision","decide"],["迷い"],2,"民謡にこういうのがある。\nゆすらうめの木\n花咲きゃ招く、\nひらりひらりと\n色よく招く。\n招きゃこの胸\nこがれるばかり、\n道が遠くて\n行かりゃせぬ。\n　先師はこの民謡をきいていわれた。――\n「まだ思いようが足りないね。なあに、遠いことがあるものか。」",["jin"]],[236,9,1,"孔子於郷党，恂恂如也，似不能言者。其在宗廟朝廷，便便言，唯謹爾。","孔子、郷党に於いて恂恂如たり。言うこと能わざる者に似たり。其の宗廟朝廷に在るや、便便として言う。唯謹めるのみ。","郷里では口下手に見えるほど控えめ、公の場でははっきり、ただし慎重に語った。","",[],[],0,"孔先生は、自宅に引きこもっておいでの時には、単純素樸なご態度で、お話などまるでお出来にならないかのように見える。ところが、宗廟や朝廷にお出になると、いうべきことは堂々といわれる。ただ慎しみだけは決してお忘れにならない。",["rei"]],[237,9,2,"朝与下大夫言，侃侃如也；与上大夫言，誾誾如也。君在，踧踖如也，与与如也。","朝にして下大夫と言えば、侃侃如たり。上大夫と言えば、誾誾如たり。君在せば、踧踖如たり、与与如たり。","朝廷では下役とは率直に、上役とは穏やかに筋を通して話し、君主の前では慎んだ。","",[],[],0,"朝廷で、下大夫とは、心置きなく率直に意見を交換され、上大夫に対しては、おだやかに、しかも正確に所信を述べられる。そして国君がお出ましの時には、恭敬の念をおのずから形にあらわされるが、それでいて、固くなられることがない。",["rei"]],[238,9,3,"君召使擯，色勃如也，足躩如也。揖所与立，左右手，衣前後，襜如也。趨進，翼如也。賓退，必復命，曰：「賓不顧矣。」","君召して擯たらしむれば、色勃如たり、足躩如たり。与に立つ所に揖すれば、手を左右にす。衣の前後、襜如たり。趨り進むには翼如たり。賓退けば必ず復命して曰く、賓顧みずと。","国賓の接待役を命じられたときの、緊張感ある立ち居振る舞いと復命の作法。","",[],[],0,"君公に召されて国賓の接待を仰せつけられると、顔色が変るほど緊張され、足がすくむほど慎まれる。そして同役の人々にあいさつされるため、左右を向いて拱いた手を上下されるが、その場合、衣の裾の前後がきちんと合っていて、寸分もみだれることがない。国賓の先導をなされる時には、小走りにお進みになり、両袖を鳥の翼のようにお張りになる。そして国賓退出の後には、必ず君公に復命していわれる。――\n「国賓はご満足のご様子でお帰りになりました。」",["rei"]],[239,9,4,"入公門，鞠躬如也，如不容。立不中門，行不履閾。過位，色勃如也，足躩如也，其言似不足者。摂斉升堂，鞠躬如也，屛気似不息者。出，降一等，逞顔色，怡怡如也。没階趨進，翼如也。復其位，踧踖如也。","公門に入るに、鞠躬如たり。容れられざるが如くす。立つに門に中せず、行くに閾を履まず。位を過ぐれば、色勃如たり、足躩如たり。其の言うこと足らざる者に似たり。斉を摂げて堂に升るに、鞠躬如たり。気を屏めて息せざる者に似たり。出でて一等を降れば、顔色を逞ちて怡怡如たり。階を没くせば趨り進むこと翼如たり。其の位に復れば踧踖如たり。","宮廷の門をくぐり、堂に昇り、退出するまでの、身を慎んだ所作の記録。","",[],[],0,"宮廷の門をおはいりになる時には、小腰をかがめ、身をちぢめて、恰も狭くて通れないところを通りぬけるかのような様子になられる。門の中央に立ちどまったり、敷居を踏んだりは決してなされない。門内の玉座の前を通られる時には、君いまさずとも、顔色をひきしめ、足をまげて進まれる。そして堂にいたるまでは、みだりに物をいわれない。堂に上る時には、両手をもって衣の裾をかかげ、小腰をかがめ、息を殺していられるかのように見える。君前を退いて階段を一段下ると、ほっとしたように顔色をやわらげて、にこやかになられる。階段をおりきって小走りなさる時には両袖を翼のようにお張りになる。そしてご自分の席におもどりになると、うやうやしくひかえて居られる。",["rei"]],[240,9,5,"執圭，鞠躬如也，如不勝。上如揖，下如授，勃如戦色，足蹜蹜如有循。享礼，有容色。私覿，愉愉如也。","圭を執れば、鞠躬如たり。勝えざるが如くす。上ぐることは揖するが如く、下すことは授くるが如し。勃如として戦く色あり。足は蹜蹜として循うこと有るが如し。享礼には容色有り。私覿には愉愉如たり。","使者として圭を捧げるときは厳粛に、私的な会見では和やかに振る舞った。","",[],[],0,"他国に使し、圭を捧げてその君主にまみえられる時には、小腰をかがめて進まれ、圭の重さにたえられないかのような物腰になられる。圭を捧げられた手をいくらか上下されるが、上っても人にあいさつする程度、下っても人に物を授ける程度で、極めて適度である。その顔色は引きしまり、恰も戦陣にのぞむかのようであり、足は小股に歩んで地に引きつけられているかのようである。贈物を捧げる礼にはなごやかな表情になられ、式が終って私的の礼となると、全く打ちとけた態度になられる。",["rei"]],[241,9,6,"君子不以紺緅飾，紅紫不以為褻服；当暑，袗絺綌，必表而出之。緇衣羔裘，素衣麑裘，黄衣狐裘。褻裘長，短右袂。（必有寢衣，長一身有半。）狐貉之厚以居。去喪，無所不佩。非帷裳，必殺之。羔裘玄冠，不以弔。吉月，必朝服而朝。","君子は紺緅を以て飾らず。紅紫は以て褻服と為さず。暑に当たりては袗の絺綌、必ず表して之を出だす。緇衣には羔裘、素衣には麑裘、黄衣には狐裘。褻裘は長く、右の袂を短くす。必ず寝衣有り、長さ一身有半。狐貉の厚き以て居る。喪を去けば佩びざる所無し。帷裳に非ざれば必ず之を殺す。羔裘玄冠しては以て弔せず。吉月には必ず朝服して朝す。","衣服の色、重ね方、仕立て、場面ごとの装いについての細かな決まり。","",[],[],0,"先生は衣服にもこまかな注意を払われる。紺色や淡紅色は喪服の飾りだから、それを他の場合の襟の飾りには用いられないし、また平常服に赤や紫のようなはでな色を用いられることもない。暑い時には単衣のかたびらを着られるが、下着なしに着られることはない。黒衣の下には黒羊の皮衣、白服の下には白鹿の皮衣、黄衣の下には狐の皮衣を用いられる。平常服の皮衣は温かいように長目に仕立てられるが、働きよいように右袂を短くされる。寝衣は必ず別にされ、長さは身長の一倍半である。家居には、狐や貉の毛皮を用いて暖かにされる。喪の時以外は玉その他の装身具をきちんと身につけていられる。官服・祭服のほかは簡略にして布地を節約される。黒羊の皮衣や黒の冠で弔問されることはない。退官後も、毎月朔日には礼服を着て参賀される。",["rei"]],[242,9,7,"斉，必有明衣，布。斉必変食，居必遷坐。","斉すれば必ず明衣有り、布なり。斉すれば必ず食を変じ、居は必ず坐を遷す。","物忌みのときは清潔な布の衣を着て、食事を改め、居場所も移した。","",[],[],0,"ものいみする時には清浄潔白な衣を着られる。その衣は布製である。また、ものいみ中は食物を変えられ、居室をうつされる。",["rei"]],[243,9,8,"食不厭精，膾不厭細。食饐而餲，魚餒而肉敗，不食。色悪不食，臭悪不食。失飪不食，不時不食。割不正不食，不得其醬不食。肉雖多，不使勝食気。唯酒無量，不及乱。沽酒市脯不食。不撤薑食，不多食。祭于公，不宿肉。祭肉不出三日，出三日，不食之矣。食不語，寢不言。雖疏食菜羹瓜祭，必斉如也。","食は精を厭わず、膾は細きを厭わず。食の饐して餲せる、魚の餒れて肉の敗れたるは食らわず。色の悪しきは食らわず、臭いの悪しきは食らわず。飪を失えるは食らわず、時ならざるは食らわず。割正しからざれば食らわず、其の醤を得ざれば食らわず。肉は多しと雖も、食の気に勝たしめず。唯酒は量無し、乱に及ばず。沽う酒と市う脯は食らわず。薑を撤てずして食らう。多くは食らわず。公に祭れば肉を宿めず。祭肉は三日を出ださず。三日を出づれば之を食らわず。食らうには語らず、寝ぬるには言わず。疏食菜羹瓜と雖も、祭れば必ず斉如たり。","傷んだ物や時季外れは口にせず、酒は量を決めないが乱れない。食の節度の記録。","",[],[],0,"米は精白されたのを好まれ、膾は細切りを好まれる。飯のすえて味の変つたのや、魚のくずれたのや、肉の腐つたのは、決して口にされない。色のわるいもの、匂いのわるいものも口にされない。煮加減のよくないものも口にされない。季節はずれのものは口にされない。庖丁のつかい方が正しくないものは口にされない。ひたし汁がまちがっていれば口にされない。肉の料理がいろいろあっても、主食がたべられないほどには口にされない。ただ酒だけは分量をきめられない。しかし、取乱すほどには飲まれない。店で買った酒や乾肉は口にされない。生姜は残さないで食べられる。大食はされない。君公のお祭りに奉仕していただいた供物の肉は宵越しにならないうちに人にわかたれる。家の祭の肉は三日以内に処分し、三日を過ぎると口にされない。口中に食物を入れたままでは話をされない。寝てからは口をきかれない。粗飯や、野菜汁のようなものでも、食事前には必ず先ずお初穂を捧げられるが、その御様子は敬虔そのものである。",["rei"]],[244,9,9,"席不正不坐。","席正しからざれば坐せず。","敷物が曲がっていれば、正してからでないと座らなかった。","",[],[],0,"座席のしき物がゆがんだり曲がったりしたままでは坐られない。",["rei"]],[245,9,10,"郷人飲酒，杖者出，斯出矣。郷人儺，朝服而立於阼階。","郷人の飲酒には、杖者出づれば斯に出づ。郷人の儺には、朝服して阼階に立つ。","村の酒宴では老人が退席してから席を立ち、鬼やらいの行事は礼服で迎えた。","",[],[],0,"村人と酒宴をされる時でも、老人が退席してからでないと退席されない。村人が鬼やらいに来ると、礼服をつけ、玄関に立ってそれをむかえられる。",["rei"]],[246,9,11,"問人於他邦，再拝而送之。康子饋藥，拝而受之，曰：「丘未達，不敢嘗。」","人を他邦に問えば、再拝して之を送る。康子、薬を饋る。拝して之を受く。曰く、丘未だ達せず、敢えて嘗めず。","贈られた薬は礼を尽くして受けたが、効能がわからないので飲まないと正直に伝えた。","好意を受け取ることと、鵜呑みにしないことを両立できているか。",["trust","decide"],[],1,"他邦におる知人に使者をやって訪問させる時には、再拝してその使者をおくられる。\n　ある時魯の大夫季康子が先生に薬をおくられたことがあったが、先生は病中拝礼してこれをうけられた。そしていわれた。――\n「おいただきしたお薬が私の病気に適するかどうか、まだわかりませんので、今すぐには服用いたしません。」",["rei","shin"]],[247,9,12,"廄焚，子退朝，曰：「傷人乎？」不問馬。","廏焚けたり。子、朝より退きて曰く、人を傷えりや。馬を問わず。","馬小屋が焼けたとき、孔子は人の無事だけを尋ね、馬のことは問わなかった。","事故の一報を受けたとき、最初に口にするのは人のことか。",["lead","profit"],[],2,"先生の馬屋が焼けた。朝廷からお帰りになった先生は人にけがはなかったか、と問われたきり、馬のことは問われなかった。",["jin"]],[248,9,13,"君賜食，必正席先嘗之。君賜腥，必熟而薦之。君賜生，必畜之。侍食於君，君祭，先飯。疾，君視之，東首，加朝服拖紳。君命召，不俟駕行矣。","君、食を賜えば、必ず席を正して先ず之を嘗む。君、腥を賜えば、必ず熟して之を薦む。君、生を賜えば、必ず之を畜う。君に侍食するに、君祭れば先ず飯す。疾ありて君之を視れば、東首して朝服を加え、紳を拖く。君、命じて召せば、駕を俟たずして行く。","君主からの賜り物の受け方、陪食、病中の見舞い、お召しへの応じ方の作法。","",[],[],0,"君公から料理を賜わると、必ず席を正し、先ず自らそれをいただかれ、あとを家人にわけられる。君公から生肉を賜わると、それを調理して、先ず先祖の霊に供えられる。君公から生きた動物を賜わると、必ずそれを飼っておかれる。君公に陪食を仰せつかると、君公が食前の祭をされている間に、必ず毒味をされる。病気の時、君公の見舞をうけると、東を枕にし、寝具に礼服をかけ、その上に束帯をおかれる。君公のお召しがあると、車馬の用意をまたないでお出かけになる。",["rei"]],[249,9,14,"入太廟，每事問。","太廟に入りて、事毎に問う。","大廟では、知っていそうなことも一つひとつ係の人に尋ねて確かめた。","立場が上がっても、現場で一つひとつ尋ねることができるか。",["self"],["慢心"],1,"大廟に入られると、ことごとに係の人に質問される。",["rei"]],[250,9,15,"朋友死，無所帰，曰：「於我殯。」朋友之饋，雖車馬，非祭肉，不拝。","朋友死して帰する所無し。曰く、我に於いて殯せよ。朋友の饋りものは、車馬と雖も、祭肉に非ざれば拝せず。","身寄りのない友の葬儀は引き受け、友からの高価な贈り物には頭を下げなかった。","友が本当に困ったとき、損得抜きで引き受けられるか。",["trust","profit"],[],1,"先生は、友人が死んで遺骸の引取り手がないと、「私のうちで仮入棺をさせよう」といわれる。\n　先生は、友人からの贈物だと、それが車馬のような高価なものでも、拝して受けられることはない。ただ拝して受けられるのは、祭の供物にした肉の場合だけである。",["jin","gi"]],[251,9,16,"寢不尸，居不容。見斉衰者，雖狎必変。見冕者与瞽者，雖褻必以貌。凶服者式之。式負版者。有盛饌，必変色而作。迅雷，風烈，必変。","寝ぬるに尸せず、居るに容づくらず。斉衰の者を見ては、狎れたりと雖も必ず変ず。冕者と瞽者とを見ては、褻れたりと雖も必ず貌を以てす。凶服の者には之に式す。負版の者に式す。盛饌有れば必ず色を変じて作つ。迅雷風烈には必ず変ず。","家ではくつろぐが、喪中の人やもてなし、雷や嵐には必ず姿勢を改めた。","",[],[],0,"寝るのに、死人のような寝方はされない。家居に形式ばった容儀は作られない。喪服の人にあわれると、その人がどんなに心やすい人であっても、必ずつつしんだ顔になられる。衣冠をつけた人や、盲人にあわれると、あらたまった場所でなくても、必ず礼儀正しい態度になられる。車上で喪服の人にあわれると、車の横木に手をかけて頭を下げられる。国家の地図や戸籍を運搬する役人に対しても同様である。手厚いもてなしを受けられる時には、心から思いがけもないという顔をして、立って礼をいわれる。ひどい雷鳴や烈しい嵐の時には、形を正して敬虔な態度になられる。",["rei"]],[252,9,17,"升車，必正立，執綏。車中不內顧，不疾言，不親指。","車に升りては、必ず正しく立ちて綏を執る。車の中にては内顧せず、疾言せず、親指せず。","車に乗るときは姿勢を正して綱を握り、車中で振り返ったり指さしたりしなかった。","",[],[],0,"車に乗られる時には、必ず正しく立って車の吊紐を握り、座席につかれる。車内では左右を見まわしたり、あわただしい口のきき方をしたり、手をあげて指ざしたりされることがない。",["rei"]],[253,9,18,"色斯挙矣，翔而後集。曰：「山梁雌雉，時哉時哉！」子路共之，三嗅而作。","色みて斯に挙がり、翔りて而る後に集まる。曰く、山梁の雌雉、時なるかな、時なるかな。子路之に共す。三たび嗅ぎて作つ。","気配を察して飛び立ち、見定めて降りる雉。孔子は「時を心得ている」と感じ入った。","動く時と留まる時を、雉のように見極められているか。",["decide"],["迷い"],1,"人のさま　あやしと見てか、\n鳥のむれ　空にとび立ち\n舞い舞いて　輪を描きしが、\nやがてまた　地にひそまりぬ。\n師はいえり「み山の橋の\n雌雉らは　時のよろしも、\n雌雉らは　時のよろしも。」\n子路ききて　腕なでつつ、\n雌雉らを　とらんと寄れば、\n雌雉らは　三たび鳴き交い\n舞い立ちぬ　いずくともなく。",["chi"]],[254,10,1,"子曰：「先進於礼楽，野人也；後進於礼楽，君子也。如用之，則吾従先進。」","子曰く、先進の礼楽に於けるは、野人なり。後進の礼楽に於けるは、君子なり。如し之を用うれば、則ち吾は先進に従わん。","洗練された形より、素朴でも中身のある昔のやり方を選ぶ。","見栄えを整えるうちに、失った中身はないか。",["vision"],[],1,"先師がいわれた。――\n「礼楽の道において、昔の人は土くさい野人、今の人は磨きのかかった上流人、と、そう世間で考えるのも一応尤もだ。しかし、もし私がそのいずれか一つを選ぶとすると、私は昔の人の歩んだ道を選びたい。」",["rei"]],[255,10,2,"子曰：「従我於陳蔡者，皆不及門也。」徳行：顔淵、閔子騫、冉伯牛、仲弓。言語：宰我、子貢。政事：冉有、季路。文学：子游、子夏。","子曰く、我に陳蔡に従いし者は、皆門に及ばざるなり。徳行には顔淵・閔子騫・冉伯牛・仲弓。言語には宰我・子貢。政事には冉有・季路。文学には子游・子夏。","苦難を共にした弟子はもういない。十人の弟子の得意分野の一覧。","",[],[],0,"先師がいわれた。――\n「私について陳・蔡を旅した門人たちは、今はもう一人も門下にはいない。」\n　先師に従って陳・蔡におもむいた門人の中で、徳行にすぐれたのが顔渕・閔子騫・冉伯牛・仲弓、言論に秀でたのが宰我・子夏、政治的才能できこえたのが冉有・季路、文学に長じたのが子游・子夏であった。",[]],[256,10,3,"子曰：「回也，非助我者也！於吾言，無所不説。」","子曰く、回や、我を助くる者に非ざるなり。吾が言に於いて、説ばざる所無し。","何でも納得してくれる相手は、自分を磨いてはくれない。","異を唱えてくれる人を、身近に置いているか。",["grow","self"],["慢心"],2,"先師がいわれた。――\n「囘はいっこう私を啓発してはくれない。私のいうことは、何の疑問もなく、すぐのみこんでしまうのだから。」",["chi"]],[257,10,4,"子曰：「孝哉，閔子騫！人不間於其父母昆弟之言。」","子曰く、孝なるかな閔子騫。人、其の父母昆弟の言を間せず。","身内の褒め言葉を誰も疑わない。それほど閔子騫の孝行は本物だ。","",[],[],0,"先師がいわれた。――\n「閔子騫は何という孝行者だろう。親兄弟が彼をいくらほめても、誰もそれを身びいきだと笑うものがない。」",["jin"]],[258,10,5,"南容三復《白圭》，孔子以其兄之子妻之。","南容、白圭を三復す。孔子、其の兄の子を以て之に妻す。","言葉を慎む詩を繰り返し口ずさむ南容に、孔子は姪を嫁がせた。","言葉の軽さで、信用を落としていないか。",["judge"],[],1,"南容は白圭の詩を日に三たびくりかえしていた。先師はそれを知られて、ご自分の兄の娘を彼にめあわされた。",["shin","rei"]],[259,10,6,"季康子問：「弟子孰為好学？」孔子対曰：「有顔回者好学，不幸短命死矣。今也則亡。」","季康子問う、弟子孰か学を好むと為す。孔子対えて曰く、顔回なる者有り、学を好む。不幸、短命にして死せり。今や則ち亡し。","学問好きといえるのは亡き顔回だけ。今はもういない。","",[],[],0,"大夫の季康子がたずねた。――\n「お弟子のうちで、だれが学問の好きな人でしょう。」\n　先師がこたえられた。――\n「顔囘というものがおりまして、学問が好きでございましたが、不幸にして若くて死にました。もうこの世にはおりません。」",["chi"]],[260,10,7,"顔淵死，顔路請子之車以為之槨。子曰：「才不才，亦各言其子也。鯉也死，有棺而無槨。吾不徒行以為之槨，以吾従大夫之後，不可徒行也。」","顔淵死す。顔路、子の車を請いて以て之が槨を為らんとす。子曰く、才あるも才あらざるも、亦各其の子を言うなり。鯉や死す、棺有りて槨無し。吾、徒行して以て之が槨を為らず。吾が大夫の後に従うを以て、徒行すべからざるなり。","愛弟子の葬儀でも、情に流されて立場の筋を曲げはしない。","情に押されて、守るべき一線を動かしていないか。",["decide"],[],1,"顔渕が死んだ。父の顔路は彼のために外棺を造ってやりたいと思ったが、貧しくて意に任せなかった。そこで先師に願った。――\n「先生のお車をいただけますれば、それを金にかえて、外棺を作ってやりたいと存じますが……」\n　すると先師はいわれた。――\n「才能があろうとなかろうと、子の可愛ゆさは同じだ。私も子供の鯉が死んだ時には、せめて外棺ぐらい作ってやりたい気がしないでもなかった。しかしついに内棺だけですますことにしたのだ。私がその時、徒歩する覚悟にさえなれば、車を売って外棺を作ってやることも出来ただろう。しかし、私が敢てそれをしなかったのは、私も大夫の末席につらなっているので、職掌から、徒歩するわけに行かなかったからなのだ。」",["rei","gi"]],[261,10,8,"顔淵死，子曰：「噫！天喪予！天喪予！」","顔淵死す。子曰く、噫、天予を喪ぼせり、天予を喪ぼせり。","後継ぎと頼んだ弟子を失い、天に見放されたと嘆く。","託すつもりだった人を失ったとき、何を支えに立つか。",["fail"],["落胆"],1,"顔渕が死んだ。先師がいわれた。――\n「ああ、天は私の希望を奪った。天は私の希望を奪った。」",[]],[262,10,9,"顔淵死，子哭之慟。従者曰：「子慟矣！」曰：「有慟乎？非夫人之為慟而誰為？」","顔淵死す。子、之を哭して慟す。従者曰く、子慟せり。曰く、慟すること有るか。夫の人の為に慟するに非ずして、誰が為にかせん。","この人のために泣かずに、誰のために泣くのか。","取り乱すほど大切に思える仲間が、いるか。",["lonely"],["落胆"],1,"顔渕が死んだ。先師はその霊前で声をあげて泣かれ、ほとんど取りみだされたほどの悲しみようであった。お供の門人が、あとで先師にいった。――\n「先生も今日はお取りみだしのようでしたね。」\n　先師がこたえられた。――\n「そうか。取りみだしていたかね。だが、あの人のためになげかないで、誰のためになげこう。」",["jin"]],[263,10,10,"顔淵死，門人欲厚葬之。子曰：「不可。」門人厚葬之。子曰：「回也，視予猶父也，予不得視猶子也；非我也，夫二三子也。」","顔淵死す。門人、厚く之を葬らんと欲す。子曰く、不可なり。門人、厚く之を葬る。子曰く、回や、予を視ること猶お父のごとし。予は視ること猶お子のごとくするを得ず。我に非ざるなり、夫の二三子なり。","分を超えた盛大な葬儀は、故人の生き方に合わないと孔子は嘆いた。","",[],[],0,"顔渕が死んだ。門人たちが彼のために葬儀を盛大にしようともくろんだ。先師はそれを「いけない」といって、とめられたが、門人たちはかまわず盛大な葬儀をやってしまった。すると先師はいわれた。――\n「囘は私を父のように思っていてくれた。私も彼を自分の子供同様に葬ってやりたかったが、それが出来なかった。それは私のせいではない。みんなおまえたちのせいなのだ。」",["rei"]],[264,10,11,"季路問事鬼神。子曰：「未能事人，焉能事鬼？」「敢問死？」曰：「未知生，焉知死？」","季路、鬼神に事えんことを問う。子曰く、未だ人に事うること能わず、焉んぞ能く鬼に事えん。敢えて死を問う。曰く、未だ生を知らず、焉んぞ死を知らん。","分からない先のことより、まず目の前の人と今の生に向き合う。","答えの出ない心配に、今日の力を奪われていないか。",["decide","vision"],["不安","迷い"],2,"季路が鬼神に仕える道を先師にたずねた。先師がこたえられた。――\n「まだ人に仕える道もわからないで、どうして鬼神に仕える道がわかろう。」\n　季路がかさねてたずねた。――\n「では、死とは何でありましょうか。」\n　すると先師がこたえられた。――\n「まだ生が何であるかわからないのに、どうして死が何であるかがわかろう。」",["chi"]],[265,10,12,"閔子侍側，誾誾如也；子路，行行如也；冉有、子貢，侃侃如也。子楽。「若由也，不得其死然！」","閔子、側に侍す、誾誾如たり。子路、行行如たり。冉有・子貢、侃侃如たり。子楽しむ。由がごときは、其の死を得ざらん。","個性の違う弟子に囲まれて楽しむ。ただ子路の剛直さは命取りだと案じた。","部下それぞれの持ち味と危うさを、見分けているか。",["judge","grow"],[],1,"閔先生は物やわらかな態度で、子路はごつごつした態度で、冉有と子貢とはしゃんとした態度で、先師のおそばにいた。先師はうれしそうにしていられたが、ふと顔をくもらせていわれた。\n「由のような気性だと、畳の上では死ねないかも知れないね。」",[]],[266,10,13,"魯人為長府。閔子騫曰：「仍旧貫，如之何？何必改作？」子曰：「夫人不言，言必有中。」","魯人、長府を為る。閔子騫曰く、旧貫に仍らば、之を如何。何ぞ必ずしも改め作らん。子曰く、夫の人は言わず。言えば必ず中る有り。","むやみに作り変えない。寡黙な人の一言は的を射る。","その刷新は本当に必要か、今あるものを活かせないか。",["decide"],["焦り"],2,"魯の当局が長府を改築しようとした。それについて、閔子騫がいった。――\n「これまでの建物を修理したらいい。何も改築する必要はあるまい。」\n　先師はそれを伝えきいていわれた。――\n「あの男はめったに物をいわないが、いえば必ず図星にあたる。」",["chi","shin"]],[267,10,14,"子曰：「由之瑟，奚為於丘之門？」門人不敬子路。子曰：「由也升堂矣，未入於室也！」","子曰く、由の瑟、奚為れぞ丘の門に於いてせん。門人、子路を敬せず。子曰く、由や堂に升れり。未だ室に入らざるなり。","叱ったのは期待ゆえ。彼はもう十分な高みにいて、あと一歩なのだ。","自分の一言で、部下が周りから軽んじられていないか。",["grow","trust"],[],2,"先師がいわれた。――\n「由の瑟は、私の家では弾いてもらいたくないな。」\n　それをきいた門人たちは、とかく子路を軽んずる風があった。すると、先師はいわれた。――\n「由はすでに堂にのぼっている。まだ室に入らないだけのことだ。」",["chi"]],[268,10,15,"子貢問：「師与商也孰賢？」子曰：「師也過，商也不及。」曰：「然則師愈与？」子曰：「過猶不及。」","子貢問う、師と商とは孰れか賢れる。子曰く、師や過ぎたり、商や及ばず。曰く、然らば則ち師は愈れるか。子曰く、過ぎたるは猶お及ばざるがごとし。","やり過ぎは、足りないのと同じくらい的を外している。","いま自分は、やり過ぎているのか、足りないのか。",["decide","self"],["迷い","焦り"],3,"子貢がたずねた。――\n「師と商とでは、どちらがまさっておりましようか。」\n　先師がこたえられた。――\n「師は行き過ぎている。商は行き足りない。」\n　子貢が更にたずねた。――\n「では、師の方がまさっているのでございましょうか。」\n　すると、先師がこたえられた。――\n「行き過ぎるのは行き足りないのと同じだ。」",["chi"]],[269,10,16,"季氏富於周公，而求也為之聚斂而附益之。子曰：「非吾徒也！小子鳴鼓而攻之，可也。」","季氏、周公より富む。而して求や之が為に聚斂して之に附益す。子曰く、吾が徒に非ざるなり。小子、鼓を鳴らして之を攻めて可なり。","富む主君のためにさらに民から搾る者は、もはや私の弟子ではない。","その利益は、誰かを苦しめて積み上げたものでないか。",["profit"],["怒り"],2,"先師はいわれた。――\n「季氏は周公以上に富んでいる。然るに、季氏の執事となった求は、主人の意を迎え、租税を苛酷に取り立てて、その富をふやしてやっている。彼はわれわれの仲間ではない。諸君は鼓を鳴らして彼を責めてもいいのだ。」",["gi","jin"]],[270,10,17,"柴也愚，參也魯，師也辟，由也喭。","柴や愚、参や魯、師や辟、由や喭。","弟子四人の短所を一語ずつで言い当てた人物評。","",[],[],0,"先師がいわれた。――\n「柴は愚かで、参はのろい。師はお上手で、由はがさつだ。」",[]],[271,10,18,"子曰：「回也其庶乎，屢空。賜不受命，而貨殖焉；億則屢中。」","子曰く、回や其れ庶きか、屡空し。賜は命を受けずして貨殖す。億れば則ち屡中る。","顔回は貧しくとも道に近い。子貢は商才があり読みがよく当たる。","豊かさと生き方の充実を、取り違えていないか。",["profit"],[],1,"先師がいわれた。――\n「囘の境地は先ず理想に近いだろう。財布が空になることはしばしばだが、いつも天命に安んじ、道を楽しんでいる。賜はまだ天命に安んじないで、財を作るのにかなり骨を折っているようだ。しかし、判断は正しいし、考えさえすれば、道にはずれるようなことはめったにないだろう。」",[]],[272,10,19,"子張問「善人」之道。子曰：「不践跡，亦不入於室。」","子張、善人の道を問う。子曰く、迹を践まず、亦室に入らず。","素質が良くても、先人の跡を学ばなければ奥義には届かない。","自己流の良さに頼り、先人に学ぶ手間を省いていないか。",["vision","grow"],["慢心"],2,"子張がたずねた。――\n「天性善良な人は、べつに学問などしなくても、自然に道に合するようになる、というようにも考えられますが、いかがでしょう。」\n　先師がこたえられた。――\n「どうなり危険のない道を進むことは出来るかも知れない。しかし、せっかく先人に開拓してもらったすばらしい道があるのに、その道を歩かないというのは惜しいことだ。それに、第一、そんな自己流では、所詮、道の奥義をつかむことは出来ないだろう。」",["chi"]],[273,10,20,"子曰：「論篤是与，君子者乎？色荘者乎？」","子曰く、論の篤きに是れ与せば、君子者か、色荘者か。","話が立派なだけでは、本物か見かけ倒しかは分からない。","弁の立つ人を、話のうまさだけで信じていないか。",["judge"],[],2,"先師がいわれた。\n「いうことがしっかりしているということだけで判断したのでは、君子であるか、にせ者であるか、わからない。」",["chi","shin"]],[274,10,21,"子路問：「聞斯行諸？」子曰：「有父兄在，如之何其聞斯行之？」冉有問：「聞斯行諸？」子曰：「聞斯行之。」公西華曰：「由也問：『聞斯行諸？』子曰：『有父兄在。』求也問：『聞斯行諸？』子曰：『聞斯行之。』赤也惑，敢問。」子曰：「求也退，故進之；由也兼人，故退之。」","子路問う、聞くままに斯ち諸を行わんか。子曰く、父兄の在す有り、之を如何ぞ其れ聞くままに斯ち之を行わん。冉有問う、聞くままに斯ち諸を行わんか。子曰く、聞くままに斯ち之を行え。公西華曰く、由や問う、聞くままに斯ち諸を行わんかと。子曰く、父兄の在す有りと。求や問う、聞くままに斯ち諸を行わんかと。子曰く、聞くままに斯ち之を行えと。赤や惑う。敢えて問う。子曰く、求や退く、故に之を進む。由や人を兼ぬ、故に之を退く。","引っ込み思案は押し、出過ぎる者は抑える。相手で答えを変える。","全員に同じ言葉をかけて、育てたつもりでいないか。",["grow","lead"],[],3,"子路がたずねた。――\n「善いことをきいたら、すぐ実行にうつすべきでしょうか。」\n　先師がこたえられた。――\n「父兄がおいでになるのに、おたずねもしないで、一存で実行するのはよろしくない。」\n　冉有がたずねた。――\n「善いことをきいたら、すぐ実行にうつすべきでしょうか。」\n　先師がこたえられた。――\n「すぐ実行するがよい。」\n　後日、公西華が先師にたずねた。――\n「先生は、善事をきいたらすぐ実行すべきかどうかについて、由がおたずねした時には、父兄がおいでになる、とおこたえになり、求がおたずねした時には、すぐ実行せよ、とおこたえになりました。私には、どうも先生のお気持がわかりません。いったい、どちらが先生のご真意なのですか。」\n　先師はこたえられた。――\n「求はとかく引込み思案だから、尻をたたいてやったし、由はとかく出過ぎるくせがあるから、おさえてやったのだ。」",["chi"]],[275,10,22,"子畏於匡，顔淵後。子曰：「吾以女為死矣！」曰：「子在，回何敢死？」","子、匡に畏す。顔淵後れたり。子曰く、吾、女を以て死せりと為す。曰く、子在す、回何ぞ敢えて死せん。","先生が生きておられる限り、私は死ねません。師弟の深い信頼。","この人がいる限りと、思い合える相手がいるか。",["lonely"],["孤独"],1,"先師が匡の難に遭われた時、顔渕は一行におくれて一時消息不明になっていたが、やっと追いつくと、先師はいわれた。――\n「私は、お前が死んだのではないかと、気が気でなかったよ。」\n　すると、顔渕はいった。――\n「先生がおいでになるのに、何で私が軽々しく死なれましょう。」",["shin","jin"]],[276,10,23,"季子然問：「仲由、冉求可謂大臣与？」子曰：「吾以子為異之問，曽由与求之問？所謂大臣者，以道事君，不可則止。今由与求也，可謂具臣矣。」曰：「然則従之者与？」子曰：「弒父与君，亦不従也。」","季子然問う、仲由・冉求は大臣と謂うべきか。子曰く、吾、子を以て異なるを之れ問うと為す。曾ち由と求とを之れ問う。所謂大臣なる者は、道を以て君に事え、不可なれば則ち止む。今、由と求とは、具臣と謂うべし。曰く、然らば則ち之に従う者か。子曰く、父と君とを弑するには、亦従わざるなり。","本物の重臣は道理で仕え、通らなければ身を引く。","筋が通らないとき、退く覚悟を持って仕えているか。",["profit","decide"],[],2,"季子然がたずねた。――\n「仲由と冉求とは大臣といってもいい人物でございましょうね。」\n　先師がこたえられた。――\n「私はまた誰かもつと非凡な人物についてのおたずねかと思っておりましたが、由や求のことでございましたか。お言葉にありました大臣と申しますのは、道をもって君に仕え、道が行われなければ直ちに身を退くような人をいうのでありまして、由や求にはまだ及びもつかないことでございます。二人はせいぜい忠実に政務を執るぐらいの、いわば具臣とでも申すべき人物でございましょう。」\n　季子然がまたたずねた。――\n「では、二人は主命には絶対に従うでしょうね。」\n　すると、先師はこたえられた。――\n「彼等といえども、まさか君父を弑するような命令には従いますまい。」",["gi"]],[277,10,24,"子路使子羔為費宰。子曰：「賊夫人之子。」子路曰：「有民人焉，有社稷焉；何必読書，然後為学？」子曰：「是故悪夫佞者。」","子路、子羔をして費の宰たらしむ。子曰く、夫の人の子を賊わん。子路曰く、民人有り、社稷有り。何ぞ必ずしも書を読みて、然る後に学と為さん。子曰く、是の故に夫の佞者を悪む。","準備のない者を要職に就ければ、本人を潰す。言い逃れは要らない。","現場で学べばいいと、未熟な人を重責に放り込んでいないか。",["grow","judge"],[],2,"子路が子羔を費の代官に推挙した。先師は、そのことをきいて子路にいわれた。――\n「そんなことをしたら、却ってあの青年を毒することになりはしないかね。実務につくには、まだ少し早や過ぎるように思うが。」\n　子路がいった。――\n「費には治むべき人民がありますし、祭るべき神々の社があります。子羔はそれで実地の生きた学問が出来ると存じます。何も机の上で本を読むだけが学問ではありますまい。」\n　すると、先師はいわれた。――\n「そういうことをいうから、私は、口達者な人間をにくむのだ！」",["chi"]],[278,10,25,"子路、曽皙、冉有、公西華侍坐。子曰：「以吾一日長乎爾，毋吾以也。居則曰：『不吾知也。』如或知爾，則何以哉？」子路率爾而対，曰：「千乘之国，摂乎大国之閒，加之以師旅，因之以饑饉，由也為之，比及三年，可使有勇，且知方也。」夫子哂之。「求，爾何如？」対曰：「方六七十，如五六十，求也為之，比及三年，可使足民；如其礼楽，以俟君子。」「赤，爾何如？」対曰：「非曰能之，願学焉！宗廟之事，如会同，端章甫，願為小相焉。」「点，爾何如？」鼓瑟希，鏗爾，舎瑟而作；対曰：「異乎三子者之撰。」子曰：「何傷乎？亦各言其志也。」曰：「莫春者，春服既成。冠者五六人，童子六七人。浴乎沂，風乎舞雩，詠而帰。」夫子喟然歎曰：「吾与点也！」三子者出，曽皙後。曽皙曰：「夫三子者之言何如？」子曰：「亦各言其志也已矣。」曰：「夫子何哂由也？」曰：「為国以礼，其言不譲，是故哂之。」「唯求則非邦也与？」「安見方六七十，如五六十，而非邦也者？」「唯赤則非邦也与？」「宗廟会同，非諸侯而何？赤也為之小，孰能為之大？」","子路・曾皙・冉有・公西華、侍坐す。子曰く、吾が一日爾より長ずるを以て、吾を以てすること毋かれ。居りては則ち曰く、吾を知らざるなりと。如し爾を知るもの或らば、則ち何を以てせんや。子路、率爾として対えて曰く、千乗の国、大国の間に摂まれ、之に加うるに師旅を以てし、之に因るに饑饉を以てす。由や之を為め、三年に及ぶ比おい、勇有りて且つ方を知らしむべきなり。夫子、之を哂う。求、爾は何如。対えて曰く、方六七十、如しくは五六十、求や之を為め、三年に及ぶ比おい、民を足らしむべし。其の礼楽の如きは、以て君子を俟たん。赤、爾は何如。対えて曰く、之を能くすと曰うには非ず、願わくは学ばん。宗廟の事、如しくは会同に、端章甫して、願わくは小相たらん。点、爾は何如。瑟を鼓くこと希なり、鏗爾として瑟を舎きて作ち、対えて曰く、三子者の撰に異なり。子曰く、何ぞ傷まんや。亦各其の志を言うなり。曰く、莫春には、春服既に成る。冠者五六人、童子六七人、沂に浴し、舞雩に風し、詠じて帰らん。夫子、喟然として歎じて曰く、吾は点に与せん。三子者出づ。曾皙後る。曾皙曰く、夫の三子者の言は何如。子曰く、亦各其の志を言うのみ。曰く、夫子、何ぞ由を哂うや。曰く、国を為むるには礼を以てす。其の言譲らず、是の故に之を哂う。唯れ求は則ち邦に非ざるか。安んぞ方六七十、如しくは五六十にして、邦に非ざる者を見ん。唯れ赤は則ち邦に非ざるか。宗廟会同は、諸侯に非ずして何ぞ。赤や之が小たらば、孰か能く之が大たらん。","弟子が志を語る。孔子は、春の川辺で歌って帰りたいという願いに頷いた。","認められたら何をしたいか、飾らずに言えるか。",["vision","lonely"],["疲れ"],2,"子路と曾皙と［＃「曾皙と」は底本では「曾晢と」］冉有と公西華が先師のおそばにいたとき、先師がいわれた。――\n「私がお前たちよりいくらか先輩だからといって、何も遠慮することはない。今日は一つ存分に話しあって見よう。お前たちは、いつも、自分を認めて用いてくれる人がないといって、くやしがっているが、もし用いてくれる人があるとしたら、いったいどんな仕事がしたいのかね。」\n　すると、子路がいきなりこたえた。――\n「千乗の国が大国の間にはさまって圧迫をうけ、しかも戦争、饑饉といったような難局に陥った場合、私がその国政の任に当るとしましたら、三年ぐらいで、人民を勇気づけ、且つ彼等に正しい行動の基準を与えることが出来ます。」\n　先師は微笑された。そして、いわれた。\n「求よ、お前はどうだ。」\n　冉求はこたえた。――\n「方六七十里、あるいは五六十里程度のところでしたら、三年ぐらいで、人民の生活を安定させる自信があります。尤も、礼楽といった方面のことになりますと、私はそのがらではありませんので、高徳の人の力にまたなければなりません。」\n　先師、――\n「赤よ、お前はどうだ。」\n　公西華がこたえた。――\n「まだ十分の自信はありませんが、稽古かたがたやって見たいと思うことがあります。それは、宗廟のお祭りや、国際会談といったような場合に、礼装して補佐役ぐらいの任務につくことです。」\n　先師、――\n「点よ、お前はどうだ。」\n　曾皙は、それまで、みんなのいうことに耳をかたむけながら、ぽつん、ぽつんと瑟を弾じていたが、先師にうながされると、がちゃりとそれをおいて立ちあがった。そしてこたえた。――\n「私の願いは、三君とはまるでちがっておりますので……」\n　先師、――\n「何、かまうことはない。みんなめいめいに自分の考えていることをいって見るまでのことだ。」\n　曾皙――\n「では申しますが、私は、晩春のいい季節に、新しく仕立てた春着を着て、青年五六人、少年六七人をひきつれ、沂水で身を清め、舞で一涼みしたあと、詩でも吟じながら帰って来たいと、まあそんなことを考えております。」\n　すると先師は深い感歎のため息をもらしていわれた。――\n「私も点の仲間になりたいものだ。」\n　間もなく三人は室を出て、曾皙だけがあとに残った。\n　彼はたずねた。――\n「あの三人のいったことを、どうお考えになりますか。」\n　先師はこたえられた。――\n「みんなそれぞれに自分相応の抱負をのべたに過ぎないさ。」\n　曾皙――\n「では、なぜ先生は由をお笑いになりましたか。」\n　先師――\n「国を治むるには礼を欠いではならないのに、由の言葉は高ぶり過ぎていたので、ついおかしくなったのだ。」\n　曾皙――\n「求は謙遜して一国の政治ということにはふれなかったようですが……」\n　先師――\n「方六七十里、或は五六十里といえば、小さいながらも国だ。やはり求も一国の政治のことを考えていたのだよ。謙遜はしていたが。」\n　曾皙――\n「赤のいったのは、いかがでしょう。ああいうことも一国の政治といえるでしょうか。」\n　先師――\n「宗廟のことや国際会談の接伴というようなことは、諸侯にとっての重大事で、やはり一国の政治だよ。しかも赤はその適任者だ。謙遜して、補佐役ぐらいなところを引きうけたいといっていたが、彼が補佐役だったら、彼の上に長官になれる人はないだろう。」",["gi"]],[279,11,1,"顔淵問「仁」。子曰：「克己復礼為仁。一日克己復礼，天下帰仁焉，為仁由己，而由人乎哉？」顔淵曰：「請問其目。」子曰：「非礼勿視，非礼勿聴，非礼勿言，非礼勿動。」顔淵曰：「回雖不敏，請事斯語矣！」","顔淵、仁を問う。子曰く、己に克ちて礼に復るを仁と為す。一日己に克ちて礼に復れば、天下仁に帰す。仁を為すは己に由る、而して人に由らんや。顔淵曰く、請う、其の目を問わん。子曰く、礼に非ざれば視ること勿かれ、礼に非ざれば聴くこと勿かれ、礼に非ざれば言うこと勿かれ、礼に非ざれば動くこと勿かれ。顔淵曰く、回、不敏なりと雖も、請う、斯の語を事とせん。","わがままに打ち克ち、節度に立ち返る。それは他人でなく自分次第。","人のせいにする前に、自分の側で改められることは何か。",["self"],["怒り","慢心"],3,"顔渕が仁の意義をたずねた。先師はこたえられた。――\n「己に克ち、私利私欲から解放されて、調和の大法則である礼に帰るのが仁である。上に立つ者が一たび意を決してこの道に徹底すれば、天下の人心もおのずから仁に帰向するであろう。仁の実現は先ず自らの力によるべきで、他にまつべきではない。」\n　顔渕がさらにたずねた。――\n「実践の細目について、お示しをお願いいたしたいと存じます。」\n　先師がこたえられた。――\n「非礼なことに眼をひかれないがいい。非礼なことに耳を傾けないがいい。非礼なことを口にしないがいい。非礼なことを行わぬがいい。」\n　顔渕がいった。――\n「まことにいたらぬ者でございますが、お示しのことを一生の守りにいたしたいと存じます。」",["rei","jin"]],[280,11,2,"仲弓問「仁」。子曰：「出門如見大賓，使民如承大祭，己所不欲，勿施於人。在邦無怨，在家無怨。」仲弓曰：「雍雖不敏，請事斯語矣！」","仲弓、仁を問う。子曰く、門を出でては大賓を見るが如くし、民を使うには大祭に承うるが如くす。己の欲せざる所は、人に施すこと勿かれ。邦に在りても怨み無く、家に在りても怨み無し。仲弓曰く、雍、不敏なりと雖も、請う、斯の語を事とせん。","誰にも賓客のように接し、自分が嫌なことは人にしない。","自分がされたら嫌なことを、社員や取引先に強いていないか。",["lead","trust"],[],3,"仲弓が仁についてたずねた。先師はこたえられた。――\n「門を出て社会の人と交る時には、地位の高下を問わず、貴賓にまみえるように敬虔であるがいい。人民に義務を課する場合には、天地宋廟の神々を祭る時のように、恐懼するがいい。自分が人にされたくないことを、人に対して行ってはならない。もしそれだけのことが出来たら、国に仕えても、家にあっても、平和を楽しむことが出来るだろう。\n　仲弓がいった。――\n「まことにいたらぬ者でございますが、お示しのことを一生の守りにいたしたいと存じます。」",["jin","rei"]],[281,11,3,"司馬牛問「仁」。子曰：「仁者，其言也訒。」曰：「其言也訒，斯謂之『仁』已夫？」子曰：「為之難，言之得無訒乎！」","司馬牛、仁を問う。子曰く、仁者は其の言や訒。曰く、其の言や訒、斯ち之を仁と謂うか。子曰く、之を為すこと難し。之を言うに訒なること無きを得んや。","実行の難しさを知る人は、言葉が自然と慎重になる。","できるか分からないことを、軽く口にしていないか。",["self","trust"],[],2,"司馬牛が仁についてたずねた。先師はこたえられた。――\n「仁者というものは、言いたいことがあっても、容易に口をひらかないものだ。」\n　司馬牛が更にたずねた。――\n「容易に口をひらかない、――それだけのことが仁というものでございましょうか。」\n　すると先師はいわれた。――\n「仁者は実践のむずかしさをよく知っている。だから、言葉をつつしまないではいられないのだ。」",["shin"]],[282,11,4,"司馬牛問「君子」。子曰：「君子不憂不懼。」曰：「不憂不懼，斯謂之『君子』矣夫？」子曰：「內省不疚，夫何憂何懼！」","司馬牛、君子を問う。子曰く、君子は憂えず、懼れず。曰く、憂えず懼れず、斯ち之を君子と謂うか。子曰く、内に省みて疚しからざれば、夫れ何をか憂え、何をか懼れん。","胸に手を当てて疚しさがなければ、憂いも恐れも要らない。","いまの不安の底に、自分で疚しいと感じる点はあるか。",["self","fail"],["不安"],3,"司馬牛が君子についてたずねた。先師はこたえられた。――\n「君子はくよくよしない。またびくびくしない。」\n　司馬牛が更にたずねた。――\n「くよくよしない、びくびくしない、というだけで君子といえるでしょうか。」\n　すると先師はいわれた。――\n「それは誰にも出来ることではない。自分を省みてやましくない人だけにしか出来ないことなのだ。」",["gi"]],[283,11,5,"司馬牛憂曰：「人皆有兄弟，我独亡！」子夏曰：「商聞之矣：『死生有命，富貴在天』君子敬而無失，与人恭而有礼，四海之內，皆兄弟也，君子何患乎無兄弟也！」","司馬牛、憂えて曰く、人は皆兄弟有り、我独り亡し。子夏曰く、商、之を聞く。死生命有り、富貴天に在り。君子は敬して失うこと無く、人と恭しくして礼有らば、四海の内、皆兄弟なり。君子何ぞ兄弟無きを患えんや。","敬意と礼を尽くせば、世界中が兄弟になる。孤独を嘆くことはない。","味方がいないと嘆く前に、自分から敬意を示しているか。",["lonely"],["孤独"],2,"司馬牛が沈んだ顔をして子夏にいった。――\n「誰にも兄弟があるのに、私だけにはない。」\n　すると、子夏が慰めていった。――\n「死生や富貴は天命だときいているが、兄弟に縁のうすいのも、やはり天命だろう。おたがいに道に志して、心につつしみを持ちつづけ、礼をもって社会生活の調和を保って行くならば、四海のいたるところに兄弟は見出せるではないか。道に志す者が何で肉親の兄弟に縁のうすいのをくよくよ思う必要があろう。」",["rei"]],[284,11,6,"子張問「明」。子曰：「浸潤之譖，膚受之愬，不行焉，可謂明也已矣。浸潤之譖，膚受之愬，不行焉，可謂遠也已矣。」","子張、明を問う。子曰く、浸潤の譖、膚受の愬、行われざるは、明と謂うべきのみ。浸潤の譖、膚受の愬、行われざるは、遠と謂うべきのみ。","じわじわ染みる中傷や、情に訴える告げ口に動かされないのが明察。","繰り返し耳に入る噂で、誰かへの評価を変えていないか。",["judge","trust"],[],2,"子張が明察ということについてたずねた。先師はこたえられた。――\n「水がしみこむようにじりじりと人をそしる言葉や、傷口にさわるように、するどくうったえて来る言葉には、とかく人は動かされがちなものだが、そういう言葉にうかうかと乗らなくなったら、その人は明察だといえるだろう。いや、明察どころではない、達見の人といってもいいだろう、」",["chi"]],[285,11,7,"子貢問「政」。子曰：「足食，足兵，民信之矣。」子貢曰：「必不得已而去，於斯三者何先？」曰：「去兵。」子貢曰：「必不得已而去，於斯二者何先？」曰：「去食。自古皆有死，民無信不立。」","子貢、政を問う。子曰く、食を足し、兵を足し、民之を信にす。子貢曰く、必ず已むを得ずして去らば、斯の三者に於いて何をか先にせん。曰く、兵を去らん。子貢曰く、必ず已むを得ずして去らば、斯の二者に於いて何をか先にせん。曰く、食を去らん。古より皆死有り、民信無くんば立たず。","武力も食糧も手放せるが、信頼を失えば組織は立ち行かない。","何を削っても、最後まで守り抜くべき信用は何か。",["profit","decide","lead"],["迷い"],3,"子貢が政治の要諦についてたずねた。先師はこたえられた。――\n「食糧をゆたかにして国庫の充実をはかること、軍備を完成すること、国民をして政治を信頼せしめること、この三つであろう。」\n　子貢が更にたずねた。――\n「その三つのうち、やむなくいずれか一つを断念しなければならないとしますと、先ずどれをやめたらよろしうございましょうか。」\n　先師――\n「むろん軍備だ。」\n　子貢がさらにたずねた。\n「あとの二つのうち、やむなくその一つを断念しなければならないとしますと？」\n　先師――\n「食糧だ。国庫が窮乏しては為政者が困るだろうが、昔から人間は早晩死ぬものときまっている。国民に信を失うぐらいなら、饑えて死ぬ方がいいのだ。信がなくては、政治の根本が立たないのだから。」",["shin"]],[286,11,8,"棘子成曰：「君子質而已矣，何以文為？」子貢曰：「惜乎，夫子之説，君子也，駟不及舌！文猶質也，質猶文也；虎豹之鞹，猶犬羊之鞹。」","棘子成曰く、君子は質のみ。何ぞ文を以て為さん。子貢曰く、惜しいかな、夫子の君子を説くや。駟も舌に及ばず。文は猶お質のごとく、質は猶お文のごときなり。虎豹の鞹は、猶お犬羊の鞹のごとし。","中身さえあれば形は不要、とは言えない。形と中身は一体だ。","中身があれば伝わるはずと、見せ方を怠っていないか。",["self"],[],1,"衛の大夫棘子成がいった。――\n「君子は精神的、本質的にすぐれておれば、それでいいので、外面的、形式的な磨きなどは、どうでもいいことだ。」\n　すると子貢がいった。\n「あなたの君子論には、遺憾ながら、ご同意出来ません。あなたのような地位の方が、そういうことを仰しゃっては、取りかえしがつかないことになりますから、ご注意をお願いいたします。いったい本質と外形とは決して別々のものではなく、外形はやがて本質であり、本質はやがて外形なのであります。早い話が、虎や豹の皮が虎や豹の皮として価値あるためには、その美しい毛がなければならないのでありまして、もしその毛をぬき去って皮だけにしましたら、犬や羊の皮とほとんどえらぶところはありますまい。君子もその通りであります。」",["rei"]],[287,11,9,"哀公問於有若曰：「年饑，用不足，如之何？」有若対曰：「盍徹乎？」曰：「二，吾猶不足，如之何其徹也？」対曰：「百姓足，君孰与不足？百姓不足，君孰与足！」","哀公、有若に問いて曰く、年饑えて用足らず、之を如何。有若対えて曰く、盍ぞ徹せざるや。曰く、二にして吾猶お足らず、之を如何ぞ其れ徹せんや。対えて曰く、百姓足らば、君孰と与にか足らざらん。百姓足らずんば、君孰と与にか足らん。","民が豊かなら君主も足りる。苦しい時こそ取り立てを軽くする。","苦しい局面で、社員や顧客から先に取ろうとしていないか。",["profit","lead"],["焦り"],2,"魯の哀公が有若にたずねられた。――\n「今年は飢饉で国庫が窮乏しているが、何かよい案はないのか。」\n　有若がこたえていった。――\n「どうして十分の一税になさいませんか。」\n　哀公がいわれた。――\n「十分の二税を課しても足りないのに、十分の一税になど、どうして出来るものか。」\n　すると、有若がいった。\n「百姓がもし足りていたら、君主として、あなたはいったい誰と共に不足をおなげきになりますか。百姓がもし足りていなかったら、君主として、あなたはいったい誰と共に足りているのをお喜びになりますか。」",["jin"]],[288,11,10,"子張問「崇徳，弁惑。」子曰：「主忠信，徙義：崇徳也。愛之欲其生，悪之欲其死；既欲其生，又欲其死：是惑也。」（誠不以富，亦祇以異。）","子張、徳を崇くし惑いを弁ぜんことを問う。子曰く、忠信を主とし、義に徙るは、徳を崇くするなり。之を愛しては其の生を欲し、之を悪みては其の死を欲す。既に其の生を欲し、又其の死を欲するは、是れ惑いなり。誠に富を以てせず、亦祇に異を以てす。","誠実を軸に正しい方へ移る。好き嫌いで評価が揺れるのが惑い。","好き嫌いで、同じ人への評価が極端に振れていないか。",["self","judge"],["迷い","怒り"],2,"子張がたずねた。――\n「徳を高くして、迷いを解くには、いかがいたしたものでございましょうか。」\n　先師がこたえられた。――\n「誠実と信義を旨とし、たゆみなく正義の実現に精進するがよい。それが徳を高くする道だ。迷いは愛憎の念にはじまる。愛してはその人の生命の永からんことを願い、憎んではその人の死の早からんことを願う。何というおそろしい迷いだろう。愛憎の超克、これが迷いを解く根本の道だ。」",["shin","gi"]],[289,11,11,"斉景公問「政」於孔子。孔子対曰：「君君，臣臣，父父，子子。」公曰：「善哉！信如君不君，臣不臣，父不父，子不子，雖有粟，吾得而食諸？」","斉の景公、政を孔子に問う。孔子対えて曰く、君君たり、臣臣たり、父父たり、子子たり。公曰く、善いかな。信に如し君君たらず、臣臣たらず、父父たらず、子子たらずんば、粟有りと雖も、吾得て諸を食らわんや。","上は上らしく、下は下らしく。各自が役割を果たして組織は成り立つ。","社長としての役割を、自分はまず果たせているか。",["lead"],[],2,"斉の景公が先師に政治について問われた。先師はこたえていわれた。――\n「君は君として、臣は臣として、父は父として、子は子として、それぞれの道をつくす、それだけのことでございます。」\n　景公いわれた。――\n「善い言葉だ。なるほど君が君らしくなく、臣が臣らしくなく、父が父らしくなく、子が子らしくないとすれば、財政がどんなにゆたかであっても、自分は安んじて食うことは出来ないだろう。」",["rei"]],[290,11,12,"子曰：「片言可以折獄者，其由也与！」子路無宿諾。","子曰く、片言以て獄えを折むべき者は、其れ由なるか。子路、諾を宿むること無し。","一言で争いを裁けるのは子路だ。彼は引き受けた約束を先延ばしにしない。","引き受けた約束を、寝かせたままにしていないか。",["trust","lead"],[],1,"先師がいわれた。――\n「ただ一言でぴたりと判決を下し、当事者双方を信服させる力のあるのは、由だろうか。」\n　子路は元来、引きうけたことは直ちに実行にうつす人で、ふだんから人に信頼された人なのである。",["shin"]],[291,11,13,"子曰：「聴訟，吾猶人也；必也使無訟乎！」","子曰く、訟えを聴くは、吾猶お人のごときなり。必ずや訟え無からしめんか。","争いをうまく裁くより、争いが起きない状態をつくる。","揉め事の処理に追われ、起きない仕組みを後回しにしていないか。",["trust","lead"],["疲れ"],2,"先師がいわれた。――\n「訴訟ごとの審理判決をやらされると、私もべつに人と変ったところはない。もし私に変ったところがあるとすれば、それは、訴訟ごとのない世の中にしたいと願っていることだ。」",["jin"]],[292,11,14,"子張問「政」。子曰：「居之無倦，行之以忠。」","子張、政を問う。子曰く、之に居りて倦むこと無く、之を行うに忠を以てす。","その立場に飽きず、誠実にやり続ける。","慣れた仕事に、最初と同じ誠意を注げているか。",["fail","lead"],["疲れ"],2,"子張が政治のやり方についてたずねた。先師はこたえられた。――\n「職務に専念して、辛抱づよく、真心をこめてやりさえすれば、それでいいのだ。」",["shin"]],[293,11,15,"子曰：「博学以文，約之以礼；亦可以弗畔矣夫！」","子曰く、博く文を学び、之を約するに礼を以てせば、亦以て畔かざるべきか。","広く学び、それを節度で引き締めれば、道を外れない。","集めた知識を、行動の規律にまで絞り込めているか。",["vision","self"],[],1,"先師がいわれた。――\n「ひろく典籍を学んで知見をゆたかにすると共に、実践の軌範を礼に求めてその知見にしめくくりをつけるがいい。それでこそ学問の道にそむかないといえるだろう。」",["chi","rei"]],[294,11,16,"子曰：「君子成人之美，不成人之悪。小人反是。」","子曰く、君子は人の美を成し、人の悪を成さず。小人は是に反す。","立派な人は他人の長所を伸ばし、短所を助長しない。","部下の欠点探しより、長所を伸ばす手助けをしているか。",["grow","lead"],[],2,"先師がいわれた。――\n「君子は人の美点を称揚し、助長するが、人の欠点にはふれまいとする。小人はその反対である。」",["jin"]],[295,11,17,"季康子問「政」於孔子。孔子対曰：「『政』者，正也。子帥以正，孰敢不正？」","季康子、政を孔子に問う。孔子対えて曰く、政は正なり。子帥いるに正を以てせば、孰か敢えて正しからざらん。","上が率先して正しくあれば、誰も不正などしない。","社員に求めていることを、自分がまずやっているか。",["lead","self"],[],3,"季康子が、政治について先師にたずねた。先師はこたえられた。――\n「政治の政は正であります。あなたが真先に立って正を行われるならば、誰が正しくないものがありましょう。」",["gi","shin"]],[296,11,18,"季康子患盗，問於孔子。孔子対曰：「苟子之不欲，雖賞之不窃。」","季康子、盗を患えて孔子に問う。孔子対えて曰く、苟くも子の欲せざれば、之を賞すと雖も窃まざらん。","上が貪らなければ、褒美を出しても下は盗まない。","組織の不正の根に、自分自身の欲が映っていないか。",["lead","profit"],[],2,"季康子が国内に盗賊の多いのを心配して、先師にその対策をもとめた。すると先師はこたえられた。――\n「もしあなたさえ無欲におなりになれば、賞をあたえるといっても盗む者はありますまい。」",["shin"]],[297,11,19,"季康子問政於孔子曰：「如殺無道，以就有道，何如？」孔子対曰：「子為政，焉用殺？子欲善，而民善矣。君子之徳，風；小人之徳，草；草上之風，必偃。」","季康子、政を孔子に問いて曰く、如し無道を殺して、以て有道に就かば、何如。孔子対えて曰く、子、政を為すに、焉んぞ殺を用いん。子、善を欲すれば、民善ならん。君子の徳は風なり、小人の徳は草なり。草、之に風を上うれば、必ず偃す。","罰で従わせる必要はない。上が善を望めば、風になびく草のように人は動く。","切り捨てる前に、自分の姿勢で変えられることはないか。",["lead"],["怒り"],2,"季康子が政治について先師にたずねていった。――\n「もし無道な者を殺して有道な者を保護するようにしたらいかがでしょう。」\n　先師がこたえられた。\n「政治を行うのに人を殺す必要がどこにありましょう。あなたが、もし真に善をお望みであれば、人民はおのずから善に向います。為政者と人民との関係は風と草との関係のようなもので、風が吹けば草は必ずその方向になびくものでございます。」",["shin"]],[298,11,20,"子張問：「士何如斯可謂之『達』矣？」子曰：「何哉，爾所謂『達』者？」子張対曰：「在邦必聞，在家必聞。」子曰：「是『聞』也，非『達』也。夫『達』也者，質直而好義，察言而観色，慮以下人，在邦必達，在家必達。夫『聞』也者：色取仁而行違，居之不疑。在邦必聞，在家必聞。」","子張問う、士は何如なれば斯ち之を達と謂うべき。子曰く、何ぞや、爾の所謂達とは。子張対えて曰く、邦に在りても必ず聞こえ、家に在りても必ず聞こゆ。子曰く、是れ聞なり、達に非ざるなり。夫れ達なる者は、質直にして義を好み、言を察して色を観、慮りて以て人に下る。邦に在りても必ず達し、家に在りても必ず達す。夫れ聞なる者は、色は仁を取りて行いは違い、之に居りて疑わず。邦に在りても必ず聞こえ、家に在りても必ず聞こゆ。","有名になることと、本当に通用する人になることは違う。","求めているのは評判か、それとも中身の伴う実力か。",["profit","lonely","vision"],["焦り"],2,"子張がたずねた。――\n「学問に励みますからには、いわゆる達人といわれる境地にまで進みたいと思いますが、その達というのは、いったいどういうことなのでしょう。」\n　先師がいわれた。――\n「お前はどう思うかね、その達というのは。」\n　子張がこたえた。――\n「公生活においても、私生活においても、第一流の人だといわれるようになることだろうと存じますが――」\n　先師――\n「それは名聞というものだ。達ではない。達というのは、質実朴直で正義を愛し、人言にまどわされず、顔色に欺かれず、思慮深く、しかも謙遜で、公生活においても、私生活においても、内容的に充実することなのだ。名聞だけのことなら、実行の伴わない人でも、表面仁者らしく見せかけ、自らあやしみもせず、平然としてやっておれば、公私とも何とかごまかせることもあるだろう。しかしそんな無内容なことでは、断じて達人とはいえないのだ。」",["shin","rei"]],[299,11,21,"樊遅従遊於舞雩之下曰：「敢問崇徳，脩慝，弁惑？」子曰：「善哉問！先事後得，非『崇徳』与？攻其悪，無攻人之悪，非『脩慝』与？一朝之忿，忘其身以及其親，非『惑』与？」","樊遅、従いて舞雩の下に遊ぶ。曰く、敢えて徳を崇くし、慝を脩め、惑いを弁ぜんことを問う。子曰く、善いかな問いや。事を先にして得るを後にするは、徳を崇くするに非ずや。其の悪を攻めて、人の悪を攻むること無きは、慝を脩むるに非ずや。一朝の忿りに、其の身を忘れて以て其の親に及ぼすは、惑いに非ずや。","仕事が先で見返りは後。責めるのは自分の悪。一時の怒りで身を滅ぼすな。","いまの怒りに任せて動けば、誰まで巻き込むことになるか。",["self","trust"],["怒り"],2,"樊遅が先師のお伴をして舞のほとりを散策していた。彼はたずねた。――\n「生意気なおたずねをするようですが、徳を高め、心の奥深くひそんでいる悪をのぞき、迷いを解くには、どうしたらよろしうございましょうか。」\n　先師がこたえられた。――\n「大事な問題だ。為すべき事をどしどし片付けて、損得をあとまわしにする。これが徳を高くする道ではないかね。自分の悪をせめて他人の悪をせめない。これが心に巣喰っている悪をのぞく道ではないかね。一時の腹立ちで自分を忘れ、災を近親にまで及ぼす。これが迷いというものではないかね。」",["gi","rei"]],[300,11,22,"樊遅問「仁」。子曰：「愛人。」問「知」。子曰：「知人。」樊遅未達，子曰：「挙直錯諸枉，能使枉者直。」樊遅退，見子夏曰：「郷也吾見於夫子而問『知』，子曰：『挙直錯諸枉，能使枉者直』，何謂也？」子夏曰：「富哉言乎！舜有天下，選於眾，挙皋陶，不仁者遠矣。湯有天下，選於眾，挙伊尹，不仁者遠矣。」","樊遅、仁を問う。子曰く、人を愛す。知を問う。子曰く、人を知る。樊遅未だ達せず。子曰く、直きを挙げて諸を枉れるに錯けば、能く枉れる者をして直からしむ。樊遅退き、子夏を見て曰く、郷に吾、夫子に見えて知を問う。子曰く、直きを挙げて諸を枉れるに錯けば、能く枉れる者をして直からしむと。何の謂いぞや。子夏曰く、富めるかな言や。舜、天下を有ち、衆に選びて皋陶を挙げしかば、不仁者遠ざかれり。湯、天下を有ち、衆に選びて伊尹を挙げしかば、不仁者遠ざかれり。","仁は人を愛し、知は人を知ること。真っ直ぐな人を上に置けば周りも正される。","誰を引き上げるかで、組織に何を伝えているか。",["judge","lead"],[],2,"樊遅が仁の意義をたずねた。先師はこたえられた。\n「人間を愛することだ。」\n　樊遅がさらに知の意義をたずねた。先師はこたえられた。――\n「人間を知ることだ。」\n　樊遅はまだよくのみこめないでいた。すると先師がいわれた。――\n「まっすぐな人を挙用して、まがった人の上におくと、まがった人も自然に正しくなるものだ。」\n　樊遅は室を出たが、子夏を見るとすぐたずねた。――\n「さきほど、私は先生にお会いして、知についておたずねしました。すると先生は、まっすぐな人を挙用して、まがった人の上におくと、まがった者も自然に正しくなる、といわれましたが、これはどういう意味でございましょうか。」\n　子夏がこたえた。――\n「含蓄の深いお言葉だ。昔、舜帝が天下を治めた時、衆人の中から賢人皐陶を挙げて宰相に任じたら、不仁者がすがたをひそめたのだ。また殷の湯王が天下を治めた時、衆人の中から賢人伊尹を挙げて宰相に任じたら、不仁者がすがたをひそめたのだ。」",["jin","chi"]],[301,11,23,"子貢問「友」。子曰：「忠吿而善道之，不可則止，毋自辱焉。」","子貢、友を問う。子曰く、忠告して善く之を道き、不可なれば則ち止む。自ら辱めらるること無かれ。","真心で忠告し、聞き入れられなければ引く。深追いして恥をかかない。","聞く耳のない相手を、意地で説得し続けていないか。",["trust"],["疲れ","怒り"],2,"子貢が交友の道をたずねた。先師はこたえられた。――\n「真心こめて忠告しあい、善導しあうのが友人の道だ。しかし、忠告善導が駄目だったら、やめるがいい。無理をして自分を辱しめるような破目になってはならない。」",["jin","rei"]],[302,11,24,"曽子曰：「君子以文会友，以友輔仁。」","曾子曰く、君子は文を以て友を会し、友を以て仁を輔く。","学びを通じて友と集い、友との交わりで互いの人格を高め合う。","互いを高め合える仲間と、会う時間をつくっているか。",["lonely","vision"],["孤独"],2,"曾先生がいわれた。――\n「君子は、教養を中心にして友人と相会し、友情によって仁をたすけあうものである。」\n［＃改ページ］",["chi","jin"]],[303,12,1,"子路問政。子曰：「先之，労之。」請益，曰：「無倦。」","子路、政を問う。子曰く、之に先んじ、之を労す。益を請う。曰く、倦むこと無かれ。","まず自分が先に動き、汗をかく。あとは飽きずに続けるだけ。","社員に求めていることを、自分は先にやって見せているか。",["lead","fail"],["疲れ"],2,"子路が政治についてたずねた。先師がこたえられた。――\n「人民の先に立ち、人民のために骨折るがいい。」\n　子路は物足りない気がして、いった。\n「もう少しお話をお願いいたします。」\n　すると先師はいわれた。――\n「あきないでやることだ。」",["shin"]],[304,12,2,"仲弓為季氏宰，問政。子曰：「先有司。赦小過。挙賢才。」曰：「焉知賢才而挙之？」曰：「挙爾所知。爾所不知，人其舎諸？」","仲弓、季氏の宰と為りて、政を問う。子曰く、有司を先にし、小過を赦し、賢才を挙げよ。曰く、焉くんぞ賢才を知りて之を挙げん。曰く、爾の知る所を挙げよ。爾の知らざる所は、人其れ諸を舎てんや。","担当者に任せ、小さな失敗は許し、知っている逸材から登用する。","小さなミスを責めて、任せる機会をつぶしていないか。",["grow","judge","lead"],["不安"],2,"仲弓が魯の大夫季氏の執事となった時に、政治について先師にたずねた。先師がいわれた。――\n「それぞれの係の役人を先に立てて働かせるがいい。小さな過失は大目に見るがいい。賢才を挙用することを忘れないがいい。」\n　仲弓がたずねた。――\n「賢才を挙用すると申しましても、もれなくそれを見出すことはむずかしいと存じますが――」\n　先師がいわれた。――\n「それは心配ない。お前の知っている賢才を挙用さえすれば、お前の知らない賢才は、人がすててはおかないだろう。」",["chi","jin"]],[305,12,3,"子路曰：「衛君待子而為政，子将奚先？」子曰：「必也正名乎！」子路曰：「有是哉？子之迂也！奚其正？」子曰：「野哉，由也！君子於其所不知，蓋闕如也。名不正，則言不順；言不順，則事不成；事不成，則礼楽不興；礼楽不興，則刑罰不中；刑罰不中，則民無所措手足。故君子名之必可言也，言之必可行也。君子於其言，無所苟而已矣。」","子路曰く、衛の君、子を待ちて政を為さば、子将に奚をか先にせん。子曰く、必ずや名を正さんか。子路曰く、是れ有るかな、子の迂なるや。奚ぞ其れ正さん。子曰く、野なるかな、由や。君子は其の知らざる所に於いては、蓋し闕如たり。名正しからざれば、則ち言順わず。言順わざれば、則ち事成らず。事成らざれば、則ち礼楽興らず。礼楽興らざれば、則ち刑罰中らず。刑罰中らざれば、則ち民手足を措く所無し。故に君子は之に名づくれば必ず言うべきなり。之を言えば必ず行うべきなり。君子は其の言に於いて、苟くもする所無きのみ。","役割と言葉の定義が曖昧なままでは、どんな施策も実を結ばない。","肩書きと実際の役割が食い違ったまま、放置している所はないか。",["lead","decide"],["迷い","焦り"],2,"子路がいった。――\n「もし衛の君が先生をおむかえして政治を委ねられることになりましたら、先生は真先に何をなさいましょうか。」\n　先師がこたえられた。――\n「先ず名分を正そう。」\n　すると、子路がいった。――\n「それだから先生は迂遠だと申すのです。この火急の場合に、名分など正しておれるものではありません。」\n　先師がいわれた。――\n「お前は何というはしたない男だろう。君子は自分の知らないことについては、だまってひかえているものだ。そもそも名分が正しくないと論策が道をはずれる。論策が道をはずれると実務があがらない。実務があがらないと礼楽が興らない。礼楽が興らないと刑罰が適正でない。刑罰が適正でないと人民は不安で手足の置き場にも迷うようになる。だから君子は必ず先ず名分を正すのだ。いったい君子というものは、名分の立たないことを口にすべきでなく、口にしたことは必ずそれを実行にうつす自信がなければならない。あやふやな根拠に立って、うかつな口をきくような人は、断じて君子とはいえないのだ。」",["rei","chi"]],[306,12,4,"樊遅請学稼，子曰：「吾不如老農。」請学為圃，曰：「吾不如老圃。」樊遅出，子曰：「小人哉，樊須也！上好礼，則民莫敢不敬；上好義，則民莫敢不服；上好信，則民莫敢不用情，夫如是，則四方之民，襁負其子而至矣，焉用稼？」","樊遅、稼を学ばんと請う。子曰く、吾は老農に如かず。圃を為るを学ばんと請う。曰く、吾は老圃に如かず。樊遅出ず。子曰く、小人なるかな、樊須や。上礼を好めば、則ち民敢えて敬せざる莫し。上義を好めば、則ち民敢えて服せざる莫し。上信を好めば、則ち民敢えて情を用いざる莫し。夫れ是くの如くんば、則ち四方の民、其の子を襁負して至らん。焉くんぞ稼を用いん。","上に立つ者の仕事は現場の技術ではなく、礼・義・信を自ら示すこと。","現場の作業に逃げて、トップにしかできない仕事を後回しにしていないか。",["lead","vision"],["迷い"],2,"樊遅が殻物の作り方を教えていただきたいと先師に願った。先師はこたえられた。――\n「私は老農には及ばないよ。」\n　樊遅は、すると、野菜の作り方を教えていただきたいと願った。先師はこたえられた。――\n「私は老園芸家には及ばないよ。」\n　樊遅が引退がると、先師はいわれた。――\n「樊須は人物が小さい。上に立つ者が礼を好めば、人民が上を敬しないことはない。上に立つ者が義を好めば、人民が上に服しないことはない。上に立つ者が信を好めば、人民が不人情になることはない。そして、そうなれば、人民はその徳を慕い、四方の国々から子供をおぶって集って来るであろう。為政者に農業技術の知識など何の必要もないことだ。」",["shin","rei"]],[307,12,5,"子曰：「誦詩三百，授之以政，不達。使於四方，不能專対；雖多，亦奚以為？」","子曰く、詩三百を誦するも、之に授くるに政を以てして達せず、四方に使いして専対すること能わずんば、多しと雖も、亦奚を以て為さん。","どれほど知識を蓄えても、実務と交渉で使えなければ意味がない。","学んだことのうち、実際の仕事で使えているものはどれだけあるか。",["vision","grow"],["慢心"],2,"先師がいわれた。――\n「詩経にある三百篇の詩を暗んずることが出来ても、政治をゆだねられて満足にその任務が果せず、諸侯の国に使して自分の責任において応対が出来ないというようでは、何のためにたくさんの詩を暗んじているのかわからない。」",["chi"]],[308,12,6,"子曰：「其身正，不令而行；其身不正，雖令不従。」","子曰く、其の身正しければ、令せずして行わる。其の身正しからざれば、令すと雖も従わず。","自分が正しくあれば命じなくても人は動く。そうでなければ命じても動かない。","人が動かない原因を、指示の出し方ではなく自分の姿に探したか。",["lead","self"],["怒り","焦り"],3,"先師がいわれた。――\n「上に立つ者が身を正しくすれば、命令を下さないでも道が行われるし、身を正しくしなければ、どんなに厳しい命令を下しても、人民はついて来るものではない。」",["shin"]],[309,12,7,"子曰：「魯衛之政，兄弟也。」","子曰く、魯衛の政は兄弟なり。","魯と衛の政治は、兄弟のようによく似ているという評。","",[],[],0,"先師がいわれた。――\n「魯の政治と衛の政治とはやはり兄弟だな。」",[]],[310,12,8,"子謂衛公子荊，「善居室：始有，曰：『苟合矣；』少有，曰：『苟完矣。』富有，曰：『苟美矣。』」","子、衛の公子荊を謂う。善く室に居る。始め有るに、曰く、苟か合えりと。少しく有るに、曰く、苟か完しと。富に有るに、曰く、苟か美しと。","財産が少なくても増えても「これで十分」と言えた公子荊への賛辞。","いまの規模や持ち物に、まず「足りている」と言えるだろうか。",["profit","self"],["焦り"],1,"衛の公子荊のことについて、先師がいわれた。――\n「あの人は家庭経済をよく心得て、奢らなかった人だ。はじめ型ばかり家財があった時に、どうなり間にあいそうだといい、少し家財がふえると、どうやらこれで十分だといい、足りないものがないようになると、いささか華美になりすぎたといった。」",["rei"]],[311,12,9,"子適衛，冉有僕。子曰：「庶矣哉！」冉有曰：「既庶矣，又何加焉？」曰：「富之。」曰：「既富矣，又何加焉？」曰：「教之。」","子、衛に適く。冉有僕たり。子曰く、庶きかな。冉有曰く、既に庶し。又何をか加えん。曰く、之を富まさん。曰く、既に富めり。又何をか加えん。曰く、之を教えん。","人が集まったら、まず暮らしを豊かにし、その次に教育する。","社員の生活を安定させる前に、理念ばかり説いていないか。",["grow","decide","lead"],["迷い"],2,"先師が衛に行かれた時、冉有がお供をして馬車を御していた。先師はいわれた。――\n「この国の人口は大したものだ。」\n　すると冉有がたずねた。――\n「これだけ人が集れば結構でございますが、この上は、どういうことに力を注ぐべきでございましょう。」\n　先師――\n「経済生活をゆたかにしてやりたいね。」\n　冉有――\n「もし経済生活がゆたかになりましたら、その次には？」\n　先師――\n「文教を盛んにすることだ。」",["jin","chi"]],[312,12,10,"子曰：「苟有用我者，期月而已可也，三年有成。」","子曰く、苟くも我を用うる者有らば、期月のみにして可ならん。三年にして成すこと有らん。","任せてくれる人さえいれば一年で形にし、三年で成果を出せるという自負。","機会が来たとき、一年で形にできるだけの準備が自分にあるか。",["lonely","vision"],["孤独","落胆"],1,"先師がいわれた。――\n「もし私を用いて政治をやらせてくれる国があったら、一年で一通りのことは出来るし、三年もあったら申し分のないところまで行けるのだが。」",["gi"]],[313,12,11,"子曰：「『善人為邦百年，亦可以勝残去殺矣。』誠哉是言也。」","子曰く、善人邦を為むること百年ならば、亦以て残に勝ち殺を去るべしと。誠なるかな是の言や。","善良な人が百年治め続けて、ようやく暴力と極刑のない世になる。","組織の風土を変えるのに、どれだけの年月を覚悟しているか。",["lead","fail"],["焦り"],1,"先師がいわれた。――\n「古語に、単なる善人に過ぎないような人でも、もしその人が百年間政治の任にあたることが出来たら、人間の残忍性を矯め、死刑のような極刑を用いないでもすむようになる、とあるが、まことにその通りだ。」",["jin"]],[314,12,12,"子曰：「如有王者，必世而後仁。」","子曰く、如し王者有らば、必ず世にして後に仁ならん。","理想の指導者が現れても、仁が行きわたるには一世代かかる。","理念が浸透しないと嘆く前に、十分な時間をかけてきたか。",["lead","fail"],["焦り"],1,"先師がいわれた。――\n「たとえ真の王者が現われても、少くも一世代を経なければ、民をあまねく仁に化することは出来ない。」",["jin"]],[315,12,13,"子曰：「苟正其身矣，於従政乎何有？不能正其身，如正人何？」","子曰く、苟くも其の身を正しくせば、政に従うに於いて何か有らん。其の身を正しくすること能わずんば、人を正すを如何せん。","自分を正せない者に、人を正すことはできない。","部下に直してほしいことを、自分はもう直せているか。",["self","lead"],["怒り"],2,"先師がいわれた。\n「もし自分の身を正しくすることが出来るなら、政治の局に当っても何の困難があろう。もし自分の身を正しくすることが出来ないなら、どうして人を正しくすることが出来よう。」",["shin"]],[316,12,14,"冉子退朝，子曰：「何晏也？」対曰：「有政。」子曰：「其事也！如有政，雖不吾以，吾其与聞之！」","冉子、朝より退く。子曰く、何ぞ晏きや。対えて曰く、政有り。子曰く、其れ事ならん。如し政有らば、吾を以いずと雖も、吾其れ之を与り聞かん。","冉有の言う「政務」は季氏の私事にすぎないと、孔子が公私の別をただした。","",[],[],0,"冉先生が役所から退出して来られると、先師がたずねられた。――\n「どうしてこんなにおそくなったのかね。」\n　冉先生がこたえられた。――\n「政治上の相談がひまどりまして。」\n　先師がいわれた。――\n「いや、そうではあるまい。季氏一家の私事ではなかったかね。もし政治向きのことであれば私にも相談があるはずだ。」",["gi"]],[317,12,15,"定公問：「一言而可以興邦，有諸？」孔子対曰：「言不可以若是其幾也！人之言曰：『為君難，為臣不易』。如知為君之難也，不幾乎一言而興邦乎？」曰：「一言而喪邦，有諸？」孔子対曰：「言不可以若是其幾也！人之言曰：『予無楽乎為君，唯其言而莫予違也。』如其善而莫之違也，不亦善乎？如不善而莫之違也，不幾乎一言而喪邦乎？」","定公問う、一言にして以て邦を興すべきこと、諸有りや。孔子対えて曰く、言は以て是くの若く其れ幾すべからざるなり。人の言に曰く、君為ること難く、臣為ること易からずと。如し君為ることの難きを知らば、一言にして邦を興すに幾からずや。曰く、一言にして邦を喪ぼすこと、諸有りや。孔子対えて曰く、言は以て是くの若く其れ幾すべからざるなり。人の言に曰く、予君為ることを楽しむこと無し。唯其の言いて予に違うこと莫きなりと。如し其れ善にして之に違うこと莫くんば、亦善からずや。如し不善にして之に違うこと莫くんば、一言にして邦を喪ぼすに幾からずや。","トップの難しさを知れば国は興り、誰も逆らわないことを喜べば国は滅ぶ。","最近、自分の意見に正面から反対してくれた人はいるか。",["lead","self","trust"],["慢心"],3,"魯の定公がたずねられた。――\n「一言で国を興隆させるような言葉はないものかな。」\n　先師がこたえられた。――\n「いったい言葉というものは、仰せのようにこれぞという的確なききめのあるものではありません。しかし、世の諺に、君となるのも難しい、臣となるのもたやすくはない、ということがございます。もし、君となるのがむずかしいという言葉が支配者に十分のみこめましたら、その言葉こそ一言で国を興隆させる言葉にもなろうかと存じます。」\n　定公がまたたずねられた。――\n「一言で国を亡ぼすというような言葉はないものかな。」\n　先師がこたえられた。――\n「いったい言葉というものは、仰せのように、これぞという的確なききめのあるものではありません。しかし、世の諺に、君となっても何の楽みもないが、ただ何をいってもさからう者がないのが楽みだ、ということがございます。もし善いことをいってさからう者がないというのなら、まことに結構でございますが、万一にも、悪いことをいってもさからう者がないという意味でございますと、それこそ一言で国を亡ばす言葉にもなろうかと存じます。」",["chi"]],[318,12,16,"葉公問政。子曰：「近者説，遠者来。」","葉公、政を問う。子曰く、近き者説び、遠き者来る。","身近な人が喜んでいれば、遠くの人も自然に集まってくる。","新しい顧客を追う前に、いまの社員と顧客は喜んでいるか。",["lead","vision"],["焦り"],2,"葉公が政道についてたずねた。先師はこたえられた。――\n「領内の人民が悦服すれば、領外の者も慕って参りましょう。」",["shin"]],[319,12,17,"子夏為莒父宰，問政。子曰：「無欲速，無見小利。欲速，則不達；見小利，則大事不成。」","子夏、莒父の宰と為りて、政を問う。子曰く、速やかならんことを欲すること無かれ。小利を見ること無かれ。速やかならんことを欲すれば、則ち達せず。小利を見れば、則ち大事成らず。","成果を急げば届かず、目先の利益に気を取られれば大きな仕事は成らない。","いま急いでいるその成果は、本当に急ぐべきものか。",["decide","profit","self"],["焦り"],3,"子夏が父の代官となった時、政道についてたずねた。先師はこたえられた。――\n「功をいそいではならない。小利にとらわれてはならない。功をいそぐと手落ちがある。小利にとらわれると大事を成しとげることが出来ない。」",["gi"]],[320,12,18,"葉公語孔子曰：「吾党有直躬者，其父攘羊，而子証之。」孔子曰：「吾党之直者異於是，父為子隠，子為父隠，直在其中矣。」","葉公、孔子に語りて曰く、吾が党に直躬なる者有り。其の父、羊を攘みて、子之を証せり。孔子曰く、吾が党の直き者は是に異なり。父は子の為に隠し、子は父の為に隠す。直きこと其の中に在り。","親子がかばい合う情のなかにこそ、人としてのまっすぐさがある。","規則の正しさと身近な人への情がぶつかるとき、何を拠り所にするか。",["decide","trust"],["迷い"],1,"葉公が得意らしく先師に話した。――\n「私の地方に、感心な正直者がおりまして、その男の父が、どこからか羊が迷いこんで来たのを、そのまま自分のものにしていましたところ、かくさずそのあかしを立てたのでございます。」\n　すると、先師がいわれた。――\n「私の地方の正直者は、それとは全く趣がちがっております。父は子のためにその罪をかくしてやりますし、子は父のためにその罪をかくしてやるのでございます。私は、そういうところにこそ、人間のほんとうの正直さというものがあるのではないかと存じます。」",["jin"]],[321,12,19,"樊遅問仁。子曰：「居処恭，執事敬，与人忠。雖之夷狄，不可棄也。」","樊遅、仁を問う。子曰く、居処は恭に、事を執りては敬に、人と与わりては忠なれ。夷狄に之くと雖も、棄つべからざるなり。","ふだんは慎み深く、仕事は丁寧に、人には誠実に。どこへ行っても変えない。","相手や場所によって、仕事の丁寧さを変えてしまっていないか。",["self","trust"],["疲れ"],2,"樊遅が仁についてたずねた。先師がこたえられた。――\n「休息している時にもだらけた風をしない、執務の時には仕事に魂をぶちこむ、人と交っては誠実を旨とする。この三つのことを、時処の如何をとわず、たとえば野蛮国に行っても忘れないようにするがいい。」",["rei","shin"]],[322,12,20,"子貢問曰：「何如斯可謂之『士』矣？」子曰：「行己有恥，使於四方，不辱君命；可謂『士』矣。」曰：「敢問其次。」曰：「宗族称孝焉，郷党称弟焉。」曰：「敢問其次。」曰：「言必信，行必果，硜硜然，小人哉，抑亦可以為次矣。」曰：「今之従政者何如？」子曰：「噫！斗筲之人，何足算也！」","子貢問いて曰く、何如なるをか斯れ之を士と謂うべき。子曰く、己を行うに恥有り、四方に使いして君命を辱めざる、士と謂うべし。曰く、敢えて其の次を問う。曰く、宗族孝を称し、郷党弟を称す。曰く、敢えて其の次を問う。曰く、言必ず信、行必ず果、硜硜然として小人なるかな。抑亦以て次と為すべし。曰く、今の政に従う者は何如。子曰く、噫、斗筲の人、何ぞ算うるに足らんや。","一流は恥を知り任務を全うする人。約束を守るだけの頑固さは三番手。","自分の振る舞いに、恥ずかしいと感じる基準を持てているか。",["judge","self"],["慢心"],2,"子貢がたずねた。――\n「士たる者の資格についておうかがいいたしたいと存じます。」\n　先師がこたえられた。――\n「自分の行動について恥を知り責任を負い、使節となって外国に赴いたら君命を辱しめない、というほどの人であったら、士といえるだろう。」\n　子貢がまたたずねた。――\n「もう一段さがったところで申しますと？」\n　先師――\n「一家親族から孝行者だとほめられ、土地の人から兄弟の情誼に厚いと評判されるような人だろう。」\n　子貢――\n「更にもう一段さがったところで申しますと？」\n　先師――\n「口に出したことは必ず実行する、やり出したことはあくまでやりとげる、といったような人は、石ころ見たようにこちこちしていて、融通がきかないところがあり、人物の型は小さいが、それでも第三流ぐらいのねうちはあるだろう。」\n　子貢が最後にたずねた。――\n「現在政務に当っている人たちをご覧になって、どうお考えになりますか。」\n　すると先師はこたえられた。――\n「だめ、だめ。桝ではかるような小人物ばかりで、まるで問題にはならない。」",["gi","shin"]],[323,12,21,"子曰：「不得中行而与之，必也狂狷乎：狂者進取，狷者有所不為也。」","子曰く、中行を得て之に与せずんば、必ずや狂狷か。狂者は進みて取り、狷者は為さざる所有るなり。","バランスの良い人が得られないなら、志の高い人か節を曲げない人を選ぶ。","無難な人ばかり選んで、尖った人材を遠ざけていないか。",["judge","grow"],["迷い"],2,"先師がいわれた。――\n「願わくば中道を歩む人と事を共にしたいが、それが出来なければ、狂熱狷介な人を求めたい。狂熱的な人は志が高くて進取的であり、狷介な人は節操が固くて断じて不善を為さないからだ。」",["gi"]],[324,12,22,"子曰：「南人有言曰：『人而無恆，不可以作巫医』。「善夫！『不恆其徳，或承之羞』」子曰：「不占而已矣。」","子曰く、南人言えること有り。曰く、人にして恒無くんば、以て巫医を作すべからずと。善いかな。其の徳を恒にせざれば、或いは之に羞を承めんと。子曰く、占わざるのみ。","心がぐらつき一貫しない人は、何をしても実らず、いずれ恥をかく。","方針をころころ変えて、周りを振り回していないか。",["self","vision","fail"],["迷い"],2,"先師がいわれた。\n「南国の人の諺に、人間の移り気だけには、祈祷師のお祈りも役に立たないし、医者の薬もきかない、ということがあるが、名言だ。また、易経に、徳がぐらついていると、いつかは、だれかに恥辱というお土産をいただくだろう、という言葉があるが、これもまちがいのないことだ。」",["shin"]],[325,12,23,"子曰：「君子和而不同，小人同而不和。」","子曰く、君子は和して同ぜず、小人は同じて和せず。","できた人は調和するが安易に同調しない。小さな人は同調するが調和しない。","会議の「全員賛成」は、調和なのか、ただの同調なのか。",["trust","lead","lonely"],["孤独","不安"],3,"先師がいわれた。\n「君子は人と仲よく交るが、ぐるにはならない。小人はぐるにはなるが、ほんとうに仲よくはならない。」",["gi"]],[326,12,24,"子貢問曰：「郷人皆好之，何如？」子曰：「未可也。」「郷人皆悪之，何如？」子曰：「未可也。不如郷人之善者好之，其不善者悪之。」","子貢問いて曰く、郷人皆之を好まば、何如。子曰く、未だ可ならざるなり。郷人皆之を悪まば、何如。子曰く、未だ可ならざるなり。郷人の善き者之を好み、其の善からざる者之を悪むに如かず。","全員に好かれる人より、善い人に好かれ悪い人に嫌われる人が本物。","評判の数ではなく、誰がその人を評価しているかを見ているか。",["judge","lonely","trust"],["不安","孤独"],2,"子貢がたずねた。\n「その土地の人みんなにほめられるような人でございましたら、りっぱな人といえましょうか。」\n　先師がこたえられた。――\n「必ずしもそうとはいえまい。」\n　子貢――\n「では、土地の人みんなに憎まれるような人が却ってりっぱな人でございましょうか。」\n「そうはいえまい。土地の善人にほめられ、悪人ににくまれるような人が、一番りっぱな人なのだ。」",["chi"]],[327,12,25,"子曰：「君子易事而難説也；説之不以道，不説也；及其使人也，器之。小人難事而易説也。説之雖不以道，説也；及其使人也，求備焉。」","子曰く、君子は事え易くして説ばしめ難し。之を説ばしむるに道を以てせざれば、説ばざるなり。其の人を使うに及びては、之を器にす。小人は事え難くして説ばしめ易し。之を説ばしむるに道を以てせずと雖も、説ぶなり。其の人を使うに及びては、備わらんことを求む。","良い上司はお世辞を喜ばず、人を持ち味に応じて使う。悪い上司は逆に完璧を求める。","部下一人ひとりに、何でもできることを求めてしまっていないか。",["grow","lead","self"],["怒り"],2,"先師がいわれた。\n「君子は仕えやすいが、きげんはとりにくい。きげんをとろうとしても、こちらが道にかなっていないといい顔はしない。しかし人を使う時には、それぞれの器量に応じて使ってくれ、無理な要求をしないから仕えやすい。小人は、これに反して、仕えにくいがきげんはとりやすい。こちらが道にかなわなくても、きげんをとろうと思えばわけなく出来る。しかし人を使う時には、すべてに完全を求めて無理な要求をするから仕えにくい。」",["chi","gi"]],[328,12,26,"子曰：「君子泰而不驕；小人驕而不泰。」","子曰く、君子は泰にして驕らず、小人は驕りて泰ならず。","できた人は落ち着いていて威張らない。小さな人は威張るのに落ち着きがない。","強く見せようとするとき、内心は何を恐れているのか。",["self"],["慢心","不安"],2,"先師がいわれた。――\n「君子は泰然としている。しかし高ぶらない。小人は高ぶる。しかし泰然たるところがない。」",["rei"]],[329,12,27,"子曰：「剛毅木訥，近仁。」","子曰く、剛毅木訥、仁に近し。","意志が強く、果断で、飾らず、口下手。そういう人が仁に近い。","話のうまさに目を奪われて、無口で誠実な人を見落としていないか。",["judge","self"],[],2,"先師がいわれた。――\n「剛健な意志、毅然たる節操、表裏のない質朴さ、粉飾のない訥々たる言葉、こうした資質は、最高の徳たる仁に近い徳である。」",["gi"]],[330,12,28,"子路問曰：「何如斯可謂之『士』矣？」子曰：「切切偲偲、怡怡如也，可謂『士』矣。朋友切切偲偲，兄弟怡怡。」","子路問いて曰く、何如なるをか斯れ之を士と謂うべき。子曰く、切切偲偲、怡怡如たる、士と謂うべし。朋友には切切偲偲、兄弟には怡怡たり。","友には真心をこめて励まし合い、兄弟にはなごやかに接する人が士である。","厳しさだけで人に接して、温かさを置き忘れていないか。",["trust","self"],["怒り"],1,"子路がたずねた。――\n「どういう人物を士というのでございましょう。」\n　先師がこたえられた。――\n「こまやかな情愛、かゆいところに手のとどくような親切心、春風のようにやわらかで温かい物ごし、そうしたものが士にはそなわっていなければならない。とりわけ朋友に対しては情をこまやかにして、懇切に交るがいいし、兄弟に対しては顔色をやわらげることに気をつけるがいい。」",["jin"]],[331,12,29,"子曰：「善人教民七年，亦可以卽戎矣。」","子曰く、善人民を教うること七年ならば、亦以て戎に即かしむべし。","善い指導者が七年かけて教えて、初めて民を戦いに出せる。","人を大事な勝負に出す前に、十分な時間をかけて育てたか。",["grow"],["焦り"],1,"先師がいわれた。――\n「有徳の人が人民を教化して七年になったら、はじめて戦争に使ってもよいようになるだろう。」",["chi"]],[332,12,30,"子曰：「以不教民戦，是謂棄之。」","子曰く、教えざるの民を以て戦う、是れ之を棄つと謂う。","教えもせずに人を戦場へ送るのは、その人を見捨てるのと同じだ。","教えないまま現場に放り込み、失敗を本人のせいにしていないか。",["grow","lead"],["焦り"],2,"先師がいわれた。――\n「教化訓練の行き届かない人民を率いて戦にのぞむのは、民を棄てるのと同じである。」",["jin"]],[333,13,1,"憲問「恥」。子曰：「邦有道，穀；邦無道，穀，恥也。」","憲、恥を問う。子曰く、邦に道有れば穀す。邦に道無くして穀するは、恥なり。","筋の通らない組織で報酬だけ受け取り続けるのは恥である。","いま受け取っている報酬は、胸を張れる仕事の対価か。",["profit","decide"],["迷い"],2,"憲が恥についてたずねた。先師がこたえられた。――\n「国に道が行われている時、仕えて祿を食むのは恥ずべきことではない。しかし、国に道が行われていないのに、その祿を食むのは恥ずべきである。」",["gi"]],[334,13,2,"「克、伐、怨、欲，不行焉，可以為仁矣？」子曰：「可以為難矣，仁則吾不知也。」","克・伐・怨・欲、行われざる、以て仁と為すべきか。子曰く、以て難しと為すべし。仁は則ち吾知らざるなり。","欲や怨みを抑えるのは立派だが、それだけではまだ仁ではない。","悪い癖を抑えるだけで満足し、人への働きかけを忘れていないか。",["self"],["慢心"],1,"憲がたずねた。――\n「優越心、自慢、怨恨、食欲、こうしたものを抑制することが出来ましたら、仁といえましょうか。」\n　先師がこたえられた。\n「それが出来たらえらいものだが、それだけで仁といえるかどうかは問題だ。」",["jin"]],[335,13,3,"子曰：「士而懐居，不足以為士矣！」","子曰く、士にして居を懐うは、以て士と為すに足らず。","居心地のよさに執着する者は、志ある人とは呼べない。","いまの快適さを守るために、先送りしている挑戦は何か。",["vision","decide"],["疲れ","迷い"],2,"先師がいわれた。――\n「士たる者が、安楽な家庭生活のみを恋しがるようでは、士の名に値しない。」",["gi"]],[336,13,4,"子曰：「邦有道，危言危行；邦無道，危行言孫。」","子曰く、邦に道有れば、言を危しくし行いを危しくす。邦に道無ければ、行いを危しくし言は孫う。","行いは常に厳しく正しく。言葉は状況を見て控えめにする。","正しさを曲げずに、言い方だけを変えられる場面はどこか。",["trust","decide"],["不安"],2,"先師がいわれた。――\n「国に道が行われている時には、信ずるところを大胆に言い、大胆に行うべきである。国に道が行われていない時には、行いは無論大胆でなければならないが、言葉は多少ひかえて、婉曲であるがいい。」",["gi","rei"]],[337,13,5,"子曰：「有徳者必有言，有言者不必有徳。仁者必有勇，勇者不必有仁。」","子曰く、徳有る者は必ず言有り。言有る者は必ずしも徳有らず。仁者は必ず勇有り。勇者は必ずしも仁有らず。","弁が立つ人が徳のある人とは限らず、勇ましい人が仁者とも限らない。","話のうまさや威勢のよさだけで、人を評価していないか。",["judge"],["迷い"],2,"先師がいわれた。――\n「有徳の人は必ずよいことをいう。しかしよいことをいう人、必ずしも有徳の人ではない。仁者には必ず勇気がある。しかし勇者必ずしも仁者ではない。」",["jin","gi"]],[338,13,6,"南宮适問於孔子曰：「羿善射，奡盪舟，俱不得其死然。禹稷躬稼而有天下。」夫子不答。南宮适出，子曰：「君子哉若人！尙徳哉若人！」","南宮适、孔子に問いて曰く、羿は射を善くし、奡は舟を盪かす。倶に其の死を得ず。禹と稷とは躬ら稼して天下を有つと。夫子答えず。南宮适出ず。子曰く、君子なるかな、若き人。徳を尚ぶかな、若き人。","力に頼った者は滅び、地道に働いた者が天下を得たという故事。","力で押し切ろうとしている案件を、地道な積み上げに戻せないか。",["vision"],["焦り"],1,"南宮が先師にたずねていった。――\n「は弓の名手であり。※［＃「（戛－戈）／介」の「人がしら」に代えて「大」、U+5961、372-下-12］は大船をゆり動かすほどの大力でありましたが、いずれも非業の最期をとげました。しかるに、禹と稷とは自ら耕作に従事して、ついに天子の位にのぼりました。これについての先生の御感想を承りたいと存じます。」\n　先師はこたえられなかった。しかし、南宮がその場を去ると、いわれた。\n「あのような人こそ、まことの君子だ。あのような人こそ、まことに徳を尊ぶ人だ。」",[]],[339,13,7,"子曰：「君子而不仁者有矣夫！未有小人而仁者也！」","子曰く、君子にして不仁なる者は有らんか。未だ小人にして仁なる者有らざるなり。","志ある人でも仁を欠くことはある。志のない人に仁はない。","志を掲げていることに安心し、目の前の人への思いやりを欠いていないか。",["self"],["慢心"],1,"先師がいわれた。――\n「道に志す君子にも不仁なものがないとはいえない。しかし道を求めない小人はすべて不仁だ。」",["jin"]],[340,13,8,"子曰：「愛之，能勿労乎？忠焉，能勿誨乎？」","子曰く、之を愛して、能く労すること勿からんや。忠にして、能く誨うること勿からんや。","大切に思うなら苦労をさせ、誠実であるなら率直に教え諭す。","部下を思うあまり、必要な苦労や耳の痛い指摘を避けていないか。",["grow","lead"],["迷い"],2,"先師がいわれた。――\n「人を愛するからには、その人を鍛えないでいられようか。人に忠実であるからには、その人を善導しないでいられようか。」",["jin"]],[341,13,9,"子曰：「為命，裨諶草創之，世叔討論之，行人子羽脩飾之，東里子產潤色之。」","子曰く、命を為るに、裨諶之を草創し、世叔之を討論し、行人子羽之を修飾し、東里の子産之を潤色す。","鄭の外交文書は、四人が得意を分担して仕上げていた。","重要な仕事を一人に抱えさせず、強みごとに分担できているか。",["grow"],[],1,"先師がいわれた。――\n「※［＃「猶のつくり＋おおざと」、U+2871F、374-上-2］の国では、外交文書を作製するには、裨が草稿をつくり、世叔がその内容を検討し、外交官の子羽がその文章に筆を入れ、更に東里の子産がそれに最後の磨きをかけている。」",[]],[342,13,10,"或問子產，子曰：「惠人也。」問子西。曰：「彼哉彼哉！」問管仲。曰：「人也，奪伯氏騈邑三百，飯疏食，没歯，無怨言。」","或るひと子産を問う。子曰く、恵人なり。子西を問う。曰く、彼をや、彼をや。管仲を問う。曰く、人なり。伯氏の駢邑三百を奪い、疏食を飯いて、歯を没するまで、怨言無かりき。","子産・子西・管仲の人物評。管仲は処分した相手にも怨まれなかった。","",[],[],0,"ある人が※［＃「猶のつくり＋おおざと」、U+2871F、374-上-14］の大夫子産の人物についてたずねた。先師がこたえられた。――\n「めぐみ深い人だ。」\n　楚の大夫子西の人物についてたずねた。先師がこたえられた。――\n「あの人か、あの人は。」\n　斉の大夫管仲の人物についてたずねた。先師がこたえられた。――\n「人物だね。あの人は大夫伯氏の罪をただして、その領地であった駢邑三百里を没収したが、当の伯氏は、その後やっとかゆをすするほどの困りかたであったにもかかわらず、死ぬまであの人に対して怨みごとをいわなかったというのだから、大したものだ。」",[]],[343,13,11,"子曰：「貧而無怨，難；富而無驕，易。」","子曰く、貧しくして怨むこと無きは難く、富みて驕ること無きは易し。","苦しい時に人を怨まないのは、豊かな時に驕らないより難しい。","業績が苦しいいま、誰かや何かのせいにしていないか。",["fail","self"],["怒り","落胆"],2,"先師がいわれた。――\n「貧乏でも怨みがましくならないということは、めったな人に出来ることではない。それに比べると、富んでおごらないということはたやすいことだ。」",["rei"]],[344,13,12,"子曰：「孟公綽，為趙、魏老則優，不可以為滕、薛大夫。」","子曰く、孟公綽は、趙・魏の老と為れば則ち優なり。以て滕・薛の大夫と為すべからず。","大家の家老なら立派に務まる人でも、小国の実務を担う大夫には向かない。","あの人の不振は能力の問題か、それとも配置の問題か。",["judge","grow"],[],1,"先師がいわれた。――\n「孟公綽は、たとい晉の趙家や魏家のような大家であっても、その家老になったらりっぱなものだろう。しかし、滕や薜のような小国でも、その大夫にはなれない人物だ。」",["chi"]],[345,13,13,"子路問成人。子曰：「若臧武仲之知，公綽之不欲，卞荘子之勇，冉求之芸，文之以礼楽，亦可以為成人矣！」曰：「今之成人者，何必然？見利思義，見危授命，久要不忘平生之言，亦可以為成人矣！」","子路、成人を問う。子曰く、臧武仲の知、公綽の不欲、卞荘子の勇、冉求の芸の若き、之を文るに礼楽を以てせば、亦以て成人と為すべし。曰く、今の成人は、何ぞ必ずしも然らん。利を見ては義を思い、危うきを見ては命を授け、久要に平生の言を忘れざれば、亦以て成人と為すべし。","利益を前に義を考え、危機に身を投げ出し、古い約束を守る。それが一人前。","儲け話を前にしたとき、まず筋が通るかを考えているか。",["profit","judge"],["迷い"],2,"子路が「成人」の資格についてたずねた。先師がいわれた。――\n「臧武仲の知、公綽の無欲、卞荘子の勇気、冉求の多芸をかね、更に礼楽をもつて磨きをかけたら、成人といってもいいだろう。」\n　さらにいわれた。――\n「しかし、今のような乱世では、そこまでは望めまい。利得の問題では道義を考え、国家の危急に臨んでは身命をなげうち、古い約束や、平常の誓いを忘れずに実行する、というような人であったら、今ではまずまず成人といえるだろう。」",["gi","shin"]],[346,13,14,"子問公叔文子於公明賈，曰：「信乎？夫子不言不笑不取乎？」公明賈対曰：「以吿者過也！夫子時然後言，人不厭其言；楽然後笑，人不厭其笑；義然後取，人不厭其取。」子曰：「其然！豈其然乎？」","子、公叔文子を公明賈に問いて曰く、信なるか、夫子は言わず、笑わず、取らずとは。公明賈対えて曰く、以て告ぐる者の過ちなり。夫子は時にして然る後に言う、人其の言うことを厭わず。楽しみて然る後に笑う、人其の笑うことを厭わず。義にして然る後に取る、人其の取ることを厭わず。子曰く、其れ然り、豈に其れ然らんや。","言うべき時に言い、筋の通るものだけ受け取る人は、誰にも嫌がられない。","自分の発言や受け取るものは、時と筋にかなっているか。",["self","trust"],[],1,"先師が公叔文子のことを公明賈にたずねていわれた。\n「ほんとうでしょうか、あの方は、言わず笑わず取らず、というような方だときいていますが？」\n　公明賈がこたえていった。――\n「それはお話しした人の言いすぎでございましょう。あの方は、言うべき時になってはじめて口をひらかれますので、人があの方を口数の多い方だとは思わないのです。あの方は心から楽しい時にだけ笑われますので、お笑いになるのが鼻につかないのです。また、あの方は、筋道の立つ贈物だけをお取りになりますので、お取りになっても人が気にしないのです。」\n　すると先師がいわれた。――\n「なるほど、その通りでしょう。うわさなどあてになりませんね。」",["gi"]],[347,13,15,"子曰：「臧武仲以防，求為後於魯，雖曰不要君，吾不信也。」","子曰く、臧武仲、防を以て後を為てんことを魯に求む。君を要せずと曰うと雖も、吾は信ぜざるなり。","領地を盾に要求した臧武仲を、主君への強要でないとは信じない。","",[],[],0,"先師がいわれた。――\n「臧武仲は、罪を得て魯を去る時、その領地であった防にふみとどまり、自分の後嗣を立てることを魯君に求めたのだ。彼が武力に訴えて国君を強要する意志はなかったといっても、私はそれを信ずるわけには行かない。」",[]],[348,13,16,"子曰：「晉文公譎而不正，斉桓公正而不譎。」","子曰く、晋の文公は譎りて正しからず。斉の桓公は正しくして譎らず。","晋の文公は策略に走り、斉の桓公は正道を歩んだという人物評。","",[],[],0,"先師がいわれた。\n「晉の文公は謀略を好んで正道によらなかった人であり、斉の桓公は正道によって謀略を用いなかった人である。」",[]],[349,13,17,"子路曰：「桓公殺公子糾，召忽死之，管仲不死。」曰：「未仁乎？」子曰：「桓公九合諸侯，不以兵車，管仲之力也。如其仁！如其仁！」","子路曰く、桓公、公子糾を殺す。召忽之に死し、管仲は死せず。曰く、未だ仁ならざるか。子曰く、桓公、諸侯を九合して、兵車を以てせざるは、管仲の力なり。其の仁に如かんや、其の仁に如かんや。","主君に殉じなかった管仲を、武力なしに諸侯をまとめた功績で評価する。","人を一つの汚点だけで裁き、成し遂げた仕事を見落としていないか。",["judge"],[],1,"子路がいった。――\n「斉の桓公が公子糾を殺した時、召忽は公子糾に殉じて自殺しましたのに、管仲は生き永らえて却って桓公の政をたすけました。こういう人は仁者とはいえないのではありますまいか。」\n　先師がこたえられた。――\n「桓公が武力を用いないで諸侯の聯盟に成功し、夷狄の難から中国を救い得たのは、全く管仲の力だ。それを思うと、管仲ほどの仁者はめったにあるものではない。めったにあるものではない。」",["jin"]],[350,13,18,"子貢曰：「管仲非仁者与？桓公殺公子糾，不能死，又相之。」子曰：「管仲相桓公，霸諸侯，一匡天下，民到于今受其賜；微管仲，吾其被髪左衽矣！豈若匹夫匹婦之為諒也，自経於溝瀆，而莫之知也！」","子貢曰く、管仲は仁者に非ざるか。桓公、公子糾を殺すに、死すること能わず、又之を相く。子曰く、管仲、桓公を相けて、諸侯に覇たらしめ、天下を一匡す。民、今に到るまで其の賜を受く。管仲微かりせば、吾其れ髪を被り衽を左にせん。豈に匹夫匹婦の諒を為すや、自ら溝瀆に経れて、之を知るもの莫きが若くならんや。","小さな義理に殉じるより、生きて天下を安んじた管仲の功を重く見る。","面子や小さな義理にこだわって、果たすべき大きな役割を捨てていないか。",["decide","judge"],["迷い"],1,"子貢がいった。――\n「管仲は仁者とはいえますまい。桓公が公子糾を殺した時、糾に殉じて死ぬことが出来ず、しかも、桓公に仕えてその政を輔佐したのではありませんか。」\n　先師がこたえられた。\n「管仲が桓公を輔佐して諸侯聯盟の覇者たらしめ、天下を統一安定したればこそ、人民は今日にいたるまでその恩恵に浴しているのだ。もし管仲がいなかったとしたら、われわれも今頃は夷狄の風俗に従って髪をふりみだし、着物を左前に着ていることだろう。管仲ほどの人が、小さな義理人情にこだわり、どぶの中で首をくくって名もなく死んで行くような、匹夫匹婦のまねごとをすると思ったら、それは見当ちがいではないかね。」",["gi","jin"]],[351,13,19,"公叔文子之臣大夫僎，与文子同升諸公。子聞之曰：「可以為文矣！」","公叔文子の臣、大夫僎、文子と同じく諸を公に升る。子之を聞きて曰く、以て文と為すべし。","自分の家臣を同格の大夫に推挙した公叔文子を、孔子は称えた。","部下が自分と肩を並べることを、心から喜んで後押しできるか。",["grow","judge"],[],1,"公叔文子の家臣であったは、大夫となって文子と同列で朝廷に出仕した。先師はそのことを知っていわれた。――\n「公叔文子は文の名に値する人だ。」",["chi"]],[352,13,20,"子言衛霊公之無道也。康子曰：「夫如是，奚而不喪？」孔子曰：「仲叔圉治賓客，祝鮀治宗廟，王孫賈治軍旅。夫如是，奚其喪？」","子、衛の霊公の無道なるを言う。康子曰く、夫れ是くの如くんば、奚ぞ喪びざる。孔子曰く、仲叔圉は賓客を治め、祝鮀は宗廟を治め、王孫賈は軍旅を治む。夫れ是くの如くんば、奚ぞ其れ喪びん。","君主が無道でも、要所に有能な人材がいれば国は滅びない。","自分が欠けても回るように、要所を任せられる人を置けているか。",["grow","judge"],["不安"],1,"先師が、衛の霊公は無道な君主だと非難された。すると大夫の季康子がいった。――\n「仰しゃるとおりだとしますと、どうして国が亡びないのでしょう。」\n　先師がいわれた。――\n「仲叔圉が外交に任じ、祝駝が内政を司り、王孫賈が国防の責を負っています。これだけの人物がそろっていて、どうして国が亡びましょう。」",["chi"]],[353,13,21,"子曰：「其言之不怍，則為之也難！」","子曰く、其の言を之れ怍じざれば、則ち之を為すや難し。","恥じらいもなく大きなことを言う人は、実行が伴わない。","最近口にした大きな約束のうち、まだ手を付けていないものは何か。",["self","judge"],["慢心"],2,"先師がいわれた。――\n「恥かしげもなく偉らそうなことをいうようでは、実行はあやしいものである。」",["shin"]],[354,13,22,"陳成子弒簡公。孔子沐浴而朝，吿於哀公曰：「陳恆弒其君，請討之。」公曰：「吿夫三子。」孔子曰：「以吾従大夫之後，不敢不吿也！君曰：『吿夫三子』者！」之三子吿，不可。孔子曰：「以吾従大夫之後，不敢不吿也！」","陳成子、簡公を弑す。孔子、沐浴して朝し、哀公に告げて曰く、陳恒、其の君を弑す。請う之を討たん。公曰く、夫の三子に告げよ。孔子曰く、吾大夫の後に従えるを以て、敢えて告げずんばあらざるなり。君は曰う、夫の三子者に告げよと。三子に之きて告ぐ。可かず。孔子曰く、吾大夫の後に従えるを以て、敢えて告げずんばあらざるなり。","通らないと分かっていても、立場上言うべきことは言わねばならない。","結果が見えているからと、言うべきことを黙っていないか。",["decide","lonely"],["落胆"],1,"斉の大夫陳成子がその君簡公を弑した。先師は斎戒沐浴して身をきよめ、参内して哀公に言上された。――\n「斉の陳恆が君を弑しました。ご討伐なさるがよろしいと存じます。」\n　哀公がいわれた。――\n「先ずあの三人に話して見るがいい。」\n　先師は退出して歎息しながらいわれた。――\n「自分も大夫の末席につらなっている以上、默っては居れないほどの重大事なので、申上げたのだが、ご決断がつかないと見えて、あの三人に話せと仰せられる。いたしかたもない。」\n　先師はそういって三家に相談に行かれた。三人は賛成しなかった。先師はまた歎息していわれた。――\n「自分も大夫の末席につらなっている以上、默っては居れないほどの重大事なので、いったのだが、三人とも気にもかからぬと見える。何ということだろう。」",["gi"]],[355,13,23,"子路問事君，子曰：「勿欺也，而犯之。」","子路、君に事えんことを問う。子曰く、欺くこと勿かれ。而して之を犯せ。","上に仕えるなら、欺かず、必要なら面と向かって諫めよ。","自分に面と向かって異を唱えてくれる人が、社内に何人いるか。",["trust","lead"],[],2,"子路が君に仕える道をたずねた。先師はいわれた。――\n「いつわりのないのが先ず第一だ。そして場合によっては面を犯して直言するがいい。」",["shin","gi"]],[356,13,24,"子曰：「君子上達，小人下達。」","子曰く、君子は上達し、小人は下達す。","君子は高いものへ通じていき、小人は低いものへ通じていく。","日々の関心は、高いほうと低いほうのどちらへ向かっているか。",["vision","self"],[],1,"先師がいわれた。――\n「君子は上へ上へと進む。小人は下へ下へと進む。」",["gi"]],[357,13,25,"子曰：「古之学者為己，今之学者為人。」","子曰く、古の学者は己の為にし、今の学者は人の為にす。","学びは自分を磨くためのもの。人に見せるためのものではない。","いまの学びや挑戦は、自分を磨くためか、人に見せるためか。",["vision","lonely","self"],["焦り"],3,"先師がいわれた。――\n「昔の人は自分を伸ばすために学問をした。今の人は人に見せるために学問をしている。」",["chi"]],[358,13,26,"蘧伯玉使人於孔子，孔子与之坐而問焉。曰：「夫子何為？」対曰：「夫子欲寡其過而未能也。」使者出。子曰：「使乎！使乎！」","蘧伯玉、人を孔子に使いせしむ。孔子之に坐を与えて問いて曰く、夫子何をか為す。対えて曰く、夫子は其の過ちを寡くせんと欲して、未だ能わざるなり。使者出ず。子曰く、使いなるかな、使いなるかな。","主人は過ちを減らそうと努めてまだできずにいる、と答えた使者を称えた。","過ちを減らす努力を、いまも続けていると言えるか。",["self","fail"],["慢心"],1,"伯玉が先師に使者をやった。先師は使者を座につかせてたずねられた。――\n「御主人はこのごろどんなことをしておすごしでございますか。」\n　使者がこたえた。――\n「主人は何とかして過ちを少くしたいと苦心していますが、なかなかそうは参らないようでございます。」\n　使者が帰ったあとで、先師がいわれた。――\n「見事な使者だ、見事な使者だ。」",["rei"]],[359,13,27,"子曰：「不在其位，不謀其政。」","子曰く、其の位に在らざれば、其の政を謀らず。","その立場にないなら、その職務に口を出さない。","任せたはずの仕事に、つい口を出していないか。",["grow","self"],["焦り"],2,"先師がいわれた。――\n「その地位にいなくて、みだりにその職務のことに口出しすべきではない。」",["rei"]],[360,13,28,"曽子曰：「君子思不出其位。」","曾子曰く、君子は思うこと其の位を出でず。","君子は、自分の持ち場を越えたことまで思いわずらわない。","自分の持ち場でやるべきことに、考えを集中できているか。",["self","decide"],["焦り"],1,"曾先生がいわれた。――\n「君子は自分の本分をこえたことは考えないものである。」",["rei"]],[361,13,29,"子曰：「君子恥其言而過其行。」","子曰く、君子は其の言を恥じて、其の行いを過ごす。","言葉は控えめに、行動は言葉以上に。","語っていることに、行動は追いついているか。",["self","lead"],["慢心"],3,"先師がいわれた。――\n「君子は言葉が過ぎるのを恥じる。しかし実践には過ぎるほど努力する。」",["shin"]],[362,13,30,"子曰：「君子道者三，我無能焉：仁者不憂，知者不惑，勇者不懼。」子貢曰：「夫子自道也！」","子曰く、君子の道なる者三つ。我能くすること無し。仁者は憂えず、知者は惑わず、勇者は懼れず。子貢曰く、夫子自ら道うなり。","仁者は憂えず、知者は惑わず、勇者は懼れない。孔子自身はまだ及ばぬと言う。","いまの自分を縛っているのは、憂いか、惑いか、恐れか。",["decide","self"],["不安","迷い"],2,"先師がいわれた。――\n「君子の道には三つの面があるが、私はまだいずれの面でも、達していない。三つの面というのは、仁者は憂えない、知者は惑わない、勇者はおそれない、ということだ。」\n　子貢がいった。――\n「それは先生がご自分で仰しゃることで、ご謙遜だと思います。」",["jin","chi"]],[363,13,31,"子貢方人。子曰：「賜也，賢乎哉？夫我則不暇！」","子貢、人を方ぶ。子曰く、賜や賢なるかな。夫れ我は則ち暇あらず。","他人の品定めに時間を使うくらいなら、自分を磨くことに使う。","人の批評に費やした時間を、自分の修養に回せないか。",["self","trust"],["慢心"],2,"子貢がある時、しきりに人物の品定めをやっていた。すると先師はいわれた。――\n「賜はもうすいぶん賢い男になったらしい。私にはまだ他人の批評などやっているひまはないのだが。」",["chi"]],[364,13,32,"子曰：「不患人之不己知，患其不能也。」","子曰く、人の己を知らざるを患えず、其の能くせざるを患う。","認められないことを悩むより、自分の力不足を気にかける。","評価されない悔しさを、何の力を磨くことに向けるか。",["lonely","self"],["孤独","落胆"],3,"先師がいわれた。――\n「人が自分を認めてくれないのを気にかけることはない。自分にそれだけの能力がないのを気にかけるがいい。」",["chi"]],[365,13,33,"子曰：「不逆詐，不億不信，抑亦先覚者，是賢乎！」","子曰く、詐りを逆えず、信ぜられざるを億らず、抑も亦先ず覚る者は、是れ賢か。","初めから疑ってかからず、それでいて嘘に自然と気づける人が賢い。","一度の裏切りのせいで、誰に対しても疑いから入っていないか。",["judge","trust"],["不安"],2,"先師がいわれた。――\n「だまされはしないかと邪推したり、疑われはしないかと取越苦労をしたりしないで、虚心に相手に接しながら、しかも相手の本心がわかるようであれば、賢者といえようか。」",["chi"]],[366,13,34,"微生畝謂孔子曰：「丘，何為是栖栖者与？無乃為佞乎？」孔子曰：「非敢為佞也，疾固也。」","微生畝、孔子に謂いて曰く、丘、何為れぞ是れ栖栖たる者ぞ。乃ち佞を為すこと無からんや。孔子曰く、敢えて佞を為すに非ざるなり。固を疾めばなり。","あくせく動くのは口先で取り入るためではない。独りよがりに固まるのを嫌うからだ。","自分の考えに凝り固まり、外の人と会うことを減らしていないか。",["lonely","vision"],["孤独"],1,"微生畝が先師にいった。――\n「丘、お前は何でそんなに、いつまでもあくせくとうろつきまわっているのだ。そんなふうで、おべんちゃらばかりいって歩いているのではないかね。」\n　先師がいわれた。――\n「いや、べつにおしゃべりをしたいわけではありませんが、小さく固まって独りよがりになるのがいやなものですから。」",["gi"]],[367,13,35,"子曰：「驥不称其力，称其徳也。」","子曰く、驥は其の力を称せず、其の徳を称するなり。","名馬が称えられるのは力ではなく、よく調えられた性質のためである。","人を評価するとき、能力だけでなく人柄も見ているか。",["judge","grow"],[],2,"先師がいわれた。――\n「名馬が名馬といわれるのは、その力のためではなく調教が行き届いて性質がよくなっているからだ。」",[]],[368,13,36,"或曰：「以徳報怨，何如？」子曰：「何以報徳？以直報怨，以徳報徳。」","或るひと曰く、徳を以て怨みに報いば、何如。子曰く、何を以てか徳に報いん。直きを以て怨みに報い、徳を以て徳に報ゆ。","怨みには公正さで、恩には恩で応える。無理に善人ぶらなくていい。","ひどい仕打ちをした相手に、感情抜きの公正さで向き合えているか。",["trust","self"],["怒り"],3,"ある人がたずねた。――\n「怨みに報いるに徳をもってしたら、いかがでございましょう。」\n　先師がこたえられた。――\n「それでは徳に報いるのには、何をもってしたらいいかね。怨みには正しさをもって報いるがいいし、徳には徳をもって報いるがいい。」",["gi"]],[369,13,37,"子曰：「莫我知也夫！」子貢曰：「何為其莫知子也？」子曰：「不怨天，不尤人，下学而上達，知我者，其天乎！」","子曰く、我を知ること莫きかな。子貢曰く、何為れぞ其れ子を知ること莫からん。子曰く、天を怨みず、人を尤めず、下学して上達す。我を知る者は其れ天か。","天を怨まず人を責めず、足元から学んで高みへ。分かってくれるのは天でいい。","誰にも理解されなくても、黙って続けると決めていることは何か。",["lonely","fail","vision"],["孤独","落胆"],3,"先師が歎息していわれた。――\n「ああ、とうとう私は人に知られないで世を終りそうだ。」\n　子貢がおどろいていった。――\n「どうして先生のような大徳の方が世に知られないというようなことが、あり得ましょう。」\n　すると先師は、しばらく沈默したあとでいわれた。――\n「私は天を怨もうとも、人をとがめようとも思わぬ。私はただ自分の信ずるところに従って、低いところから学びはじめ、一歩一歩と高いところにのぼって来たのだ。私の心は天だけが知っている。」",["chi"]],[370,13,38,"公伯寮愬子路於季孫，子服景伯以吿，曰：「夫子固有惑志於公伯寮，吾力猶能肆諸市朝。」子曰：「道之将行也与，命也；道之将廢也与，命也。公伯寮其如命何？」","公伯寮、子路を季孫に愬う。子服景伯以て告げて曰く、夫子固より公伯寮に惑える志有り。吾が力猶お能く諸を市朝に肆さん。子曰く、道の将に行われんとするや、命なり。道の将に廃れんとするや、命なり。公伯寮、其れ命を如何せん。","中傷する者がいても、道が行われるかどうかは天命。一人の悪意では動かせない。","陰口や中傷への仕返しに、力を使おうとしていないか。",["trust","fail"],["怒り","不安"],2,"公伯寮が子路のことを季孫にざん言した。子服景伯が先師にその話をして、いった。――\n「季孫はむろん公伯寮の言にまどわされていますので、心配でございます。しかし、私の力で、何とかして子路の潔白を証明し、公伯寮の屍をさらしてお目にかけますから、ご安心下さい。」\n　すると先師はいわれた。――\n「道が行われるのも天命です。道がすたれるのも天命です。公伯寮ごときに天命が動かせるものでもありますまいから、あまりご心配なさらない方がよいと思います。」",["gi"]],[371,13,39,"子曰：「賢者辟世，其次辟地，其次辟色，其次辟言。」","子曰く、賢者は世を辟く。其の次は地を辟く。其の次は色を辟く。其の次は言を辟く。","賢者は乱れた世を去り、次は土地を、次は相手の顔色を、次は言葉を見て身を引く。","ここは退くべき場だという兆しを、見て見ぬふりしていないか。",["decide"],["迷い"],1,"先師がいわれた。――\n「賢者がその身を清くする場合が四つある。世の中全体に道が行われなければ、世をさけて隠棲する。ある地方に道が行われなければ、その地方をさけて、他の地方に行く。君主の自分に対する信任がうすらぎ、それが色に出たら、その色をさけて隠退する。君主の言葉と自分の言葉とが対立すれば、その言葉をさけて隠退する。」",["chi"]],[372,13,40,"子曰：「作者七人矣。」","子曰く、作つ者七人なり。","そのように身を処した者が七人いた、という短い言葉。","",[],[],0,"先師がいわれた。――\n「立ちあがったものが、七人だ。」",[]],[373,13,41,"子路宿於石門。晨門曰：「奚自？」子路曰：「自孔氏。」曰：「是知其不可而為之者与？」","子路、石門に宿る。晨門曰く、奚れ自りする。子路曰く、孔氏自りす。曰く、是れ其の不可なるを知りて、而も之を為す者か。","無理だと知りながら、それでもやり続ける人。孔子は世間にそう呼ばれた。","無理だと言われても、やめないと決めていることは何か。",["vision","lonely","fail"],["孤独","落胆"],3,"子路が石門に宿って、翌朝関所を通ろうとすると、門番がたずねた。――\n「どちらからおいでですかな。」\n　子路がこたえた。――\n「孔家のものです。」\n　すると門番がいった。――\n「ああ、あの、だめなことがわかっていながら、思いきりわるくまだやっている人のうちの方ですかい。」",["gi"]],[374,13,42,"子擊磬於衛。有荷蕢者而過孔氏之門者，曰：「有心哉！擊磬乎！」既而曰：「鄙哉，硜硜乎！莫己知也，斯已而已矣！『深則厲，淺則揭。』」子曰：「果哉！末之難矣！」","子、磬を衛に撃つ。蕢を荷いて孔氏の門を過ぐる者有り。曰く、心有るかな、磬を撃つや。既にして曰く、鄙なるかな、硜硜乎たり。己を知ること莫くんば、斯れ已まんのみ。深ければ則ち厲し、浅ければ則ち掲す。子曰く、果なるかな。之を難しとする末し。","認められなければ退けばいいと言う隠者に、孔子は割り切るだけなら易しいと応じた。","手を引くほうが楽な場面で、あえて関わり続ける理由は何か。",["vision","lonely"],["孤独","迷い"],1,"先師が衛に滞在中、ある日磬をうって楽しんでいられた。その時、もつこをかついで門前を通りがかった男が、いった。――\n「ふふうむ。ちょっと意味ありげな磬のうちかただな。」\n　しばらくして、彼はまたいった。――\n「だが、品がない。執念深い音だ。やっぱりまだ未練があるらしいな。認めてもらえなけりゃあ、ひっこむだけのことだのに。」\n　それから彼は歌をうたい出した。\n「わしに添いたきゃ、渡っておじゃれ、\n水が深かけりゃ腰までぬれて、\n浅けりゃ、ちょいと小褄をとって。\nほれなきゃ、そなたの気のままよ。」\n　それをきいていた門人の一人が、先師にそのことを話すと、先師はいわれた。――\n「思いきりのいい男だ。だが、思いきってよければ、何もむずかしいことはない。大事なのは、一身を清くすることではなくて、天下と共に清くなることなのだ。」",["gi"]],[375,13,43,"子張曰：「書云：『高宗諒陰，三年不言。』何謂也？」子曰：「何必高宗，古之人皆然。君薨，百官総己以聴於冢宰，三年。」","子張曰く、書に云う、高宗諒陰、三年言わずと。何の謂いぞや。子曰く、何ぞ必ずしも高宗のみならん。古の人皆然り。君薨ずれば、百官己を総べて、以て冢宰に聴くこと三年なり。","先君の喪の三年間、新君は口を出さず、百官は宰相の指図に従ったという古礼。","",[],[],0,"子張がいった。\n「書経に、高宗は服喪中の三年間口をきかなかった、とありますが、どういう意味でございましょうか。」\n　先師がこたえられた。――\n「それは高宗にかぎったことではない。古人はみなそうだったのだ。君主がおかくれになると、三年の間は、百官はそれぞれの職務をまとめて、すべて首相の指図に従うことになっていたので、あとに立たれた君主は口をきく必要がなかったのだ。」",["rei"]],[376,13,44,"子曰：「上好礼，則民易使也。」","子曰く、上礼を好めば、則ち民使い易きなり。","上に立つ者が礼を大切にすれば、人は気持ちよく動いてくれる。","社員に求めている礼儀や節度を、まず自分が示しているか。",["lead"],[],2,"先師がいわれた。――\n「為政者が礼を好むと、人民は快く義務をつくすようになる。」",["rei","shin"]],[377,13,45,"子路問君子。子曰：「脩己以敬。」曰：「如斯而已乎？」曰：「脩己以安人。」曰：「如斯而已乎？」曰：「脩己以安百姓。脩己以安百姓，堯舜其猶病諸！」","子路、君子を問う。子曰く、己を修めて以て敬す。曰く、斯くの如きのみか。曰く、己を修めて以て人を安んず。曰く、斯くの如きのみか。曰く、己を修めて以て百姓を安んず。己を修めて以て百姓を安んずるは、堯舜も其れ猶お諸を病めり。","まず自分を修める。それが周りの人を、やがて万人を安心させる出発点になる。","社員を安心させるために、まず自分の何を整えるべきか。",["lead","self"],["焦り"],3,"子路が君子の道をたずねた。先師がこたえられた。――\n「大事に大事に細心な注意をはらって、自分の身を修めるがいい。」\n　子路――\n「それだけのことでございますか。」\n　先師――\n「自分の身を修めて人を安んずるのだ。」\n　子路――\n「それだけのことでございますか。」\n　先師――\n「自分の身を修めて天下万民を安んずるのだ。天下万民を安んずるのは、堯舜のような聖天子も心をなやまされたことなのだ。」",["rei","jin"]],[378,13,46,"原壤夷俟。子曰：「幼而不孫弟，長而無述焉，老而不死，是為賊。」以杖叩其脛。","原壌、夷して俟つ。子曰く、幼にして孫弟ならず、長じて述ぶること無く、老いて死せず。是を賊と為す。杖を以て其の脛を叩く。","無作法に座って待つ旧友の原壌を、孔子が叱って杖で脛を叩いた話。","",[],[],0,"原壤が、両膝をだき、うずくまったままで、先師が近づかれるのを待っていた。先師はいわれた。――\n「お前は、子供のころには目上の人に対する道をわきまえず、大人になっても何一つよいことをせず、その年になってまだ生をむさぼっているが、お前のような人間こそ世の中の賊だ。」\n　そういって、杖で彼の脛をたたかれた。",["rei"]],[379,13,47,"闕党童子将命。或問之曰：「益者与？」子曰：「吾見其居於位也，見其与先生並行也，非求益者也，欲速成者也。」","闕党の童子、命を将う。或るひと之を問いて曰く、益する者か。子曰く、吾其の位に居るを見る。其の先生と並び行くを見る。益を求むる者に非ざるなり。速やかに成らんと欲する者なり。","その少年は成長を求めているのではなく、早く一人前に見られたいだけだ。","早く成果を見せたい焦りが、地道な積み上げを飛ばさせていないか。",["grow","self"],["焦り"],2,"闕という村の出身だった一少年が、先師の家で取次役をさせられていた。そこである人が、先師にたずねた。――\n「あの少年もよほど学問が上達したと見えますね。」\n　先師はこたえられた。――\n「いやそうではありません。私はあの少年が成人の坐る席に坐っていたのを見ましたし、また先輩と肩をならべて歩くのを見ました。あの少年は学問の上達を求めているのでなく、早く成人になりたがっているのです。それで実は取次でもやらして、仕込んで見たいと存じまして……」",["rei","chi"]],[380,14,1,"衛霊公問陳於孔子。孔子対曰：「俎豆之事，則嘗聞之矣；軍旅之事，未之学也。」明日遂行。在陳絕糧。従者病，莫能興。子路慍見曰：「君子亦有窮乎？」子曰：「君子固窮，小人窮斯濫矣。」","衛の霊公、陳を孔子に問う。孔子対えて曰く、俎豆の事は則ち嘗て之を聞けり。軍旅の事は未だ之を学ばざるなり、と。明日遂に行る。陳に在りて糧を絶つ。従者病みて、能く興つこと莫し。子路慍りて見えて曰く、君子も亦窮すること有るか。子曰く、君子固より窮す。小人窮すれば斯に濫る。","立派な人も行き詰まる。違いは、窮地で崩れるかどうか。","追い込まれた今、自分は何を崩さずにいられるか。",["fail","self","lead"],["落胆","不安"],3,"衛の霊公が戦陣のことについて先師に質問した。先師がこたえていわれた。――\n「私は祭具の使い方については学んだことがありますが、軍隊の使い方については学んだことがございません。」\n　翌日先師はついに衛を去られた。――\n　陳においでの時に、食糧攻めにあわれた。お伴の門人たちは、すっかり弱りきって、起きあがることも出来ないほどであった。子路が憤慨して先師にいった。――\n「君子にも窮するということがありましょうか。」\n　すると、先師がいわれた。――\n「君子もむろん窮することがある。しかし、窮しても取りみださない。小人は窮すると、すぐに取りみだすのだ。」",["gi"]],[381,14,2,"子曰：「賜也，女以予為多学而識之者与？」対曰：「然，非与？」曰：「非也，予一以貫之。」","子曰く、賜や、女は予を以て多く学びて之を識る者と為すか。対えて曰く、然り。非なるか。曰く、非なり。予は一以て之を貫く。","物知りなのではない。一つの原理で全てを貫いているのだ。","自分のあらゆる判断を貫いている一本の軸は何か。",["vision","decide"],["迷い"],2,"先師がいわれた。――\n「賜よ、お前は私を博学多識な人だと思つているのか。」\n　子貢がこたえた。――\n「むろん、さようでございます。ちがっていましょうか。」\n　先師――\n「ちがっている。私はただ一つのことで貫いているのだ。」",["chi"]],[382,14,3,"子曰：「由，知徳者鮮矣！」","子曰く、由よ、徳を知る者は鮮なし。","徳の値打ちを本当にわかっている人は、めったにいない。","徳の大切さを、知識でなく実感として語れるか。",["lonely","vision"],["孤独"],1,"先師がいわれた。――\n「由よ、ほんとうに徳というものが腹にはいっているものは少いものだね。」",["chi"]],[383,14,4,"子曰：「無為而治者，其舜也与！夫何為哉？恭己正南面而已矣。」","子曰く、無為にして治まる者は、其れ舜なるか。夫れ何をか為さんや。己を恭しくして正しく南面するのみ。","あれこれ手を出さず、自分を正して座る。それで治まるのが理想。","自分が動き回らなくても回る組織に、何が足りないか。",["lead","grow","self"],["疲れ","焦り"],2,"先師がいわれた。――\n「無為にして天下を治めることが出来たのは、舜であろう。舜は何をしたか。ただ恭しい態度で、正しく南面していただけである。」",["rei","shin"]],[384,14,5,"子張問行。子曰：「言忠信，行篤敬，雖蠻貊之邦行矣。言不忠信，行不篤敬，雖州里行乎哉？立，則見其參於前也；在輿，則見其倚於衡也。夫然後行。」子張書諸紳。","子張、行われんことを問う。子曰く、言忠信、行篤敬なれば、蛮貊の邦と雖も行われん。言忠信ならず、行篤敬ならざれば、州里と雖も行われんや。立てば則ち其の前に参わるを見、輿に在れば則ち其の衡に倚るを見る。夫れ然る後に行われん。子張、諸を紳に書す。","言葉に誠、行いに慎み。それがあればどこでも通用する。","自分の言葉と行いは、初対面の相手にも通用する誠実さか。",["lead","trust","self"],["不安"],2,"子張が、どうしたら自分の意志が社会に受けいれられ、実現されるか、ということについてたずねた。先師がこたえられた。――\n「言葉が忠信であり、行いが篤敬であるならば、野蛮国においても思い通りのことが行われるであろうし、もしそうでなければ、自分の郷里においても何一つ行われるものではない。忠信篤敬の四字が、立っている時には眼のまえにちらつき、車に腰をおろしている時には、ながえの先の横木に、ぶらさがって見えるというぐらいに、片時もそれを忘れないようになって、はじめて自分の意志を社会に実現することが出来るのだ。」\n　子張はこの四字を紳に書きつけて守りとした。",["shin","rei"]],[385,14,6,"子曰：「直哉史魚！邦有道，如矢；邦無道，如矢。君子哉蘧伯玉！邦有道，則仕；邦無道，則可卷而懐之。」","子曰く、直なるかな史魚。邦に道有れば矢の如く、邦に道無きも矢の如し。君子なるかな蘧伯玉。邦に道有れば則ち仕え、邦に道無ければ則ち巻きて之を懐にすべし。","どんな世でも真っすぐな史魚、時勢を見て進退した蘧伯玉。","いまは貫く時か、力を収めて待つ時か。",["decide"],["迷い"],1,"先師がいわれた。――\n「史魚は何という真直な人だろう。国に道があっても矢のように真直であり、国に道がなくても矢のように真直だ。」\n　またいわれた。――\n「伯玉は何という見事な君子だろう。国に道があれば出でて仕え、国に道がなければただちに才能を巻いて懐におさめる。」",["gi"]],[386,14,7,"子曰：「可与言，而不与之言，失人；不可与言，而与之言，失言。知者不失人，亦不失言。」","子曰く、与に言うべくして之と言わざれば、人を失う。与に言うべからずして之と言えば、言を失う。知者は人を失わず、亦言を失わず。","語るべき人に語らねば人を失い、語るべきでない人に語れば言葉を失う。","いま本音で話すべき相手に、きちんと話せているか。",["trust","judge","grow"],["迷い"],2,"先師がいわれた。――\n「共に語るに足る人に会いながら、その人と語らなければ人を失うことになる。共に語るに足りない人に会って、みだりにその人と語れば言葉を失うことになる。知者は人を失わないし、また言葉を失わない。」",["chi"]],[387,14,8,"子曰：「志士仁人，無求生以害仁，有殺身以成仁。」","子曰く、志士仁人は、生を求めて以て仁を害すること無く、身を殺して以て仁を成すこと有り。","志ある人は、保身のために人の道を曲げない。","身を守るために、譲ってはならないものを譲っていないか。",["profit","vision","decide"],["迷い","不安"],2,"先師がいわれた。――\n「志士仁人は生を求めて仁を害することがない。却って身を殺して仁を成しとげることがあるものだ。」",["gi","jin"]],[388,14,9,"子貢問為仁。子曰：「工欲善其事，必先利其器。居是邦也，事其大夫之賢者，友其士之仁者。」","子貢、仁を為さんことを問う。子曰く、工、其の事を善くせんと欲すれば、必ず先ず其の器を利くす。是の邦に居りては、其の大夫の賢なる者に事え、其の士の仁なる者を友とす。","よい仕事はまず道具を研ぐことから。優れた人のそばに身を置け。","自分を磨いてくれる人のそばに、いま身を置いているか。",["judge","vision","grow"],[],2,"子貢が仁を行う道についてたずねた。先師がこたえられた。――\n「大工はよい仕事をやろうと思うと、必ず先ず自分の道具を鋭利にする。同様に、仁を行うには、先ず自分の身を磨かなければならない。それには、どこの国に住まおうと、その国の賢大夫を選んでこれに仕え、その国の仁徳ある士を選んでこれを友とするがよい。」",["chi"]],[389,14,10,"顔淵問為邦。子曰：「行夏之時，乘殷之輅，服周之冕，楽則韶舞。放鄭声，遠佞人。鄭声淫，佞人殆。」","顔淵、邦を為めんことを問う。子曰く、夏の時を行い、殷の輅に乗り、周の冕を服し、楽は則ち韶舞。鄭声を放ち、佞人を遠ざけよ。鄭声は淫にして、佞人は殆うし。","各時代の良い制度を採り、みだらな音楽と口先の人を遠ざけよ。","耳に心地よいだけの人を、そばに置きすぎていないか。",["judge"],[],1,"顔渕が治国の道をたずねた。先師がいわれた。――\n「夏の暦法を用い、殷の輅に乗り、周の冕をかぶるがいい。舞楽は韶がすぐれている。※［＃「猶のつくり＋おおざと」、U+2871F、395-上-8］の音楽を禁じ、佞人を遠けることを忘れてはならない。※［＃「猶のつくり＋おおざと」、U+2871F、395-上-9］の音楽はみだらで、佞人は危険だからな。」",["rei","chi"]],[390,14,11,"子曰：「人無遠慮，必有近憂。」","子曰く、人、遠き慮り無ければ、必ず近き憂い有り。","先を見ていなければ、足元にすぐ心配事が生まれる。","目の前の火消しに追われ、数年先の備えを後回しにしていないか。",["decide","vision"],["不安","焦り"],3,"先師がいわれた。\n「遠い将来のことを考えない人には、必ず間近かに心配ごとが待っている。」",["chi"]],[391,14,12,"子曰：「已矣乎！吾未見好徳如好色者也！」","子曰く、已んぬるかな。吾未だ徳を好むこと色を好むが如くする者を見ざるなり。","美人を好むほどの熱心さで徳を求める人には、まだ会えない。","欲しいものを追う熱量で、自分を磨こうとしているか。",["self","vision"],["落胆"],1,"先師がいわれた。――\n「なさけないことだ。私はまだ色事を好むほど徳を好むものを見たことがない。」",[]],[392,14,13,"子曰：「臧文仲，其窃位者与！知柳下惠之賢，而不与立也。」","子曰く、臧文仲は其れ位を窃む者か。柳下恵の賢を知りて、而も与に立たざるなり。","優れた人を知りながら登用しないのは、地位を盗むのと同じ。","自分より優れた人を、脅威と感じて遠ざけていないか。",["judge","grow","lead"],["慢心"],2,"先師がいわれた。――\n「臧文仲は位をぬすむ人というべきであろう。柳下恵の賢人たることを知っていながら、彼を推挙して共に朝廷に立とうとはしなかったのだ。」",["chi","gi"]],[393,14,14,"子曰：「躬自厚，而薄責於人，則遠怨矣！」","子曰く、躬自ら厚くして、薄く人を責むれば、則ち怨みに遠ざかる。","自分には厳しく、人には寛く。そうすれば恨みは遠のく。","人を責めたのと同じ厳しさで、今日の自分を点検したか。",["trust","self","lead"],["怒り"],3,"先師がいわれた。――\n「自分を責めることにきびしくて、他人を責めることがゆるやかであれば、人に怨まれることはないものだ。」",["jin"]],[394,14,15,"子曰：「不曰『如之何，如之何』者，吾末如之何也已矣！」","子曰く、之を如何せん、之を如何せんと曰わざる者は、吾之を如何ともする末きのみ。","「どうしよう」と自ら問わない人は、誰にも助けようがない。","その部下は自分で問いを立てているか。自分はどうか。",["grow","decide"],["迷い"],2,"先師がいわれた。――\n「どうしたらいいか、どうしたらいいか、と常に自らに問わないような人は、私もどうしたらいいかわからない。」",["chi"]],[395,14,16,"子曰：「群居終日，言不及義，好行小慧，難矣哉！」","子曰く、群居すること終日、言、義に及ばず、好んで小慧を行う。難いかな。","一日中集まって筋の通った話もせず、小知恵を弄ぶ集団は見込みが薄い。","今日の会議で、本質に触れる話はどれだけあったか。",["lead","vision"],["疲れ"],1,"先師がいわれた。\n「朝から晩まで多勢集っていながら、話が道義にふれず、小ざかしいことをやって得意になっているようでは、見込なしだ。」",["gi"]],[396,14,17,"子曰：「君子義以為質，礼以行之，孫以出之，信以成之。君子哉！」","子曰く、君子は義以て質と為し、礼以て之を行い、孫以て之を出だし、信以て之を成す。君子なるかな。","筋を土台に、礼で行い、謙虚に語り、誠実さで仕上げる。","正しいことを、謙虚な言い方で伝えられているか。",["self","lead","profit"],["慢心"],2,"先師がいわれた。――\n「君子は道義を自分の本質とし、礼にかなってそれを実行にうつし、へり下ってそれを言葉にあらわし、誠意を貫いてその社会的実現を期する。それでこそ君子だ。」",["gi","rei"]],[397,14,18,"子曰：「君子病無能焉，不病人之不己知也。」","子曰く、君子は能無きを病う。人の己を知らざるを病えず。","悩むべきは自分の力不足。知られていないことではない。","認められない悔しさを、力を磨くことに向けられているか。",["lonely","self","vision"],["孤独","焦り"],3,"先師がいわれた。――\n「君子は自分に能力のないのを苦にする。しかし、人が自分を知ってくれないのを苦にしないものだ。」",["chi"]],[398,14,19,"子曰：「君子疾没世而名不称焉。」","子曰く、君子は世を没するまで名の称せられざるを疾む。","生涯を終えて、語るに足る実績が何も残らないことを恐れよ。","自分が去ったあと、何が残っていてほしいか。",["vision"],["焦り"],2,"先師がいわれた。――\n「君子といえども、死後になっても自分の名がたたえられないのは苦痛である。」",["gi"]],[399,14,20,"子曰：「君子求諸己，小人求諸人。」","子曰く、君子は諸を己に求め、小人は諸を人に求む。","できる人は原因を自分に求め、未熟な人は他人に求める。","この問題のうち、自分に原因がある部分はどこか。",["self","fail","lead"],["怒り"],3,"先師がいわれた。――\n「君子は何事も自己の責任に帰し、小人は他人の責任に帰する。」",["rei"]],[400,14,21,"子曰：「君子矜而不争，群而不党。」","子曰く、君子は矜にして争わず、群して党せず。","誇りは持つが争わない。人と交わるが派閥は作らない。","社内に、自分を中心とした派閥を作っていないか。",["trust","lead","self"],["怒り"],2,"先師がいわれた。――\n「君子はほこりをもって高く己を持するが、争いはしない。また社会的にひろく人と交るが、党派的にはならない。」",["rei"]],[401,14,22,"子曰：「君子不以言挙人，不以人廢言。」","子曰く、君子は言を以て人を挙げず、人を以て言を廃せず。","口がうまいだけで登用せず、嫌いな人の意見でも良ければ採る。","誰が言ったかではなく、何を言ったかで判断できているか。",["judge","decide","trust"],[],2,"先師がいわれた。――\n「君子は、言うことがりっぱだからといって人を挙用しないし、人がだめだからといって、その人の善い言葉をすてはしない。」",["chi"]],[402,14,23,"子貢問曰：「有一言而可以終身行之者乎？」子曰：「其恕乎！己所不欲，勿施於人。」","子貢問いて曰く、一言にして以て終身之を行うべき者有りや。子曰く、其れ恕か。己の欲せざる所は、人に施すこと勿かれ。","一生守る一語は「思いやり」。自分が嫌なことは人にしない。","自分がされたら嫌なことを、立場を使って人にしていないか。",["trust","lead","self"],["怒り"],3,"子貢がたずねた。――\n「ただ一言で生涯の行為を律すべき言葉がございましょうか。」\n　先師がこたえられた。――\n「それは恕だろうかな。自分にされたくないことを人に対して行わない、というのがそれだ。」",["jin"]],[403,14,24,"子曰：「吾之於人也，誰毀誰誉？如有所誉者，其有所試矣。斯民也，三代之所以直道而行也。」","子曰く、吾の人に於けるや、誰をか毀り誰をか誉めん。如し誉むる所の者有らば、其れ試みる所有り。斯の民や、三代の直道にして行う所以なり。","むやみに人をほめもけなしもしない。ほめるなら実際を確かめてから。","その人への評価は、自分の目で確かめた事実に基づいているか。",["judge","trust"],[],2,"先師がいわれた。――\n「私は、成心をもって人に対しない。だから誰をほめ、誰をそしるということはない。もし私が人をほめることがあつたら、それは、その人の実際を見た上でのことだ。現代の民衆にしても、過去三代の純良な民衆と同じく、その本性においては、まっすぐな道を歩むものなのだから、ほめるにしても、そしるにしても、実際を見ないでめったなことがいえるものではない。」",["chi","shin"]],[404,14,25,"子曰：「吾猶及史之闕文也，有馬者，借人乘之。今亡矣夫！」","子曰く、吾は猶お史の闕文に及べり。馬有る者は人に借して之に乗らしむ。今は亡きかな。","不確かな事は空白のまま残す。そんな慎み深さも今は失われた。","わからないことを、わからないと言えているか。",["self"],["慢心"],1,"先師がいわれた。――\n「私の子供のころには、まだ人間が正直で、いいことが行われていた。たとえば、史官が疑わしい点があると、調査研究がすむまでは、そこを空白にしておくとか、馬の所有者は気持よく人に貸して乗らせるとかいうことだ。ところが、今はそういうことがまるでなくなってしまった。」",["shin"]],[405,14,26,"子曰：「巧言乱徳，小不忍，則乱大謀。」","子曰く、巧言は徳を乱る。小を忍ばざれば、則ち大謀を乱る。","口先のうまさは徳を損ない、小さな我慢ができねば大きな計画が崩れる。","いまの苛立ちに任せて動けば、どの大きな計画が壊れるか。",["self","decide","trust"],["怒り","焦り"],2,"先師がいわれた。――\n「口上手は道義をやぶり、小事に対する忍耐心の欠乏は大計画をやぶるものだ。」",["shin","rei"]],[406,14,27,"子曰：「眾悪之，必察焉；眾好之，必察焉。」","子曰く、衆之を悪むも必ず察し、衆之を好むも必ず察す。","皆が嫌う人も、皆が好む人も、必ず自分の目で確かめよ。","周囲の評判だけで、人への評価を決めていないか。",["judge","trust"],["迷い"],2,"先師がいわれた。――\n「多数の人が悪いといっても、必ず自分でその真相をしらべてみるがいい。多数の人がいいといっても、必ず自分でその真相をしらべてみるがいい。」",["chi"]],[407,14,28,"子曰：「人能弘道，非道弘人。」","子曰く、人能く道を弘む。道、人を弘むるに非ず。","人が道を広げるのだ。道が人を大きくしてくれるのではない。","理念に頼るのでなく、自分が理念を体現できているか。",["vision","lead"],["迷い"],2,"先師がいわれた。――\n「人が道を大きくするのであって、道が人を大きくするのではない。」",["gi"]],[408,14,29,"子曰：「過而不改，是謂過矣。」","子曰く、過ちて改めざる、是を過ちと謂う。","間違えても改めない。それこそが本当の過ちである。","気づいていながら、まだ改めていない過ちは何か。",["fail","self","decide"],["落胆"],3,"先師がいわれた。――\n「過って改めないのを、過ちというのだ。」",["gi"]],[409,14,30,"子曰：「吾嘗終日不食，終夜不寑，以思；無益，不如学也。」","子曰く、吾嘗て終日食らわず、終夜寝ねず、以て思う。益無し。学ぶに如かざるなり。","寝食を忘れて一人で考え込むより、学ぶほうが早い。","一人で堂々巡りをしていないか。誰に、何に学べばよいか。",["decide","vision","fail"],["迷い","疲れ"],2,"先師がいわれた。――\n「私は、かつて、一日中飯も食わず、一晩中眠りもしないで思索にふけったことがあった。しかし何の得るところもなかった。やはり学ぶにこしたことはない。」",["chi"]],[410,14,31,"子曰：「君子謀道不謀食。耕也，餒在其中矣；学也，禄在其中矣。君子憂道不憂貧。」","子曰く、君子は道を謀りて食を謀らず。耕すや、餒え其の中に在り。学ぶや、禄其の中に在り。君子は道を憂えて貧しきを憂えず。","食うことより道を考えよ。心配すべきは貧しさより道が立つかどうか。","目先の売上の心配が、本来の使命を曇らせていないか。",["profit","vision"],["不安"],2,"先師がいわれた。\n「君子が学問をするのは道のためであって食うためではない。食うことを目的として田を耕す人でも、時には饑えることもあるし、食うことを目的としないで学問をしていても、祿がおのずからそれに伴って来ることもある。とにかく、君子にとっては、食うことは問題ではない。君子はただ道の修まらないのを憂えて、決して食の乏しきを憂えないのだ。」",["gi","chi"]],[411,14,32,"子曰：「知及之，仁不能守之，雖得之，必失之。知及之，仁能守之。不荘以蒞之，則民不敬。知及之，仁能守之，荘以蒞之。動之不以礼，未善也。」","子曰く、知は之に及べども、仁之を守ること能わざれば、之を得と雖も必ず之を失う。知は之に及び、仁能く之を守れども、荘以て之に蒞まざれば、則ち民敬せず。知は之に及び、仁能く之を守り、荘以て之に蒞めども、之を動かすに礼を以てせざれば、未だ善からざるなり。","知恵で得た地位も、仁で守り、威厳で臨み、礼で動かさねば続かない。","頭で勝ち取ったものを、人柄で守れているか。",["lead","self"],["慢心"],2,"先師がいわれた。――\n「知見においては為政者としての地位を得るに十分でも、仁徳を以てそれを守ることが出来なければ、得た地位は必ず失われる。知見において十分であり、仁徳をもって地位を守り得ても、荘重な態度で人民に臨まなければ、人民は敬服しない。知見において十分であり、仁徳をもって地位を守ることが出来、荘重な態度で民に臨んでも、人民を動かすのに礼をもってしなければ、まだ真に善政であるとはいえない。」",["chi","rei"]],[412,14,33,"子曰：「君子不可小知，而可大受也。小人不可大受，而可小知也。」","子曰く、君子は小知すべからずして、大受すべし。小人は大受すべからずして、小知すべし。","器の大きい人は細かな仕事では測れない。大きく任せて初めて真価が出る。","細かな仕事ぶりだけで、人の器を決めつけていないか。",["judge","grow"],[],2,"先師がいわれた。――\n「君子は、こまごましたことをやらせて見ても、その人物の価値はわからない。しかし大事をまかせることが出来る。小人には大事はまかされない。しかし、こまごましたことをやらせて見ると、使いどころがあるものである。」",["chi"]],[413,14,34,"子曰：「民之於仁也，甚於水火。水火，吾見蹈而死者矣，未見蹈仁而死者也。」","子曰く、民の仁に於けるや、水火よりも甚だし。水火は吾蹈みて死する者を見る。未だ仁を蹈みて死する者を見ざるなり。","仁は水や火より大切。しかも仁を踏み行って死んだ人はいない。","正しいと思うことを行うのに、何を恐れているのか。",["vision","profit"],["不安"],1,"先師がいわれた。――\n「人民にとって、仁は水や火よりも大切なものである。私は水や火にとびこんで死んだものを見たことがあるが、まだ仁にとびこんで死んだものを見たことがない。」",["jin"]],[414,14,35,"子曰：「当仁，不譲於師。」","子曰く、仁に当たりては、師にも譲らず。","正しいことを行う場面では、師にさえ遠慮はいらない。","恩ある人への遠慮で、正しい行いを控えていないか。",["decide","vision"],["迷い"],2,"先師がいわれた。――\n「仁の道にかけては、先生にも譲る必要はない。」",["gi","jin"]],[415,14,36,"子曰：「君子貞而不諒。」","子曰く、君子は貞にして諒ならず。","筋は貫くが、小さな義理立てや頑固さには縛られない。","いま守っているのは信念か、それともただの意地か。",["decide","self"],["迷い"],2,"先師がいわれた。――\n「君子は正しいことに心変りがしない。是も非もなく心変りがしないのではない。」",["gi"]],[416,14,37,"子曰：「事君，敬其事而後其食。」","子曰く、君に事えては、其の事を敬して其の食を後にす。","まず仕事に誠を尽くす。報酬はその後についてくるもの。","報酬より先に、仕事そのものに敬意を払えているか。",["profit","vision"],[],2,"先師がいわれた。――\n「君に仕えるには、恭敬の念をもって職務に精励し、食祿は第二とすべきである。」",["shin"]],[417,14,38,"子曰：「有教無類。」","子曰く、教え有りて類無し。","人は教育で変わる。生まれつきの区別などない。","「あの人は伸びない」と、教える前に決めつけていないか。",["grow","judge"],["落胆"],2,"先師がいわれた。――\n「人間を作るのは教育である。はじめから善悪の種類がきまっているのではない。」",["chi"]],[418,14,39,"子曰：「道不同，不相為謀。」","子曰く、道同じからざれば、相為に謀らず。","目指す道が違う相手とは、一緒に事を図らない。","その相手とは、目指す方向が本当に同じか。",["judge","trust","decide"],["迷い"],2,"先師がいわれた。――\n「志す道がちがっている人とは、お互いに助けあわぬがいい。」",["gi"]],[419,14,40,"子曰：「辞，達而已矣！」","子曰く、辞は達するのみ。","言葉は飾るものではない。伝わればそれでよい。","その説明は、飾りを取っても相手に伝わるか。",["trust","lead"],[],2,"先師がいわれた。――\n「言葉というものは、十分に意志が通じさえすればそれでいい。」",["rei"]],[420,14,41,"師冕見。及階，子曰：「階也。」及席，子曰：「席也。」皆坐，子吿之曰：「某在斯，某在斯。」師冕出，子張問曰：「与師言之道与？」子曰：「然，固相師之道也。」","師冕見ゆ。階に及ぶ。子曰く、階なり。席に及ぶ。子曰く、席なり。皆坐す。子之に告げて曰く、某は斯に在り、某は斯に在り。師冕出ず。子張問いて曰く、師と言うの道か。子曰く、然り。固より師を相くるの道なり。","盲目の楽師に、段や席や同席者を一つずつ伝えた孔子の心配り。","相手の立場に立った、具体的な気配りができているか。",["lead","trust"],[],1,"めくらの音楽師の冕がたずねて来た。階段のところまで来ると、先師はいわれた。――\n「階段だよ。」\n　やがて冕が座席の近くまで来ると、先師はいわれた。――\n「さあ、ここにおかけなさい。」\n　みんなが座席につくと、先師は、誰はここ、誰はそこ、というふうに、一々みんなの坐っている場所を冕に告げられた。\n　冕が帰ったあとで子張がたずねた。――\n「あんなふうに、一々こまかにおっしゃるのが音楽師に対する作法でしょうか。」\n　先師がこたえられた。――\n「そうだ。相手はめくらなのだから、むろんあのぐらいなことはいってやらなければ。」",["jin","rei"]],[421,15,1,"季氏将伐顓臾。冉有季路見於孔子曰：「季氏将有事於顓臾。」孔子曰：「求！無乃爾是過与？夫顓臾，昔者先王以為東蒙主，且在邦域之中矣，是社稷之臣也。何以伐為？」冉有曰：「夫子欲之，吾二臣者，皆不欲也。」孔子曰：「求！周任有言曰：『陳力就列，不能者止。』危而不持，顚而不扶，則将焉用彼相矣？且爾言過矣！虎兕出於柙，亀玉毀於櫝中，是誰之過与？」冉有曰：「今夫顓臾，固而近於費；今不取，後世必為子孫憂。」孔子曰：「求！君子疾夫舎曰欲之，而必為之辞。丘也，聞有国有家者，不患寡而患不均，不患貧而患不安。蓋均無貧，和無寡，安無傾。夫如是，故遠人不服，則修文徳以来之。既来之，則安之。今由与求也，相夫子，遠人不服而不能来也；邦分崩離析而不能守也，而謀動干戈於邦內。吾恐季孫之憂，不在顓臾，而在蕭牆之內也！」","季氏、将に顓臾を伐たんとす。冉有・季路、孔子に見えて曰く、季氏将に顓臾に事有らんとす。孔子曰く、求、乃ち爾是れ過てること無からんや。夫れ顓臾は、昔者先王以て東蒙の主と為し、且つ邦域の中に在り。是れ社稷の臣なり。何を以てか伐つことを為さん。冉有曰く、夫子之を欲す。吾二臣の者は、皆欲せざるなり。孔子曰く、求、周任言えること有り。曰く、力を陳べて列に就き、能わざれば止むと。危うくして持せず、顚りて扶けずんば、則ち将た焉くんぞ彼の相を用いん。且つ爾の言過てり。虎兕柙より出で、亀玉櫝中に毀るれば、是れ誰の過ちぞや。冉有曰く、今夫れ顓臾は、固くして費に近し。今取らずんば、後世必ず子孫の憂いと為らん。孔子曰く、求、君子は夫の之を欲すと曰うを舎きて、必ず之が辞を為すを疾む。丘や聞く、国を有ち家を有つ者は、寡なきを患えずして均しからざるを患え、貧しきを患えずして安からざるを患うと。蓋し均しければ貧しきこと無く、和すれば寡なきこと無く、安ければ傾くこと無し。夫れ是くの如し。故に遠人服せざれば、則ち文徳を修めて以て之を来す。既に之を来せば、則ち之を安んず。今、由と求とは、夫子を相け、遠人服せざれども来すこと能わず、邦分崩離析すれども守ること能わず。而して干戈を邦内に動かさんことを謀る。吾恐る、季孫の憂いは、顓臾に在らずして、蕭牆の
