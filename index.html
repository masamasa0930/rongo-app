<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
<title>経営者の論語</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#F5F7F6; --surface:#FFFFFF; --ink:#1B2026; --muted:#65707A; --line:#DCE2E1;
  --ai:#1F3A5F; --ai-soft:#E6ECF3; --on-ai:#FFFFFF; --shu:#B3362C;
  --moku:#2C6A58; --ka:#B3362C; --do:#94701C; --gon:#737A83; --sui:#1B2026;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#11151A; --surface:#1A2028; --ink:#E9ECE8; --muted:#97A1AA; --line:#2C343D;
    --ai:#9BB9E2; --ai-soft:#222C38; --on-ai:#10151B; --shu:#E5766A;
    --moku:#7FC2A8; --ka:#E5766A; --do:#D6B25E; --gon:#B4BAC2; --sui:#E9ECE8;
  }
}
:root[data-theme="dark"]{
  --ground:#11151A; --surface:#1A2028; --ink:#E9ECE8; --muted:#97A1AA; --line:#2C343D;
  --ai:#9BB9E2; --ai-soft:#222C38; --on-ai:#10151B; --shu:#E5766A;
    --moku:#7FC2A8; --ka:#E5766A; --do:#D6B25E; --gon:#B4BAC2; --sui:#E9ECE8;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--gothic);font-size:16px;line-height:1.8;padding-inline:16px;padding-block:20px 64px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:24px}
.stack{display:flex;flex-direction:column;gap:24px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--mincho);font-weight:700;font-size:1.5rem;letter-spacing:.08em}
.brand small{display:block;font-family:var(--gothic);font-weight:400;font-size:.75rem;color:var(--muted);letter-spacing:.04em}
nav.tabs{display:flex;gap:4px;overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--line)}
nav.tabs button{padding:8px 12px;font-size:.9rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ai);border-bottom-color:var(--ai);font-weight:700}

.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.search input::placeholder{color:var(--muted)}

h2{font-family:var(--mincho);font-weight:700;font-size:1.15rem;margin:0;text-wrap:balance}
.lead{color:var(--muted);font-size:.85rem;margin:0}

/* 今日の一章：縦書き */
.today{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:12px}
.today .label{font-size:.75rem;letter-spacing:.2em;color:var(--muted)}
.tate{writing-mode:vertical-rl;font-family:var(--mincho);font-size:1.15rem;line-height:2;inline-size:fit-content;max-inline-size:15em;overflow-x:auto;max-width:100%;padding-bottom:6px;align-self:center}
.today .hito{font-family:var(--mincho);font-weight:700;font-size:1.1rem;margin:0;text-wrap:balance}
.linkish{color:var(--ai);font-size:.85rem;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

/* 悩みの入口 */
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.scene{display:flex;align-items:baseline;justify-content:space-between;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;transition:border-color .15s}
.scene:hover{border-color:var(--ai)}
.scene b{font-weight:700;display:block;line-height:1.5}
.scene span.sub{display:block;font-size:.78rem;color:var(--muted);line-height:1.5}
.scene .cnt{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 結果 */
.resulthead{display:flex;flex-direction:column;gap:10px}
.back{color:var(--ai);font-size:.85rem;align-self:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:3px 12px;border:1px solid var(--line);border-radius:99px;color:var(--muted);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--on-ai)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px}
.card .meta{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted)}
.seal{font-family:var(--mincho);font-size:.7rem;color:var(--shu);border:1px solid var(--shu);padding:0 5px;border-radius:2px;line-height:1.5}
.card .hito{font-family:var(--mincho);font-weight:700;font-size:1.12rem;line-height:1.7;margin:0;text-wrap:balance}
.card .kaki{font-family:var(--mincho);font-size:.95rem;margin:0;color:var(--ink)}
.card .kaki.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.toi{border-left:2px solid var(--ai);padding-left:12px;font-size:.9rem;margin:0}
.toi::before{content:"問い";display:block;font-size:.7rem;color:var(--muted);letter-spacing:.2em}
.actions{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px;font-size:.85rem}
.actions button{color:var(--ai);padding:4px 2px}
.fav[aria-pressed="true"]{color:var(--shu);font-weight:700}
.more{display:flex;flex-direction:column;gap:12px}
.more h3{font-size:.72rem;letter-spacing:.2em;color:var(--muted);font-weight:500;margin:0 0 2px}
.more p{margin:0;font-size:.92rem;white-space:pre-wrap}
.more .gen{font-family:var(--mincho);font-size:1rem;letter-spacing:.05em}
.empty{color:var(--muted);font-size:.9rem;padding:20px 0}
.morebtn{align-self:center;color:var(--ai);border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 20px;font-size:.9rem}

/* 五徳 */
.tokus{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.toku{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;transition:border-color .15s}
.toku:hover{border-color:var(--tc)}
.toku .kanji{font-family:var(--mincho);font-weight:700;font-size:2.4rem;line-height:1.1;color:var(--tc);grid-row:span 3}
.toku .gyo{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.toku b{font-family:var(--mincho);font-size:.98rem;line-height:1.5}
.toku .sub{font-size:.78rem;color:var(--muted);line-height:1.5}
.toku.base{grid-column:1/-1}
.tokuhead{display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:center}
.tokuhead .kanji{font-family:var(--mincho);font-weight:700;font-size:3.2rem;line-height:1;color:var(--tc)}
.tokuhead h2{font-size:1.05rem}
.tbadge{font-family:var(--mincho);font-weight:700;color:var(--tc);border-bottom:1px solid var(--tc);line-height:1.3;padding:0 1px}
.chiplabel{font-size:.72rem;color:var(--muted);letter-spacing:.12em;align-self:center;margin-right:2px}
.chuyo{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.chuyo h3{font-family:var(--mincho);font-size:1rem;margin:0}
.chuyo p{margin:0;color:var(--muted)}
.chuyo ul{margin:0;padding-left:1.2em}
.t-jin{--tc:var(--moku)}.t-gi{--tc:var(--gon)}.t-rei{--tc:var(--ka)}.t-chi{--tc:var(--sui)}.t-shin{--tc:var(--do)}
.books{display:flex;flex-wrap:wrap;gap:6px}
footer{border-top:1px solid var(--line);padding-top:16px;font-size:.75rem;color:var(--muted);line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">経営者の論語<small>いまの悩みと五徳から引く、全499章</small></div>
  </header>

  <div class="search">
    <input id="q" type="search" placeholder="言葉で探す（例：部下が動かない、後継者、義徳）" autocomplete="off">
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-home" aria-selected="true" data-tab="home">悩みから</button>
    <button role="tab" id="tab-toku" aria-selected="false" data-tab="toku">五徳から</button>
    <button role="tab" id="tab-all" aria-selected="false" data-tab="all">全章</button>
    <button role="tab" id="tab-fav" aria-selected="false" data-tab="fav">しおり</button>
  </nav>

  <main id="view" class="stack"></main>

  <footer>
    現代語訳は下村湖人『現代訳論語』（青空文庫・著作権保護期間満了）、原文はウィキソース『論語』に拠ります。
    五徳（仁・義・礼・智・信）の考え方は株式会社ロジック・ブレインの研修体系に基づきます。
    書き下し文・一言訳・問い・悩みと五徳の分類は株式会社ロジック・ブレインが作成した参考情報で、学術的な定訳ではありません。
  </footer>
</div>

<script>
const SCENES=[
 ["lonely","孤独だ・理解されない","誰も分かってくれない、評価されない"],
 ["lead","人が動かない・ついてこない","指示しても響かない、求心力が落ちた"],
 ["grow","人を育てたい・任せられない","教え方、伸ばし方、任せどき"],
 ["judge","人を見抜けない","採用・登用・誰と組むか"],
 ["trust","人間関係がこじれた","対立、裏切り、批判、言葉の行き違い"],
 ["vision","志・目標がブレた","何のためにやっているのか"],
 ["decide","決断できない・迷っている","進むか退くか、やり過ぎか不足か"],
 ["profit","利益と筋の板挟み","金・地位・名声と、義や信用"],
 ["fail","失敗した・逆境で折れそう","過ち、不遇、続かない"],
 ["self","自分を整えたい","怒り、驕り、焦り、言行不一致"]
];
// [id, 徳, 五行, 本能, 標語, 説明]
const TOKUS=[
 ["jin","仁","木","守備本能","人を思いやることに素直にあれ","相手の立場に立ち、よく聞く。すべての徳の土台"],
 ["gi","義","金","攻撃本能","正義を貫くに素直にあれ","筋道と道理のある行動。逆境で折れない勇気と決断"],
 ["rei","礼","火","伝達本能","礼を尽くすに素直にあれ","仁を形にして伝える。礼儀、節度、自分を律する所作"],
 ["chi","智","水","習得本能","知恵を磨くに素直にあれ","学び、聞き、偏らずに物事と人を正しく判断する"],
 ["shin","信","土","魅力本能","人を信じるに素直にあれ","心と言葉と行いの一致。四徳が整えば自ずとついてくる"]
];
const tk=id=>TOKUS.find(t=>t[0]===id);
const EMOS=["不安","怒り","孤独","迷い","焦り","落胆","慢心","疲れ"];
const BOOKS=["学而","為政","八佾","里仁","公冶長","雍也","述而","泰伯","子罕","郷党","先進","顔淵","子路","憲問","衛霊公","季氏","陽貨","微子","子張","堯曰"];
// 言葉から悩みへの手がかり
const HINTS={
 lonely:["孤独","ひとり","一人","理解され","分かってくれ","わかってくれ","評価され","認められ","報われ"],
 lead:["動かない","動いてくれ","ついてこ","言うことを聞","統率","リーダー","求心力","組織","士気","指示"],
 grow:["育て","育成","任せ","教え","後継","部下","若手","成長","研修","指導"],
 judge:["採用","登用","抜擢","人選","見抜","面接","見極め","誰と","付き合う","友人"],
 trust:["人間関係","裏切","対立","批判","悪口","揉め","もめ","こじれ","喧嘩","信頼","陰口","嫌われ"],
 vision:["志","目標","ブレ","ぶれ","理念","ビジョン","何のため","やる気","学び","初心"],
 decide:["決断","迷","決められ","撤退","判断","優先","進退","やめるか","辞めるか"],
 profit:["利益","お金","金","儲","売上","値引","名声","地位","信用","誠実","筋","不正"],
 fail:["失敗","逆境","挫折","折れ","落ち込","不遇","続かない","諦め","あきらめ","苦し","ミス"],
 self:["怒","イライラ","いらいら","驕","焦","慢心","感情","反省","言い過ぎ","口だけ","自分を"]
};
// [n, 篇index, 篇内番号, 原文, 書き下し, 一言訳, 問い, scenes, emo, rel, 下村訳, 五徳]
const D=[[1,0,1,"子曰：「学而時習之，不亦説乎？有朋自遠方来，不亦楽乎？人不知而不慍，不亦君子乎？」","子曰く、学びて時に之を習う、亦説ばしからずや。朋有り遠方より来たる、亦楽しからずや。人知らずして慍みず、亦君子ならずや。","認められなくても腐らず学び続ける人が、本物だ。","評価されない今日、それでも続けたいことは何か。",["lonely","vision"],["孤独"],3,"先師がいわれた。――\n「聖賢の道を学び、あらゆる機会に思索体験をつんで、それを自分の血肉とする。何と生き甲斐のある生活だろう。こうして道に精進しているうちには、求道の同志が自分のことを伝えきいて、はるばると訪ねて来てくれることもあるだろうが、そうなつたら、何と人生は楽しいことだろう。だが、むろん、名聞が大事なのではない。ひたすらに道を求める人なら、かりに自分の存在が全然社会に認められなくとも、それは少しも不安の種になることではない。そして、それほどに心が道そのものに落ちついてこそ、真に君子の名に値するのではあるまいか。」",["chi"]],[2,0,2,"有子曰：「其為人也孝弟，而好犯上者，鮮矣；不好犯上，而好作乱者，未之有也。君子務本，本立而道生；孝弟也者，其為仁之本与？」","有子曰く、其の人と為りや孝弟にして、上を犯すことを好む者は鮮なし。上を犯すことを好まずして、乱を作すことを好む者は、未だ之有らざるなり。君子は本を務む。本立ちて道生ず。孝弟なる者は、其れ仁の本為るか。","身近な人を大切にすることが、すべての徳の土台になる。","いちばん身近な人への接し方は、仕事での自分と一致しているか。",["self","judge"],[],1,"有先生がいわれた。――\n「家庭において、親には孝行であり、兄には従順であるような人物が、世間に出て長上に対して不遜であつたためしはめつたにない。長上に対して不遜でない人が、好んで社会国家の秩序をみだし、乱をおこしたというためしは絶対にないことである。古来、君子は何事にも根本を大切にし、先ずそこに全精力を傾倒して来たものだが、それは、根本さえ把握すると、道はおのずからにしてひらけて行くものだからである。君子が到達した仁という至上の徳も、おそらく孝弟というような家庭道徳の忠実な実践にその根本があつたのではあるまいか。」",["jin"]],[3,0,3,"子曰：「巧言令色，鮮矣仁。」","子曰く、巧言令色、鮮なし仁。","口がうまく愛想のよすぎる人に、誠実さは少ない。","耳に心地よい言葉ばかりを、信用していないか。",["judge","trust"],[],2,"先師がいわれた。――\n「巧みな言葉、媚びるような表情、そうした技巧には、仁の影がうすい。」",["shin","jin"]],[4,0,4,"曽子曰：「吾日三省吾身：為人謀而不忠乎？与朋友交而不信乎？伝不習乎？」","曾子曰く、吾日に吾が身を三省す。人の為に謀りて忠ならざるか。朋友と交わりて信ならざるか。習わざるを伝うるか。","人に尽くしたか、信を守ったか、できぬことを説かなかったか、毎日省みる。","今日、相手のために本気で考え抜いたと言えるか。",["self","trust"],["慢心"],3,"曾先生がいわれた。――\n「私は、毎日、つぎの三つのことについて反省することにしている。その第一は、人のために謀つてやるのに全力をつくさなかつたのではないか、ということであり、その第二は、友人との交りにおいて信義にそむくことはなかつたか、ということであり、そしてその第三は、自分でまだ実践出来るほど身についていないことを人に伝えているのではないか、ということである。」",["shin","chi"]],[5,0,5,"子曰：「道千乘之国，敬事而信，節用而愛人，使民以時。」","子曰く、千乗の国を道むるに、事を敬して信あり、用を節して人を愛し、民を使うに時を以てす。","仕事に真剣に向き合って信頼を得、無駄を省き、人を使う時期をわきまえる。","社員に負担をかける時期と量を、相手の都合から考えているか。",["lead","profit"],[],2,"先師がいわれた。――\n「千乗の国を治める秘訣が三つある。即ち、国政の一つ一つとまじめに取組んで民の信を得ること、出来るだけ国費を節約して民を愛すること、そして、民に労役を課する場合には、農事の妨げにならない季節を選ぶこと、これである。」",["shin","jin"]],[6,0,6,"子曰：「弟子入則孝，出則弟，謹而信，汎愛眾，而親仁。行有余力，則以学文。」","子曰く、弟子入りては則ち孝、出でては則ち弟、謹みて信あり、汎く衆を愛して仁に親しみ、行いて余力有らば、則ち以て文を学べ。","まず人としての行いを整え、余力があれば知識を学べばよい。","知識や技術より先に、若手に身につけてほしいものは何か。",["grow"],[],1,"先師がいわれた。――\n「年少者の修養の道は、家庭にあつては父母に孝養をつくし、世間に出ては長上に従順であることが、先ず何よりも大切だ。この根本に出発して万事に言動を謹み、信義を守り、進んで広く衆人を愛し、とりわけ高徳の人に親しむがいい。そして、そうしたことの実践にいそしみつつ、なお餘力があるならば、詩書・礼・楽といつたような学問に志すべきであろう。」",["jin","chi"]],[7,0,7,"子夏曰：「賢賢易色；事父母，能竭其力；事君，能致其身；与朋友交，言而有信；雖曰未学，吾必謂之学已矣。」","子夏曰く、賢を賢として色に易え、父母に事えては能く其の力を竭くし、君に事えては能く其の身を致し、朋友と交わるに言いて信有らば、未だ学ばずと曰うと雖も、吾は必ず之を学びたりと謂わん。","学歴がなくても、人に誠を尽くせる人は、すでに学んだ人である。","肩書きや学歴で、人の値打ちを測っていないか。",["judge","grow"],[],2,"子夏がいつた。――\n「美人を慕う代りに賢者を慕い、父母に仕えて力のあらんかぎりを尽し、君に仕えて一身の安危を省みず、朋友と交つて片言隻句も信義にたがうことがないならば、かりにその人が世間に謂ゆる無学の人であつても、私は断乎としてその人を学者と呼ぶに躊躇しないであろう。」",["shin","jin"]],[8,0,8,"子曰：「君子不重則不威，学則不固。主忠信，無友不如己者，過則勿憚改。」","子曰く、君子重からざれば則ち威あらず、学べば則ち固ならず。忠信を主とし、己に如かざる者を友とすること無かれ。過てば則ち改むるに憚ること勿かれ。","軽々しくふるまわず誠実を軸にし、間違えたらためらわずに改める。","間違いに気づいていながら、改めるのを先延ばしにしていないか。",["fail","self"],["落胆"],3,"先師がいわれた。――\n「道に志す人は、常に言語動作を慎重にしなければならない。でないと、外見が軽っぽく見えるだけでなく、学ぶこともしっかり身につかない。むろん、忠実と信義とを第一義として一切の言動を貫くべきだ。安易に自分より知徳の劣った人と交っていい気になるのは禁物である。人間だから過失はあるだろうが、大事なのは、その過失を即座に勇敢に改めることだ。」",["shin","rei"]],[9,0,9,"曽子曰：「慎終追遠，民徳帰厚矣。」","曾子曰く、終わりを慎み遠きを追えば、民の徳厚きに帰す。","上の者が弔いと先祖の祭りを大切にすれば、人々の気風も厚くなる。","去った人や先人への礼を、会社として大切にしているか。",["lead"],[],1,"曾先生がいわれた。――\n「上に立つ者が父母の葬いを鄭重にし、遠い先祖の祭りを怠らなければ、人民もおのずからその徳に化せられて、敦厚な人情風俗が一国を支配するようになるものである。」",["rei","jin"]],[10,0,10,"子禽問於子貢曰：「夫子至於是邦也，必聞其政，求之与？抑与之与？」子貢曰：「夫子温、良、恭、儉、譲以得之。夫子之求之也，其諸異乎人之求之与？」","子禽、子貢に問いて曰く、夫子の是の邦に至るや、必ず其の政を聞く。之を求めたるか、抑も之を与えたるか。子貢曰く、夫子は温・良・恭・倹・譲、以て之を得たり。夫子の之を求むるや、其れ諸れ人の之を求むるに異なるか。","孔子は人柄の穏やかさと謙虚さゆえに、求めずとも相談を持ちかけられた。","情報や相談が、自然に集まってくる自分でいるか。",["lead","trust"],[],1,"子禽が子貢にたずねた。――\n「孔先生は、どこの国に行かれても、必ずその国の政治向きのことに関係されますが、それは先生の方からのご希望でそうなるのでしょうか、それとも先方から持ちかけて来るのでしょうか。」\n　子貢が答えた。――\n「先生は、温・良・恭・儉・譲の五つの徳を身につけていられるので、自然にそうなるのだと私は思う。むろん、先生ご自身にも政治に関与したいというご希望がないのではない。しかし、その動機はほかの人とは全くちがっている。先生にとって大事なのは、権力の掌握でなくて徳化の実現なのだ。だから、先生はどこの国に行つても、ほかの人達のように媚びたり諂ったりして官位を求めるようなことはなさらない。ただご自身の徳をもって君主にぶっつかって行かれるのだ。それが相手の心にひびいて、自然に政治向きの相談にまで発展して行くのではないかと思われる。」",["rei"]],[11,0,11,"子曰：「父在観其志，父没観其行。三年無改於父之道，可謂孝矣。」","子曰く、父在せば其の志を観、父没すれば其の行いを観る。三年父の道を改むること無きは、孝と謂うべし。","父の存命中はその志を、没後はその行いを見る。三年やり方を変えないのが孝だ。","先代のやり方を変える前に、その意図を十分に汲み取ったか。",["decide"],[],1,"先師がいわれた。――\n「父の在世中はそのお気持を察して孝養をつくし、父の死後はその行われた跡を見て、すべての仕来りを継承するがいい。こうして三年の間父の仕来りを改めず、ひたすら喪に服する人なら、真の孝子といえるであろう。」",["jin"]],[12,0,12,"有子曰：「礼之用，和為貴；先王之道，斯為美；小大由之。有所不行，知和而和，不以礼節之，亦不可行也。」","有子曰く、礼の用は、和を貴しと為す。先王の道も、斯を美と為す。小大之に由れば、行われざる所有り。和を知りて和すれども、礼を以て之を節せざれば、亦行うべからざるなり。","調和は大切だが、けじめのない馴れ合いの和ではうまくいかない。","仲の良さを優先して、けじめを曖昧にしていないか。",["lead","trust"],[],2,"有先生がいわれた。――\n「礼は、元来、人間の共同生活に節度を与えるもので、本質的には厳しい性質のものである。しかし、そのはたらきの貴さは、結局のところ、のびのびとした自然的な調和を実現するところにある。古聖の道も、やはりそうした調和を実現したればこそ美しかったのだ。だが、事の大小を問わず、何もかも調和一点張りで行こうとすると、うまく行かないことがある。調和は大切であり、それを忘れてはならないが、礼を以てそれに節度を加えないと、生活にしまりがなくなるのである。」",["rei"]],[13,0,13,"有子曰：「信近於義，言可復也；恭近於礼，遠恥辱也。因不失其親，亦可宗也。」","有子曰く、信、義に近ければ、言復むべきなり。恭、礼に近ければ、恥辱に遠ざかるなり。因ること、其の親を失わざれば、亦宗とすべきなり。","約束は筋が通ってこそ守れる。丁寧さも礼にかなってこそ恥をかかない。","その約束は、筋の通った、守りきれる約束か。",["trust","decide"],[],2,"有先生がいわれた。――\n「約束したことが正義にかなっておれば、その約束どおりに履行出来るものだ。丁寧さが礼にかなっておれば、人に軽んぜられることはないものだ。人にたよる時に、たよるべき人物の選定を誤っていなければ、生涯その人を尊敬して行けるものだ。」",["shin","rei"]],[14,0,14,"子曰：「君子食無求飽，居無求安，敏於事而慎於言，就有道而正焉：可謂好学也已。」","子曰く、君子は食飽くを求むること無く、居安きを求むること無し。事に敏にして言に慎み、有道に就きて正す。学を好むと謂うべきのみ。","安楽を求めず、行動は速く言葉は慎み、優れた人に就いて自分を正す。","自分を正してくれる人のもとへ、最近足を運んでいるか。",["vision","self"],["慢心"],2,"先師がいわれた。――\n「君子は飽食を求めない。安居を求めない。仕事は敏活にやるが、言葉はひかえ目にする。そして有徳の人に就いて自分の言行の是非をたずね、過ちを改めることにいつも努力している。こうしたことに精進する人をこそ、真に学問を好む人というべきだ。」",["chi","rei"]],[15,0,15,"子貢曰：「貧而無諂，富而無驕，何如？」子曰：「可也。未若貧而楽，富而好礼者也」。子貢曰：「《詩》云：『如切如磋，如琢如磨。』其斯之謂与？」子曰：「賜也，始可与言《詩》已矣！吿諸往而知来者。」","子貢曰く、貧しくして諂うこと無く、富みて驕ること無きは、何如。子曰く、可なり。未だ貧しくして楽しみ、富みて礼を好む者には若かざるなり。子貢曰く、詩に云う、切するが如く磋するが如く、琢するが如く磨するが如しとは、其れ斯を之謂うか。子曰く、賜や、始めて与に詩を言うべきのみ。諸に往を告げて来を知る者なり。","卑屈にも傲慢にもならないだけでなく、境遇を超えて道を楽しみ、磨き続ける。","業績が良い時も悪い時も、変わらず磨き続けているものは何か。",["profit","self"],["慢心"],2,"子貢が先師にたずねた。――\n「貧乏でも人にへつらわない、富んでも人に驕らない、というほどでしたら、立派な人物だと思いますが、いかがでしょう。」\n　先師がこたえられた。――\n「先ず一とおりの人物だといえるだろう。だが、貧富を超越し、へつらうまいとか驕るまいとかいうかまえ心からすっかり脱却して、貧乏してもその貧乏の中で心ゆたかに道を楽しみ、富んでもごく自然に礼を愛するというような人には及ばないね。」\n　すると子貢がいった。――\n「なるほど人間の修養には、上には上があるものですね。詩経に、\n切るごとく、\n磋るごとく、\n琢つごとく、\n磨くがごとく、\nたゆみなく、\n道にはげまん。\n　とありますが、そういうことをいったものでございましょうか。」\n　先師は、よろこんでいわれた。――\n「賜よ、お前はいいところに気がついた。それでこそ共に詩を談ずる資格があるのだ。君は一つのことがわかると、すぐつぎのことがわかる人物だね。」",["rei","chi"]],[16,0,16,"子曰：「不患人之不己知，患不知人也。」","子曰く、人の己を知らざるを患えず、人を知らざるを患う。","人に理解されないことより、自分が人を理解していないことを心配せよ。","わかってもらえないと嘆く前に、相手をどれだけわかっているか。",["lonely","judge"],["孤独"],3,"先師がいわれた。――\n「人が自分を知ってくれないということは少しも心配なことではない。自分が人を知らないということが心配なのだ。」\n［＃改ページ］",["chi"]],[17,1,1,"子曰：「為政以徳，譬如北辰，居其所，而眾星共之。」","子曰く、政を為すに徳を以てすれば、譬えば北辰の其の所に居て、衆星の之に共うが如し。","徳のある人が中心にどっしり居れば、人は自然にその周りに集まる。","自分が動き回らなくても、人が向かってくる軸を持てているか。",["lead"],["焦り"],2,"先師がいわれた。――\n「徳によつて政治を行えば、民は自然に帰服する。それは恰も北極星がその不動の座に居て、もろもろの星がそれを中心に一絲みだれず運行するようなものである。」",["shin"]],[18,1,2,"子曰：「詩三百，一言以蔽之，曰思無邪。」","子曰く、詩三百、一言以て之を蔽えば、曰く、思い邪無し。","詩経三百篇を一言でまとめれば、心に偽りがないということだ。","いまの判断に、自分をごまかす気持ちは混じっていないか。",["self"],[],1,"先師がいわれた。――\n「詩経にはおよそ三百篇の詩があるが、その全体を貴く精神は『思い邪なし』の一句につきている。」",["shin"]],[19,1,3,"子曰：「道之以政，斉之以刑，民免而無恥；道之以徳，斉之以礼，有恥且格。」","子曰く、之を道くに政を以てし、之を斉うるに刑を以てすれば、民免れて恥無し。之を道くに徳を以てし、之を斉うるに礼を以てすれば、恥有りて且つ格し。","規則と罰で縛れば人は抜け道を探す。徳と礼で導けば自ら恥を知り正しくなる。","ルールと罰則を増やすことで、人を動かそうとしていないか。",["lead","grow"],[],2,"先師がいわれた。――\n「法律制度だけで民を導き、刑罰だけで秩序を維持しようとすると、民はただそれらの法網をくぐることだけに心を用い、幸にして免れさえすれば、それで少しも恥じるところがない。これに反して、徳を以て民を導き、礼によって秩序を保つようにすれば、民は恥を知り、自ら進んで善を行うようになるものである。」",["rei","shin"]],[20,1,4,"子曰：「吾十有五而志于学；三十而立；四十而不惑；五十而知天命；六十而耳順；七十而従心所欲，不踰矩。」","子曰く、吾十有五にして学に志す。三十にして立つ。四十にして惑わず。五十にして天命を知る。六十にして耳順う。七十にして心の欲する所に従えども、矩を踰えず。","志を立ててから自在の境地に至るまで、人は一生をかけて段階を踏む。","いまの自分は、人生のどの段階の課題に向き合っているか。",["vision","decide"],["焦り","迷い"],3,"先師がいわれた。――\n「私は十五歳で学問に志した。三十歳で自分の精神的立脚点を定めた。四十歳で方向に迷わなくなつた。五十歳で天から授かった使命を悟った。六十歳で自然に真理をうけ容れることが出来るようになつた。そして七十歳になってはじめて、自分の意のままに行動しても決して道徳的法則にそむかなくなった。」",["chi","gi"]],[21,1,5,"孟懿子問孝。子曰：「無違。」樊遅御，子吿之曰：「孟孫問孝於我，我対曰：『無違。』」樊遅曰：「何謂也？」子曰：「生，事之以礼；死，葬之以礼，祭之以礼。」","孟懿子、孝を問う。子曰く、違うこと無し。樊遅御たり。子之に告げて曰く、孟孫、孝を我に問う。我対えて曰く、違うこと無しと。樊遅曰く、何の謂ぞや。子曰く、生けるには之に事うるに礼を以てし、死すれば之を葬るに礼を以てし、之を祭るに礼を以てす。","孝とは、親の生前も死後も、礼にはずれないように仕えることだ。","",[],[],0,"大夫の孟懿子が孝の道を先師にたずねた。すると先師は答えられた。――\n「はずれないようになさるがよろしいかと存じます。」\n　そのあと、樊遅が先師の車の御者をつとめていた時、先師が彼にいわれた。――\n「孟孫が孝の道を私にたずねたので、私はただ、はずれないようになさるがいい、とこたえておいたよ。」\n　樊遅がたずねた。――\n「それはどういう意味でございましょう。」\n　先師が答えられた。――\n「親の存命中は礼を以て仕え、その死後は礼を以て葬り、礼を以て祭る。つまり、礼にはずれないという意味だ。」",["jin","rei"]],[22,1,6,"孟武伯問孝。子曰：「父母，唯其疾之憂。」","孟武伯、孝を問う。子曰く、父母は唯其の疾を之憂う。","親は子の病気を何より心配する。健康でいることが孝行である。","",[],[],0,"孟武伯が孝の道を先師にたずねた。先師はこたえられた。――\n「父母はいつも子の健康のすぐれないのに心をいためるものでございます。」",["jin"]],[23,1,7,"子游問孝。子曰：「今之孝者，是謂能養。至於犬馬，皆能有養。不敬，何以別乎？」","子游、孝を問う。子曰く、今の孝は、是れ能く養うを謂う。犬馬に至るまで、皆能く養うこと有り。敬せずんば、何を以て別たんや。","養うだけなら犬や馬にもしている。敬う心がなければ孝とは言えない。","給料を払うだけで、社員に敬意を払ったつもりになっていないか。",["lead"],[],1,"子游が孝の道を先師にたずねた。先師がこたえられた。――\n「現今では、親に衣食の不自由をさせなければ、それが孝行だとされているようだが、それだけのことなら、犬や馬を飼う場合にもやることだ。もし敬うということがなかつたら、両者に何の区別があろう。」",["jin","rei"]],[24,1,8,"子夏問孝。子曰：「色難。有事，弟子服其労；有酒食，先生饌。曽是以為孝乎？」","子夏、孝を問う。子曰く、色難し。事有れば、弟子其の労に服し、酒食有れば、先生に饌す。曾ち是を以て孝と為さんや。","難しいのは表情だ。用事を代わり食事を勧めるだけでは孝とは言えない。","やるべきことはやっていても、不機嫌な顔で接していないか。",["self","trust"],[],1,"子夏が孝の道を先師にたずねた。先師がこたえられた。――\n「むずかしいのは、どんな顔付をして仕えるかだ。仕事は若いもの、ご馳走は老人と、型通りにやったところで、それに真情がこもらないでは孝行にはなるまい。」",["jin","rei"]],[25,1,9,"子曰：「吾与回言終日，不違如愚。退而省其私，亦足以発。回也不愚。」","子曰く、吾回と言うこと終日、違わざること愚なるが如し。退きて其の私を省みれば、亦以て発するに足る。回や愚ならず。","黙って聞くだけに見えた顔回は、実生活で教えを見事に生かしていた。","会議で発言の少ない人の、現場での働きを見ているか。",["judge","grow"],[],2,"先師がいわれた。――\n「回と終日話していても、彼は私のいうことをただおとなしくきいているだけで、まるで馬鹿のようだ。ところが彼自身の生活を見ると、あべこべに私の方が教えられるところが多い。回という人間は決して馬鹿ではないのだ。」",["chi"]],[26,1,10,"子曰：「視其所以，観其所由，察其所安，人焉廋哉！人焉廋哉！」","子曰く、其の以てする所を視、其の由る所を観、其の安んずる所を察すれば、人焉んぞ廋さんや、人焉んぞ廋さんや。","行動と動機と、何に満足する人かを見れば、人柄は隠しようがない。","その人が何に満足する人なのかまで、見ようとしているか。",["judge"],["迷い"],2,"先師がいわれた。――\n「人間のねうちというものは、その人が何をするのか、何のためにそれをするのか、そしてどの辺にその人の気持の落ちつきどころがあるのか、そういうことを観察して見ると、よくわかるものだ。人間は自分をごまかそうとしてもごまかせるものではない。決してごまかせるものではない。」",["chi"]],[27,1,11,"子曰：「温故而知新，可以為師矣。」","子曰く、故きを温ねて新しきを知れば、以て師為るべし。","古いことを深く学び直し、そこから新しい意味を見いだせる人が、人を導ける。","過去の経験から、いま使える新しい意味を引き出せているか。",["grow","vision"],[],2,"先師がいわれた。――\n「古きものを愛護しつつ新しき知識を求める人であれば、人を導く資格がある。」",["chi"]],[28,1,12,"子曰：「君子不器。」","子曰く、君子は器ならず。","人の上に立つ者は、一つの用途にしか使えない道具であってはならない。","自分の得意分野に閉じこもって、全体を見ることを怠っていないか。",["lead","vision"],[],2,"先師がいわれた。――\n「君子は機械的な人間であってはならぬ。」",["chi"]],[29,1,13,"子貢問君子。子曰：「先行其言，而後従之。」","子貢、君子を問う。子曰く、先ず其の言を行い、而る後に之に従う。","言いたいことはまず実行し、言葉はその後からついてくればよい。","語っている方針を、まず自分が実行しているか。",["self","lead"],[],2,"子貢が君子たるものの心得をたずねた。先師はこたえられた。――\n「君子は、言いたいことがあったら、先ずそれを自分で行ってから言うものだ。」",["shin"]],[30,1,14,"子曰：「君子周而不比，小人比而不周。」","子曰く、君子は周して比せず、小人は比して周せず。","立派な人は広く公平に交わり、つまらぬ人は身内だけで固まる。","気の合う人だけで、周りを固めていないか。",["trust","judge"],[],2,"先師がいわれた。――\n「君子の交りは普遍的であつて派閥を作らない。小人の交りは派閥を作って普遍的でない。」",["jin","gi"]],[31,1,15,"子曰：「学而不思則罔，思而不学則殆。」","子曰く、学びて思わざれば則ち罔し。思いて学ばざれば則ち殆し。","学ぶだけで考えなければ身につかず、考えるだけで学ばなければ独善に陥る。","いまの自分は、学びと思索のどちらが足りていないか。",["decide","vision"],["迷い"],3,"先師がいわれた。――\n「他に学ぶだけで自分で考えなければ、真理の光は見えない。自分で考えるだけで他に学ばなければ独断に陥る危険がある。」",["chi"]],[32,1,16,"子曰：「攻乎異端，斯害也已。」","子曰く、異端を攻むるは、斯れ害のみ。","本筋から外れた学問に打ち込むのは、害になるだけだ。","流行の手法に手を出して、本筋がおろそかになっていないか。",["vision","decide"],["焦り"],1,"先師がいわれた。\n「異端の学問をしても害だけしかない。」",["chi"]],[33,1,17,"子曰：「由，誨女知之乎！知之為知之，不知為不知，是知也。」","子曰く、由、女に之を知るを誨えんか。之を知るを之を知ると為し、知らざるを知らずと為す。是れ知るなり。","知っていることと知らないことを区別できること、それが知るということだ。","知らないことを「知らない」と、社員の前で言えているか。",["self","decide"],["慢心"],2,"先師がいわれた。――\n「由よ、お前に『知る』ということはどういうことか、教えてあげよう。知っていることは知っている、知らないことは知らないとして、すなおな態度になる。それが知るということになるのだ。」",["chi"]],[34,1,18,"子張学干禄。子曰：「多聞闕疑，慎言其余，則寡尤；多見闕殆，慎行其余，則寡悔。言寡尤，行寡悔，禄在其中矣。」","子張、禄を干めんことを学ぶ。子曰く、多く聞きて疑わしきを闕き、慎みて其の余を言えば、則ち尤寡なし。多く見て殆きを闕き、慎みて其の余を行えば、則ち悔い寡なし。言に尤寡なく、行いに悔い寡なければ、禄は其の中に在り。","広く見聞きし、不確かなことは言わず行わず。地位や報酬はその結果ついてくる。","確信のないことを、確かなことのように語っていないか。",["profit","self"],["焦り"],2,"子張は求職の方法を知りたがっていた。先師はこれをさとしていわれた。――\n「なるだけ多く聞くがいい。そして、疑わしいことをさけて、用心深くたしかなことだけを言つておれば、非難されることが少い。なるだけ多く見るがいい。そして、あぶないと思うことをさけて、自信のあることだけを用心深く実行しておれば、後悔することが少い。非難されることが少く、後悔することが少ければ、自然に就職の道はひらけて来るものだ。」",["chi","shin"]],[35,1,19,"哀公問曰：「何為則民服？」孔子対曰：「挙直錯諸枉，則民服；挙枉錯諸直，則民不服。」","哀公問いて曰く、何を為さば則ち民服せん。孔子対えて曰く、直きを挙げて諸を枉れるに錯けば、則ち民服す。枉れるを挙げて諸を直きに錯けば、則ち民服せず。","正しい人を引き上げて曲がった人の上に置けば、人々は納得して従う。","誰を引き上げているかを、社員はどう見ているだろうか。",["lead","judge"],[],2,"哀公がたずねられた。――\n「どうしたら人民が心服するだろうか。」\n　先師がこたえられた。――\n「正しい人を挙用して曲った人の上におくと、人民は心服いたします。曲った人を挙用して正しい人の上におくと、人民は心服いたしません。」",["shin","gi"]],[36,1,20,"季康子問：「使民敬忠以勧，如之何？」子曰：「臨之以荘，則敬；孝慈，則忠；挙善而教不能，則勧。」","季康子問う、民をして敬忠にして以て勧ましむるには、之を如何せん。子曰く、之に臨むに荘を以てすれば、則ち敬す。孝慈なれば、則ち忠なり。善を挙げて不能を教うれば、則ち勧む。","上が威儀を正し、慈しみ、できる人を登用してできない人を教えれば、人は励む。","できない人を責める前に、教えることに手を尽くしたか。",["lead","grow"],[],2,"大夫の季康子がたずねた。――\n「人民をしてその支配者に対して敬意と忠誠の念を抱かせ、すすんで善を行わしめるようにするためには、どうしたらいいでしょうか。」\n　先師はこたえられた。――\n「支配者の態度が荘重端正であれば人民は敬意を払います。支配者が親に孝行であり、すべての人に対して慈愛の心があれば、人民は忠誠になります。有徳の人を挙げて、能力の劣った者を教育すれば、人民はおのずから善に励みます。」",["shin","jin"]],[37,1,21,"或謂孔子曰：「子奚不為政？」子曰：「《書》云：『孝乎惟孝，友於兄弟。』施於有政，是亦為政，奚其為為政？」","或るひと孔子に謂いて曰く、子奚ぞ政を為さざる。子曰く、書に云う、孝なるかな惟れ孝、兄弟に友に、有政に施すと。是れ亦政を為すなり。奚ぞ其れ政を為すことを為さん。","役職に就くことだけが政治ではない。家庭を整えることもまた政治である。","肩書きがなくてもできる貢献を、軽く見ていないか。",["vision","lonely"],[],1,"ある人が先師にたずねていった。――\n「先生はなぜ政治にお携りになりませんか。」\n　先師はこたえられた。――\n「書経に、孝についてかようにいってある。『親に孝行であり、兄弟に親密であり、それがおのずから政治に及んでいる』と。これで見ると、家庭生活を美しくするのもまた政治だ。しいて国政の衝にあたる必要もあるまい。」",["jin"]],[38,1,22,"子曰：「人而無信，不知其可也。大車無輗，小車無軏，其何以行之哉？」","子曰く、人にして信無くんば、其の可なるを知らざるなり。大車輗無く、小車軏無くんば、其れ何を以て之を行らんや。","信用のない人は、くびきの留め具のない車と同じで、前に進めない。","小さな約束を破って、信用をすり減らしていないか。",["trust","profit"],[],2,"先師がいわれた。――\n「人間に信がなくては、どうにもならない。大車に牛をつなぐながえの横木がなく、小車に馬をつなぐながえの横木がなくては、どうして前進が出来よう。人間における信もその通りだ。」",["shin"]],[39,1,23,"子張問：「十世可知也？」子曰：「殷因於夏礼，所損益可知也；周因於殷礼，所損益可知也；其或継周者，雖百世可知也。」","子張問う、十世知るべきや。子曰く、殷は夏の礼に因る、損益する所知るべきなり。周は殷の礼に因る、損益する所知るべきなり。其れ或いは周を継ぐ者は、百世と雖も知るべきなり。","何を受け継ぎ、何を変えたかを見れば、遠い未来のことも見通せる。","自社で、変えてはならないものと変えるべきものは何か。",["vision","decide"],["不安"],1,"子張がたずねた。――\n「十代も後のことが果してわかるものでございましょうか。」\n　先師がこたえられた。――\n「わかるとも。殷の時代は夏の時代の礼制を踏襲して、いくらか改変したところもあるが、根本は変っていない。周の時代は殷の時代の礼制を踏襲して、いくらか改変したところがあるが、やはり根本は変っていない。今後周についで新しい時代が来るかも知れないが、礼の根本は変らないだろう。真理というものは、かように過現未を通ずるものだ。従って十代はおろか百代の後も豫見出来るのだ。」",["chi","rei"]],[40,1,24,"子曰：「非其鬼而祭之，諂也。見義不為，無勇也。」","子曰く、其の鬼に非ずして之を祭るは、諂いなり。義を見て為さざるは、勇無きなり。","筋違いの相手に媚びるのはへつらい、正しいと知りながらやらないのは臆病だ。","正しいとわかっていて、まだ手をつけていないことは何か。",["decide","profit"],["迷い","不安"],3,"先師がいわれた。――\n「自分の祭るべき霊でもないものを祭るのは、へつらいだ。行うべき正義を眼前にしながら、それを行わないのは勇気がないのだ。」",["gi"]],[41,2,1,"孔子謂季氏：「八佾舞於庭。是可忍也，孰不可忍也！」","孔子、季氏を謂う、八佾、庭に舞わす。是れをも忍ぶべくんば、孰れをか忍ぶべからざらん。","分を越えた振る舞いを見過ごせば、歯止めはどこにもなくなる。","",[],[],0,"先師が季氏を批評していわれた。――\n「季氏は前庭で八の舞を舞わせたが、これがゆるせたら、世の中にゆるせないことはないだろう。」",["rei"]],[42,2,2,"三家者，以雍徹。子曰：「『相維辟公，天子穆穆。』奚取於三家之堂？」","三家者、雍を以て徹す。子曰く、相くるは維れ辟公、天子穆穆たりと。奚ぞ三家の堂に取らん。","天子の祭りの歌を家臣の家で用いる僭越を、孔子が咎めた。","",[],[],0,"三家のものが、雍の詩を歌って祭祀の供物を下げた。先師がこれを非難していわれた。――\n「雍の詩には、『諸侯が祭りを助けている。天子はその座にあって威儀を正している。』という意味の言葉もあるし、元来三家の祭りなどで歌えるような性質のものではないのだ。」",["rei"]],[43,2,3,"子曰：「人而不仁，如礼何？人而不仁，如楽何？」","子曰く、人にして不仁ならば、礼を如何せん。人にして不仁ならば、楽を如何せん。","思いやりのない人が形だけ整えても、礼も音楽も意味を持たない。","制度や作法を整える前に、人への思いやりが自分にあるか。",["self","lead"],["慢心"],2,"先師がいわれた。――\n「不仁な人が礼を行ったとて何になろう。不仁な人が楽を奏したとて何になろう。」",["jin","rei"]],[44,2,4,"林放問礼之本。子曰：「大哉問！礼，与其奢也，寧儉；喪，与其易也，寧戚。」","林放、礼の本を問う。子曰く、大なるかな問いや。礼は其の奢らんよりは寧ろ倹せよ。喪は其の易めんよりは寧ろ戚め。","礼の根本は豪華さや手際ではない。質素でも心がこもっていることだ。","見栄えを整えることに気を取られ、肝心の心を置き去りにしていないか。",["self","profit"],["迷い"],2,"林放が礼の根本義をたずねた。先師がこたえられた。――\n「大事な質問だ。吉礼は、ぜいたくに金をかけるよりも、つまし過ぎる方がいい。凶礼は手落がないことよりも、深い悲みの情があらわれている方がよい。」",["rei"]],[45,2,5,"子曰：「夷狄之有君，不如諸夏之亡也。」","子曰く、夷狄の君有るは、諸夏の亡きが如くならざるなり。","辺境の国にさえ君主と秩序がある。乱れた中原の国々とは違う。","",[],[],0,"先師がいわれた。――\n「夷狄の国にも君主があって秩序が立っている。現在の乱脈な中華諸国のようなものではないのだ。」",["rei"]],[46,2,6,"季氏旅於泰山。子謂冉有曰：「女弗能救与？」対曰：「不能。」子曰：「嗚呼！曽謂泰山不如林放乎？」","季氏、泰山に旅す。子、冉有に謂いて曰く、女救うこと能わざるか。対えて曰く、能わず。子曰く、嗚呼、曾ち泰山を林放に如かずと謂えるか。","主君の僭越な祭りを止められない弟子を、孔子が嘆いた。","上の者の誤りに気づいたとき、止める言葉を自分は持っているか。",["trust"],["落胆"],1,"季氏が泰山の山祭りをしようとした。先師が冉有にいわれた。――\n「お前は季氏の過ちを救うことが出来ないのか。」\n　冉有がこたえた。――\n「私の力ではもうだめです。」\n　先師がため息をついていわれた。――\n「するとお前は、泰山の神は林放という一書生にも及ばないと思つているのか。」",["rei"]],[47,2,7,"子曰：「君子無所争，必也射乎！揖譲而升，下而飲，其争也君子。」","子曰く、君子は争う所無し。必ずや射か。揖譲して升り、下りて飲ましむ。其の争いや君子なり。","君子は人と争わない。競うときも礼を守り、終われば相手をたたえる。","競争相手に対して、勝ち負けの後も敬意を保てているか。",["trust","self"],["怒り"],2,"先師がいわれた。――\n「君子は争わない。争うとすれば弓の競射ぐらいなものであろう。それもゆずりあって射場にのぼり、勝負がすむと射場を下って仲よく酒をのむ。争うにしても君子らしく争うのだ。」",["rei"]],[48,2,8,"子夏問曰：「『巧笑倩兮，美目盼兮，素以為絢兮。』何謂也？」子曰：「繪事後素。」曰：「礼後乎？」子曰：「起予者商也，始可与言《詩》已矣。」","子夏問いて曰く、巧笑倩たり、美目盼たり、素以て絢を為すとは、何の謂いぞや。子曰く、絵の事は素を後にす。曰く、礼は後か。子曰く、予を起こす者は商なり。始めて与に詩を言うべきのみ。","絵の仕上げに白を置くように、礼は誠実な心という下地の上に成り立つ。","弟子や部下の一言から、自分が学ばされた経験を最近しているか。",["grow"],[],1,"子夏が先師にたずねた。――\n「笑えはえくぼが愛くるしい。\n　眼はぱっちりと澄んでいる。\n　それにお化粧が匂ってる。\n　という歌がありますが、これには何か深い意味がありましょうか。」\n　先師がこたえられた。――\n「絵の場合でいえば、見事な絵がかけて、その最後の仕上げにごふんをかけるというようなことだろうね。」\n　子夏がいった。――\n「なるほど。すると礼は人生の最後の仕上げにあたるわけでございましょうか。しかし、人生の下絵が立派でなくては、その仕上げには何のねうちもありませんね。」\n　先師が喜んでいわれた。\n「商よ、お前には私も教えられる。それでこそいっしょに詩の話が出来るというものだ。」",["rei","jin"]],[49,2,9,"子曰：「夏礼，吾能言之，杞不足徵也；殷礼，吾能言之，宋不足徵也。文献不足故也，足，則吾能徵之矣。」","子曰く、夏の礼は吾能く之を言えども、杞は徴とするに足らざるなり。殷の礼は吾能く之を言えども、宋は徴とするに足らざるなり。文献足らざるが故なり。足らば則ち吾能く之を徴とせん。","語ることはできても、記録と証人が足りなければ証明はできない。","",[],[],0,"先師がいわれた。――\n「私はしばしば夏の礼制の話をするが、夏の子孫の国である現在の杞には、私のいうことを証拠立てるようなものが何も残っていない。私はしばしば殷の礼制の話をするが、殷の子孫の国である現在の宋には、私のいうことを証拠立てるようなものが何も残っていない。それは典籍も不十分であり、賢人もいないからだ。それらがありさえすれば、私は私のいうことが正しいということを完全に証拠立てることが出来るのだが。」",["chi"]],[50,2,10,"子曰：「禘自既灌而往者，吾不欲観之矣。」","子曰く、禘は既に灌してより往は、吾之を観ることを欲せず。","禘の大祭は、酒を注ぐ儀式より後は見るに堪えないと孔子は言った。","",[],[],0,"先師がいわれた。――\n「の祭は見たくないものの一つだが、それでも酒を地にそそぐ降神式あたりまではまだどうなりがまんが出来る。しかしそのあとはとても見ていられない。」",["rei"]],[51,2,11,"或問「禘」之説。子曰：「不知也。知其説者之於天下也，其如示諸斯乎？」指其掌。","或るひと禘の説を問う。子曰く、知らざるなり。其の説を知る者の天下に於けるや、其れ諸を斯に示るが如きかと。其の掌を指す。","禘の祭りの意味を真に知る人なら、天下を治めるのもたやすいだろう。","",[],[],0,"ある人がの祭のことを先師にたずねた。すると先師は、自分の手のひらを指でさしながら、こたえられた。――\n「私は知らない。もしの祭のことがほんとうにわかっている人が天下を治めたら、その治績のたしかなことは、この手のひらにのせて見るより、明らかなことだろう。」",["rei","chi"]],[52,2,12,"祭如在，祭神如神在。子曰：「吾不与祭，如不祭。」","祭ること在すが如くし、神を祭ること神在すが如くす。子曰く、吾祭に与らざれば、祭らざるが如し。","祭るときは相手が目の前にいるように。人任せでは祭ったことにならない。","大切な場面を人任せにして、済ませたことにしていないか。",["self"],[],1,"先師は、祖先を祭る時には、祖先をまのあたりに見るような、また、神を祭る時には、神をまのあたりに見るようなご様子で祭られた。そしていつもいわれた。――\n「私は自分みずから祭を行わないと、祭ったという気がしない。」",["rei"]],[53,2,13,"王孫賈問曰：「『与其媚於奧，寧媚於竈。』何謂也？」子曰：「不然。獲罪於天，無所禱也。」","王孫賈問いて曰く、其の奥に媚びんよりは、寧ろ竈に媚びよとは、何の謂いぞや。子曰く、然らず。罪を天に獲れば、祷る所無きなり。","実力者に取り入れという誘いを退けた。天に背けば祈る先もない。","力のある相手に取り入るために、筋を曲げようとしていないか。",["profit","decide"],["迷い"],2,"王孫賈が先師にたずねた。――\n「奥の神様に媚びるよりは、むしろ竈の神様に媚びよ、という諺がございますが、どうお考えになりますか。」\n　先師がこたえられた。――\n「いけませぬ。大切なことは罪を天に得ないように心掛けることです。罪を天に得たら、どんな神様に祈っても甲斐がありませぬ。」",["gi"]],[54,2,14,"子曰：「周監於二代，郁郁乎文哉！吾従周。」","子曰く、周は二代に監みて、郁郁乎として文なるかな。吾は周に従わん。","周は先の二王朝に学んで豊かな文化を築いた。私は周にならう。","",[],[],0,"先師がいわれた。――\n「周の王朝は、夏殷二代の王朝の諸制度を参考にして、すばらしい文化を創造した。私は周の文化に従いたい。」",["rei","chi"]],[55,2,15,"子入太廟，每事問。或曰：「孰謂鄹人之子知礼乎？入太廟，每事問。」子聞之曰：「是礼也！」","子、大廟に入りて、事ごとに問う。或るひと曰く、孰か鄹人の子を礼を知ると謂うや。大廟に入りて、事ごとに問う。子之を聞きて曰く、是れ礼なり。","知っていても一つ一つ確かめて尋ねる。その慎重さこそが礼である。","笑われるのを恐れて、確かめるべきことを聞かずに済ませていないか。",["self","lonely"],["慢心"],2,"先師が大廟に入つて祭典の任に当られた時、事ごとに係の人に質問された。それをある人があざけっていった。――\n「あのの田舎者のせがれが、礼に通じているなどとは、いったいだれがいい出したことなのだ。大廟に入つて事ごとに質問しているではないか。」\n　先師はこれをきかれて、いわれた。――\n「慎重にきくのが礼なのだ。」",["rei","chi"]],[56,2,16,"子曰：「射不主皮，為力不同科，古之道也。」","子曰く、射は皮を主とせず。力の科を同じくせざるが為なり。古の道なり。","弓は的を射抜く力を競わない。人の力には差があるからだ。","力の差がある人たちを、同じ一つの物差しで測っていないか。",["grow"],[],1,"先師がいわれた。――\n「射の主目的は的にあてることで、的皮を射ぬくことではない。人の力には強弱があって等しくないからである。これは古の道である。」",["rei","jin"]],[57,2,17,"子貢欲去吿朔之餼羊。子曰：「賜也！爾愛其羊，我愛其礼。」","子貢、告朔の餼羊を去らんと欲す。子曰く、賜や、爾は其の羊を愛しむ。我は其の礼を愛しむ。","形だけになった儀式でも、やめてしまえば礼そのものが消えてしまう。","無駄に見えるから削ろうとしているものに、残すべき意味はないか。",["decide","profit"],["迷い"],1,"子貢が、告朔の礼に羊をお供えするのはむだだといって、これを廃止することを希望した。すると先師はいわれた。――\n「賜よ、お前は羊が惜しいのか。私は礼がすたれるのが惜しい。」",["rei"]],[58,2,18,"子曰：「事君尽礼，人以為諂也。」","子曰く、君に事うるに礼を尽くせば、人以て諂いと為す。","礼を尽くして仕えているだけなのに、世間はそれをへつらいと呼ぶ。","誠実にしたことを誤解されたとき、それでも続ける理由を持っているか。",["lonely","trust"],["孤独"],2,"先師がいわれた。――\n「君主に仕えて礼をつくすのは当然だ。然るに世間ではそれをへつらいだという。」",["rei"]],[59,2,19,"定公問：「君使臣，臣事君，如之何？」孔子対曰：「君使臣以礼，臣事君以忠。」","定公問う、君、臣を使い、臣、君に事うること、之を如何せん。孔子対えて曰く、君、臣を使うに礼を以てし、臣、君に事うるに忠を以てす。","上は礼をもって人を使い、下は真心をもって仕える。","部下に誠実さを求める前に、自分は礼をもって接しているか。",["lead","trust"],[],2,"定公がたずねられた。――\n「君主が臣下を使う道、臣下が君主に仕える道についてききたいものだ。」\n　先師がこたえられた。――\n「君主が臣下を使う道は礼の一語につきます。臣下が君主に仕える道は忠の一語につきます。」",["rei","shin"]],[60,2,20,"子曰：「《関雎》，楽而不淫，哀而不傷。」","子曰く、関雎は楽しみて淫せず、哀しみて傷らず。","関雎の詩は、楽しんでも溺れず、悲しんでも心を損なわない。","喜びにも悲しみにも、呑み込まれずにいられているか。",["self"],["落胆"],1,"先師がいわれた。――\n「関雎の詩は歓楽を歌っているが、歓楽におぼれてはいない。悲哀を歌っているが、悲哀にやぶれてはいない。」",["rei"]],[61,2,21,"哀公問社於宰我。宰我対曰：「夏后氏以松，殷人以柏，周人以栗。曰：『使民戦栗。』」子聞之，曰：「成事不説，遂事不諫，既往不咎。」","哀公、社を宰我に問う。宰我対えて曰く、夏后氏は松を以てし、殷人は柏を以てし、周人は栗を以てす。曰く、民をして戦栗せしむと。子之を聞きて曰く、成事は説かず、遂事は諫めず、既往は咎めず。","済んだことは言わない、やり遂げたことは諫めない、過去は咎めない。","取り返しのつかない過去を、いつまで責め続けるつもりか。",["fail","trust"],["怒り","落胆"],2,"哀公が宰我に社の神木についてたずねられた。宰我がこたえた。――\n「夏の時代には松を植えました。殷の時代には柏を植えました。周の時代になってからは、栗を植えることになりましたが、それは人民を戦慄させるという意味でございます。」\n　先師はこのことをきかれて、いわれた。――\n「出来てしまったことは、いっても仕方がない。やってしまったことは、諌めても仕方がない。過ぎてしまったことは、とがめても仕方がない。」",["jin"]],[62,2,22,"子曰：「管仲之器小哉！」或曰：「管仲儉乎？」曰：「管氏有三帰，官事不摂，焉得儉？」「然則管仲知礼乎？」曰：「邦君樹塞門，管氏亦樹塞門。邦君為両君之好，有反坫，管氏亦有反坫。管氏而知礼，孰不知礼？」","子曰く、管仲の器は小なるかな。或るひと曰く、管仲は倹なるか。曰く、管氏に三帰有り、官の事は摂ねず、焉んぞ倹なるを得ん。然らば則ち管仲は礼を知れるか。曰く、邦君は樹して門を塞ぐ、管氏も亦樹して門を塞ぐ。邦君は両君の好を為すに反坫有り、管氏も亦反坫有り。管氏にして礼を知らば、孰か礼を知らざらん。","名宰相の管仲も、贅沢と分を越えた振る舞いゆえに器が小さいと評された。","",[],[],0,"先師がいわれた。――\n「管仲は人物が小さい。」\n　するとある人がたずねた。――\n「管仲の人物が小さいと仰しゃるのは、つましい人だからでしょうか。」\n　先師がいわれた。――\n「つましい？　そんなことはない。管仲は三帰台というぜいたくな高台を作り、また、家臣を多勢使って、決して兼任をさせなかったぐらいだ。」\n「すると、管仲は礼を心得て、それに捉われていたとでもいうのでしょうか。」\n「そうでもない。門内に塀を立てて目かくしにするのは諸侯の邸宅のきまりだが、管仲も大夫の身分でそれを立てた。また、酒宴に反※［＃「土へん＋占」、U+576B、259-上-11］を用いるのは諸侯同志の親睦の場合だが、管仲もまたそれをつかった。それで礼を心得ているといえるなら、誰でも礼を心得ているだろう。」",["rei"]],[63,2,23,"子語魯大師楽，曰：「楽其可知也。始作，翕如也。従之，純如也，皦如也，繹如也。以成。」","子、魯の大師に楽を語りて曰く、楽は其れ知るべきなり。始めて作すに翕如たり。之を従ちて純如たり、皦如たり、繹如たり。以て成る。","音楽は一斉に始まり、調和し、各音が澄み、途切れず続いて完成する。","",[],[],0,"先師が魯の楽長に音楽について語られた。――\n「およそ音楽の世界は一如の世界だ。そこにはいささかの対立もない。先ず一人一人の楽手の心と手と楽器が一如になり、楽手と楽手とが一如になり、更に楽手と聴衆とが一如になって、翕如として一つの機をねらう。これが未発の音楽だ。この翕如たる一如の世界が、機熟しておのずから振動をはじめると、純如として濁りのない音波が人々の耳を打つ。その音はただ一つである。ただ一つではあるが、その中には金音もあり、石音もあり、それぞれに独自の音色を保って、決しておたがいに殺しあうことがない。如として独自を守りつつ、しかもただ一つの音の流れに没入するのだ。こうして時がたつにつれ、高低、強弱、緩急、さまざまの変化を見せるのであるが、その間、厘毫のすきもなく、繹如としてつづいて行く。そこに時間的な一如の世界があり、永遠と一瞬との一致が見出される。まことの音楽というものは、こうして始まり、こうして終るものだ。」",["chi"]],[64,2,24,"儀封人請見，曰：「君子之至於斯也，吾未嘗不得見也。」従者見之。出曰：「二三子，何患於喪乎？天下之無道也久矣，天将以夫子為木鐸。」","儀の封人、見えんことを請う。曰く、君子の斯に至るや、吾未だ嘗て見ゆることを得ずんばあらざるなり。従者之を見えしむ。出でて曰く、二三子、何ぞ喪うことを患えんや。天下の道無きや久し。天将に夫子を以て木鐸と為さんとす。","地位を失っても嘆くことはない。天はこの人を世を目覚めさせる鐸にする。","いまの不遇は、自分にどんな役目を与えようとしているのか。",["fail","lonely","vision"],["落胆","孤独"],2,"儀の関守が先師に面会を求めていった。――\n「有徳のお方がこの関所をお通りになる時に、私がお目にかかれなかったためしは、これまでまだ一度もございません。」\n　お供の門人たちが、彼を先師の部屋に通した。やがて面会を終って出て来た彼は、門人たちにいった。――\n「諸君は、先生が野に下られたことを少しも悲観されることはありませんぞ。天下の道義が地におちてすでに久しいものですが、天は、先生を一国だけにとめておかないで、天下の木鐸にしようとしているのです。」",["gi"]],[65,2,25,"子謂韶：「尽美矣，又尽善也。」謂武：「尽美矣，未尽善也。」","子、韶を謂う、美を尽くせり、又善を尽くせり。武を謂う、美を尽くせり、未だ善を尽くさず。","舜の楽は美も善も極めている。武王の楽は美しいが、善は極めていない。","",[],[],0,"先師が楽曲韶を評していわれた。――\n「美の極致であり、また善の極致である。」\n　更に楽曲武を評していわれた。――\n「美の極致ではあるが、まだ善の極致だとはいえない。」",[]],[66,2,26,"子曰：「居上不寬，為礼不敬，臨喪不哀，吾何以観之哉！」","子曰く、上に居て寛ならず、礼を為して敬せず、喪に臨みて哀しまずんば、吾何を以てか之を観んや。","上に立って寛容でなく、礼に敬意がなく、葬儀で悲しまない人は見る所がない。","上に立つ者として、人の失敗や弱さに寛容でいられているか。",["lead","self"],["怒り"],2,"先師がいわれた。――\n「人の上に立つて寛容でなく、礼を行うのに敬意をかき、葬儀に参列しても悲しい気持になれない人間は、始末におえない人間だ。」\n［＃改ページ］",["jin","rei"]],[67,3,1,"子曰：「里仁為美。択不処仁，焉得知？」","子曰く、里は仁なるを美と為す。択びて仁に処らずんば、焉んぞ知なるを得ん。","思いやりのある場に身を置くのがよい。そこを選ばないのは賢明でない。","いま身を置いている環境や付き合う人は、自分を良くしているか。",["judge","decide"],["迷い"],2,"先師がいわれた。――\n「隣保生活には何よりも親切心が第一である。親切気のないところに居所をえらぶのは、賢明だとはいえない。」",["jin","chi"]],[68,3,2,"子曰：「不仁者，不可以久処約，不可以長処楽。仁者安仁，知者利仁。」","子曰く、不仁者は以て久しく約に処るべからず、以て長く楽に処るべからず。仁者は仁に安んじ、知者は仁を利とす。","仁のない人は逆境にも順境にも長く耐えられない。仁者は仁に安らぐ。","苦しい時も好調な時も、変わらない自分の軸は何か。",["fail","self"],["不安","慢心"],2,"先師がいわれた。――\n「不仁な人間は、長く逆境に身を処すことも出来ないし、また長く順境に身を処することも出来ない。それが出来るのは仁者と知者であるが、仁者はどんな境遇にあっても、仁そのものに安んずるが故にみだれないし、知者は仁の価値を知って努力するが故にみだれない。」",["jin"]],[69,3,3,"子曰：「惟仁者能好人，能悪人。」","子曰く、惟だ仁者のみ能く人を好み、能く人を悪む。","私心のない人だけが、人を正しく好み、正しく嫌うことができる。","人への好き嫌いに、自分の損得や感情が混ざっていないか。",["judge","trust"],["怒り"],2,"先師がいわれた。――\n「ただ仁者のみが正しく人を愛し、正しく人を悪むことが出来る。」",["jin","chi"]],[70,3,4,"子曰：「苟志於仁矣，無悪也。」","子曰く、苟くも仁に志せば、悪しきこと無きなり。","本気で仁を志していれば、悪に走ることはない。","判断に迷うとき、立ち返る志をはっきり言葉にできるか。",["vision","self"],["迷い"],2,"先師がいわれた。――\n「志向がたえず仁に向ってさえおれば、過失はあっても悪を行うことはない。」",["jin"]],[71,3,5,"子曰：「富与貴，是人之所欲也，不以其道得之，不処也。貧与賎，是人之所悪也；不以其道得之，不去也。君子去仁，悪乎成名？君子無終食之閒違仁，造次必於是，顛沛必於是。」","子曰く、富と貴きとは、是れ人の欲する所なり。其の道を以て之を得ざれば、処らざるなり。貧しきと賤しきとは、是れ人の悪む所なり。其の道を以て之を得ざれば、去らざるなり。君子は仁を去りて、悪くにか名を成さん。君子は食を終うるの間も仁に違うこと無し。造次にも必ず是に於いてし、顛沛にも必ず是に於いてす。","富も地位も誰もが欲しい。だが筋の通らない手段で得たならそこに留まらない。","この利益は、胸を張って説明できる道筋で得たものか。",["profit","decide","fail"],["迷い","焦り"],3,"先師がいわれた。――\n「人は誰しも富裕になりたいし、また尊貴にもなりたい。しかし、正道をふんでそれを得るのでなければ、そうした境遇を享受すべきではない。人は誰しも貧困にはなりたくないし、また卑賎にもなりたくはない。しかし、道を誤ってそうなったのでなければ、無理にそれを脱れようとあせる必要はない。君子が仁を忘れて、どうして君子の名に値しよう。君子は、箸のあげおろしの間にも仁にそむかないように心掛くべきだ。いや、それどころか、あわを食ったり、けつまずいたりする瞬間も、心は仁にしがみついていなければならないのだ。」",["gi","jin"]],[72,3,6,"子曰：「我未見好仁者，悪不仁者。好仁者，無以尙之；悪不仁者，其為仁矣。不使不仁者加乎其身。有能一日用其力於仁矣乎？我未見力不足者！蓋有之矣，我未之見也。」","子曰く、我未だ仁を好む者、不仁を悪む者を見ず。仁を好む者は、以て之に尚うること無し。不仁を悪む者は、其れ仁を為す、不仁者をして其の身に加えしめず。能く一日も其の力を仁に用いること有らんか。我未だ力の足らざる者を見ず。蓋し之有らん、我未だ之を見ざるなり。","一日だけでも仁に力を尽くそうとして、力が足りなかった人を見たことがない。","力が足りないのではなく、今日一日やると決めていないだけではないか。",["fail","vision"],["落胆","疲れ"],2,"先師がいわれた。――\n「私はまだ、真に仁を好む者にも、真に不仁を悪む者にも会ったことがない。真に仁を好む人は自然に仁を行う人で、全く申分がない。しかし不仁を悪む人も、つとめて仁を行うし、また決して不仁者の悪影響をうけることがない。せめてその程度には誰でもなりたいものだ。それは何もむずかしいことではない。今日一日、今日一日と、その日その日を仁にはげめばいいのだ。たった一日の辛抱さえ出来ない人はまさかないだろう。あるかも知れないが、私はまだ、それも出来ないような人を見たことがない。」",["jin"]],[73,3,7,"子曰：「人之過也，各於其党。観過，斯知仁矣。」","子曰く、人の過つや、各其の党に於いてす。過ちを観れば、斯に仁を知る。","過ちにはその人らしさが出る。過ちの質を見れば人柄がわかる。","あの人の失敗は、どんな人柄から生まれたものだったか。",["judge","fail"],[],2,"先師がいわれた。――\n「人がら次第で過失にも種類がある。だから、過失を見ただけでも、その人の仁不仁がわかるものだ。」",["chi","jin"]],[74,3,8,"子曰：「朝聞道，夕死可矣！」","子曰く、朝に道を聞かば、夕べに死すとも可なり。","朝に真理を悟れたなら、その夕方に死んでも悔いはない。","それが分かれば悔いはないと言えるほど、求めているものは何か。",["vision"],["迷い"],3,"先師がいわれた。――\n「朝に真実の道をきき得たら、夕には死んでも思い残すことはない。」",["chi","gi"]],[75,3,9,"子曰：「士志於道，而恥悪衣悪食者，未足与議也！」","子曰く、士、道に志して、悪衣悪食を恥ずる者は、未だ与に議るに足らざるなり。","道を志しながら粗末な身なりや食事を恥じる人とは、ともに語れない。","志よりも、人からの見え方や体裁を気にしていないか。",["vision","profit","judge"],["焦り"],2,"先師がいわれた。――\n「いやしくも道に志すものが、粗衣粗食を恥じるようでは、話相手とするに足りない。」",["gi"]],[76,3,10,"子曰：「君子之於天下也，無適也，無莫也，義之与比。」","子曰く、君子の天下に於けるや、適も無く、莫も無し。義に之与に比う。","君子は物事に決まった可否を持ち込まない。ただ義に従って判断する。","先入観やこだわりを外したら、筋が通るのはどちらの道か。",["decide"],["迷い"],2,"先師がいわれた。――\n「君子が政治の局にあたる場合には、自分の考えを固執し、無理じいに事を行ったり禁止したりすることは決してない。虚心に道理のあるところに従うだけである。」",["gi"]],[77,3,11,"子曰：「君子懐徳，小人懐土；君子懐刑，小人懐惠。」","子曰く、君子は徳を懐い、小人は土を懐う。君子は刑を懐い、小人は恵を懐う。","上が徳を思えば民は土地に落ち着き、罰を思えば民は恩恵ばかり求める。","人を動かすとき、罰や管理にばかり頼っていないか。",["lead"],[],1,"先師がいわれた。\n「上に立つ者が常に徳に心掛けると、人民は安んじて土に親み、耕作にいそしむ。上に立つ者が常に刑罰を思うと、人民はただ上からの恩恵だけに焦慮する。」",["gi"]],[78,3,12,"子曰：「放於利而行，多怨。」","子曰く、利に放りて行えば、怨み多し。","利益だけを基準に動けば、多くの怨みを買う。","目先の利益を優先した判断が、誰かの怨みを生んでいないか。",["profit","trust"],["焦り"],2,"先師がいわれた。――\n「利益本位で行動する人ほど怨恨の種をまくことが多い。」",["gi"]],[79,3,13,"子曰：「能以礼譲為国乎，何有？不能以礼譲為国，如礼何？」","子曰く、能く礼譲を以て国を為めんか、何か有らん。能く礼譲を以て国を為めずんば、礼を如何せん。","礼と譲り合いの心で治めれば難しいことはない。それがなければ礼制は空しい。","規則を増やす前に、自分から譲る姿勢を見せているか。",["lead"],[],1,"先師がいわれた。――\n「礼の道にかなつた懇切さで国を治めるならば、何の困難があろう。もし国を治めるのに、そうした懇切さを欠くなら、いったい礼制は何のためのものか。」",["rei"]],[80,3,14,"子曰：「不患無位，患所以立。不患莫己知，求為可知也。」","子曰く、位無きを患えず、立つ所以を患う。己を知ること莫きを患えず、知らるべきことを為すを求むるなり。","地位がないことより実力を案じよ。認められないなら認められるだけのことをせよ。","評価されないと嘆く前に、評価に値するだけの中身を積んでいるか。",["lonely","vision","self"],["孤独","焦り"],3,"先師がいわれた。――\n「地位のないのを心配するより、自分にそれだけの資格があるかどうかを心配するがいい。また、自分が世間に認められないのを気にやむより、認められるだけの価値のある人間になるように努力するがいい。」",["chi"]],[81,3,15,"子曰：「參乎！吾道一以貫之。」曽子曰：「唯。」子出，門人問曰：「何謂也？」曽子曰：「夫子之道，忠恕而已矣！」","子曰く、参や、吾が道は一以て之を貫く。曾子曰く、唯。子出ず。門人問いて曰く、何の謂いぞや。曾子曰く、夫子の道は、忠恕のみ。","孔子の道を貫くものは一つ。自分の真心を尽くし、人を思いやることだ。","自分の経営を貫いている一つのものを、一言で言えるか。",["vision","decide"],["迷い"],3,"先師がいわれた。\n「参よ、私の道はただ一つの原理で貫かれているのだ。」\n　曾先生が答えられた。――\n「さようでございます。」\n　先師はそういって室を出て行かれた。すると、ほかの門人たちが曾先生にたずねた。――\n「今のは何のことでしょう。」\n　曾先生は答えていわれた。――\n「先生の道は忠恕の一語につきるのです。」",["jin"]],[82,3,16,"子曰：「君子喻於義，小人喻於利。」","子曰く、君子は義に喩り、小人は利に喩る。","君子は何が正しいかで物事を理解し、小人は何が得かで理解する。","この判断を、損得ではなく正しさの言葉で説明できるか。",["profit","judge","decide"],["迷い"],3,"先師がいわれた。――\n「君子は万事を道義に照らして会得するが、小人は万事を利害から割出して会得する。」",["gi"]],[83,3,17,"子曰：「見賢思斉焉，見不賢而內自省也。」","子曰く、賢を見ては斉しからんことを思い、不賢を見ては内に自ら省みるなり。","優れた人を見たら並ぼうと思い、劣った人を見たら自分を省みる。","人の欠点に腹が立つとき、同じものが自分の中にないか。",["self","grow"],["怒り","慢心"],3,"先師がいわれた。――\n「賢者を見たら、自分もそうありたいと思うがいいし、不賢者を見たら、自分はどうだろうかと内省するがいい。」",["chi"]],[84,3,18,"子曰：「事父母幾諫；見志不従，又敬而不違，労而不怨。」","子曰く、父母に事うるには幾くに諫む。志の従わざるを見ては、又敬して違わず、労して怨みず。","親を諫めるときは穏やかに。聞き入れられなくても敬意を失わず、怨まない。","目上の人に意見が通らないとき、敬意を保ったまま粘れているか。",["trust"],["怒り"],1,"先師がいわれた。\n「父母に仕えて、その悪を默過するのは子の道ではない。言葉を和らげてそれを諌めるがいい。もし父母がきかなかったら、一層敬愛の誠をつくして、根気よく諌めることだ。苦しいこともあるだろうが、決して親を怨んではならない。」",["jin","rei"]],[85,3,19,"子曰：「父母在，不遠遊；遊必有方。」","子曰く、父母在せば、遠く遊ばず。遊ぶこと必ず方有り。","親が健在のうちは遠出を控え、出かけるなら必ず行き先を知らせる。","",[],[],0,"先師がいわれた。――\n「父母の存命中は、遠い旅行などはあまりしないがいい。やむを得ず旅行する場合は行先を明らかにしておくべきだ。」",["jin"]],[86,3,20,"子曰：「三年無改於父之道，可謂孝矣。」","子曰く、三年、父の道を改むること無きは、孝と謂うべし。","父の死後三年、そのやり方を変えなければ孝行と言える。","先代のやり方を変える前に、その意味を十分に汲み取ったか。",["decide"],["焦り"],1,"先師がいわれた。\n「もし父の死後三年間その仕来りを変えなければ、その人は孝子といえるだろう。」",["jin"]],[87,3,21,"子曰：「父母之年，不可不知也。一則以喜，一則以懼。」","子曰く、父母の年は、知らざるべからざるなり。一は則ち以て喜び、一は則ち以て懼る。","親の年齢は覚えておくこと。長寿を喜び、同時に老いを案じるために。","",[],[],0,"先師がいわれた。――\n「父母の年齢は忘れてはならない。一つにはその長命を喜ぶために、一つには老先の短いのをおそれていよいよ孝養をはげむために。」",["jin"]],[88,3,22,"子曰：「古者言之不出，恥躬之不逮也。」","子曰く、古者、言をこれ出ださざるは、躬の逮ばざるを恥ずればなり。","昔の人が軽々しく口にしなかったのは、実行が伴わないのを恥じたからだ。","口にした約束や方針のうち、実行が追いついていないものは何か。",["self","lead"],["慢心"],2,"先師がいわれた。――\n「古人はかろがろしく物をいわなかったが、それは実行の伴わないのを恥じたからだ。」",["shin"]],[89,3,23,"子曰：「以約失之者，鮮矣。」","子曰く、約を以て之を失う者は鮮なし。","控えめに身を引き締めていて失敗する人は少ない。","いまの判断は、勢いに任せて手を広げ過ぎていないか。",["decide","self"],["慢心","焦り"],2,"先師がいわれた。――\n「ひかえ目にしていてしくじる人は少い。」",["rei"]],[90,3,24,"子曰：「君子欲訥於言而敏於行。」","子曰く、君子は言に訥にして、行いに敏ならんと欲す。","君子は、口は重くても行動は素早くありたいと願う。","語る量と動く量、いまの自分はどちらが多いか。",["self","lead"],["焦り"],3,"先師がいわれた。――\n「君子は、口は不調法でも行いには敏活でありたいと願うものだ。」",["shin"]],[91,3,25,"子曰：「徳不孤，必有隣。」","子曰く、徳は孤ならず、必ず隣有り。","徳のある人は孤立しない。必ず理解し寄り添う人が現れる。","正しいと信じることを続ける自分に、すでに寄り添ってくれている人は誰か。",["lonely","vision"],["孤独"],3,"先師がいわれた。――\n「徳というものは孤立するものではない。必ず隣が出来るものだ。」",["shin"]],[92,3,26,"子游曰：「事君数，斯辱矣。朋友数，斯疏矣。」","子游曰く、君に事えて数すれば、斯に辱めらる。朋友に数すれば、斯に疎んぜらる。","主君にも友人にも、忠告がしつこければ辱められ、疎まれる。","相手のためと言いながら、同じ忠告を繰り返し過ぎていないか。",["trust","grow"],["怒り"],2,"子游がいった。――\n「君主に対して忠言の度が過ぎると、きっとひどい目にあわされる。友人に対して忠告の度が過ぎると、きっとうとまれる。」\n［＃改ページ］",["rei"]],[93,4,1,"子謂公冶長，「可妻也；雖在縲絏之中，非其罪也。」以其子妻之。子謂南容，「邦有道，不廢；邦無道，免於刑戮。」以其兄之子妻之。","子、公冶長を謂う、「妻あわすべきなり。縲紲の中に在りと雖も、其の罪に非ざるなり」と。其の子を以て之に妻あわす。子、南容を謂う、「邦に道有れば廃てられず、邦に道無きも刑戮より免る」と。其の兄の子を以て之に妻あわす。","経歴の傷より人物そのものを見て、娘と姪の婿を選んだ。","肩書きや過去の傷で、人を見誤っていないか。",["judge"],[],1,"先師が公冶長を評していわれた。――\n「あの人物なら、娘を嫁にやってもよい。かつては縄目の恥をうけたこともあったが、無実の罪だったのだ。」\n　そして彼を自分の婿にされた。\n　また先師は南容を評していわれた。――\n「あの人物なら、国が治っている時には必ず用いられるであろうし、国が乱れていても刑罰をうけるようなことは決してあるまい。」\n　そして兄上の娘を彼の嫁にやられた。",["chi"]],[94,4,2,"子謂子賎：「君子哉若人！魯無君子者，斯焉取斯？」","子、子賤を謂う、「君子なるかな、若き人。魯に君子なる者無くんば、斯れ焉くにか斯れを取らん」と。","立派な人は、立派な人に囲まれた環境から育つ。","社員が手本にできる人物は、身近に何人いるか。",["grow"],[],1,"先師が子賎を評していわれた。――\n「こういう人こそ君子というべきだ。しかし、もし魯の国に多くの君子がいなかったとしたら、彼もなかなかこうはなれなかったろう。」",["chi"]],[95,4,3,"子貢問曰：「賜也何如？」子曰：「女器也」。曰：「何器也？」曰：「瑚璉也。」","子貢問いて曰く、「賜や何如」と。子曰く、「女は器なり」と。曰く、「何の器ぞや」と。曰く、「瑚璉なり」と。","子貢は祭器のように貴い器。ただし、まだ器の域にある。","",[],[],0,"先師が人物評をやつておられると、子貢がたずねた。――\n「私はいかがでございましょう。」\n　先師がこたえられた。――\n「お前は見事な器だね。」\n　子貢がかさねてたずねた。――\n「どんな器でございましょう。」\n　先師がこたえられた。――\n「瑚連だ。」",[]],[96,4,4,"或曰：「雍也，仁而不佞。」子曰：「焉用佞？禦人以口給，屢憎於人。不知其仁；焉用佞？」","或るひと曰く、「雍や、仁にして佞ならず」と。子曰く、「焉くんぞ佞を用いん。人に禦るに口給を以てすれば、屢しば人に憎まる。其の仁を知らず、焉くんぞ佞を用いん」と。","口のうまさは要らない。弁舌で人をあしらえば、いずれ嫌われる。","口下手な人の実力を、見落としていないか。",["judge","trust"],[],2,"ある人がいった。――\n「雍は仁者ではありますが、惜しいことに口下手で、人を説きふせる力がありません。」\n　すると先師がいわれた。\n「口下手など、どうでもいいことではないかね。人に接して口先だけうまいことをいう人は、たいていおしまいには、あいそをつかされるものだよ。私は雍が仁者であるかどうかは知らないが、とにかく、口下手は問題ではないね。」",["shin"]],[97,4,5,"子使漆雕開仕。対曰：「吾斯之未能信。」子説。","子、漆雕開をして仕えしむ。対えて曰く、「吾、斯れを之れ未だ信ずること能わず」と。子説ぶ。","まだ自信がないと辞退した弟子の慎重さを、孔子は喜んだ。","「まだ早い」と言える部下を、正しく評価しているか。",["grow","judge"],[],1,"先師が漆雕開に仕官をすすめられた。すると、漆雕開はこたえた。――\n「私には、まだ役目を果すだけの自信がありません。」先師はその答えを心から喜ばれた。",["rei","chi"]],[98,4,6,"子曰：「道不行，乘桴浮於海，従我者，其由与？」子路聞之喜。子曰：「由也，好勇過我，無所取材。」","子曰く、「道行われず、桴に乗りて海に浮かばん。我に従う者は、其れ由なるか」と。子路之を聞きて喜ぶ。子曰く、「由や、勇を好むこと我に過ぎたり。材を取る所無し」と。","理想が通らぬ嘆きと、勇気はあるが分別の足りない子路への苦笑。","勇ましいだけの決断を、自分は喜んでいないか。",["lonely","decide"],["孤独"],1,"先師がいわれた。――\n「私の説く治国の道も、到底行われそうにないし、そろそろ桴にでも乗って海外に出ようと思うが、いよいよそうなった場合、私について来てくれるのは、由かな。」\n　子路はそれをきいて大喜びであった。すると先師がまたいわれた。――\n「ところで、由は、勇気を愛する点では私以上だが、分別が足りないので、いささか心細いね。」",["gi","chi"]],[99,4,7,"孟武伯問：「子路仁乎？」子曰：「不知也。」又問，子曰：「由也，千乘之国，可使治其賦也；不知其仁也。」「求也何如？」子曰：「求也，千室之邑，百乘之家，可使為之宰也；不知其仁也。」「赤也何如？」子曰：「赤也，束帶立於朝，可使与賓客言也；不知其仁也。」","孟武伯問う、「子路は仁なるか」と。子曰く、「知らざるなり」と。又問う。子曰く、「由や、千乗の国、其の賦を治めしむべきなり。其の仁を知らざるなり」と。「求や何如」と。子曰く、「求や、千室の邑、百乗の家、之が宰たらしむべきなり。其の仁を知らざるなり」と。「赤や何如」と。子曰く、「赤や、束帯して朝に立ち、賓客と言わしむべきなり。其の仁を知らざるなり」と。","能力は役目ごとに認める。だが、人格の完成とは別の話だ。","仕事ができることと、人として信頼できることを混同していないか。",["judge"],[],1,"孟武伯が先師にたずねた。――\n「子路は仁者でございましょうか。」\n　先師がこたえられた。――\n「わかりませぬ。」\n　孟武伯は、しかし、おしかえしてまた同じことをたずねた。すると先師はいわれた。――\n「由は千乗の国の軍事を司るだけの能力はありましょう。しかし仁者といえるかどうかは疑問です。」\n「では、求はいかがでしょう。」\n　先師はこたえられた。――\n「求は千戸の邑の代官とか、百乗の家の執事とかいう役目なら十分果せましょう。しかし、仁者といえるかどうかは疑問です。」\n「赤はどうでしょう。」\n　先師はこたえられた。――\n「赤は式服をつけ、宮庭において外国の使臣の応接をするのには適しています。しかし、仁者であるかどうかは疑問です。」",["chi"]],[100,4,8,"子謂子貢曰：「女与回也孰愈？」対曰：「賜也何敢望回！回也聞一以知十，賜也聞一以知二。」子曰：「弗如也。吾与女，弗如也。」","子、子貢に謂いて曰く、「女と回と孰れか愈れる」と。対えて曰く、「賜や何ぞ敢えて回を望まん。回や一を聞きて以て十を知る。賜や一を聞きて以て二を知る」と。子曰く、「如かざるなり。吾と女と如かざるなり」と。","及ばないと素直に認める弟子に、師も「私も及ばない」と並んだ。","自分より優れた人を、素直に認められているか。",["self","grow"],["慢心"],2,"先師が子貢にいわれた。――\n「お前と囘とは、どちらがすぐれていると思うかね。」\n　子貢がこたえていった。――\n「私ごときが、囘と肩をならべるなど、思いも及ばないことです。囘は一をきいて十を知ることが出来ますが、私は一をきいてやつと二を知るに過ぎません。」\n　すると先師はいわれた。――\n「実際、囘には及ばないね。それはお前のいうとおりだ。お前のその正直な答はいい。」",["rei","chi"]],[101,4,9,"宰予昼寢。子曰：「朽木不可雕也，糞土之牆，不可杇也；於予与何誅！」子曰：「始吾於人也，聴其言而信其行；今吾於人也，聴其言而観其行；於予与改是。」","宰予、昼寝ぬ。子曰く、「朽木は雕るべからざるなり。糞土の牆は杇るべからざるなり。予に於いてか何ぞ誅めん」と。子曰く、「始め吾、人に於けるや、其の言を聴きて其の行いを信ず。今吾、人に於けるや、其の言を聴きて其の行いを観る。予に於いてか是を改む」と。","人は言葉ではなく行動で見る。口先を信じて懲りた孔子の転換。","その人の言葉ではなく、行動を見て判断しているか。",["judge","grow"],["怒り","落胆"],2,"宰予が昼寝をしていた。すると先師がいわれた。――\n「くさった木には彫刻は出来ない。ぼろ土の塀は上塗をしてもだめだ。お前のようななまけ者を責めても仕方がない。」\n　それから、しばらくしてまたいわれた。――\n「これまで私は、誰でもめいめい口でいう通りのことを実行しているものだとばかり信じて来たのだ。しかしこれからは、もうそうは信じていられない。いうことと行うこととが一致しているかどうか、それをはっきりつきとめないと、安心が出来なくなって来た。お前のような人間もいるのだから。」",["shin","chi"]],[102,4,10,"子曰：「吾未見剛者。」或対曰：「申棖。」子曰：「棖也慾！焉得剛？」","子曰く、「吾未だ剛なる者を見ず」と。或るひと対えて曰く、「申棖あり」と。子曰く、「棖や慾あり。焉くんぞ剛なるを得ん」と。","欲の深い人は、本当の意味で強くはなれない。","自分の強気は、信念から来ているか、欲から来ているか。",["self","profit"],[],2,"先師が、いわれた。――\n「私はまだ剛者というほどの人物に会ったことがない。」\n　するとある人がいった。――\n「申という人物がいるではありませんか。」\n　先師は、いわれた。――\n「は慾が深い。あんなに慾が深くては剛者にはなれないね。」",["gi"]],[103,4,11,"子貢曰：「我不欲人之加諸我也，吾亦欲無加諸人。」子曰：「賜也，非爾所及也！」","子貢曰く、「我、人の諸を我に加うることを欲せざるや、吾も亦諸を人に加うること無からんと欲す」と。子曰く、「賜や、爾の及ぶ所に非ざるなり」と。","されたくないことを人にしない。言うは易く、行うは遠い。","掲げている理念を、今日の自分はどこまで実行できたか。",["self"],["慢心"],2,"子貢がいった。――\n「私は、自分が人からされたくないことは、自分もまた人に対してしたくないと思つています。」\n　すると先師がいわれた。――\n「賜よ、それはまだまだお前に出来ることではない。」",["jin"]],[104,4,12,"子貢曰：「夫子之文章，可得而聞也；夫子之言性与天道，不可得而聞也。」","子貢曰く、「夫子の文章は、得て聞くべきなり。夫子の性と天道とを言うは、得て聞くべからざるなり」と。","孔子は学芸や実践は語ったが、人の本性や天の道はめったに語らなかった。","",[],[],0,"子貢がいった。――\n「先生のご思想、ご人格の華というべき詩書礼楽のお話や、日常生活の実践に関するお話は、いつでもうかがえるが、その根本をなす人間の本質とか、宇宙の原理とかいう哲学的なお話は、容易にはうかがえない。」",["chi"]],[105,4,13,"子路有聞，未之能行，唯恐有聞。","子路、聞くこと有りて、未だ之を行うこと能わざれば、唯聞くこと有らんことを恐る。","学んだことを実行し終えるまで、次の教えを聞くのを恐れた子路。","学んだまま実行していないことが、いくつ溜まっているか。",["self","vision"],["焦り"],2,"子路は、一つの善言をきいて、まだそれを実現することが出来ない間は、更に新しい善言を聞くことを恐れた。",["shin","chi"]],[106,4,14,"子貢問曰：「孔文子，何以謂之文也？」子曰：「敏而好学，不恥下問，是以謂之文也。」","子貢問いて曰く、「孔文子は何を以て之を文と謂うや」と。子曰く、「敏にして学を好み、下問を恥じず。是を以て之を文と謂うなり」と。","頭が切れるうえに学びを好み、目下に尋ねることを恥じない。","部下や若手に、わからないことを素直に聞けているか。",["self","grow"],["慢心"],2,"子貢がたずねた。\n「孔文子はどうして文というりっぱなおくり名をされたのでありましょうか。」\n　先師がこたえられた。\n「天性明敏なうえに学問を好み、目下のものに教えを乞うのを恥としなかつた。そういう人だったから文というおくり名をされたのだ。」",["chi","rei"]],[107,4,15,"子謂子產：「有君子之道四焉：其行己也恭，其事上也敬，其養民也惠，其使民也義。」","子、子産を謂う、「君子の道四つ有り。其の己を行うや恭、其の上に事うるや敬、其の民を養うや恵、其の民を使うや義」と。","自分には慎み、上には敬意、人には恵み、使うときは筋を通す。","人を使うとき、相手が納得できる筋を通しているか。",["lead"],[],2,"先師が子産のことを評していわれた。――\n「子産は、為政家の守るべき四つの道をよく守つている人だ。彼は先ず第一に身を持すること恭謙である。第二に上に仕えて敬慎である。第三に人民に対して慈恵を旨としている。そして第四に人民の使役の仕方が公正である。」",["rei","gi"]],[108,4,16,"子曰：「晏平仲善与人交，久而敬之。」","子曰く、「晏平仲、善く人と交わる。久しくして之を敬す」と。","長い付き合いになっても、相手への敬意を失わない。","付き合いの長い相手ほど、扱いが雑になっていないか。",["trust"],[],2,"先師がいわれた。――\n「晏平仲は交際の道をよく心得ている人である。どんなに久しく交際している人に対しても狎れて敬意を失うことがない。」",["rei"]],[109,4,17,"子曰：「臧文仲居蔡，山節藻梲。何如其知也？」","子曰く、「臧文仲、蔡を居く。節を山にし梲を藻にす。何如ぞ其れ知ならん」と。","分を越えた飾りで占いの亀を祀る者を、知者とは呼べない。","",[],[],0,"先師がいわれた。――\n「臧文仲は、諸侯でもないのに、国の吉兆を占う蔡をもっている。しかもそれを置く節には山の形を刻み、には水草の模様を描いているが、それは天子の廟の装飾だ。世間では彼を知者だといっているが、こんな身の程知らずが、何で知者といえよう。」",["chi","rei"]],[110,4,18,"子張問曰：「令尹子文，三仕為令尹，無喜色；三已之，無慍色。旧令尹之政，必以吿新令尹。何如？」子曰：「忠矣。」曰：「仁矣乎？」曰：「未知，焉得仁？」「崔子弒斉君，陳文子有馬十乘，棄而違之，至於他邦，則曰：『猶吾大夫崔子也！』違之，之一邦，則又曰：『猶吾大夫崔子也！』違之。何如？」子曰：「淸矣。」曰：「仁矣乎？」曰：「未知，焉得仁？」","子張問いて曰く、「令尹子文、三たび仕えて令尹と為れども、喜ぶ色無し。三たび之を已めらるれども、慍る色無し。旧令尹の政は、必ず以て新令尹に告ぐ。何如」と。子曰く、「忠なり」と。曰く、「仁なりや」と。曰く、「未だ知らず、焉くんぞ仁なるを得ん」と。「崔子、斉君を弑す。陳文子、馬十乗有り、棄てて之を違る。他邦に至りて、則ち曰く、『猶お吾が大夫崔子のごときなり』と。之を違る。一邦に之きて、則ち又曰く、『猶お吾が大夫崔子のごときなり』と。之を違る。何如」と。子曰く、「清なり」と。曰く、「仁なりや」と。曰く、「未だ知らず、焉くんぞ仁なるを得ん」と。","忠実でも潔癖でも、それだけで仁とは言えない。一つの美点で人を決めない。","一つの美点だけで、その人の全体を評価していないか。",["judge"],[],1,"子張が先師にたずねた。――\n「子文は三度令尹の職にあげられましたが、べつにうれしそうな顔もせず、三度その職をやめられましたが、べつに不平そうな顔もしなかったそうです。そして、やめる時には、気持よく政務を新任の令尹に引きついだということです。こういう人を先生はどうお考えでございましょうか。」\n　先師はいわれた。――\n「忠実な人だ。」\n　子張がたずねた。――\n「仁者だとは申されますまいか。」\n　先師がこたえられた。――\n「どうかわからないが、それだけきいただけでは仁者だとは断言出来ない。\n　子張が更にたずねた。――――\n「崔子が斉の荘公を弑したときに、陳文子は馬十乗もあるほどの大財産を捨てて国を去りました。ところが、他の国に行って見ると、そこの大夫もよろしくないので、『ここにも崔子と同様の大夫がいる。』といって、またそこを去りました。それから更に他の国に行きましたが、そこでも、やはり同じようなことをいって、去ったというのです。かような人物はいかがでしょう。」\n　先師がこたえられた。――\n「純潔な人だ。」\n　子張がたずねた。――\n「仁者だとは申されますまいか。」\n　先師がいわれた。――\n「どうかわからないが、それだけきいただけでは、仁者だとは断言出来ない。」",["chi","jin"]],[111,4,19,"季文子三思而後行。子聞之曰：「再，斯可矣！」","季文子、三たび思いて而る後に行う。子、之を聞きて曰く、「再びせば斯れ可なり」と。","考えすぎは迷いを生む。二度考えたら、動けばよい。","もう十分考えたのに、まだ決めずにいることは何か。",["decide"],["迷い","不安"],3,"季文子は何事も三たび考えてから行った。先師はそれをきいていわれた。――\n「二度考えたら十分だ。」",["gi","chi"]],[112,4,20,"子曰：「甯武子，邦有道則知；邦無道則愚。其知可及也，其愚不可及也。」","子曰く、「甯武子、邦に道有れば則ち知、邦に道無ければ則ち愚。其の知は及ぶべきなり、其の愚は及ぶべからざるなり」と。","順境で賢く働くのは易しい。逆境で愚直に損な役を担うのは難しい。","苦しい局面で、損な役回りを黙って引き受けられるか。",["fail","lead"],[],2,"先師がいわれた。――\n「武子は国に道が行われている時には、見事に腕をふるって知者だといわれ、国が乱れている時には、損な役割を引きうけて愚者だといわれた。その知者としての働きは真似が出来るが、愚者としての働きは容易に真似の出来ないところだ。」",["gi"]],[113,4,21,"子在陳，曰：「帰与！帰与！吾党之小子狂簡，斐然成章，不知所以裁之。」","子、陳に在りて曰く、「帰らんか、帰らんか。吾が党の小子、狂簡にして、斐然として章を成す。之を裁する所以を知らざるなり」と。","帰ろう。志は大きいが粗削りな故郷の若者たちを、育てに帰ろう。","外で成果を追うより、足元の人を育てる時期ではないか。",["grow","decide","vision"],["疲れ"],2,"先師が天下を周遊して陳の国に居られたときに、いわれた。――\n「帰るとしよう、帰るとしよう。帰って郷党の若い同志を教えるとしよう。彼等の志は遠大だが、まだ実践上の磨きが足りない。知識学問においては百花爛漫の妍を競っているが、まだ自己形成のための真の道を知らない。それはちょうど、見事な布は織ったが、寸法をはかってそれを裁断し、衣服に仕立てることが出来ないようなものだ。これをすてては置けない。しかも、彼等を教えることは、こうして諸侯を説いて無用な旅をつづけるより、どれだけ有意義なことだろう。」",["chi"]],[114,4,22,"子曰：「伯夷、叔斉，不念旧悪，怨是用希。」","子曰く、「伯夷・叔斉、旧悪を念わず。怨み是を用て希なり」と。","過去の悪を根に持たない。だから人からも怨まれない。","いつまでも根に持っている、あの一件は何か。",["trust","self"],["怒り"],2,"先師がいわれた。――\n「伯夷・叔斉は人の旧悪を永く根にもつことがなかった。だから人に怨まれることがほとんどなかったのだ。」",["jin"]],[115,4,23,"子曰：「孰謂微生高直？或乞醯焉，乞諸其隣而与之。」","子曰く、「孰か微生高を直なりと謂うや。或るひと醯を乞う。諸を其の隣に乞いて之に与う」と。","無いものを無いと言わず、隣から借りて与えるのは正直とは言えない。","いい顔をしたくて、できないことを引き受けていないか。",["self","judge"],[],1,"先師がいわれた。――\n「いったい誰が微生高を正直者などといい出したのだ。あの男は、ある人に酢を無心され、それを隣からもらって与えたというではないか。」",["shin"]],[116,4,24,"子曰：「巧言、令色、足恭，左丘明恥之，丘亦恥之。匿怨而友其人，左丘明恥之，丘亦恥之。」","子曰く、「巧言・令色・足恭は、左丘明之を恥ず、丘も亦之を恥ず。怨みを匿して其の人を友とするは、左丘明之を恥ず、丘も亦之を恥ず」と。","へつらいも、怨みを隠した付き合いも、恥ずべきことだ。","本心を隠したまま、笑顔で付き合っている相手はいないか。",["trust","self"],[],2,"先師がいわれた。――\n「言葉巧みに、顔色をやわらげて人の機嫌をとり、度をこしてうやうやしく振舞うのを、左丘明は恥じていたが、私もそれを恥じる。心に怨みをいだきながら、表面だけいかにも友達らしく振舞うのを、左丘明は恥じていたが、私もそれを恥じる。」",["shin"]],[117,4,25,"顔淵、季路侍。子曰：「盍各言爾志？」子路曰：「願車馬衣裘，与朋友共，敝之而無憾。」顔淵曰：「願無伐善，無施労。」子路曰：「願聞子之志。」子曰：「老者安之，朋友信之，少者懐之。」","顔淵・季路侍す。子曰く、「盍ぞ各おの爾の志を言わざる」と。子路曰く、「願わくは車馬衣裘、朋友と共にし、之を敝りて憾み無からん」と。顔淵曰く、「願わくは善に伐ること無く、労を施すこと無からん」と。子路曰く、「願わくは子の志を聞かん」と。子曰く、「老者は之を安んじ、朋友は之を信じ、少者は之を懐けん」と。","年長者に安心され、仲間に信頼され、若者に慕われる。それが志。","自分の志を、身近な人への接し方で語れるか。",["vision","lead"],["迷い"],3,"顔渕と季路とが先師のおそばにいたときのこと、先師がいわれた。――\n「どうだ、今日は一つ、めいめいの理想といったようなものを語りあって見ようではないか。」\n　すると、子路がすぐいった。\n「私が馬車に乗り、軽い毛皮の着物が着れるような身分になりました時に、友人と共にそれに乗り、それを着て、かりに友人がそれをいためましても、何とも思わないようにありたいものだと思います。」\n　顔渕はいった。――\n「私は、自分の善事を誇ったり、骨折を吹聴したりするような誘惑に打克って、自分の為すべきことを、真心こめてやれるようになりたいと、それをひたすら願っております。」\n　しばらくして子路が先師にたずねた。――\n「どうか、先生のご理想も承らしていただきたいと思います。」\n　先師は答えられた。――\n「私は、老人たちの心を安らかにしたい。友人とは信をもって交りたい。年少者には親しまれたい、と、ただそれだけを願っているのだ。」",["shin","jin"]],[118,4,26,"子曰：「已矣乎！吾未見能見其過，而內自訟者也。」","子曰く、「已んぬるかな。吾未だ能く其の過ちを見て、内に自ら訟むる者を見ざるなり」と。","自分の過ちを認め、心の内で自分を裁ける人は、めったにいない。","最近の失敗を、誰かのせいにしたままにしていないか。",["fail","self"],["慢心"],2,"先師がいわれた。――\n「何ともしようのない世の中だ。自分の過ちを認めて、自ら責める人がまるでいなくなったようだ。」",["rei","chi"]],[119,4,27,"子曰：「十室之邑，必有忠信如丘者焉，不如丘之好学也。」","子曰く、「十室の邑、必ず忠信丘が如き者有らん。丘の学を好むに如かざるなり」と。","誠実な人はどこにでもいる。違いを生むのは、学び続けることだ。","人柄に甘えて、学ぶことを止めていないか。",["vision","self"],[],2,"先師がいわれた。――\n「十戸ほどの小村にも、まじめで偽りがないというだけのことなら、私ぐらいな人はきっといるだろう。だが、学問を愛して道に精進している点では、私以上の人はめったにあるまい。",["chi","shin"]],[120,5,1,"子曰：「雍也，可使南面。」仲弓問子桑伯子。子曰：「可也，簡。」仲弓曰：「居敬而行簡，以臨其民，不亦可乎？居簡而行簡，無乃大簡乎？」子曰：「雍之言然。」","子曰く、「雍や南面せしむべし」と。仲弓、子桑伯子を問う。子曰く、「可なり、簡なり」と。仲弓曰く、「敬に居て簡を行い、以て其の民に臨まば、亦可ならずや。簡に居て簡を行うは、乃ち大簡なること無からんや」と。子曰く、「雍の言然り」と。","自分には厳しく、人には大まかに。自分にまで大まかなら、ただの放漫だ。","「細かいことは言わない」が、自分への甘さになっていないか。",["lead","self"],[],2,"先師がいわれた。――\n「雍には人君の風がある。南面して政を見ることが出来よう。」\n　　　　　　＊\n　仲弓が先師に子桑伯子の人物についてたずねた。先師がこたえられた。――\n「よい人物だ。大まかでこせこせしない。」\n　すると仲弓がまたたずねた。――\n「日常あくまでも敬慎の心を以て万事を裁量しつつ、政治の実際にあたっては、大まかな態度で人民に臨む、これが為政の要道ではありますまいか。もし、日常の執務も大まかであり、政治の実際面でも大まかであると、放慢になりがちだと思いますが。」\n　先師がいわれた。――\n「お前のいうとおりだ。」",["rei"]],[121,5,2,"哀公問：「弟子孰為好学？」孔子対曰：「有顔回者，好学；不遷怒，不弐過，不幸短命死矣！今也則亡，未聞好学者也。」","哀公問う、「弟子孰か学を好むと為す」と。孔子対えて曰く、「顔回なる者有り、学を好む。怒りを遷さず、過ちを弐びせず。不幸短命にして死せり。今や則ち亡し。未だ学を好む者を聞かざるなり」と。","怒りを他人にぶつけない。同じ過ちを繰り返さない。それが本当の学び。","今日の苛立ちを、関係のない誰かに向けていないか。",["self","fail"],["怒り"],3,"哀公が先師にたずねられた。――\n「門人中で誰が一番学問が好きかな。」\n　先師がこたえられた。――\n「顔囘と申すものがおりまして、大変学問が好きでありました。怒りをうつさない、過ちをくりかえさない、ということは、なかなか出来ることではありませんが、それが顔囘には出来たのでございます。しかし、不幸にして短命でなくなりました。もうこの世にはおりません。顔囘亡きあとには、残念ながら、ほんとうに学問が好きだといえるほどの者はいないようでございます。」",["chi","rei"]],[122,5,3,"子華使於斉，冉子為其母請粟。子曰：「与之釜。」請益，曰：「与之庾。」冉子与之粟五秉。子曰：「赤之適斉也，乘肥馬，衣軽裘；吾聞之也：君子周急不継富。」原思為之宰，与之粟九百，辞。子曰：「毋！以与爾隣里郷党乎！」","子華、斉に使いす。冉子、其の母の為に粟を請う。子曰く、「之に釜を与えよ」と。益さんことを請う。曰く、「之に庾を与えよ」と。冉子、之に粟五秉を与う。子曰く、「赤の斉に適くや、肥馬に乗り、軽裘を衣たり。吾之を聞く、君子は急を周いて富めるに継がずと」と。原思、之が宰たり。之に粟九百を与う。辞す。子曰く、「毋かれ。以て爾の隣里郷党に与えんか」と。","困っている人は助けるが、富む人に上乗せはしない。正当な報酬は受けてよい。","その配分は、必要な人に届いているか、声の大きい人に流れているか。",["profit","lead"],[],2,"子華が先師の使者として斉に行った。彼の友人の冉先生が、留守居の母のために飯米を先師に乞うた。先師はいわれた。――\n「五六升もやれば結構だ。」\n　冉先生はそれではあんまりだと思ったので、もう少し増してもらうようにお願いした。すると、先師はいわれた。――\n「では、一斗四五升もやったらいいだろう。」\n　冉先生は、それでも少いと思ったのか、自分のはからいで七石あまりもやってしまった。\n　先師はそれを知るといわれた。――\n「赤は斉に行くのに、肥馬に乗り軽い毛衣を着ていたくらいだ。まさか留守宅が飯米にこまることもあるまい。私のきいているところでは、君子は貧しい者にはその不足を補ってやるが、富める者にその富のつぎ足しをしてやるようなことはしないものだそうだ。少し考えるがいい。」\n　　　　　　＊\n　原思が先師の領地の代官になった時に、先師は彼に俸祿米九百を与えられた。原思は多過ぎるといって辞退した。すると先師はいわれた。――\n「遠慮しないがいい。もし多過ぎるようだったら、近所の人たちにわけてやってもいいのだから。」",["gi","jin"]],[123,5,4,"子謂仲弓曰：「犁牛之子，騂且角；雖欲勿用，山川其舎諸？」","子、仲弓を謂いて曰く、「犁牛の子、騂くして且つ角あらば、用うること勿からんと欲すと雖も、山川其れ諸を舎てんや」と。","出自が低くても、本人が優れていれば、世の中は放っておかない。","出身や経歴で、人の可能性に蓋をしていないか。",["judge","lonely"],[],2,"先師は仲弓のことについて、こんなことをいわれた。――\n「まだら牛の生んだ子でも、毛が赤くて、角が見事でさえあれば、神前に供えられる資格は十分だ。人がそれを用いまいとしても、山川の神々が決して捨ててはおかれないだろう。」",["chi"]],[124,5,5,"子曰：「回也，其心三月不違仁。其余，則日月至焉而已矣。」","子曰く、「回や、其の心三月仁に違わず。其の余は則ち日月に至るのみ」と。","顔回は長く仁から離れない。他の者は、たまに届くだけだ。","良い心がけは、何日続いているか。",["self","vision"],[],1,"先師がいわれた。――\n「囘よ、三月の間、心が仁の原理をはなれなければ、その他の衆徳は日に月に進んで来るものだ。」",["jin"]],[125,5,6,"季康子問：「仲由可使従政也与？」子曰：「由也果，於従政乎何有！」曰：「賜也可使従政也与？」曰：「賜也達，於従政乎何有！」曰：「求也可使従政也与？」曰：「求也芸，於従政乎何有！」","季康子問う、「仲由は政に従わしむべきか」と。子曰く、「由や果なり。政に従うに於いて何か有らん」と。曰く、「賜は政に従わしむべきか」と。曰く、「賜や達なり。政に従うに於いて何か有らん」と。曰く、「求は政に従わしむべきか」と。曰く、「求や芸あり。政に従うに於いて何か有らん」と。","決断力、見通す力、多才さ。強みは違っても、それぞれ任せられる。","部下一人ひとりの強みを、一言で言えるか。",["grow","judge"],[],2,"大夫の季康子が先師にたずねた。――\n「仲由は政治の任にたえうる人物でしょうか。」\n　先師がこたえられた。――\n「由には決断力があります。決して政治が出来ないことはありません。」\n　季康子――\n「賜は政治の任にたえうる人物でしょうか。」\n　先師――\n「賜は聰明です。決して政治が出来ないことはありません。」\n　季康子――\n「求は政治の任にたえうる人物でしょうか。」\n　先師――\n「求は多才多能です。決して政治が出来ないことはありません。」",["chi"]],[126,5,7,"季氏使閔子騫為費宰。閔子騫曰：「善為我辞焉。如有復我者，則吾必在汶上矣。」","季氏、閔子騫をして費の宰たらしめんとす。閔子騫曰く、「善く我が為に辞せよ。如し我を復びする者有らば、則ち吾は必ず汶の上に在らん」と。","筋の通らない相手からの良い地位は、きっぱり断る。","条件は良いが筋の悪い話を、断る覚悟はあるか。",["profit","decide"],[],2,"魯の大夫季氏が閔子騫を費の代官に任用したいと思って、使者をやった。すると、閔子騫は、その使者にいった。――\n「どうか私に代ってよろしくお断り申しあげて下さい。もし再び私をお召しになるようなことがあれば、私はきっと水のほとりにかくれるでございましょう。」",["gi"]],[127,5,8,"伯牛有疾，子問之，自牖執其手，曰：「亡之，命矣夫！斯人也，而有斯疾也！斯人也，而有斯疾也！」","伯牛、疾有り。子、之を問う。牖より其の手を執りて曰く、「之を亡わん、命なるかな。斯の人にして斯の疾有るや、斯の人にして斯の疾有るや」と。","重病の弟子の手を窓越しに取り、これほどの人がなぜと嘆いた。","どうにもならないことを、嘆くだけ嘆いて受け入れられるか。",["fail"],["落胆"],1,"伯牛が癩を病んで危篤に陥った。先師は彼をその家に見舞われ、窓から彼の手をとって永訣された。そして嘆いていわれた。――\n「惜しい人がなくなる。これも天命だろう。それにしても、この人にこの業病があろうとは。この人にこの業病があろうとは。」",["jin"]],[128,5,9,"子曰：「賢哉回也！一簞食，一瓢飲，在陋巷，人不堪其憂，回也不改其楽。賢哉回也！」","子曰く、「賢なるかな回や。一箪の食、一瓢の飲、陋巷に在り。人は其の憂いに堪えず、回や其の楽しみを改めず。賢なるかな回や」と。","貧しさの中でも楽しみを失わない。喜びの源が、境遇の外にある。","業績や境遇に関係なく、自分を支える楽しみは何か。",["fail","vision","profit"],["不安","落胆"],3,"先師がいわれた。――\n「囘は何という賢者だろう。一膳飯に一杯酒で、裏店住居といったような生活をしておれば、たいていの人は取りみだしてしまうところだが、囘は一向平気で、ただ道を楽み、道にひたりきっている。囘は何という賢者だろう。」",["chi"]],[129,5,10,"冉求曰：「非不説子之道，力不足也。」子曰：「力不足者，中道而廢；今女画。」","冉求曰く、「子の道を説ばざるに非ず、力足らざるなり」と。子曰く、「力足らざる者は、中道にして廃す。今女は画れり」と。","力不足なら途中で倒れるはず。やる前から自分に線を引いているだけだ。","「力が足りない」と、やる前から線を引いていないか。",["fail","vision","grow"],["不安","落胆"],3,"冉求がいった。――\n「先生のお説きになる道に心をひかれないのではありません。ただ、何分にも私の力が足りませんので……」\n　すると、先師はいわれた。\n「力が足りないかどうかは、根かぎり努力して見たうえでなければ、わかるものではない。ほんとうに力が足りなければ中途でたおれるまでのことだ。お前はたおれもしないうちから、自分の力に見きりをつけているようだが、それがいけない。」",["gi"]],[130,5,11,"子謂子夏曰：「女為君子儒，無為小人儒。」註解：「女」有「汝、你」的意思。本句文意是「孔子給学生子夏的期許，希望子夏能做大事，不做計算小事的儒者。」","子、子夏に謂いて曰く、「女、君子の儒と為れ。小人の儒と為ること無かれ」と。","同じ学ぶなら、器の大きな学び手になれ。知識を飾りにするな。","その学びは、自分を大きくするためか、飾るためか。",["vision","grow"],[],2,"先師が子夏にいわれた。――\n「君子の儒になるのだ。小人の儒になるのではないぞ。」",["chi"]],[131,5,12,"子游為武城宰。子曰：「女得人焉耳乎？」曰：「有澹台滅明者，行不由徑；非公事，未嘗至於偃之室也。」","子游、武城の宰たり。子曰く、「女、人を得たりや」と。曰く、「澹台滅明なる者有り。行くに径に由らず。公事に非ざれば、未だ嘗て偃の室に至らざるなり」と。","近道をせず、私用で上司に近づかない。そういう人が得がたい人材だ。","すり寄って来ない実直な人を、きちんと見つけているか。",["judge"],[],2,"子游は武城の代官をつとめていたが、ある時、先師が彼にたずねられた。――\n「部下にいい人物を見つけたかね。」\n　子游がこたえた。――\n「澹臺滅明という人物がおります。この人間は、決して近道やぬけ道を歩きません。また公用でなければ、決して私の部屋にはいって来たことがございません。」",["gi","shin"]],[132,5,13,"子曰：「孟之反不伐，奔而殿，将入門，策其馬，曰：『非敢後也，馬不進也。』」","子曰く、「孟之反、伐らず。奔りて殿す。将に門に入らんとするとき、其の馬に策うちて曰く、『敢えて後れたるに非ざるなり、馬進まざるなり』と」。","退却のしんがりを務めながら、「馬が進まなかっただけ」と功を誇らない。","手柄を語りたくなったとき、黙っていられるか。",["self","lead"],["慢心"],2,"先師がいわれた。――\n「孟子反は功にほこらない人だ。敗軍の時に一番あとから退却して来たが、まさに城門に入ろうとする時、馬に鞭をあてて、こういったのだ。――自分は好んで殿の役をつとめたわけではないが、つい馬がいうことをきかなかったので。――」",["rei"]],[133,5,14,"子曰：「不有祝鮀之佞，而有宋朝之美，難乎免於今之世矣。」","子曰く、「祝鮀の佞有らずして、宋朝の美有るは、難いかな、今の世に免れんこと」と。","口のうまさや見た目がなければ無事に渡れない、と時代を嘆いた。","",[],[],0,"先師がいわれた。――\n「祝※［＃「魚＋它」、U+9B80、288-下-8］ほど口がうまくて、宋朝ほどの美男子でないと、無事にはつとまらないらしい。何というなさけない時代だろう。」",[]],[134,5,15,"子曰：「誰能出不由戶？何莫由斯道也！」","子曰く、「誰か能く出ずるに戸に由らざらん。何ぞ斯の道に由ること莫きや」と。","外へ出るには戸口を通る。なのに人は、なぜ正しい道を通らないのか。","近道を探して、通るべき正面の道を避けていないか。",["vision","profit"],["迷い"],2,"先師がいわれた。――\n「外に出るのに戸口を通らないものはない。然るに、どうして人々は、人間が世に出るのに必ず通らなければならないこの道を通ろうとしないだろう。」",["gi"]],[135,5,16,"子曰：「質勝文則野，文勝質則史。文質彬彬，然後君子。」","子曰く、「質、文に勝てば則ち野。文、質に勝てば則ち史。文質彬彬として、然る後に君子なり」と。","中身だけでは粗野、見た目だけでは上滑り。釣り合ってこそ一流。","中身と見せ方、いまどちらに偏っているか。",["self","decide"],[],2,"先師がいわれた。――\n「質がよくても文がなければ一個の野人に過ぎないし、文は十分でも、質がわるければ、気のきいた事務家以上にはなれない。文と質とがしっかり一つの人格の中に溶けあった人を君子というのだ。」",["rei"]],[136,5,17,"子曰：「人之生也直，罔之生也幸而免。」","子曰く、「人の生くるや直し。之を罔いて生くるや、幸いにして免るるなり」と。","人はまっすぐ生きるもの。ごまかして無事なのは、運がよかっただけだ。","ごまかしが通っているのを、実力だと勘違いしていないか。",["profit","self"],[],2,"先師がいわれた。――\n「人間というものは、本来、正直に生れついたものだ。それを無視して生きていられるのは、決して天理にかなっていることではない。偶然に天罰を免れているに過ぎないのだ。」",["shin"]],[137,5,18,"子曰：「知之者，不如好之者，好之者，不如楽之者。」","子曰く、「之を知る者は、之を好む者に如かず。之を好む者は、之を楽しむ者に如かず」と。","知っているより好き、好きより楽しんでいる人が、いちばん強い。","いまの仕事を、自分は楽しめているか。",["vision","grow"],["疲れ","迷い"],3,"先師がいわれた。――\n「真理を知る者は真理を好む者に及ばない。真理を好む者は真理を楽む者に及ばない。」",["chi"]],[138,5,19,"子曰：「中人以上，可以語上也；中人以下，不可以語上也。」","子曰く、「中人以上には、以て上を語るべきなり。中人以下には、以て上を語るべからざるなり」と。","高度な話は、受け取れる段階の相手にする。教えは相手に合わせる。","相手の段階に合わない話を、一方的にしていないか。",["grow"],[],2,"先師がいわれた。――\n「中以上の学徒には高遠精深な哲理を説いてもいいが、中以下の学徒にはそれを説くべきではない。」",["chi"]],[139,5,20,"樊遅問知。子曰：「務民之義，敬鬼神而遠之，可謂知矣。」問仁。曰：「仁者先難而後獲，可謂仁矣。」","樊遅、知を問う。子曰く、「民の義を務め、鬼神を敬して之を遠ざく。知と謂うべし」と。仁を問う。曰く、「仁者は難きを先にして獲るを後にす。仁と謂うべし」と。","人としてなすべきことに力を注ぐ。難しいことを先に、見返りは後に。","見返りを先に計算して、難しい仕事を後回しにしていないか。",["profit","decide"],[],2,"樊遅が「知」について先師の教えを乞うた。先師がこたえられた。――\n「ひたすら現実社会の人倫の道に精進して、超自然界の霊は敬して遠ざける、それを知というのだ。」\n　樊遅はさらに「仁」について教えを乞うた。先師がこたえられた。――\n「仁者は労苦を先にして利得を後にする。仁とはそういうものなのだ。」",["chi","jin"]],[140,5,21,"子曰：「知者楽水，仁者楽山。知者動，仁者静。知者楽，仁者壽。」","子曰く、「知者は水を楽しみ、仁者は山を楽しむ。知者は動き、仁者は静かなり。知者は楽しみ、仁者は寿し」と。","知の人は水のように動き、仁の人は山のように静か。どちらも良い生き方。","自分は動いて力を出す型か、腰を据えて力を出す型か。",["self"],[],1,"先師がいわれた。――\n「知者は水に歓びを見出し、仁者は山に歓びを見出す。知者は活動的であり、仁者は静寂である。知者は変化を楽み、仁者は永遠の中に安住する。」",["chi","jin"]],[141,5,22,"子曰：「斉一変，至於魯；魯一変，至於道。」","子曰く、「斉、一変せば魯に至らん。魯、一変せば道に至らん」と。","斉が変われば魯のように、魯が変われば理想の国になれる、と期待した。","",[],[],0,"先師がいわれた。――\n「斉が一飛躍したら魯のようになれるし、魯が一飛躍したら真の道義国家になれるのだが。」",[]],[142,5,23,"子曰：「觚不觚，觚哉！觚哉！」","子曰く、「觚、觚ならず。觚ならんや、觚ならんや」と。","角のない觚は觚ではない。名ばかりで実を失ったものへの嘆き。","社名や理念が、名ばかりになっていないか。",["vision"],[],1,"先師がいわれた。――\n「觚には角があるものだが、この觚には角がない。角のない觚が觚だろうか。角のない觚が觚だろうか。」",["rei"]],[143,5,24,"宰我問曰：「仁者雖吿之曰：『井有仁焉。』其従之也？」子曰：「何為其然也？君子可逝也，不可陷也。可欺也，不可罔也。」","宰我問いて曰く、「仁者は之に告げて、『井に仁有り』と曰うと雖も、其れ之に従わんや」と。子曰く、「何為れぞ其れ然らん。君子は逝かしむべきなり、陥るべからざるなり。欺くべきなり、罔うべからざるなり」と。","善意につけ込まれて騙されることはあっても、判断力までは失わない。","情に訴えられたとき、助けることと巻き込まれることを分けているか。",["decide","trust"],[],2,"宰我が先師にたずねた。――\n「仁者は、もしも井戸の中に人がおちこんだといって、だまされたら、すぐ行ってとびこむものでしょうか。」\n　先師がこたえられた。――\n「どうしてそんなことをしよう。君子はだまして井戸まで行かせることは出来る。しかし、おとし入れることは出来ない。人情に訴えて欺くことは出来ても、正しい判断力を失わせることは出来ないのだ。」",["chi","jin"]],[144,5,25,"子曰：「君子博学於文，約之以礼，亦可以弗畔矣夫！」","子曰く、「君子、博く文を学び、之を約するに礼を以てせば、亦以て畔かざるべきか」と。","広く学び、それを礼という規範で引き締めれば、道を外れない。","集めた知識を、一本の軸で束ねられているか。",["vision","self"],[],2,"先師がいわれた。――\n「君子は博く典籍を学んで知見をゆたかにすると共に、実践の軌範を礼に求めてその知見にしめくくりをつけて行かなければならない。それでこそはじめて学問の道にそむかないといえるであろう。」",["chi","rei"]],[145,5,26,"子見南子，子路不説。夫子矢之曰：「予所否者，天厭之！天厭之！」","子、南子を見る。子路説ばず。夫子之に矢いて曰く、「予が否なる所の者は、天之を厭たん、天之を厭たん」と。","評判の悪い夫人に会って弟子に疑われ、やましければ天が許さぬと誓った。","身近な人に疑われたとき、天に恥じないと言い切れるか。",["trust","lonely"],[],1,"先師が南子に謁見された。子路がそのことについて遺憾の意を表した。先師は、すると、誓言するようにいわれた。――\n「私のやったことが、もし道にかなわなかったとしたら、天がゆるしてはおかれない。天がゆるしてはおかれない。」",["shin"]],[146,5,27,"子曰：「中庸之為徳也，其至矣乎！民鮮久矣！」","子曰く、「中庸の徳たるや、其れ至れるかな。民鮮なきこと久し」と。","偏らず、過不足のない中庸こそ最高の徳。だが身につけた人は少ない。","いまの判断は、やり過ぎか、足りないか。",["decide","self"],["迷い"],2,"先師がいわれた。――\n「中庸こそは完全至高の徳だ。それが人々の間に行われなくなってから久しいものである。」",["chi"]],[147,5,28,"子貢曰：「如有博施於民，而能済眾，何如？可謂仁乎？」子曰：「何事於仁，必也聖乎？堯舜其猶病諸！夫仁者，己欲立而立人，己欲達而達人。能近取譬，可謂仁之方也已。」","子貢曰く、「如し博く民に施して、能く衆を済う有らば、何如。仁と謂うべきか」と。子曰く、「何ぞ仁を事とせん。必ずや聖か。堯舜も其れ猶お諸を病めり。夫れ仁者は、己立たんと欲して人を立て、己達せんと欲して人を達す。能く近く譬えを取る。仁の方と謂うべきのみ」と。","自分が立ちたければ先に人を立たせる。仁は身近な一歩から始まる。","自分が得たいものを、先に誰かに与えているか。",["lead","vision","grow"],[],3,"子貢が先師にたずねていった。――\n「もしひろく恵みをほどこして民衆を救うことが出来ましたら、いかがでしょう。そういう人なら仁者といえましょうか。」\n　先師がこたえられた。――\n「それが出来たら仁者どころではない。それこそ聖人の名に値するであろう。堯や舜のような聖天子でさえ、それには心労をされたのだ。いったい仁というのは、何もそう大げさな事業をやることではない。自分の身を立てたいと思えば人の身も立ててやる、自分が伸びたいと思えば人も伸ばしてやる、つまり、自分の心を推して他人のことを考えてやる、ただそれだけのことだ。それだけのことを日常生活の実践にうつして行くのが仁の具体化なのだ。」\n［＃改ページ］",["jin"]],[148,6,1,"子曰：「述而不作，信而好古，窃比於我老彭。」","子曰く、述べて作らず、信じて古を好む。窃かに我が老彭に比す。","新説を誇らず、先人の知恵を信じて受け継ぐ。","新しさを追う前に、受け継ぐべきものを掴んでいるか。",["vision"],[],1,"先師がいわれた。――\n「私は古聖の道を伝えるだけで、私一箇の新説を立てるのではない。古聖の道を信じ愛する点では、私は心ひそかに自分を老彭にも劣らぬと思っているのだ。」",["chi","shin"]],[149,6,2,"子曰：「黙而識之，学而不厭，誨人不倦，何有於我哉？」","子曰く、黙して之を識し、学びて厭わず、人を誨えて倦まず。何か我に有らんや。","黙って覚え、飽きずに学び、倦まずに教える。それだけでいい。","派手さはなくても、毎日続けている自分の基本は何か。",["grow","vision"],["疲れ"],2,"先師がいわれた。――\n「沈默のうちに心に銘記する、あくことなく学ぶ、そして倦むことなく人を導く。それだけは私に出来る。そして私に出来るのは、ただそれだけだ。」",["chi"]],[150,6,3,"子曰：「徳之不脩，学之不講，聞義不能徙，不善不能改，是吾憂也。」","子曰く、徳の脩まらざる、学の講ぜざる、義を聞きて徙る能わざる、不善の改むる能わざる、是れ吾が憂いなり。","正しいと知って動けず、悪いと知って改められない。それが憂い。","正しいと分かっていながら、まだ手を付けていないことは何か。",["self","fail"],["焦り"],2,"先師がいわれた。――\n「修徳の未熟なこと、研学の不徹底なこと、正義と知ってただちに実践にうつり得ないこと、不善の行を改めることが出来ないこと。――いつも私の気がかりになっているのは、この四つのことだ。」",["gi","chi"]],[151,6,4,"子之燕居，申申如也，夭夭如也。","子の燕居するや、申申如たり、夭夭如たり。","家でくつろぐ時の孔子は、のびやかで和やかだった。","仕事を離れた時間に、心からくつろげているか。",["self"],["疲れ"],1,"先師が家にくつろいでいられる時は、いつものびのびとして、うれしそうな顔をしていられた。",[]],[152,6,5,"子曰：「甚矣，吾衰也！久矣，吾不復夢見周公！」","子曰く、甚だしいかな、吾が衰えたるや。久しいかな、吾復た夢に周公を見ず。","理想の人を夢に見なくなった。孔子でさえ衰えを嘆いた。","かつて夢に見るほど憧れた理想を、最近思い出しているか。",["vision"],["落胆","疲れ"],1,"先師がいわれた。――\n「私もずいぶん老衰したものだ。このごろはさっぱり周公の夢も見なくなってしまった。」",[]],[153,6,6,"子曰：『志於道，據於徳，依於仁，游於芸。』","子曰く、道に志し、徳に拠り、仁に依り、芸に游ぶ。","道を志し、徳を足場に、仁に寄り添い、教養に遊ぶ。","志・足場・思いやり・遊び。いま欠けているのはどれか。",["vision","self"],["迷い"],2,"先師がいわれた。――\n「常に志を人倫の道に向けていたい。体得した徳を堅確に守りつづけたい。行うところを仁に合致せしめたい。そして楽しみを六芸に求めたい。」",["gi","jin"]],[154,6,7,"子曰：「自行束脩以上，吾未嘗無誨焉。」","子曰く、束脩を行うより以上は、吾未だ嘗て誨うること無くんばあらず。","礼を尽くして学びに来た者には、誰であれ必ず教えた。","教えを求めて来た人を、相手によって選り好みしていないか。",["grow"],[],1,"先師がいわれた。――\n「かりそめにも束脩をおさめて教えを乞うて来たからには、私はその人をなまけさしてはおかない。」",["chi"]],[155,6,8,"子曰：「不憤不啟；不悱不発。挙一隅，不以三隅反，則不復也。」","子曰く、憤せずんば啓せず、悱せずんば発せず。一隅を挙げて之に示し、三隅を以て反らざれば、則ち復たせざるなり。","自分で考え抜いて悶える者にだけ、手を貸す。先回りして教えない。","部下が自分で悩み抜く前に、答えを渡してしまっていないか。",["grow"],["焦り"],3,"先師がいわれた。――\n「私は、教えを乞う者が、先ず自分で道理を考え、その理解に苦しんで歯がみをするほどにならなければ、解決の糸口をつけてやらない。また、説明に苦しんで口をゆがめるほどにならなければ、表現の手引を与えてやらない。むろん私は、道理の一隅ぐらいは示してやることもある。しかし、その一隅から、あとの三隅を自分で研究するようでなくては、二度とくりかえして教えようとは思わない。」",["chi"]],[156,6,9,"子食於有喪者之側，未嘗飽也。子於是日哭，則不歌。","子、喪有る者の側に食すれば、未だ嘗て飽かざるなり。子、是の日に於いて哭すれば、則ち歌わず。","喪中の人のそばでは満腹まで食べず、弔問した日は歌わなかった。","",[],[],0,"先師は、喪中の人と同席して食事をされるときには、腹一ぱい召しあがることがなかった。先師は、人の死を弔われたその日には、歌をうたわれることがなかった。",["jin","rei"]],[157,6,10,"子謂顔淵曰：「用之則行，舎之則蔵。惟我与爾有是夫！」子路曰：「子行三軍，則誰与？」子曰：「暴虎馮河，死而無悔者，吾不与也。必也臨事而懼，好謀而成者也。」","子、顔淵に謂いて曰く、之を用うれば則ち行い、之を舎つれば則ち蔵る。唯我と爾と是れ有るかな。子路曰く、子、三軍を行らば、則ち誰と与にせん。子曰く、暴虎馮河し、死して悔い無き者は、吾与にせざるなり。必ずや事に臨みて懼れ、謀を好みて成さん者なり。","用いられれば働き、外されれば退く。組むなら恐れを知り謀る人。","大勝負を共にする相手を、勢いではなく慎重さで選んでいるか。",["decide","judge"],["焦り"],2,"先師が顔渕に向っていわれた。\n「用いられれば、その地位において堂々と道を行うし、用いられなければ、天命に安んじ、退いて静かに独り道を楽む。こういった出処進退が出来るのは、まず私とお前ぐらいなものであろう。」\n　すると子路がはたからいった。――\n「もし一国の軍隊をひきいて、いざ出陣という場合がありましたら、先生は誰をおつれになりましょうか。」\n　先師はこたえられた。――\n「素手で虎を打とうとしたり、徒歩で大河をわたろうとしたりするような、無謀なことをやって、死ぬことを何とも思わない人とは、私は事を共にしたくない。私の参謀には、臆病なぐらい用心深く、周到な計画のもとに確信をもって仕事をやりとげて行くような人がほしいものだ。」",["chi","gi"]],[158,6,11,"子曰：「富而可求也，雖執鞭之士，吾亦為之；如不可求，従吾所好。」","子曰く、富にして求むべくんば、執鞭の士と雖も、吾亦之を為さん。如し求むべからずんば、吾が好む所に従わん。","富が求めて得られるものなら何でもする。違うなら好きな道を行く。","儲かるかどうかを外したとき、それでも選ぶ道はどれか。",["profit","vision"],["迷い"],2,"先師がいわれた。――\n「もし富というものが、人間として進んで求むべきものであるなら、それを得るためには、私は喜んで行列のお先払いでもやろう。だが、それが求むべきものでないなら、私は私の好む道に従って人生をわたりたい。」",["gi"]],[159,6,12,"子之所慎：斉、戦、疾。","子の慎む所は、斉・戦・疾。","孔子が特に慎重に臨んだのは、祭りの斎戒、戦、病の三つ。","絶対に軽く扱ってはならない場面を、自分で決めているか。",["decide"],[],1,"先師が慎んだ上にも慎まれたのは、斎戒と、戦争と、病気の場合であった。",["rei"]],[160,6,13,"子在斉聞韶，三月不知肉味，曰：「不図為楽之至於斯也！」","子、斉に在りて韶を聞く。三月、肉の味を知らず。曰く、図らざりき、楽を為すことの斯に至らんとは。","斉で韶の音楽を聴き、三か月も肉の味を忘れるほど感動した。","",[],[],0,"先師は斉にご滞在中、韶をきかれた。そして三月の間それを楽んで、肉の味もおわかりにならないほどであった。その頃、先師はこういわれた。――\n「これほどのすばらしい音楽があろうとは、思いもかけないことだった。」",[]],[161,6,14,"冉有曰：「夫子為衛君乎？」子貢曰：「諾，吾将問之」。入曰：「伯夷叔斉，何人也？」曰：「古之賢人也。」曰：「怨乎？」曰：「求仁而得仁，又何怨？」出，曰：「夫子不為也。」","冉有曰く、夫子は衛の君を為けんか。子貢曰く、諾、吾将に之を問わんとす。入りて曰く、伯夷・叔斉は何人ぞや。曰く、古の賢人なり。曰く、怨みたるか。曰く、仁を求めて仁を得たり。又何をか怨みん。出でて曰く、夫子は為けざるなり。","筋を通して望んだものを得たなら、失ったものを恨むことはない。","筋を通した結果の損を、いまも悔やんでいないか。",["profit","decide"],["迷い"],1,"冉有がいった。――\n「先生は衛の君を援けられるだろうか。」\n　子貢がいった。――\n「よろしい。私がおたずねして見よう。」\n　彼は先師のお室に入ってたずねた。――\n「伯夷・叔斉はどういう人でございましょう。」\n　先師はこたえられた。――\n「古代の賢人だ。」\n　子貢――\n「二人は自分たちのやったことを、あとで悔んだのでしょうか。」\n　先師――\n「仁を求めて仁を行うことが出来たのだから、何の悔むところがあろう。」\n　子貢は先師のお室からさがって、冉有にいった。――\n「先生は衛の君をお援けにはならない。」",["gi","jin"]],[162,6,15,"子曰：「飯疏食，飲水，曲肱而枕之，楽亦在其中矣。不義而富且貴，於我如浮雲。」","子曰く、疏食を飯い、水を飲み、肱を曲げて之を枕とす。楽しみ亦其の中に在り。不義にして富み且つ貴きは、我に於いて浮雲の如し。","粗食と肘枕の暮らしにも楽しみはある。不義の富は浮き雲と同じ。","筋を曲げて得る利益を、浮き雲だと言い切れるか。",["profit","vision"],["迷い","不安"],3,"先師がいわれた。――\n「玄米飯を冷水でかきこみ、肱を枕にして寝るような貧しい境涯でも、その中に楽みはあるものだ。不義によって得た富や位は、私にとっては浮雲のようなものだ。」",["gi"]],[163,6,16,"子曰：「加我数年，五十以学易，可以無大過矣。」","子曰く、我に数年を加え、五十にして以て易を学べば、以て大過無かるべし。","あと数年学べれば、大きな過ちはなくなる。孔子も学び足りなかった。","この年齢だからこそ、学び直したいことは何か。",["vision","fail"],[],1,"先師がいわれた。――\n「私がもう数年生き永らえて、五十になる頃まで易を学ぶことが出来たら、大きな過ちを犯さない人間になれるだろう。」",["chi"]],[164,6,17,"子所雅言：「詩、書、執礼，皆雅言也。」","子の雅言する所は、詩・書。執礼も皆雅言す。","詩経・書経を読む時と礼を執り行う時、孔子は正しい発音で語った。","",[],[],0,"先師が毎日語られることは、詩・書・執礼の三つである。この三つだけは実際毎日語られる。",["rei"]],[165,6,18,"葉公問孔子於子路，子路不対。子曰：「女奚不曰：『其為人也，発憤忘食，楽以忘憂，不知老之将至云爾。』」","葉公、孔子を子路に問う。子路対えず。子曰く、女奚ぞ曰わざる、其の人と為りや、憤りを発して食を忘れ、楽しみて以て憂いを忘れ、老いの将に至らんとするを知らざるのみと。","夢中になって食事を忘れ、楽しんで憂いを忘れ、老いにも気づかない。","食事も歳も忘れるほど打ち込めるものが、いまあるか。",["vision","lonely"],["疲れ","不安"],3,"葉公が先師のことを子路にたずねた。子路はこたえなかった。先師はそのことを知って、子路にいわれた。――\n「お前はなぜこういわなかったのか。――学問に熱中して食事を忘れ、道を楽んで憂いを忘れ、そろそろ老境に入ろうとするのも知らないような人がらでございます、と。」",["chi"]],[166,6,19,"子曰：「我非生而知之者，好古，敏以求之者也。」","子曰く、我は生まれながらにして之を知る者に非ず。古を好み、敏にして以て之を求めたる者なり。","生まれつき知っていたのではない。好きで、懸命に求めただけだ。","才能のせいにして、求めることを止めていないか。",["vision","grow"],["落胆"],2,"先師がいわれた。――\n「私は生れながらにして人倫の道を知っている者ではない。古聖の道を好み、汲々としてその探求をつづけているまでのことだ。」",["chi"]],[167,6,20,"子不語：怪、力、乱、神。","子、怪・力・乱・神を語らず。","怪異、暴力、背徳、神秘。孔子は不確かで人を惑わす話をしなかった。","不確かな話や刺激の強い噂に、判断を預けていないか。",["decide"],["不安"],1,"先師は、妖怪変化とか、腕力沙汰とか、醜聞とか、超自然の霊とか、そういったことについては、決して話をされなかった。",["chi"]],[168,6,21,"子曰：「三人行，必有我師焉。択其善者而従之，其不善者而改之。」","子曰く、三人行えば、必ず我が師有り。其の善き者を択びて之に従い、其の善からざる者にして之を改む。","誰といても師はいる。良い点は真似、悪い点は自分を直す鏡にする。","苦手なあの人から、自分を直す材料を見つけられるか。",["self","grow","trust"],["慢心","怒り"],3,"先師がいわれた。――\n「三人道連れをすれば、めいめいに二人の先生をもつことになる。善い道連れは手本になってくれるし、悪い道連れは、反省改過の刺戟になってくれる。」",["chi"]],[169,6,22,"子曰：「天生徳於予，桓魋其如予何！」","子曰く、天、徳を予に生せり。桓魋其れ予を如何せん。","天から使命を授かった身だ。敵が自分をどうこうできはしない。","脅かされたとき、自分の使命を信じて立っていられるか。",["fail","lonely"],["不安"],2,"先師がいわれた。――\n「私は天に徳を授かった身だ。桓などが私をどうにも出来るものではない。」",["gi"]],[170,6,23,"子曰：「二三子，以我為隠乎？吾無隠乎爾！吾無行而不与二三子者，是丘也。」","子曰く、二三子、我を以て隠せりと為すか。吾は爾に隠すこと無し。吾行うとして二三子と与にせざる者無し。是れ丘なり。","隠し事は何もない。行いのすべてを弟子と共にする、それが私だ。","社員に見せられない判断や行動を、抱えていないか。",["lead","trust"],[],2,"先師がいわれた。――\n「お前たちは、私の教えに何か秘伝でもあって、それをお前たちにかくしていると思っているのか。私には何もかくすものはない。私は四六時中、お前たちに私の行動を見てもらっているのだ。それが私の教えの全部だ。丘という人間は元来そういう人間なのだ。」",["shin"]],[171,6,24,"子以四教：文、行、忠、信。","子、四を以て教う。文・行・忠・信。","孔子の教えは四つ。学問、実践、誠実、信義。","人を育てるとき、知識だけでなく誠実さと信義を教えているか。",["grow"],[],1,"先師は四つの教育要目を立てて指導された。典籍の研究、生活体験、誠意の涵養、社会的信義がそれである。",["chi","shin"]],[172,6,25,"子曰：「聖人，吾不得而見之矣！得見君子者，斯可矣。」子曰：「善人，吾不得而見之矣！得見有恆者，斯可矣。亡而為有，虚而為盈，約而為泰，難乎有恆矣！」","子曰く、聖人は吾得て之を見ず。君子者を見るを得ば、斯れ可なり。子曰く、善人は吾得て之を見ず。恒有る者を見るを得ば、斯れ可なり。亡くして有りと為し、虚しくして盈てりと為し、約にして泰かなりと為す。難いかな、恒有ること。","完璧な人は望めない。せめてぶれない人を。見栄を張る人は続かない。","無いものを有るように見せて、無理を重ねていないか。",["judge","self"],["慢心"],2,"先師がいわれた。――\n「今の時代に聖人の出現は到底のぞめないので、せめて君子といわれるほどの人に会えたら、私は満足だ。」\n　またいわれた。――\n「今の時代に善人に会える見込は到底ないので、せめてうそのない人にでも会えたら、結構だと思うのだが、それもなかなかむずかしい。無いものをあるように、からっぽなものを充実しているように、また行きづまっていながら気楽そうに見せかけるのが、この頃のはやりだが、そういう人がうそのない人間になるのは、容易なことではないね。」",["shin"]],[173,6,26,"子釣而不綱，弋而不射宿。","子、釣して綱せず。弋して宿を射ず。","釣りはしても網で根こそぎにせず、ねぐらの鳥は射なかった。","取れるからといって、取り尽くそうとしていないか。",["profit"],[],1,"先師は釣りはされたが、綱はつかわれなかった。また矢ぐるみで鳥をとられることはあったが、ねぐらの鳥を射たれることはなかった。",["jin"]],[174,6,27,"子曰：「蓋有不知而作之者，我無是也。多聞，択其善者而従之，多見而識之，知之次也。」","子曰く、蓋し知らずして之を作る者有らん。我は是れ無きなり。多く聞きて其の善き者を択びて之に従い、多く見て之を識すは、知るの次なり。","知らないまま我流でつくらない。多く聞き、多く見て、良いものを選ぶ。","よく知らないまま、思いつきで決めようとしていないか。",["decide","self"],["慢心"],2,"先師がいわれた。――\n「無知で我流の新説を立てる者もあるらしいが、私は絶対にそんなことはしない。私はなるべく多くの人の考えを聞いて取捨選択し、なるべく多く実際を見てそれを心にとめておき、判断の材料にするようにつとめている。むろん、それではまだ真知とはいえないだろう。しかし、それが真知にいたる途なのだ。」",["chi"]],[175,6,28,"互郷難与言。童子見，門人惑。子曰：「与其進也，不与其退也。唯何甚？人潔己以進，与其潔也，不保其往也！」","互郷、与に言い難し。童子見ゆ。門人惑う。子曰く、其の進むに与するなり。其の退くに与せざるなり。唯何ぞ甚だしき。人、己を潔くして以て進まば、其の潔きに与せん。其の往を保せざるなり。","過去や出自で人を退けない。身を正して来た今の姿勢を受け入れる。","過去の印象だけで、変わろうとしている人を退けていないか。",["judge","grow"],[],2,"互郷という村の人たちは、お話にならないほど風俗が悪かった。ところがその村の一少年が先師に入門をお願いして許されたので、門人たちは先師の真意を疑った。すると、先師はいわれた。――\n「せっかく道を求めてやって来たのだから、喜んで迎えてやって、退かないようにしてやりたいものだ。お前たちのように、そうむごいことをいうものではない。いったい、人が自分の身を清くしようと思って一歩前進して来たら、その清くしようとする気持を汲んでやればいいので、過去のことをいつまでも気にする必要はないのだ。」",["jin"]],[176,6,29,"子曰：「仁遠乎哉？我欲仁，斯仁至矣。」","子曰く、仁遠からんや。我仁を欲すれば、斯に仁至る。","仁は遠くにあるものではない。自分が求めれば、すぐそこに来る。","理想を遠いものと決めつけて、今日の一歩を先送りしていないか。",["vision","self"],["迷い","落胆"],3,"先師がいわれた。――\n「仁というものは、そう遠くにあるものではない。切実に仁を求める人には、仁は刻下に実現されるのだ。」",["jin"]],[177,6,30,"陳司敗問：「昭公知礼乎？」孔子対曰：「知礼。」孔子退，揖巫馬期而進之，曰：「吾聞君子不党，君子亦党乎？君取於吳為同姓，謂之吳孟子。君而知礼，孰不知礼？」巫馬期以吿。子曰：「丘也幸，苟有過，人必知之。」","陳の司敗問う、昭公は礼を知れるか。孔子対えて曰く、礼を知れり。孔子退く。巫馬期を揖して之を進めて曰く、吾聞く、君子は党せずと。君子も亦党するか。君、呉に取れり。同姓なるが為に、之を呉孟子と謂う。君にして礼を知らば、孰か礼を知らざらん。巫馬期以て告ぐ。子曰く、丘や幸いなり。苟くも過ち有れば、人必ず之を知る。","過ちがあれば誰かが必ず気づいてくれる。それは幸せなことだ。","自分の誤りを指摘されたとき、幸いだと受け止められるか。",["fail","trust"],["怒り"],2,"陳の司敗がたずねた。――\n「昭公は礼を知っておられましょうか。」\n　先師がこたえられた。――\n「知っておられます。」\n　先師はそれだけいって退かれた。そのあと司敗は巫馬期に会釈し、彼を自分の身近かに招いていった。――。\n「私は、君子というものは仲間ぼめはしないものだと聞いていますが、やはり君子にもそれがありましょうか。と申しますのは、昭公は呉から妃を迎えられ、その方がご自分と同性なために、ごまかして呉孟子と呼んでおられるのです。もしそれでも昭公が礼を知った方だといえますなら、世の中に誰か礼を知らないものがありましょう。」\n　巫馬期があとでそのことを先師に告げると、先師はいわれた。――\n「私は幸福だ。少しでも過ちがあると、人は必ずそれに気づいてくれる。」",["rei"]],[178,6,31,"子与人歌而善，必使反之，而後和之。","子、人と歌いて善ければ、必ず之を反さしめて、而る後に之に和す。","人の歌が良ければ、必ずもう一度歌ってもらい、それから唱和した。","人の良さに出会ったとき、まずじっくり聴いて学んでいるか。",["self"],[],1,"先師は、誰かといっしょに歌をうたわれる場合、相手がすぐれた歌い手だと、必ずその相手にくりかえし歌わせてから、合唱された。",["rei"]],[179,6,32,"子曰：「文，莫吾猶人也；躬行君子，則吾未之有得！」","子曰く、文は吾猶お人のごとくなること莫からんや。躬、君子を行うことは、則ち吾未だ之を得ること有らず。","知識は人並みにある。だが身をもって行うことは、まだできていない。","語っていることと、実際にやっていることの差はどこにあるか。",["self"],["慢心"],2,"先師がいわれた。――\n「典籍の研究は、私も人なみに出来ると思う。しかし、君子の行を実践することは、まだなかなかだ。」",["shin"]],[180,6,33,"子曰：「若聖与仁，則吾豈敢？抑為之不厭，誨人不倦，則可謂云爾已矣！」公西華曰：「正唯弟子不能学也！」","子曰く、聖と仁との若きは、則ち吾豈に敢えてせんや。抑も之を為して厭わず、人を誨えて倦まざるは、則ち謂うべきのみ。公西華曰く、正に唯弟子学ぶ能わざるなり。","聖人ではない。ただ飽きずに努め、倦まずに教える。それが難しい。","完成を誇るより、飽きずに続けることを誇れるか。",["vision","grow"],["疲れ"],2,"先師がいわれた。――\n「聖とか仁とかいうほどの徳は、私には及びもつかないことだ。ただ私は、その境地を目ざして厭くことなく努力している。また私の体験をとおして倦むことなく教えている。それだけが私の身上だ。」\n　すると、公西華がいった。――\n「それだけと仰しゃいますが、そのそれだけが私たち門人には出来ないことでございます。」",["chi"]],[181,6,34,"子疾病，子路請禱。子曰：「有諸？」子路対曰：「有之。誄曰：『禱爾于上下神祇。』子曰：「丘之禱久矣！」","子の疾、病なり。子路、禱らんことを請う。子曰く、諸有りや。子路対えて曰く、之有り。誄に曰く、爾を上下の神祇に禱ると。子曰く、丘の禱るや久し。","日々の生き方そのものが祈りだ。病の床で改めて祈ることはない。","いざという時に慌てずに済む日々を、送れているか。",["fail"],["不安"],1,"先師のご病気が重かった。子路が病気平癒のお祷りをしたいとお願いした。すると先師がいわれた。――\n「そういうことをしてもいいものかね。」\n　子路がこたえた。――\n「よろしいと思います。誄に、汝の幸いを天地の神々に祷る、という言葉がございますから。」\n　すると、先師がいわれた。――\n「そういう祷りなら、私はもう久しい間祷っているのだ。」",["shin"]],[182,6,35,"子曰：「奢則不孫，儉則固；与其不孫也，甯固。」","子曰く、奢なれば則ち不孫、倹なれば則ち固し。其の不孫ならんよりは、寧ろ固しかれ。","贅沢は傲慢に、倹約は頑なになりやすい。傲慢よりは頑なの方がよい。","羽振りが良くなって、態度まで大きくなっていないか。",["self","profit"],["慢心"],2,"先師がいわれた。――\n「ぜいたくな人は不遜になりがちだし、儉約な人は窮屈になりがちだが、どちらを選ぶかというと、不遜であるよりは、まだしも窮屈な方がいい。」",["rei"]],[183,6,36,"子曰：「君子坦蕩蕩，小人長戚戚。」","子曰く、君子は坦として蕩蕩たり。小人は長えに戚戚たり。","君子の心は平らかで広い。小人はいつも何かに怯えくよくよする。","いま心を縮こまらせているものは、本当に恐れるべきことか。",["self"],["不安","焦り"],3,"先師がいわれた。――\n「君子は気持がいつも平和でのびのびとしている。小人はいつもびくびくして何かにおびえている。」",["shin"]],[184,6,37,"子温而厲，威而不猛，恭而安。","子は温にして厲し。威にして猛からず。恭にして安し。","温かいが厳しく、威厳はあるが荒々しくなく、恭しいが窮屈でない。","優しさと厳しさ、自分はどちらに偏っているか。",["lead","self"],[],2,"先師は、温かで、しかもきびしい方であった。威厳があって、しかもおそろしくない方であった。うやうやしくて、しかも安らかな方であった。\n［＃改ページ］",["rei"]],[185,7,1,"子曰：「泰伯，其可謂至徳也已矣！三以天下譲，民無得而称焉。」","子曰く、泰伯は其れ至徳と謂うべきのみ。三たび天下を以て譲る。民得て称すること無し。","泰伯は天下を三度譲り、人々が称えようもないほど跡を残さなかった。","",[],[],0,"先師がいわれた。――\n「泰伯こそは至徳の人というべきであろう。固辞して位をつがず、三たび天下を譲ったが、人民にはそうした事実をさえ知らせなかった。」",["rei"]],[186,7,2,"子曰：「恭而無礼則労，慎而無礼則葸，勇而無礼則乱，直而無礼則絞。君子篤於親，則民興於仁。故旧不遺，則民不偷。」","子曰く、恭にして礼無ければ則ち労す。慎にして礼無ければ則ち葸す。勇にして礼無ければ則ち乱る。直にして礼無ければ則ち絞す。君子、親に篤ければ、則ち民仁に興る。故旧遺れざれば、則ち民偸からず。","丁寧さも慎重さも勇気も率直さも、節度を欠けば害になる。","自分の長所が、度を越して人を苦しめていないか。",["self","lead","trust"],[],2,"先師がいわれた。――\n「恭敬なのはよいが、それが礼にかなわないと窮屈になる。慎重なのはよいが、それが礼にかなわないと臆病になる。勇敢なのはよいが、それが礼にかなわないと、不逞になる。剛直なのはよいが、それが礼にかなわないと苛酷になる。」\n　またいわれた。――\n「上に立つ者が親族に懇篤であれば、人民はおのずから仁心を刺戟される。上に立つ者が故旧を忘れなければ、人民はおのずから浮薄の風に遠ざかる。」",["rei"]],[187,7,3,"曽子有疾，召門弟子曰：「啟予足！啟予手！詩云：『戦戦兢兢，如臨深淵，如履薄冰。』而今而後，吾知免夫！小子！」","曾子、疾有り。門弟子を召びて曰く、予が足を啓け、予が手を啓け。詩に云う、戦戦兢兢として、深淵に臨むが如く、薄氷を履むが如しと。而今よりして後、吾免るるを知るかな、小子。","薄氷を踏む思いで身を慎み通した。最期にやっとその務めを終える。","預かったものを、最後まで傷つけずに渡しきる覚悟があるか。",["self"],["不安"],1,"曾先生が病気の時に、門人たちを枕頭に呼んでいわれた。――\n「私の足を出して見るがいい。私の手を出して見るがいい。詩経に、\n深渕にのぞむごと、\nおののくこころ。\nうす氷ふむがごと、\nつつしむこころ。\nとあるが、もう私も安心だ。永い間、おそれつつしんで、この身をけがさないように、どうやら護りおおせて来たが、これで死ねば、もうその心労もなくなるだろう。ありがたいことだ。そうではないかね、みんな。」",["jin","rei"]],[188,7,4,"曽子有疾，孟敬子問之。曽子言曰：「鳥之将死，其鳴也哀，人之将死，其言也善。君子所貴乎道者三：動容貌，斯遠暴慢矣；正顔色，斯近信矣；出辞気，斯遠鄙倍矣；籩豆之事，則有司存。」","曾子、疾有り。孟敬子之を問う。曾子言いて曰く、鳥の将に死せんとするや、其の鳴くこと哀し。人の将に死せんとするや、其の言うこと善し。君子の道に貴ぶ所の者は三。容貌を動かしては、斯に暴慢に遠ざかる。顔色を正しては、斯に信に近づく。辞気を出だしては、斯に鄙倍に遠ざかる。籩豆の事は、則ち有司存す。","上に立つ者が大切にすべきは態度・表情・言葉。細かな実務は任せる。","細部に口を出すより、自分の態度と表情と言葉を整えているか。",["lead","self","grow"],[],2,"曾先生が病床にあられた時、大夫の孟敬子が見舞に行った。すると、曾先生がいわれた。――\n「鳥は死ぬまえに悲しげな声で鳴き、人は死ぬまえに善言を吐く、と申します。これから私の申上げますことは、私の最後の言葉でございますから、よくおきき下さい。およそ為政家が自分の道として大切にしなければならないことが三つあります。その第一は態度をつつしんで粗暴怠慢にならないこと、その第二は顔色を正しくして信実の気持があふれること、その第三は、言葉を叮重にして野卑不合理にならないこと、これであります。祭典のお供物台の並べ方などのこまかな技術上のことは、それぞれ係の役人がおりますし、一々お気にかけられなくともよいことでございます。」",["rei"]],[189,7,5,"曽子曰：「以能問於不能，以多問於寡，有若無，実若虚，犯而不校。昔者吾友，嘗従事於斯矣。」","曾子曰く、能を以て不能に問い、多きを以て寡なきに問い、有れども無きが若く、実つれども虚しきが若く、犯さるるも校いず。昔者、吾が友、嘗て斯に従事せり。","できる人ほど人に尋ね、満ちていても空のように謙虚で、張り合わない。","自分より経験の浅い人に、素直に尋ねることができるか。",["self","trust"],["慢心","怒り"],2,"曾先生がいわれた。――\n「有能にして無能な人に教えを乞い、多知にして少知の人にものをたずね、有っても無きが如く内に省み、充実していても空虚なるが如く人にへり下り、無法をいいかけられても相手になって曲直を争わない。そういうことの出来た人がかって私の友人にあったのだが。」",["rei"]],[190,7,6,"曽子曰：「可以託六尺之孤，可以寄百里之命，臨大節而不可奪也。君子人与？君子人也！」","曾子曰く、以て六尺の孤を託すべく、以て百里の命を寄すべく、大節に臨みて奪うべからず。君子人か、君子人なり。","幼い主君も国の命運も託せて、大事の場で節を曲げない人が君子。","会社の命運を預けても揺るがない人が、そばにいるか。",["judge","grow"],[],2,"曾先生がいわれた。――\n「安んじて幼君の補佐を頼み、国政を任せることが出来、重大事に臨んで断じて節操を曲げない人、かような人を君子人というのであろうか。正にかような人をこそ君子人というべきであろう。」",["shin","gi"]],[191,7,7,"曽子曰：「士不可以不弘毅，任重而道遠。仁以為己任，不亦重乎；死而後已，不亦遠乎。」","曾子曰く、士は以て弘毅ならざるべからず。任重くして道遠し。仁以て己が任と為す、亦重からずや。死して後已む、亦遠からずや。","志ある者は広く強くあれ。荷は重く道は遠い。死ぬまで続く道だから。","この重さと遠さを承知のうえで、それでも担ぎたい荷は何か。",["vision","fail","lonely"],["疲れ","落胆"],3,"曾先生がいわれた。――\n「道を行おうとする君は大器で強靭な意志の持主でなければならない。任務が重大でしかも前途遼遠だからだ。仁をもって自分の任務とする、何と重いではないか。死にいたるまでその任務はつづく、何と遠いではないか。」",["gi","jin"]],[192,7,8,"子曰：「興於詩，立於礼，成於楽。」","子曰く、詩に興り、礼に立ち、楽に成る。","人は詩で心を奮い立たせ、礼で自立し、音楽で完成する。","人を育てるとき、感性・規律・調和の順を踏んでいるか。",["grow"],[],1,"先師がいわれた。――\n「詩によって情意を刺戟し、礼によって行動に基準を与え、楽によって生活を完成する。これが修徳の道程だ。」",["rei","chi"]],[193,7,9,"子曰：「民可使由之，不可使知之。」","子曰く、民は之に由らしむべし。之を知らしむべからず。","人々を従わせることはできても、理由まで理解させるのは難しい。","説明で分かってもらえないとき、行動で示せているか。",["lead"],[],1,"先師がいわれた。――\n「民衆というものは、範を示してそれに由らせることは出来るが、道理を示してそれを理解させることはむずかしいものだ。」",["shin"]],[194,7,10,"子曰：「好勇疾貧，乱也。人而不仁，疾之已甚，乱也。」","子曰く、勇を好みて貧しきを疾むは、乱す。人にして不仁なる、之を疾むこと已甚だしければ、乱す。","血気盛んで不遇を恨む者は乱を起こす。悪人も追い詰めすぎれば同じ。","相手が悪いとしても、逃げ場がなくなるまで責めていないか。",["trust","lead"],["怒り"],2,"先師がいわれた。――\n「社会秩序の破壊は、勇を好んで貧に苦しむ者によってひき起されがちなものである。しかしまた、道にはずれた人を憎み過ぎることによってひき起されることも、忘れてはならない。」",["gi","jin"]],[195,7,11,"子曰：「如有周公之才之美，使驕且吝，其余不足観也已！」","子曰く、如し周公の才の美有りとも、驕り且つ吝かならしめば、其の余は観るに足らざるのみ。","どれほど才能があっても、驕って出し惜しみするなら見る価値はない。","実績を盾に、驕りや出し惜しみが出ていないか。",["self","judge"],["慢心"],2,"先師がいわれた。――\n「かりに周公ほどの完璧な才能がそなわっていても、その才能にほこり、他人の長所を認めないような人であるならば、もう見どころのない人物だ。」",["rei"]],[196,7,12,"子曰：「三年学，不至於穀，不易得也。」","子曰く、三年学びて、穀に至らざるは、得易からざるなり。","三年学んでも報酬や地位を目当てにしない人は、なかなかいない。","見返りを急がずに学び続ける人を、見つけて大事にしているか。",["judge","vision"],[],1,"先師がいわれた。――\n「三年も学問をして、俸祿に野心のない人は得がたい人物だ。」",["chi"]],[197,7,13,"子曰：「篤信好学，守死善道。危邦不入，乱邦不居。天下有道則見，無道則隠。邦有道，貧且賎焉，恥也；邦無道，富且貴焉，恥也。」","子曰く、篤く信じて学を好み、死を守りて道を善くす。危邦には入らず、乱邦には居らず。天下道有れば則ち見れ、道無ければ則ち隠る。邦に道有るに、貧しくして且つ賤しきは、恥なり。邦に道無きに、富み且つ貴きは、恥なり。","信じて学び、命がけで道を守る。乱れた場からは退く。不正な世での富は恥。","筋の通らない場所で得ている利益や地位はないか。",["decide","profit"],["迷い"],2,"先師がいわれた。――\n「篤く信じて学問を愛せよ。生死をかけて道を育てよ。乱れるきざしのある国には入らぬがよい。すでに乱れた国には止まらぬがよい。天下に道が行われている時には、出でて働け。道がすたれている時には、退いて身を守れ。国に道が行われていて、貧賎であるのは恥だ。国に道が行われないで、富貴であるのも恥だ。」",["gi","shin"]],[198,7,14,"子曰：「不在其位，不謀其政。」","子曰く、其の位に在らざれば、其の政を謀らず。","その立場にいないなら、その仕事に口を出さない。","任せたはずの仕事に、つい口を挟んでいないか。",["grow","lead"],[],2,"先師がいわれた。――\n「その地位にいなくて、みだりにその職務のことに口出しすべきではない。」",["rei"]],[199,7,15,"子曰：「師摯之始，関雎之乱，洋洋乎，盈耳哉！」","子曰く、師摯の始め、関雎の乱りは、洋洋乎として耳に盈てるかな。","楽師の摯が奏でた関雎の終章は、豊かに耳に満ちあふれた。","",[],[],0,"先師がいわれた。――\n「楽師の摯がはじめて演奏した時にきいた関雎の終曲は、洋々として耳にみちあふれる感があったのだが――」",[]],[200,7,16,"子曰：「狂而不直，侗而不愿，悾悾而不信，吾不知之矣！」","子曰く、狂にして直ならず、侗にして愿ならず、悾悾として信ならずんば、吾之を知らず。","短所にはふつう裏返しの長所がある。それすらない人は手に負えない。","人の短所の裏にある長所を、見ようとしているか。",["judge"],[],1,"先師がいわれた。――\n「熱狂的な人は正直なものだが、その正直さがなく、無知な人は律義なものだが、その律儀さがなく、才能のない人は信実なものだが、その信実さがないとすれば、もう全く手がつけられない。」",["shin"]],[201,7,17,"子曰：「学如不及，猶恐失之。」","子曰く、学は及ばざるが如くするも、猶お之を失わんことを恐る。","追いつけないつもりで学び、それでも取り逃がすことを恐れる。","もう十分学んだと、どこかで思っていないか。",["vision","self"],["慢心"],2,"先師がいわれた。――\n「学問は追いかけて逃がすまいとするような気持でやっても、なお取りにがすおそれがあるものだ。」",["chi"]],[202,7,18,"子曰：「巍巍乎，舜、禹之有天下也，而不与焉。」","子曰く、巍巍乎たり、舜・禹の天下を有つや。而して与らず。","舜と禹は天下を治めながら、それを我がものとせず執着しなかった。","会社を自分の持ち物のように扱っていないか。",["lead","grow"],[],1,"先師がいわれた。――\n「何という荘厳さだろう、舜帝と禹王が天下を治められたすがたは。しかも両者共に政治には何のかかわりもないかのようにしていられたのだ。」",["rei"]],[203,7,19,"子曰：「大哉，堯之為君也！巍巍乎，唯天為大，唯堯則之！蕩蕩乎，民無能名焉！巍巍乎，其有成功也！煥乎，其有文章！」","子曰く、大なるかな、堯の君たるや。巍巍乎として、唯天を大なりと為す。唯堯之に則る。蕩蕩乎として、民能く名づくること無し。巍巍乎として、其れ成功有り。煥乎として、其れ文章有り。","堯は天にならった偉大な君主で、その徳は広大すぎて形容できない。","",[],[],0,"先師がいわれた。――\n「堯帝の君徳は何と大きく、何と荘厳なことであろう。世に真に偉大なものは天のみであるが、ひとり堯帝は天とその偉大さを共にしている。その徳の広大無辺さは何と形容してよいかわからない。人はただその功業の荘厳さと文物制度の燦然たるとに眼を見はるのみである。」",["shin"]],[204,7,20,"舜有臣五人，而天下治。武王曰：「予有乱臣十人。」孔子曰：「『才難』，不其然乎？唐虞之際，於斯為盛，有婦人焉，九人而已。三分天下有其二，以服事殷、周之徳，其可謂至徳也已矣！」","舜に臣五人有りて、天下治まる。武王曰く、予に乱臣十人有り。孔子曰く、才難しと。其れ然らずや。唐虞の際、斯に於いて盛んと為す。婦人有り、九人のみ。天下を三分して其の二を有ち、以て殷に服事す。周の徳は、其れ至徳と謂うべきのみ。","人材は得がたい。名君の時代でさえ、柱となる臣は数人だった。","本当に頼れる数人を、見極めて大切にしているか。",["judge"],[],1,"舜帝には五人の重臣があって天下が治った。周の武王は、自分には乱を治める重臣が十人あるといった。それに関連して先師がいわれた。――\n「人材は得がたいという言葉があるが、それは真実だ。唐・虞の時代をのぞいて、それ以後では、周が最も人材に富んだ時代であるが、それでも十人に過ぎず、しかもその十人の中一人は婦人で、男子の賢臣は僅かに九人にすぎなかった。」\n　またいわれた。――\n「しかし、わずかの人材でも、その有る無しでは大変なちがいである。周の文王は天下を三分してその二を支配下におさめていられたが、それでも殷に臣事して秩序をやぶられなかった。文王時代の周の徳は至徳というべきであろう。」",[]],[205,7,21,"子曰：「禹，吾無間然矣！菲飲食，而致孝乎鬼神；悪衣服，而致美乎黻冕；卑宮室，而尽力乎溝洫。禹，吾無間然矣！」","子曰く、禹は吾間然すること無し。飲食を菲くして、孝を鬼神に致し、衣服を悪しくして、美を黻冕に致し、宮室を卑くして、力を溝洫に尽くす。禹は吾間然すること無し。","禹は自分の衣食住を質素にし、祭祀と治水には力を惜しまなかった。","自分への支出と、事業や人への投資の釣り合いは取れているか。",["profit","lead"],[],1,"先師がいわれた。――\n「禹は王者として完全無欠だ。自分の飲食をうすくしてあつく農耕の神を祭り、自分の衣服を粗末にして祭服を美しくし、自分の宮室を質素にして灌漑水路に力をつくした。禹は王者として完全無欠だ。」\n［＃改ページ］",["rei"]],[206,8,1,"子罕言利与命与仁。","子、罕に利を言う、命と仁と。","孔子は儲け話をめったにせず、語るときは天命や仁と結びつけた。","利益の話をするとき、その先にある筋まで語れているか。",["profit"],[],1,"先師はめったに利益の問題にはふれられな
