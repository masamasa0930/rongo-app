内に在らんことを。","補佐役は止められないなら退け。憂うべきは外の敵でなく、内側の不公平と不安。","外に敵を探す前に、社内の不公平や不安に手を打っているか。",["lead","decide","trust"],["不安","迷い"],2,"季氏が魯の保護国叟を討伐しようとした。季氏に仕えていた冉有と季路とが先師にまみえていった。――\n「季氏が叟に対して事を起そうとしています。」\n　先師がいわれた。――\n「求よ、もしそうだとしたら、それはお前がわるいのではないのかね。いったい叟という国は、昔、周王が東蒙山の近くに領地を与えてその山の祭祀をお命じになった国なのだ。それに、今では魯の支配下にはいっていて、その領主は明らかに魯の臣下だ。同じく魯の臣下たる季氏が勝手に討伐など出来る国ではないだろう。」\n　冉有がいった。――\n「主人がやりたがって困るのです。私共は二人とも決して賛成しているわけではありませんが……」\n　先師がいわれた。――\n「求よ、昔、周任という人は『力のかぎりをつくして任務にあたり、任務が果せなければその地位を退け。盲人がつまずいた時に支えてやることが出来ず、ころんだ時にたすけ起すことが出来なければ、手引きはあっても無いに等しい』といっているが、全くその通りだ。お前のいうことは、いかにもなさけない。もしも虎や野牛が檻から逃げ出したとしたら、それはいったい誰の責任だ。また亀甲や宝石が箱の中でこわれていたとしたら、それはいったい誰の罪だ。よく考えて見るがいい。」\n　冉有がいった。――\n「仰しゃることはごもっともですが、しかし現在の叟は、要害堅固で、季氏の領地の費にも近いところでございますし、今のうちに始末をしておきませんと、将来、子孫の心配の種になりそうにも思えますので……」\n　先師がいわれた。――\n「求、君子というものは、自分の本心を率直にいわないで、あれこれと言葉をかざるのをにくむものだ。私はこういうことを聞いたことがある。諸侯や大夫たる者はその領内の人民の貧しいのを憂えず、富の不平均になるのを憂え、人民の少いのを憂えず、人心の安定しないのを憂えるというのだ。私の考えるところでは、富が平均すれば貧しいこともなく、人心がやわらげば人民がへることもない。そして人心が安定すれば国が傾くこともないだろう。かようなわけだから、もし遠い土地の人民が帰服しなければ、文教徳化をさかんにして自然に慕って来るようにするがいいし、すでに帰服して来たものは安んじて生を楽むようにしてやるがいい。今、きいていると、由も求も、季氏を輔佐していながら、遠い土地の人民を帰服させることが出来ず、国内を四分五裂させて、その収拾がつかず、しかも領内に兵を動かして動乱をひきおこそうと策謀している。もっての外だ。私は、季孫の憂いの種は、実は叟にはなくて垣根のうちにあると思うがどうだ。」",["gi","jin"]],[422,15,2,"孔子曰：「天下有道，則礼楽征伐自天子出；天下無道，則礼楽征伐自諸侯出。自諸侯出，蓋十世希不失矣；自大夫出，五世希不失矣；陪臣執国命，三世希不失矣。天下有道，則政不在大夫。天下有道，則庶人不議。」","孔子曰く、天下道有れば、則ち礼楽征伐、天子より出ず。天下道無ければ、則ち礼楽征伐、諸侯より出ず。諸侯より出ずれば、蓋し十世にして失わざること希なり。大夫より出ずれば、五世にして失わざること希なり。陪臣国命を執れば、三世にして失わざること希なり。天下道有れば、則ち政は大夫に在らず。天下道有れば、則ち庶人議せず。","決定権が本来の場所から下へ流れるほど、その体制は短命に終わる。","重要な決定が、責任を負わない人の手で下されていないか。",["lead"],[],1,"先師がいわれた。――\n「天下に道が行われている時には、文武の政令がすべて天子から出る。天下に道が行われていない時には、文武の政令が諸侯から出る。政令が諸侯から出るようになれば、おそらくその政権が十代とつづくことはまれであろう。政令が大夫から出るようになれば、五代とつづくことはまれであろう。更に陪臣が国政の実権を握るようになれば、三代とつづくことはまれであろう。天下に道が行われておれば、政権が大夫の手にうつるようなことはない。天下に道が行われておれば、庶民が政治を論議することもない。」",["rei"]],[423,15,3,"孔子曰：「禄之去公室，五世矣。政逮於大夫，四世矣。故夫三桓之子孫，微矣。」","孔子曰く、禄の公室を去ること五世なり。政の大夫に逮ぶこと四世なり。故に夫の三桓の子孫は微なり。","魯の実権が公室を離れて久しく、奪った三桓の子孫も衰えたという時評。","",[],[],0,"先師がいわれた。――\n「国庫の収入が魯の公室をはなれてから五代になる。政権が大夫の手に握られてから四代になる。従って三桓の子孫が衰微して来たのも当然である。」",[]],[424,15,4,"孔子曰：「益者三友，損者三友：友直，友諒，友多聞，益矣；友便辟，友善柔，友便佞，損矣。」","孔子曰く、益者三友、損者三友。直きを友とし、諒を友とし、多聞を友とするは、益なり。便辟を友とし、善柔を友とし、便佞を友とするは、損なり。","率直な人、誠実な人、博識な人と付き合う。体裁屋、迎合者、口達者は遠ざける。","耳の痛いことを言ってくれる人を、身近に何人置いているか。",["judge","trust","lonely"],["孤独","慢心"],3,"先師がいわれた。――\n「益友に三種、損友に三種ある。直言する人、信実な人、多識な人、これが益友である。形式家、盲従者、口上手、これが損友である。」",["shin","chi"]],[425,15,5,"孔子曰：「益者三楽，損者三楽：楽節礼楽，楽道人之善，楽多賢友，益矣；楽驕楽，楽佚遊，楽宴楽，損矣。」","孔子曰く、益者三楽、損者三楽。礼楽を節するを楽しみ、人の善を道うを楽しみ、賢友多きを楽しむは、益なり。驕楽を楽しみ、佚遊を楽しみ、宴楽を楽しむは、損なり。","節度、人の長所を語ること、賢い友を楽しむ。驕り・怠惰・酒宴の楽しみは身を損なう。","最近、人の良いところを誰かに話したのはいつだろうか。",["self"],["慢心","疲れ"],2,"先師がいわれた。――\n「有益な楽しみが三つ、有害な楽しみが三つある。礼楽の節度を楽しみ、人の善をいうことを楽しみ、賢友の多いのを楽しむのは有益である。驕慢を楽しみ、遊隋を［＃「遊隋を」はママ］楽しみ、酒色を楽しむのは有害である。」",["rei"]],[426,15,6,"孔子曰：「侍於君子有三愆：言未及之而言，謂之躁；言及之而不言，謂之隠；未見顔色而言，謂之瞽。」","孔子曰く、君子に侍するに三愆有り。言未だ之に及ばずして言う、之を躁と謂う。言之に及びて言わざる、之を隠と謂う。未だ顔色を見ずして言う、之を瞽と謂う。","早すぎる発言、言うべき時の沈黙、相手の様子を見ない発言。この三つが話し方の過ち。","あの行き違いは、内容ではなく言うタイミングの問題ではなかったか。",["trust","self"],["焦り"],2,"先師がいわれた。――\n「君子のそばにいて犯しやすい過ちが三つある。まだ口をきくべき時でないのに口をきく、これは軽はずみというものだ。口をきくべき時に口をきかない、これはかくすというものだ。顔色を見、気持を察することなしに口をきく、これは向う見ずというものだ。」",["rei"]],[427,15,7,"孔子曰：「君子有三戒：少之時，血気未定，戒之在色；及其壮也，血気方剛，戒之在鬭；及其老也，血気既衰，戒之在得。」","孔子曰く、君子に三戒有り。少き時は、血気未だ定まらず、之を戒むること色に在り。其の壮なるに及びてや、血気方に剛なり、之を戒むること闘に在り。其の老ゆるに及びてや、血気既に衰う、之を戒むること得に在り。","若い時は色欲、働き盛りは争い、老いてからは欲深さを戒める。","いまの年齢の自分が、いちばん警戒すべき欲は何だろうか。",["self","profit"],["怒り","慢心"],2,"先師がいわれた。――\n「君子に戒むべきことが三つある。青年時代の血気がまだ定まらないころに戒むべきは性慾である。壮年時代の血気が最も盛んなころに戒むべきは闘争である。老年時代の血気がおとろえるころに戒むべきは利慾である。」",["rei"]],[428,15,8,"孔子曰：「君子有三畏：畏天命，畏大人，畏聖人之言。小人不知天命而不畏也，狎大人，侮聖人之言。」","孔子曰く、君子に三畏有り。天命を畏れ、大人を畏れ、聖人の言を畏る。小人は天命を知らずして畏れざるなり。大人に狎れ、聖人の言を侮る。","できた人は天命、優れた人、聖人の言葉を畏れる。小さな人は何も畏れない。","自分には、畏れ敬うものがまだ残っているだろうか。",["self","vision"],["慢心"],2,"先師がいわれた。――\n「君子には三つの畏れがある。天命を畏れ、長上を畏れ、聖人の言葉を畏れるのである。小人は天命を感知しないのでそれを畏れない。そして長上に猥れ、聖人の言葉をあなどる。」",["rei"]],[429,15,9,"孔子曰：「生而知之者，上也；学而知之者，次也；困而学之，又其次也。困而不学，民斯為下矣！」","孔子曰く、生まれながらにして之を知る者は上なり。学びて之を知る者は次なり。困しみて之を学ぶは、又其の次なり。困しみて学ばざる、民斯れを下と為す。","行き詰まってから学ぶのでもよい。行き詰まっても学ばないのが最も下だ。","いまの行き詰まりを、何を学ぶきっかけにできるだろうか。",["fail","vision","grow"],["落胆"],2,"先師がいわれた。\n「生れながらにして自然に知るものは上の人である。学んで容易に知るものはその次である。才足らず苦しんで学ぶものは、またその次である。才足らざるに苦しんで学ぶことさえしないもの、これが下の人で、いかんともしがたい。」",["chi"]],[430,15,10,"孔子曰：「君子有九思：視思明，聴思聡，色思温，貌思恭，言思忠，事思敬，疑思問，忿思難，見得思義。」","孔子曰く、君子に九思有り。視るには明を思い、聴くには聡を思い、色には温を思い、貌には恭を思い、言には忠を思い、事には敬を思い、疑わしきには問うを思い、忿りには難を思い、得るを見ては義を思う。","見る・聞く・表情・態度・言葉・仕事・疑い・怒り・利益。九つの場面で省みる。","怒りを覚えたとき、その後に起こることまで考えているか。",["self","profit","decide"],["怒り","焦り"],3,"先師がいわれた。――\n「君子には九つの思いがある。見ることは明らかでありたいと思い、聴くことは聰くありたいと思い、顔色は温和でありたいと思い、態度は恭しくありたいと思い、言語は誠実でありたいと思い、仕事は慎重でありたいと思い、疑いは問いただしたいと思い、怒れば後難のおそれあるを思い、利得を見ては正義を思うのである。」",["rei","gi"]],[431,15,11,"孔子曰：「『見善如不及，見不善如探湯。』吾見其人矣，吾聞其語矣。『隠居以求其志，行義以達其道。』吾聞其語矣，未見其人也。」","孔子曰く、善を見ては及ばざるが如くし、不善を見ては湯を探るが如くす。吾其の人を見る、吾其の語を聞く。隠居して以て其の志を求め、義を行いて以て其の道を達す。吾其の語を聞く、未だ其の人を見ざるなり。","善を追い悪を避ける人はいる。だが不遇でも志を守り、義を貫いて道を通す人は稀だ。","誰にも用いられない時期でも、守り続けたい志は何か。",["vision","lonely","fail"],["孤独","落胆"],2,"先師がいわれた。\n「善を見ては、取りにがすのを恐れるようにそれを追求し、悪を見ては、熱湯に手を入れるのを恐れるようにそれを避ける。――そういう言葉を私はきいたことがあるし、また現にそういう人物を見たこともある。しかし、世に用いられないでも初一念を貫き、正義の実現に精進して、道の徹底を期する、というようなことは、言葉ではきいたことがあるが、まだ実際にそういう人を見たことがない。」",["gi"]],[432,15,12,"斉景公有馬千駟，死之日，民無徳而称焉。伯夷叔斉餓於首陽之下，民到于今称之。其斯之謂与？","斉の景公、馬千駟有り。死するの日、民徳として称すること無し。伯夷・叔斉、首陽の下に餓う。民今に到るまで之を称す。（誠に富を以てせず、亦祇に異を以てす。）其れ斯を之れ謂うか。","富んだ景公は死後誰にも称えられず、飢えて死んだ伯夷・叔斉は今も称えられる。","自分が去ったあと、人は自分の何を語るだろうか。",["profit","vision"],["迷い"],2,"先師がいわれた。――\n「斉の景公は馬四千頭を養っていたほど富んでいたが、その死にあたって、人民はだれ一人としてその徳をたたえるものがなかった。伯夷叔斉は首陽山のふもとで饑死したが、人民は今にいたるまでその徳をたたえている。詩経に、\n黄金も玉も何かせん\n心ばえこそ尊けれ。\nとあるが、そういうことをいったものであろう。」",["gi"]],[433,15,13,"陳亢問於伯魚曰：「子亦有異聞乎？」対曰：「未也。嘗独立，鯉趨而過庭。曰：『学《詩》乎？』対曰：『未也。』『不学《詩》，無以言。』鯉退而学《詩》。他日，又独立，鯉趨而過庭。曰：『学礼乎？』対曰：『未也。』『不学礼，無以立！』鯉退而学礼。聞斯二者。」陳亢退而喜曰：「問一得三：聞《詩》，聞礼，又聞君子之遠其子也。」","陳亢、伯魚に問いて曰く、子も亦異聞有るか。対えて曰く、未だし。嘗て独り立てり。鯉趨りて庭を過ぐ。曰く、詩を学びたるか。対えて曰く、未だし。詩を学ばずんば、以て言うこと無し。鯉退きて詩を学ぶ。他日、又独り立てり。鯉趨りて庭を過ぐ。曰く、礼を学びたるか。対えて曰く、未だし。礼を学ばずんば、以て立つこと無し。鯉退きて礼を学ぶ。斯の二者を聞けり。陳亢退きて喜びて曰く、一を問いて三を得たり。詩を聞き、礼を聞き、又君子の其の子を遠ざくるを聞けり。","孔子はわが子にも特別扱いをせず、詩と礼を学べと弟子と同じことを教えた。","身内や気に入った相手だけを、特別扱いしていないか。",["grow","lead"],[],1,"陳亢が伯魚にたずねた。――\n「先生もあなたにだけは、何か私共に対するとはちがった特別のご教訓をなさることでしょう。」\n　伯魚がこたえた。――\n「これまでには、まだこれといって特別の教えをうけたことはありません。ただ、いつでしたか、父が独りで立っていましたおり、私がいそいで庭先を通り過ぎようとしますと、私を呼びとめて、詩を学んだか、とたずねました。私が、まだとこたえますと、詩を学ばない人間は話相手にならぬ、と叱りました。それ以来私も詩を学ぶことにしています。またある日、父が一人で立っていました時、私がいそいで庭先を通り過ぎようとしますと、私をよびとめて、礼を学んだか、とたずねました。私が、まだとこたえますと、礼を学ばない人間は世に立つ資格がない、と叱りました。それ以来、私も礼を学ぶことにしています。私が父に特別に何かいわれたことがあるとすると、まずこの二つぐらいのことでしょう。」\n　陳亢は、伯魚とわかれたあとで、よろこんでいった。――\n「今日は一つのことをたずねて、三つのことをきくことが出来た。詩を学ぶことの大切さをきき、礼を学ぶことの大切さをきき、そして、君子は自分の子をあまやかすことがないということをきいたのだ。」",["chi","rei"]],[434,15,14,"邦君之妻，君称之曰「夫人」，夫人自称曰「小童」；邦人称之曰「君夫人」，称諸異邦曰「寡小君」；異邦人称之，亦曰「君夫人」。","邦君の妻、君之を称して夫人と曰う。夫人自ら称して小童と曰う。邦人之を称して君夫人と曰う。諸を異邦に称して寡小君と曰う。異邦の人之を称するも、亦君夫人と曰う。","君主の妻を、誰がどの場面で何と呼ぶかを定めた呼称の決まり。","",[],[],0,"国君の妻は、国君が呼ぶ時には「夫人」といい、夫人自ら呼ぶ時には「小童」といい、国内の人が呼ぶ時には「君夫人」といい、外国に対しては「寡小君」といい、外国の人が呼ぶ時にはやはり「君夫人」という。",["rei"]],[435,16,1,"陽貨欲見孔子，孔子不見，帰孔子豚。孔子時其亡也，而往拝之，遇諸塗。謂孔子曰：「来，予与爾言。」曰：「懐其宝而迷其邦，可謂仁乎？」曰：「不可。」「好従事而亟失時，可謂知乎？」曰：「不可。」「日月逝矣，歳不我与。」孔子曰：「諾，吾将仕矣。」","陽貨、孔子を見んと欲す。孔子見えず。孔子に豚を帰る。孔子其の亡きを時として、往きて之を拝す。諸に塗に遇う。孔子に謂いて曰く、来たれ、予爾と言わん。曰く、其の宝を懐きて其の邦を迷わす、仁と謂うべきか。曰く、不可なり。事に従うを好みて亟時を失う、知と謂うべきか。曰く、不可なり。日月逝く、歳我と与にせず。孔子曰く、諾、吾将に仕えんとす。","力を抱えて出番を逃すなと迫られ、孔子は逆らわず受け流す。","嫌な相手の正論を、私はどう受け止めているか。",["decide"],["迷い"],1,"魯の大夫陽貨が先師を引見しようとしたが、先師は応じられなかった。そこで陽貨は先師に豚肉の進物をした。先師は陽貨の留守を見はからってお礼に行かれた。ところが、運わるく、その帰り途で陽貨に出遇われた。すると陽貨はいった。――\n「まあ、私のうちにおいでなさい。話があるから。」\n　先師が仕方なしについて行かれると、陽貨がいった。――\n「胸中に宝を抱きながら、国家の混迷を傍観している人を、果して仁者といえましょうか。」\n　先師――\n「いえません。」\n　陽貨――\n「国事に挺身したい希望を持ちながら、しばしばその機会を失う人を、果して知者といえましょうか。」\n　先師――\n「いえません。」\n　陽貨――\n「月日は流れ、歳は人を待ってはくれないものですが……」\n　先師――\n「よくわかりました。いずれそのうちには、私もご奉公することにいたしましょう。」",[]],[436,16,2,"子曰：「性相近也，習相遠也。」","子曰く、性相近し、習い相遠し。","生まれつきの差は小さい。人を分けるのは日々の習慣。","自分と社員の習慣は、どちらへ人を運んでいるか。",["grow","self"],[],3,"先師がいわれた。――\n「人間の生れつきは似たものである。しかししつけによる差は大きい。」",["chi"]],[437,16,3,"子曰：「唯上知与下愚不移也。」","子曰く、唯上知と下愚とは移らず。","飛び抜けた賢者と、学ぼうとしない者だけは変わらない。","変わらないと決めつけている相手は、本当に変われないのか。",["grow"],[],1,"先師がいわれた。――\n「最上位の賢者と、最下位の愚者だけは、永久に変らない。」",["chi"]],[438,16,4,"子之武城，聞弦歌之声，夫子莞爾而笑，曰：「割雞焉用牛刀。」子游対曰：「昔者，偃也聞諸夫子曰：『君子学道則愛人，小人学道則易使也。』」子曰：「二三子！偃之言是也，前言戲之耳！」","子、武城に之き、弦歌の声を聞く。夫子莞爾として笑いて曰く、鶏を割くに焉んぞ牛刀を用いん。子游対えて曰く、昔者偃や諸を夫子に聞けり、曰く、君子道を学べば則ち人を愛し、小人道を学べば則ち使い易しと。子曰く、二三子、偃の言是なり。前言は之に戯れしのみ。","小さな町でも正道で治める弟子を認め、軽口をすぐ取り消す。","部下の正しい反論に、その場で非を認められるか。",["grow","lead"],[],2,"先師が武城に行かれた時、町の家々から弦歌の声がきこえていた。先師はにこにこしながらいわれた。――\n「を料理するのに、牛刀を使う必要もないだろうにな。」\n　武城は門人子游がその代官をつとめ、礼楽を盛んにして人民を善導し、治績をあげていた小さな町であった。\n　で、子游は先師にそういわれると、けげんそうな顔をしていった。――\n「以前私は、先生に、上に立つ者が道を学ぶとよく人を愛し、民衆が道を学ぶとよく治まる、とうけたまわりましたが……」\n　すると、先師は、お伴をしていたほかの門人たちをかえりみて、いわれた。――\n「今、偃がいったことはほんとうだ。私のさっきいったのは、じょうだんだよ。」",["rei","jin"]],[439,16,5,"公山弗擾以費畔，召，子欲往。子路不説，曰：「末之也已，何必公山氏之之也。」子曰：「夫召我者，而豈徒哉？如有用我者，吾其為東周乎！」","公山弗擾、費を以て畔く。召す。子往かんと欲す。子路説ばずして曰く、之くこと末きのみ。何ぞ必ずしも公山氏に之れ之かん。子曰く、夫れ我を召す者にして、豈徒ならんや。如し我を用うる者有らば、吾は其れ東周を為さんか。","評判の悪い相手の招きでも、理想を実現する機会なら逃したくない。","その誘いに乗りたいのは、志のためか、焦りのためか。",["decide","vision"],["迷い","焦り"],1,"公山弗擾が、費に立てこもって叛いたとき、先師を招いた。先師はその招きに応じて行こうとされた。子路はそれをにがにがしく思って、いった。――\n「おいでになってはいけません。人もあろうに、何でわざわざ公山氏などのところへおいでになるのです。」\n　先師がいわれた。――\n「いやしくも私を招くのだ。いいかげんな考えからではあるまい。私は、私を用いるものがあったら、第二の周をこの東方に建設しないではおかないつもりだ。」",["gi"]],[440,16,6,"子張問「仁」於孔子。孔子曰：「能行五者於天下，為仁矣。」「請問之？」曰：「恭、寬、信、敏、惠。恭則不侮，寬則得眾，信則人任焉，敏則有功，惠則足以使人。」","子張、仁を孔子に問う。孔子曰く、能く五つの者を天下に行うを仁と為す。之を請い問う。曰く、恭・寛・信・敏・恵なり。恭なれば則ち侮られず、寛なれば則ち衆を得、信なれば則ち人任じ、敏なれば則ち功有り、恵なれば則ち以て人を使うに足る。","慎み、寛容、誠実、機敏、恵み。この五つが人を動かす。","五つのうち、いま自分に一番欠けているのはどれか。",["lead","self"],[],3,"子張が仁について先師にたずねた。先師はいわれた。――\n「五つの徳で天下を治めることが出来たら、仁といえるだろう。」\n　子張はその五つの徳についての説明を求めた。すると、先師はいわれた。――\n「恭・寛・信・敏・恵の五つがそれだ。身も心もうやうやしければ人に侮られない。他に対して寛大であれば衆望があつまる。人と交って信実であれば人が信頼する。仕事に敏活であれば功績があがる。恵み深ければ人を働かせることが出来る。」",["jin","shin"]],[441,16,7,"仏肸召，子欲往。子路曰：「昔者由也聞諸夫子曰：『親於其身為不善者，君子不入也。』仏肸以中牟畔，子之往也，如之何？」子曰：「然，有是言也。不曰堅乎？磨而不磷。不曰白乎？涅而不緇。吾豈匏瓜也哉？焉能繫而不食！」","仏肸召す。子往かんと欲す。子路曰く、昔者由や諸を夫子に聞けり、曰く、親ら其の身に於て不善を為す者には、君子は入らざるなりと。仏肸中牟を以て畔く。子の往くや、之を如何。子曰く、然り、是の言有るなり。堅しと曰わずや、磨すれども磷ろがず。白しと曰わずや、涅すれども緇まず。吾豈匏瓜ならんや。焉んぞ能く繋りて食らわれざらん。","本当に堅く白いものは染まらない。ぶら下がるだけの瓢箪では終われない。","環境に染まる不安と、用いられない焦り、どちらが強いか。",["decide","vision","lonely"],["焦り"],2,"仏が先師を招いた。先師はその招きに応じて行こうとされた。すると子路がいった。――\n「かつて私は先生に、君子は、自分から進んで不善を行うような人間の仲間入りはしないものだ、と承ったことがあります。仏は、中牟に占拠して反乱をおこしている人間ではありませんか。先生が、そういう人間の招きに応じようとなさるのは、いったいどういうわけでございます。」\n　先師がいわれた。――\n「さよう。たしかに私はそういうことをいったことがある。だが、諺にも、ほんとうに堅いものは、磨っても磨ってもうすくはならない、ほんとうに白いものは、そめてもそめても黒くはならない、というではないか。私にもそのぐらいの自信はあるのだ。私をあの匏のような人間だと思ってもらっては困る。食用にもならず、ただぶらりとぶらさがっているあの匏のような人間――どうして私がそんな無用な人間でいられよう。」",["gi"]],[442,16,8,"子曰：「由也，女聞『六言六蔽』矣乎？」対曰：「未也。」「居！吾語女。好仁不好学，其蔽也愚；好知不好学，其蔽也蕩；好信不好学，其蔽也賊；好直不好学，其蔽也絞；好勇不好学，其蔽也乱；好剛不好学，其蔽也狂。」","子曰く、由や、女六言の六蔽を聞けるか。対えて曰く、未だし。居れ、吾女に語げん。仁を好みて学を好まざれば、其の蔽や愚。知を好みて学を好まざれば、其の蔽や蕩。信を好みて学を好まざれば、其の蔽や賊。直を好みて学を好まざれば、其の蔽や絞。勇を好みて学を好まざれば、其の蔽や乱。剛を好みて学を好まざれば、其の蔽や狂。","どんな美徳も、学びを欠けば欠点に変わる。","自分の長所は、学ばないままどんな害に変わっているか。",["self","vision"],["慢心"],3,"先師がいわれた。――\n「由よ、お前は六つの善言に六つの暗い影があるということをきいたことがあるか。」\n　子路がこたえた。――\n「まだきいたことがございません。」\n　先師――\n「では、おかけなさい。話してあげよう。仁を好んで学問を好まないと、見さかいのない痴愚の愛に陥りがちなものだ。知を好んで学問を好まないと、筋道の立たない妄想を逞しうしがちなものだ。信を好んで学問を好まないと、小信にこだわって自他の幸福を害しがちなものだ。直を好んで学問を好まないと、杓子定規になり、無情非礼を敢てしがちなものだ。勇を好んで学問を好まないと、血気にはやって秩序を紊しがちなものだ。剛を好んで学問を好まないと、理非をわきまえない狂気じみた自己主張をやりがちなものだ。」",["chi"]],[443,16,9,"子曰：「小子！何莫学夫《詩》？《詩》可以興，可以観，可以群，可以怨；邇之事父，遠之事君；多識於鳥獣草木之名。」","子曰く、小子、何ぞ夫の詩を学ぶこと莫きや。詩は以て興すべく、以て観るべく、以て群すべく、以て怨むべし。之を邇くしては父に事え、之を遠くしては君に事え、多く鳥獣草木の名を識る。","詩は心を奮い立たせ、人を見る目と共に生きる力を養う。","数字以外に、心と人を見る目を養うものに触れているか。",["vision"],[],1,"先師が門人たちにいわれた。――\n「お前たちはどうして詩経を学ぼうとしないのか。詩は人間の精神にいい刺戟を与えてくれる。人間に人生を見る眼を与えてくれる。人とともに生きるこころを培ってくれる。また、怨み心を美しく表現する技術をさえ教えてくれる。詩が真に味わえてこそ、近くは父母に仕え、遠くは君に仕えることも出来るのだ。しかも、われわれは、詩をよむことによって、鳥獣草本のような自然界のあらゆるものに親しむことまで出来るのではないか。」",["chi"]],[444,16,10,"子謂伯魚曰：「女為周南召南矣乎？人而不為周南召南，其猶正牆面而立也与！」","子、伯魚に謂いて曰く、女周南・召南を為びたるか。人にして周南・召南を為ばずんば、其れ猶正しく牆に面して立つがごときか。","基本の古典を学ばなければ、壁の前に立つように一歩も進めない。","自分の仕事の土台となる基本を、学び直しているか。",["vision"],[],1,"先師が子息の伯魚にいわれた。\n「お前は周南・召南の詩を研究して見たのか。この二つの詩がわからなければ、人間も土塀に鼻つきつけて立っているようなものだがな。」",["chi"]],[445,16,11,"子曰：「礼云礼云，玉帛云乎哉？楽云楽云！鐘鼓云乎哉？」","子曰く、礼と云い礼と云う、玉帛を云わんや。楽と云い楽と云う、鐘鼓を云わんや。","礼も音楽も道具や形式のことではない。大事なのは中身の心。","形だけ残って、心が抜けた制度や行事はないか。",["vision","lead"],[],2,"先師がいわれた。――\n「礼だ、礼だ、と大さわぎしているが、礼とはいったい儀式用の玉や帛のことだろうか。楽だ、楽だ、と大さわぎしているが、楽とはいったい鐘や太鼓のことだろうか。」",["rei"]],[446,16,12,"子曰：「色厲而內荏，譬諸小人，其猶穿窬之盗也与？」","子曰く、色厲しくして内荏なるは、諸を小人に譬うれば、其れ猶穿窬の盗のごときか。","外見は強面で中身が弱い人は、こそ泥のようにびくついている。","強く見せている場面で、内心は何を恐れているか。",["self","judge"],["不安"],2,"先師がいわれた。――\n「見かけだけはいかにも厳めしくして、内心ぐにゃぐにゃしている人は、これを下層民の場合でいうと、壁をぶち破ったり、塀を乗りこえたりしながら、びくびくしている泥棒のようなものであろうか。」",["shin"]],[447,16,13,"子曰：「郷原，徳之賊也。」","子曰く、郷原は徳の賊なり。","誰からも良い人と言われる八方美人が、実は徳を損なう。","誰にも嫌われまいとして、筋を曲げていないか。",["judge","self"],[],2,"先師がいわれた。――\n「郷党のほめられ者の中には、得てして、道義の賊がいるものだ。」",["shin","gi"]],[448,16,14,"子曰：「道聴而塗説，徳之棄也。」","子曰く、道に聴きて塗に説くは、徳を之れ棄つるなり。","聞きかじりをすぐ受け売りするのは、徳を捨てるに等しい。","最近語ったことのうち、自分で確かめ身につけたものはどれか。",["self","vision"],[],2,"先師がいわれた。――\n「途中でよいことをきいて、早速それを途中で人にいつて聞かせる。それでは徳を棄てるようなものだ。」",["chi","shin"]],[449,16,15,"子曰：「鄙夫！可与事君也与哉？其未得之也，患得之；既得之，患失之。苟患失之，無所不至矣！」","子曰く、鄙夫は与に君に事うべけんや。其の未だ之を得ざるや、之を得んことを患う。既に之を得れば、之を失わんことを患う。苟も之を失わんことを患うれば、至らざる所無し。","地位を失うことを恐れる人は、保身のために何でもする。","失うのが怖くて、判断を曲げていることはないか。",["judge","profit","self"],["不安"],2,"先師がいわれた。――\n「心事の陋劣な人とは、到底いっしょに君に仕えることが出来ない。そういう人は、まだ地位を得ないうちは、それを得たいとあせるし、一旦それを得ると、それを失うまいとあせるし、そして、それを失うまいとあせり出すと、今度はどんなことでもしかねないのだから。」",["gi"]],[450,16,16,"子曰：「古者民有三疾，今也或是之亡也。古之狂也肆，今之狂也蕩；古之矜也廉，今之矜也忿戾；古之愚也直，今之愚也詐而已矣。」","子曰く、古者民に三疾有り。今や或いは是れ亡きなり。古の狂や肆、今の狂や蕩。古の矜や廉、今の矜や忿戾。古の愚や直、今の愚や詐のみ。","昔の人の欠点にはまだ美点があったが、今はそれすら崩れている。","自分の欠点は、まだ美点とつながっているか。",["judge","self"],[],1,"先師がいわれた。\n「昔の人に憂うべきことが三つあつたが、今はその憂うべきことを通りこして、全く救いがたいものになっているらしい。昔の理想狂の弊は、自由奔放で小事にこだわらない程度であった。然るに今の理想狂は徒らに放縦である。昔、ほこりをもって己を高くした人々の弊は、廉直に過ぎて寄りつきにくい程度であった。然るに今のそうした人々は強情でひねくれている。昔の愚か者は正直であった。然るに今の愚か者はずるくて安心が出来ない。」",[]],[451,16,17,"子曰：「巧言令色，鮮矣仁。」","子曰く、巧言令色、鮮なし仁。","口がうまく愛想のよい人に、誠実さは少ない。","耳に心地よい言葉ばかり言う人を、重用していないか。",["judge"],[],2,"先師がいわれた。――\n「ご機嫌とりにろくな人間はいない。」",["shin"]],[452,16,18,"子曰：「悪紫之奪朱也，悪鄭声之乱雅楽也，悪利口之覆邦家者。」","子曰く、紫の朱を奪うを悪む。鄭声の雅楽を乱るを悪む。利口の邦家を覆す者を悪む。","まがい物が本物を押しのけ、口達者が国を傾けるのを憎む。","弁の立つ人の言葉で、本筋を見失っていないか。",["judge"],[],2,"先師がいわれた。――\n「私は紫色が朱色を圧して流行しているのを憎む。※声［＃「猶のつくり＋おおざと」、U+2871F、420-下-6］が雅楽を乱しているのを憎む。そして、口上手な人が国家を危くしているのを最も憎む。」",["shin"]],[453,16,19,"子曰：「予欲無言！」子貢曰：「子如不言，則小子何述焉？」子曰：「天何言哉？四時行焉，百物生焉，天何言哉？」","子曰く、予言うこと無からんと欲す。子貢曰く、子如し言わずんば、則ち小子何をか述べん。子曰く、天何をか言うや。四時行われ、百物生ず。天何をか言うや。","天は何も語らないが四季は巡る。言葉より行いで示す。","言葉を尽くす代わりに、背中で示せていることは何か。",["lead","grow"],["疲れ"],2,"先師がいわれた。――\n「私はもう沈默したいと思っている。」\n　子貢がいった。――\n「先生がもし沈默なさいましたら、私共門人は何をよりどころにして、道をひろめましょう。」\n　先師がいわれた。――\n「天を見るがいい。天に何の言葉があるのか。しかも四季の変化は整然と行われ、万物はたゆみなく生育している。天に何の言葉があるのか。」",["shin"]],[454,16,20,"孺悲欲見孔子，孔子辞以疾。将命者出戶，取瑟而歌，使之聞之。","孺悲、孔子を見んと欲す。孔子辞するに疾を以てす。命を将う者戸を出づ。瑟を取りて歌い、之をして之を聞かしむ。","仮病で面会を断り、わざと歌を聞かせて拒絶の意を悟らせた。","",[],[],0,"孺悲が先師に面会を求めた。先師は病気だといって会われなかったが、取次の人がそれをつたえるために部屋を出ると、すぐ瑟を取りあげ、歌をうたって、わざと孺悲にそれがきこえるようにされた。",[]],[455,16,21,"宰我問：「三年之喪，期已久矣！君子三年不為礼，礼必壊；三年不為楽，楽必崩。旧穀既没，新穀既升，鑽燧改火，期可已矣。」子曰：「食夫稻，衣夫錦，於女安乎？」曰：「安！」「女安，則為之！夫君子之居喪，食旨不甘，聞楽不楽，居処不安，故不為也。今女安，則為之！」宰我出。子曰：「予之不仁也！子生三年，然後免於父母之懐。夫三年之喪，天下之通喪也。予也，有三年之愛於其父母乎？」","宰我問う、三年の喪は、期にして已に久し。君子三年礼を為さずんば、礼必ず壊れん。三年楽を為さずんば、楽必ず崩れん。旧穀既に没きて、新穀既に升る。燧を鑽りて火を改む。期にして已むべし。子曰く、夫の稲を食らい、夫の錦を衣る、女に於て安きか。曰く、安し。女安くんば則ち之を為せ。夫れ君子の喪に居るや、旨きを食らえども甘からず、楽を聞けども楽しからず、居処安からず、故に為さざるなり。今女安くんば則ち之を為せ。宰我出づ。子曰く、予の不仁なるや。子生まれて三年、然る後に父母の懐を免る。夫れ三年の喪は天下の通喪なり。予や、三年の愛其の父母に有るか。","喪を一年に縮めたいという宰我に、親の恩を思えと嘆く。","",[],[],0,"宰我がたずねた。――\n「父母の喪は三年となっていますが、一年でも結構長過ぎるぐらいではありますまいか。もし君子が三年間も礼を修めなかったら、礼はすたれてしまいましょう。もし三年間も楽に遠ざかったら、楽がくずれてしまいましょう。一年たてば、殻物も古いのは食いつくされて新しいのが出てまいりますし、火を擦り出す木にしましても、四季それぞれの木が一巡して、またもとにもどるわけです。それを思いますと、父母の喪にしましても、一年で十分ではありますまいか。」\n　先師がいわれた。――\n「お前は、一年たてば、うまい飯をたべ、美しい着物を着ても気がおちつかないというようなことはないのか。」\n　宰我――\n「かくべつそういうこともございません。」\n　先師――\n「そうか、お前が何ともなければ、好きなようにするがよかろう。だが、いったい君子というものは、喪中にはご馳走を食べてもうまくないし、音楽をきいてもたのしくないし、また、どんなところにいても気がおちつかないものなのだ。だからこそ、一年で喪を切りあげるようなことをしないのだ。もしお前が、何ともなければ、私は強いてそれをいけないとはいうまい。」\n　それで宰我はひきさがった。すると先師はほかの門人たちにいわれた。――\n「どうも予は不人情な男だ。人間の子は生れて三年たってやっと父母の懐をはなれる。だから、三年間父母の喪に服するのは天下の定例になっている。いったい予は三年間の父母の愛をうけなかったとでもいうのだろうか。」",["jin","rei"]],[456,16,22,"子曰：「飽食終日，無所用心，難矣哉！不有博弈者乎？為之，猶賢乎已！」","子曰く、飽くまで食らいて日を終え、心を用うる所無きは、難いかな。博弈なる者有らずや。之を為すは猶已むに賢れり。","満腹で一日何も考えないのが最悪。遊びでも頭を使う方がまし。","何にも心を使わずに過ぎた日が、続いていないか。",["self","vision"],["疲れ"],1,"先師がいわれた。――\n「たらふく食ってばかりいて、終日ぼんやりしている人間ほど始末におえない人間はない。雙六とか碁とかいうものもあるではないか。そんなつまらん遊びごとでも、何もしないよりは、まだしも取柄があるよ。」",["chi"]],[457,16,23,"子路曰：「君子尙勇乎？」子曰：「君子義以為上。君子有勇而無義為乱，小人有勇而無義為盗。」","子路曰く、君子勇を尚ぶか。子曰く、君子義以て上と為す。君子勇有りて義無ければ乱を為す。小人勇有りて義無ければ盗を為す。","勇気より上に置くべきは義。義のない勇気は乱を招く。","その大胆な一手は、筋の通ったものか。",["decide","self"],[],2,"子路がたずねた。\n「君子は勇をたっとぶものでございますか。」\n　先師がこたえられた。――\n「君子にとって何より大事なのは義だ。上に立つ人に勇があって義がないと、反乱を起し、下に居る人民に勇があって義がないと盗みをする。」",["gi"]],[458,16,24,"子貢曰：「君子亦有悪乎？」子曰：「有悪，悪称人之悪者，悪居下流而訕上者，悪勇而無礼者，悪果敢而窒者。」曰：「賜也亦有悪乎？」「悪徼以為知者，悪不孫以為勇者，悪訐以為直者。」","子貢曰く、君子も亦悪むこと有るか。子曰く、悪むこと有り。人の悪を称する者を悪む。下流に居て上を訕る者を悪む。勇にして礼無き者を悪む。果敢にして窒がる者を悪む。曰く、賜や亦悪むこと有るか。徼めて以て知と為す者を悪む。不孫にして以て勇と為す者を悪む。訐きて以て直と為す者を悪む。","君子も憎む。陰口、上への中傷、礼なき勇気、独善的な決断を。","自分が嫌う振る舞いを、自分もしていないか。",["judge","trust"],["怒り"],2,"子貢がたずねた。――\n「君子も人を憎むということがありましょうか。」\n　先師がこたえられた。――\n「それはあるとも。他人の悪事をいい立てるものを憎むのだ。下位にいて、上をそしる者を憎むのだ。勇のみあって礼のないものを憎むのだ。思いきりがよくて道理にもとるものを憎むのだ。」\n　それから、子貢にたずねられた。――\n「お前にも憎む人があるのか。」\n　子貢がこたえた。――\n「先まわりして物事をさぐっておいて、知ったかぶりする者を憎みます。傲慢不遜を勇気だと心得ている者を憎みます。人の秘密をあばいて正直だと思っている者を憎みます。」",["rei"]],[459,16,25,"子曰：「唯女子与小人為難養也！近之則不孫，遠之則怨。」","子曰く、唯女子と小人とは養い難しと為す。之を近づくれば則ち不孫、之を遠ざくれば則ち怨む。","身近に仕える者との距離は難しい。近すぎれば馴れ、遠ければ恨む。","",[],[],0,"先師がいわれた。――\n「女子と小人だけには取扱いに苦労をする。近づけるとのさばるし、遠ざけると怨むのだから。」",["rei"]],[460,16,26,"子曰：「年四十而見悪焉，其終也已。」","子曰く、年四十にして悪まるるは、其れ終わらんのみ。","四十になっても人に嫌われるようでは、先は知れている。","年齢にふさわしい信頼を、周囲から得られているか。",["self"],["焦り"],1,"先師がいわれた。――\n「人間が四十歳にもなって人にそしられるようでは、もう先が見えている。」\n［＃改ページ］",["shin"]],[461,17,1,"微子去之，箕子為之奴，比干諫而死。孔子曰：「殷有三仁焉。」","微子は之を去り、箕子は之が奴と為り、比干は諫めて死す。孔子曰く、殷に三仁有り。","去る、耐える、諫めて死ぬ。道は違っても三人とも仁者。","去るか残るか、どの道なら自分の誠を貫けるか。",["decide"],["迷い"],1,"微子・箕子・比干は共に殷の紂王の無道を諌めた。微子は諌めてきかれず、去って隠棲した。箕子は諌めて獄に投ぜられ、奴隷となった。比干は極諌して死刑に処せられ、胸を剖かれた。先師はこの三人をたたえていわれた。――\n「殷に三人の仁者があった。」",["jin","gi"]],[462,17,2,"柳下惠為士師，三黜。人曰：「子未可以去乎？」曰：「直道而事人，焉往而不三黜？枉道而事人，何必去父母之邦？」","柳下恵、士師と為り、三たび黜けらる。人曰く、子未だ以て去るべからざるか。曰く、道を直くして人に事うれば、焉くに往くとして三たび黜けられざらん。道を枉げて人に事うれば、何ぞ必ずしも父母の邦を去らん。","まっすぐ仕えればどこでも退けられる。曲げるなら去る意味もない。","場所を変えれば解決するのか、自分の筋の問題なのか。",["fail","profit","lonely"],["落胆"],2,"柳下恵が法官となつて三たびその職を免ぜられた。ある人が彼にいった。――\n「どうしてこんな国にぐずぐずしておいでです。さっさとお去りになったらいいでしょうのに。」\n　柳下恵がこたえた。――\n「どこの国に行ったところで、正道をふんでご奉公をしようとすれば、三度ぐらいの免職は覚悟しなければなりますまい。免職がおそろしさに正道をまげてご奉公するぐらいなら、何も父母の国をすてて、わざわざ他国に行く必要もなかろうではありませんか。」",["gi"]],[463,17,3,"斉景公待孔子，曰：「若季氏則吾不能，以季、孟之閒待之。」曰：「吾老矣，不能用也。」孔子行。","斉の景公、孔子を待つに曰く、季氏の若くするは則ち吾能わず。季・孟の間を以て之を待たん。曰く、吾老いたり、用うる能わざるなり。孔子行る。","待遇は示されても用いる気がないと知り、孔子は去った。","待遇ではなく、本当に用いられる場所を選んでいるか。",["decide"],[],1,"斉の景公が、先師を採用するにつき、その待遇のことでいった。――\n「季氏ほどに待遇してやることは、とても力に及ばないので、季氏と孟氏との間ぐらいのところにしたいと思う。」\n　しかし、あとになって、またいった。\n「自分も、もうこの老年になっては、孔子のような遠大な理想をもっている人を用いても仕方があるまい。」\n　先師はそのことをもれ聞かれて、斉の国を去られた。",[]],[464,17,4,"斉人帰女楽，季桓子受之，三日不朝。孔子行。","斉人、女楽を帰る。季桓子之を受け、三日朝せず。孔子行る。","上が歌舞に溺れ政務を三日放棄したのを見て、孔子は去った。","見切りをつけるべき兆しを、見ないふりしていないか。",["decide"],[],1,"斉が、魯の君臣を誘惑してその政治をみだすために、美人の歌舞団をおくった。魯の権臣季桓子が喜んでこれをうけ、君臣共にこれに見ほれて、三日間朝政を廃するにいたったので、先師はついに職を辞して魯を去られた。",["gi"]],[465,17,5,"楚狂接輿，歌而過孔子，曰：「鳳兮！鳳兮！何徳之衰？往者不可諫，来者猶可追。已而！已而！今之従政者殆而！」孔子下，欲与之言。趨而辟之，不得与之言。","楚の狂接輿、歌いて孔子を過ぐ。曰く、鳳や鳳や、何ぞ徳の衰えたる。往く者は諫むべからず、来たる者は猶追うべし。已みなん已みなん。今の政に従う者は殆うし。孔子下りて之と言わんと欲す。趨りて之を辟く。之と言うを得ず。","過ぎたことは正せないが、これからのことはまだ間に合う。","悔やむのをやめたら、これから何に手を付けるか。",["fail","decide"],["落胆"],2,"楚の国で、狂人をよそっていた接輿という人が、先師の車のそばを通り過ぎながら、歌った。――\n「鳳凰よ、鳳凰よ、\n神通力は、どうしたか。\nすんだことなら仕方がない。\nこれから先はしっかりせい\n国の舵取りゃあぶないぞ\nやめたらどうぞい。やめたらぞい。」\n　先師は車をおりて、接輿と話をしようとされた。しかし、接輿が大急ぎでどこかにかくれてしまったので、お話しになることが出来なかった。",[]],[466,17,6,"長沮、桀溺耦而耕。孔子過之，使子路問津焉。長沮曰：「夫執輿者為誰？」子路曰：「為孔丘。」曰：「是魯孔丘与？」曰：「是也。」曰：「是知津矣！」問於桀溺，桀溺曰：「子為誰？」曰：「為仲由。」曰：「是魯孔丘之徒与？」対曰：「然。」曰：「滔滔者，天下皆是也，而誰以易之？且而与其従辟人之士也，豈若従辟世之士哉？」耰而不輟。子路行以吿，夫子憮然曰：「鳥獣不可与同群！吾非斯人之徒与而誰与？天下有道，丘不与易也。」","長沮・桀溺、耦して耕す。孔子之を過ぎ、子路をして津を問わしむ。長沮曰く、夫の輿を執る者は誰と為す。子路曰く、孔丘と為す。曰く、是れ魯の孔丘か。曰く、是れなり。曰く、是れならば津を知らん。桀溺に問う。桀溺曰く、子は誰と為す。曰く、仲由と為す。曰く、是れ魯の孔丘の徒か。対えて曰く、然り。曰く、滔滔たる者、天下皆是れなり。而して誰か以て之を易えん。且つ而其の人を辟くるの士に従わんよりは、豈世を辟くるの士に従うに若かんや。耰して輟めず。子路行きて以て告ぐ。夫子憮然として曰く、鳥獣は与に群を同じくすべからず。吾斯の人の徒と与にするに非ずして誰と与にせん。天下道有らば、丘は与に易えざるなり。","世を捨てはしない。人の中で生き、人と共に世を変えていく。","投げ出したくなる日、それでも誰と共に歩みたいか。",["lonely","vision"],["孤独","疲れ"],3,"長沮と桀溺の二人が、ならんで畑を耕していた。巡歴中の先師がそこを通りがかられ、子路に命じて渡場をたずねさせられた。すると長沮が子路にいった。――\n「あの人は誰ですかい。あの車の上で今手綱をにぎっているのは。」\n　子路がこたえた。――\n「孔丘です。」\n　長沮――\n「ああ、あの魯の孔丘ですかい。」\n　子路――\n「そうです。」\n　長沮――\n「じゃあ、渡場ぐらいはもう知っていそうなものじゃ。年がら年中方々うろつきまわっている人だもの。」\n　そこで子路は今度は桀溺にたずねた。すると桀溺がいった。\n「お前さんはいったい誰かね。」\n　子路――\n「仲由と申すものです。」\n　桀溺――\n「ほう。すると、魯の孔丘のお弟子じゃな。」\n　子路――\n「そうです。」\n　桀溺――\n「今の世の中は、どうせ泥水の洪水見たようなものじゃ。お前さんの師匠は、いったい誰を力にこの時勢を変えようとなさるのかな。お前さんもお前さんじゃ。そんな人にいつまでもついてまわって、どうなさるおつもりじゃ。この人間もいけない、あの人間もいけないと、人間の選り好みばかりしている人についてまわるよりか、いっそ、さっぱりと世の中に見切りをつけて、のんきな渡世をしている人のまねをして見たら、どうだね。」\n　桀溺はそういって、まいた種にせっせと土をかぶせ、それっきり見向きもしなかった。\n　子路も仕方なしに、先師のところに帰って行って、その旨を話した。すると先師はさびしそうにしていわれた。――\n「世をのがれるといったところで、まさか鳥や獣の仲間入りも出来まい。人間と生れたからには、人間と共に生きて行くよりほかはあるまいではないか。私にいわせると、濁った世の中であればこそ、世の中のために苦しんで見たいのだ。もし正しい道が行われている世の中なら、私も、こんなに世の中のために苦労はしないのだ。」",["jin","gi"]],[467,17,7,"子路従而後，遇丈人，以杖荷蓧。子路問曰：「子見夫子乎？」丈人曰：「四体不勤，五穀不分，孰為夫子？」植其杖而芸。子路拱而立。止子路宿，殺雞為黍而食之，見其二子焉。明日，子路行以吿。子曰：「隠者也。」使子路反見之。至則行矣。子路曰：「不仕無義。長幼之節，不可廢也；君臣之義，如之何其廢之？欲潔其身，而乱大倫。君子之仕也，行其義也。道之不行，已知之矣。」","子路従いて後る。丈人の杖を以て蓧を荷うに遇う。子路問いて曰く、子、夫子を見たるか。丈人曰く、四体勤めず、五穀分かたず、孰をか夫子と為す。其の杖を植てて芸る。子路拱して立つ。子路を止めて宿せしめ、鶏を殺し黍を為りて之に食らわしめ、其の二子を見えしむ。明日、子路行きて以て告ぐ。子曰く、隠者なり。子路をして反りて之を見しむ。至れば則ち行れり。子路曰く、仕えざれば義無し。長幼の節は廃すべからざるなり。君臣の義は之を如何ぞ其れ之を廃せん。其の身を潔くせんと欲して大倫を乱る。君子の仕うるや、其の義を行うなり。道の行われざるは、已に之を知れり。","道が行われないのは承知の上。それでも務めを果たすのが義。","報われないと分かっていても、果たすべき務めは何か。",["vision","lonely"],["疲れ"],2,"子路が先師の随行をしていて、道におくれた。たまたま一老人が杖に草籠をひっかけてかついでいるのに出あったので、彼はたずねた。――\n「あなたは私の先生をお見かけではありませんでしたか。」\n　老人がこたえた。――\n「なに？　先生だって？　お見かけするところ、その手足では百姓仕事をなさるようにも見えず、五穀の見分けもつかない方のようじゃが、それでいったいお前さんの先生というのはどんな人じゃな。」\n　老人はそれだけいって杖を地につき立てて、草をかりはじめた。――\n　子路は手を胸に組んで敬意を表し、そのそばにじっと立っていた。\n　すると老人は何と思ったか、子路を自分の家に案内して一泊させ、鶏をしめたり、黍飯をたいたりして彼をもてなしたうえに、自分の二人の息子を彼にひきあわせ、ていねいにあいさつさせた。\n　翌日、子路は先師に追いついて、その話をした。すると先師はいわれた。――\n「隠者だろう。」\n　そして、子路に、もう一度引きかえして会って来るように命じられた。\n　子路が行って見ると、老人はもういなかつた。子路は仕方なしに、二人の息子にこういって先師の心をつたえた。――\n「出でて仕える心がないのは義とはいえませぬ。もし、長幼の序が大切でありますなら、君臣の義をすてていいという道理はありますまい。道が行われないからといって自分の一身をいさぎよくすれば、大義をみだすことになります。君子が出でて仕えるのは、君臣の義を行うためでありまして、道が行われないこともあるということは、むろん覚悟のまえであります。」",["gi"]],[468,17,8,"逸民：伯夷、叔斉、虞仲、夷逸、朱張、柳下惠、少連。子曰：「不降其志，不辱其身，伯夷叔斉与！」謂柳下惠、少連：「降志辱身矣。言中倫，行中慮，其斯而已矣。」謂虞仲、夷逸：「隠居放言，身中淸，廢中権。」我則異於是，無可無不可。」","逸民は、伯夷・叔斉・虞仲・夷逸・朱張・柳下恵・少連。子曰く、其の志を降さず、其の身を辱めざるは、伯夷・叔斉か。柳下恵・少連を謂う、志を降し身を辱む。言は倫に中り、行いは慮に中る。其れ斯れのみ。虞仲・夷逸を謂う、隠居して放言す。身は清に中り、廃は権に中る。我は則ち是に異なり。可も無く不可も無し。","先人の型に自分をはめない。進むも退くも、その時の義に従う。","「こうあるべき」の型に縛られて、動けなくなっていないか。",["decide"],["迷い"],2,"古来、野の賢者として名高いのは、伯夷・叔斉・虞仲・夷逸・朱張・柳下恵・少連などであるが、先師はいわれた。\n「あくまでも志を曲げず、身を辱かしめなかったのは、伯夷と叔斉であろう。」\n　柳下恵と少連とについては、つぎのようにいわれた。――\n「志をまげ、身を辱しめて仕えたこともあったが、いうことはあくまでも人倫の道にかなっていたし、行動にも筋道が立っていた。二人はその点だけで、十分立派だ。」\n　虞仲と夷逸については、つぎのようにいわれた。――\n「隠遁して無遠慮な放言ばかりしていたが、しかし一身を守ることは清かったし、世を捨てたのは時宜に適した道だったと言えるだろう。」\n　先師は、それにつけ加えて更にいわれた。――\n「私は、しかし、こうした人たちとはちがう。私は、はじめから隠遁がいいとかわるいとかを決めてかかるような、片意地な態度には出たくないのだ。」",["gi"]],[469,17,9,"大師摯適斉，亞飯干適楚，三飯繚適蔡，四飯缺適秦。鼓方叔入於河，播鼗武入於漢，少師陽、擊磬襄入於海。","大師摯は斉に適く。亜飯干は楚に適く。三飯繚は蔡に適く。四飯欠は秦に適く。鼓方叔は河に入る。播鼗武は漢に入る。少師陽・撃磬襄は海に入る。","魯の楽師たちが、国の乱れとともに各地へ散っていった。","",[],[],0,"楽長の摯は斉に去った。亜飯の干は楚に去った。三飯の繚は蔡に去った。四飯の欠は秦に去った。鼓師の方叔は河内に逃げた。振り鼓師の武は漢に逃げた。楽官補佐の陽と、磬打ち役の襄とは海をこえて島に逃げた。",[]],[470,17,10,"周公謂魯公曰：「君子不施其親，不使大臣怨乎不以。故旧無大故，則不棄也，無求備於一人。」","周公、魯公に謂いて曰く、君子は其の親を施てず。大臣をして以いられざるを怨ましめず。故旧大故無ければ、則ち棄てず。備わるを一人に求むること無かれ。","身内と古参を大切にし、一人に完璧を求めない。","一人の部下に、何もかも求めすぎていないか。",["lead","grow","judge"],[],3,"周公が魯公にいわれた。――\n「君主たるものは親族を見捨てるものではない。大臣をして信任のうすきをかこたせてはならぬ。古くからの臣下は、重大な理由がなければ棄てないがいい。一人の人に何もかも備わるのを求めてはならぬ。」",["jin"]],[471,17,11,"周有八士：伯達、伯适、仲突、仲忽、叔夜、叔夏、季隨、季騧。","周に八士有り。伯達・伯适・仲突・仲忽・叔夜・叔夏・季随・季騧。","周の盛時に現れた、八人の優れた人物の名を挙げる。","",[],[],0,"周に八人の人物がいた。伯達・伯・仲突・仲忽・叔夜・叔夏・季随・季※［＃「馬＋咼」、U+9A27、433-下-2］がそれである。",[]],[472,18,1,"子張曰：「士見危致命，見得思義，祭思敬，喪思哀，其可已矣。」","子張曰く、士は危うきを見ては命を致し、得るを見ては義を思い、祭には敬を思い、喪には哀を思う。其れ可なるのみ。","危機には身を投げ出し、利益を前にしては筋を考える。","目の前の利益は、受け取って筋の通るものか。",["profit","decide"],[],2,"子張がいった。――\n「士たるものは、公けの任務において危難に直面したら生命を投げ出してそれに当るべきだ。利得に恵まれる機会があったら、それをうけることが正義に合するかどうかを思うべきだ。そして祭事には敬虔の念があふれ、喪には悲哀の情があふれるならば、士と称するに足るであろう。」",["gi","rei"]],[473,18,2,"子張曰：「執徳不弘，信道不篤，焉能為有？焉能為亡？」","子張曰く、徳を執ること弘からず、道を信ずること篤からずんば、焉んぞ能く有りと為さん、焉んぞ能く亡しと為さん。","徳が狭く信念も浅い人は、いてもいなくても変わらない。","自分の信念は、腹の底から信じているものか。",["vision","self"],[],2,"子張がいった。――\n「何か一つの徳に固まって、ひろく衆徳を修めることが出来ず、正道を信じても、それが腹の底からのものでなければ、そんな人は居ても大して有りがたくないし、いなくても大して惜しくはない。」",["gi","shin"]],[474,18,3,"子夏之門人，問「交」於子張。子張曰：「子夏云何？」対曰：「子夏曰：『可者与之，其不可者拒之。』」子張曰：「異乎吾所聞；『君子尊賢而容眾，嘉善而矜不能。』我之大賢与，於人何所不容？我之不賢与，人将拒我，如之何其拒人也？」","子夏の門人、交わりを子張に問う。子張曰く、子夏は何とか云える。対えて曰く、子夏曰く、可なる者は之に与し、其の不可なる者は之を拒めと。子張曰く、吾が聞く所に異なり。君子は賢を尊びて衆を容れ、善を嘉して不能を矜れむ。我の大賢ならんか、人に於て何の容れざる所かあらん。我の不賢ならんか、人将に我を拒まんとす。之を如何ぞ其れ人を拒まんや。","優れた人を敬い、できない人も受け入れる。人を拒む前に器を広げる。","付き合う人を選ぶ前に、自分の器は足りているか。",["judge","trust","lead"],[],2,"子夏の門人が人と交る道を子張にたずねた。子張がいった。――\n「子夏は何といったのか。」\n　子夏の門人がこたえた。――\n「為めになる人と交り、為めにならない人とは交るな、といわれました。」\n　子張がいった。――\n「それは私の学んだこととはちがっている。君子は賢者を尊ぶと共に衆人を包容し、善人を称讃すると共に無能の人をあわれむ、と私はきいている。自分がもし大賢であるなら、誰と交ろうと平気だし、自分がもし賢くなければ、こちらが相手をきらうまえに、相手がこちらをきらうだろう。」",["jin"]],[475,18,4,"子夏曰：「雖小道，必有可観者焉，致遠恐泥，是以君子不為也。」","子夏曰く、小道と雖も必ず観るべき者有り。遠きを致すには泥まんことを恐る。是を以て君子は為さざるなり。","小さな技にも価値はあるが、遠くを目指すなら足を取られる。","遠い目標の妨げになっている、目先の得意分野は何か。",["decide","vision"],[],2,"子夏がいった。――\n「一技一芸の小さな道にも、それぞれに意義はある。しかし、そうした道で遠大な人生の理想を行おうとすると、おそらく行き詰りが来るであろう。だから君子はそういうことに専念しないのである。」",["chi"]],[476,18,5,"子夏曰：「日知其所亡，月無忘其所能，可謂好学也已矣。」","子夏曰く、日に其の亡き所を知り、月に其の能くする所を忘るること無し。学を好むと謂うべきのみ。","毎日新しいことを知り、毎月身につけたことを確かめる。","今日知った新しいことは何か。今月、何を忘れていないか。",["vision","self"],[],3,"子夏がいった。――\n「日ごとに自分のまだ知らないことを知り、月ごとに、すでに知り得たことを忘れないようにつとめる。そういう心がけであってこそ、真に学問を好むといえるだろう。」",["chi"]],[477,18,6,"子夏曰：「博学而篤志，切問而近思，仁在其中矣。」","子夏曰く、博く学びて篤く志し、切に問いて近く思う。仁其の中に在り。","広く学び、志を固め、切実に問い、身近に引き寄せて考える。","学んだことを、自分の足元の問題として考えているか。",["vision","self"],[],2,"子夏がいった。\n「ひろく学んで見聞をゆたかにし、理想を追求して一心不乱になり、疑問が生じたら切実に師友の教えを求め、すべてを自分の実践上の事として工夫するならば、最高の徳たる仁は自然にその中から発展するであろう。」",["chi","jin"]],[478,18,7,"子夏曰：「百工居肆以成其事，君子学以致其道。」","子夏曰く、百工は肆に居て以て其の事を成し、君子は学びて以て其の道を致す。","職人が仕事場で技を仕上げるように、君子は学びで道を極める。","自分の道を極めるための「仕事場」に、毎日立っているか。",["vision"],[],2,"子夏がいった。――\n「もろもろの技術家はその職場においてそれぞれの仕事を完成し、君子は学問において人間の道を極める。」",["chi"]],[479,18,8,"子夏曰：「小人之過也必文。」","子夏曰く、小人の過つや、必ず文る。","器の小さい人は、過ちを犯すと必ず取り繕う。","いま言い訳で飾ろうとしている失敗はないか。",["fail","self","judge"],[],3,"子夏がいった。――\n「小人が過ちを犯すと、必ずそれをかざるものである。」",["shin"]],[480,18,9,"子夏曰：「君子有三変：望之儼然，卽之也温，聴其言也厲。」","子夏曰く、君子に三変有り。之を望めば儼然たり。之に即けば温なり。其の言を聴けば厲し。","遠目には威厳、近づけば温かく、言葉は厳正。それが君子。","近づいた人に、温かさは伝わっているか。",["lead","self"],[],2,"子夏がいった。――\n「君子に接すると三つの変化が見られる。遠くから望むと儼然としており、近づいて見ると柔和な顔をしており、その言葉をきくと確乎として犯しがたい。」",["rei"]],[481,18,10,"子夏曰：「君子信而後労其民，未信則以為厲己也。信而後諫，未信則以為謗己也。」","子夏曰く、君子は信ぜられて而る後に其の民を労す。未だ信ぜられざれば、則ち以て己を厲ましむと為す。信ぜられて而る後に諫む。未だ信ぜられざれば、則ち以て己を謗ると為す。","信頼が先、要求は後。信頼なしの指示も諫言も、攻撃と受け取られる。","厳しい要求をする前に、信頼の貯えは十分にあるか。",["lead","trust"],[],3,"子夏がいった。――\n「君子は人民の信頼を得て然る後に彼等を公けのことに働かせる。信頼を得ないで彼等を働かせると、彼等は自分たちが苦しめられているように思うだろう。また、君子は君主の信任を得て然る後に君主を諌める。まだ信任されないうちに諌めると、君主は自分がそしられているように思うだろう。」",["shin"]],[482,18,11,"子夏曰：「大徳不踰閑，小徳出入可也。」","子夏曰く、大徳は閑を踰えず。小徳は出入すとも可なり。","大きな筋さえ外さなければ、小さな点の出入りは許してよい。","細かな点を責めて、大筋を見失っていないか。",["decide","grow","lead"],[],2,"子夏がいった。――\n「大徳が軌道をはずれていなければ、小徳は多少の出入りがあっても、さしてとがむべきではない。」",["gi"]],[483,18,12,"子游曰：「子夏之門人小子，当洒掃応対進退則可矣，抑末也；本之則無，如之何？」子夏聞之曰：「噫！言游過矣！君子之道，孰先伝焉？孰後倦焉？譬諸草木，區以別矣。君子之道，焉可誣也？有始有卒者，其惟聖人乎！」","子游曰く、子夏の門人小子、洒掃・応対・進退に当たりては則ち可なり。抑末なり。之を本づくれば則ち無し。之を如何。子夏之を聞きて曰く、噫、言游過てり。君子の道は、孰れをか先にし伝え、孰れをか後にし倦まん。諸を草木に譬うれば、区して以て別あり。君子の道は、焉んぞ誣うべけんや。始め有り卒わり有る者は、其れ惟聖人か。","教える順序は相手次第。草木のように、人に応じて育て分ける。","相手の段階に合った順序で、教えられているか。",["grow"],[],2,"子游がいった。――\n「子夏の門下の青年たちは、掃除や、応対や、いろんな作法などはなかなかうまくやっている。しかし、そんなことはそもそも末だ。根本になることは何も教えられていないようだが、いったいどうしたというのだろう。」\n　子夏がそれをきいていった。――\n「ああ、言游もとんでもないまちがったことをいったものだ。君子が人を導くには、何が重要だから先に教えるとか、何が重要でないから当分ほっておくとか、一律にきめてかかるべきではない。たとえば草木を育てるようなもので、その種類に応じて、取りあつかいがちがっていなければならないのだ。君子が人を導くのに、無理があっていいものだろうか。道の本末がすべて身についているのは、ただ聖人だけで、一般の人々には、その末になることさえまだ身についていないのだから、むしろそういうことから手をつけるのが順序ではあるまいか。」",["chi"]],[484,18,13,"子夏曰：「仕而優則学，学而優則仕。」","子夏曰く、仕えて優なれば則ち学び、学びて優なれば則ち仕う。","仕事に余力があれば学び、学んで余力があれば仕事に生かす。","仕事と学びの間を、行き来できているか。",["vision"],[],2,"子夏がいった。――\n「仕えて餘力があったら学問にはげむがいい。学問をして餘力があったら、出でて仕えるがいい。」",["chi"]],[485,18,14,"子游曰：「喪致乎哀而止。」","子游曰く、喪は哀を致して止む。","喪は悲しみを尽くせばそれで足り、飾り立てる必要はない。","",[],[],0,"子游がいった。――\n「喪にあたっては、哀悼の至情をつくせばそれでいいので、形式をかざる必要はない。」",["rei","jin"]],[486,18,15,"子游曰：「吾友張也，為難能也，然而未仁。」","子游曰く、吾が友張や、能くし難きを為す。然れども未だ仁ならず。","子張は難事をやってのけるが、まだ仁者とは言えないという評。","",[],[],0,"子游がいった。――\n「友人の張は、困難なことをやりとげる男ではあるが、まだ仁者だとはいえない。」",[]],[487,18,16,"曽子曰：「堂堂乎張也，難与並為仁矣。」","曾子曰く、堂堂たるかな張や。与に並びて仁を為し難し。","子張は堂々として立派だが、共に仁を磨き合うのは難しいという評。","",[],[],0,"曾先生がいわれた。――\n「堂々たるものだ、張の態度は。だが、相たすけて仁の道を歩める人ではない。」",[]],[488,18,17,"曽子曰：「吾聞諸夫子：『人未有自致者也，必也親喪乎！』」","曾子曰く、吾諸を夫子に聞けり。人未だ自ら致す者有らざるなり。必ずや親の喪か。","人が心の底から自分を出し尽くすのは、親を亡くした時くらいだ。","",[],[],0,"曾先生がいわれた。――\n「私は先生がこんなことをいわれたのをきいたことがある。人間が自己の全部を出しきってしまうということは、先ずないものだが、せめて親の死を悲しむ時ぐらいは、そうありたいものだ、と。」",["jin"]],[489,18,18,"曽子曰：「吾聞諸夫子：『孟荘子之孝也，其他可能也，其不改父之臣，与父之政，是難能也。』」","曾子曰く、吾諸を夫子に聞けり。孟荘子の孝や、其の他は能くすべきなり。其の父の臣と父の政とを改めざるは、是れ能くし難きなり。","父の家臣と政策を変えなかった点こそ、真似しがたい孝行。","引き継いだ人と方針を、変える前に十分に敬っているか。",["lead","decide"],[],1,"曾先生がいわれた。――\n「私は先生がこんなことをいわれたのを聞いたことがある。孟荘子の親孝行も、ほかのことはまねが出来るが、父の死後、その重臣とその政治方式とを改めなかった点は、容易にまねの出来ないことだ、と。」",["jin"]],[490,18,19,"孟氏使陽膚為士師，問於曽子。曽子曰：「上失其道，民散久矣！如得其情，則哀矜而勿喜。」","孟氏、陽膚をして士師たらしむ。曾子に問う。曾子曰く、上其の道を失いて、民散ずること久し。如し其の情を得ば、則ち哀矜して喜ぶこと勿かれ。","下の過ちを暴いて得意になるな。上の失政の結果と知り、哀れめ。","部下の不正や失敗を、自分の治め方の結果として見ているか。",["lead","trust"],[],2,"孟氏が陽膚を司法官に任用した。陽膚は曾先生に司法官としての心得をたずねた。曾先生はいわれた。――\n「政道がみだれ、民心が離散してすでに久しいものだ。だから人民の罪状をつかんでも、なるだけあわれみを、かけてやるがいい。罪状をつかんだのを手柄に思って喜ぶようなことがあってはならないのだ。」",["jin"]],[491,18,20,"子貢曰：「紂之不善，不如是之甚也。是以君子悪居下流，天下之悪皆帰焉。」","子貢曰く、紂の不善は、是くの如く之れ甚だしからざるなり。是を以て君子は下流に居るを悪む。天下の悪皆焉に帰す。","一度悪評の溜まり場に立てば、世の悪がすべて自分に集まる。","悪い評判が集まりやすい立ち位置に、身を置いていないか。",["self","trust"],[],2,"子貢がいった。――\n「殷の紂王の悪行も実際はさほどではなかったらしい。しかし、今では罪悪の溜池ででもあったかのようにいわれている。だから君子は道徳的低地に居って、天下の衆悪が一身に帰せられるのを悪むのだ。」",["shin"]],[492,18,21,"子貢曰：「君子之過也，如日月之食焉。過也，人皆見之；更也，人皆仰之。」","子貢曰く、君子の過ちや、日月の食の如し。過つや人皆之を見る。更むるや人皆之を仰ぐ。","上に立つ者の過ちは皆に見える。隠さず改めれば、皆が仰ぎ見る。","皆に見えている自分の過ちを、堂々と改められるか。",["fail","lead"],["落胆"],3,"子貢がいった。――\n「君子の過ちは日蝕や月蝕のようなものである。過ちがあると、すべての人がそのかげりを見るし、過ちを改めると、すべての人がその光を仰ぐのだから。」",["shin","gi"]],[493,18,22,"衛公孫朝問於子貢曰：「仲尼焉学？」子貢曰：「文、武之道，未墜於地，在人。賢者識其大者，不賢者識其小者，莫不有文、武之道焉。夫子焉不学？而亦何常師之有？」","衛の公孫朝、子貢に問いて曰く、仲尼焉にか学べる。子貢曰く、文武の道、未だ地に墜ちずして人に在り。賢者は其の大なる者を識し、不賢者は其の小なる者を識す。文武の道有らざること莫し。夫子焉にか学ばざらん。而して亦何の常師か之れ有らん。","道は人々の中に生きている。誰からでも学べ、決まった師は要らない。","身近な誰から、まだ学べていないことがあるか。",["vision","grow"],[],2,"衛の公孫朝が子貢にたずねていった。――\n「仲尼は誰について道を学ばれたのか。」\n　子貢がこたえた。――\n「文王・武王の道は地におちてほろびたわけではありません。それはまだ人々の間に生かされています。賢者はその大道を心得ていますし、不賢者もその小道ぐらいは心得ていますので、万人に道が残っているともいえるのです。かようなわけでございますから、私共の先生にとっては、すべての人が師でありまして、これといってきまった師があるわけではありません。」",["chi"]],[494,18,23,"叔孫武叔語大夫於朝，曰：「子貢賢於仲尼。」子服景伯以吿子貢。子貢曰：「譬之宮牆，賜之牆也及肩，闚見室家之好；夫子之牆数仞，不得其門而入，不見宗廟之美、百官之富。得其門者或寡矣。夫子之云，不亦宜乎！」","叔孫武叔、大夫に朝に語げて曰く、子貢は仲尼より賢れり。子服景伯以て子貢に告ぐ。子貢曰く、之を宮牆に譬うれば、賜の牆や肩に及ぶ。室家の好きを闚い見る。夫子の牆は数仞、其の門を得て入らざれば、宗廟の美、百官の富を見ず。其の門を得る者或いは寡なし。夫子の云えること、亦宜ならずや。","低い塀は中が覗けるが、高い塀の奥は門を入った者にしか見えない。","分かりやすさだけで、人の器を測っていないか。",["judge","lonely"],[],1,"叔孫武叔が朝廷で諸大夫に向っていった。――\n「子貢は仲尼以上の人物だと思います。」\n　子服景伯がそのことを子貢に話した。すると子貢はいった。――\n「とんでもないことです。これを宮殿の塀にたとえて見ますと、私の塀は肩ぐらいの高さで、人はその上から建物や室内のよさがのぞけますが、先生の塀は何丈という高さですから、門をさがしあてて中にはいって見ないと、御霊屋の美しさや、文武百官の盛んな装おいを見ることが出来ないのです。しかし、考えて見ると、その門をさがしあてるのが容易ではありませんので、大夫がそんなふうにいわれるのも、或は無理のないことかも知れません。」",[]],[495,18,24,"叔孫武叔毀仲尼。子貢曰：「無以為也，仲尼不可毀也。他人之賢者，丘陵也，猶可踰也；仲尼，日月也，無得而踰焉。人雖欲自絕，其何傷於日月乎？多見其不知量也！」","叔孫武叔、仲尼を毀る。子貢曰く、以て為すこと無かれ。仲尼は毀るべからざるなり。他人の賢者は丘陵なり、猶踰ゆべきなり。仲尼は日月なり、得て踰ゆること無し。人自ら絶たんと欲すと雖も、其れ何ぞ日月を傷らんや。多に其の量を知らざるを見るなり。","太陽や月をそしっても傷つかない。そしる側の器が知れるだけ。","その批判は、自分の本質を傷つけるほどのものか。",["trust","lonely"],["怒り"],1,"叔孫武叔が仲尼をそしった。すると子貢がいった。\n「そういうことは仰しゃらない方がよろしいかと存じます。仲尼先生は傷つけようとしても傷つけることの出来ない方です。ほかの賢者は丘陵のようなもので、ふみこえることも出来ましょうが、仲尼先生は日月のように高くかかっていられて、ふみこえることが出来ません。仲尼先生をそしって、絶縁なさいましても、日月のようなあの方にとっては何の損害もないことです。却ってそしる人自身が自分の力を知らないということを暴露するに過ぎないでしょう。」",[]],[496,18,25,"陳子禽謂子貢曰：「子為恭也，仲尼豈賢於子乎？」子貢曰：「君子一言以為知，一言以為不知，言不可不慎也！夫子之不可及也，猶天之不可階而升也。夫子之得邦家者，所謂『立之斯立，道之斯行，綏之斯来，動之斯和。其生也栄，其死也哀』。如之何其可及也？」","陳子禽、子貢に謂いて曰く、子は恭を為すなり。仲尼豈子より賢らんや。子貢曰く、君子は一言以て知と為し、一言以て不知と為す。言は慎まざるべからざるなり。夫子の及ぶべからざるや、猶天の階して升るべからざるがごときなり。夫子にして邦家を得ば、所謂之を立つれば斯に立ち、之を道びけば斯に行き、之を綏んずれば斯に来たり、之を動かせば斯に和す。其の生くるや栄え、其の死するや哀しまる。之を如何ぞ其れ及ぶべけんや。","一言で賢くも愚かにも見られる。言葉は慎まねばならない。","軽い一言で、信頼を損ねたことはなかったか。",["self","lead"],[],1,"陳子禽が子貢にいった。――\n「あなたはご謙遜が過ぎます。仲尼先生といえどもあなた以上だとは私には思えません。」\n　すると子貢がいった。――\n「君子は一言で知者ともいわれ、一言で愚者ともいわれる。だから、口はうっかりきくものではない。先生が、われわれの到底及びもつかない方であられるのは、ちょうど天に梯子をかけて登れないのと同じようなものだ。もし先生が国家を治める重任につかれたら、それこそ古語にいわゆる、「これを立つればここに立ち、これを導けばここに行われ、これを安んずればここに来り、これを動かせばここに和らぐ。その生や栄え、その死やかなしむ。」とある通り、民生もゆたかになり、道義も作興し、人民は帰服して平和を楽しみ、先生の御存命中はその政治をたたえ、亡くなられたらその徳を慕うて心から悲しむだろう。とても、とても、私などの及ぶところではないのだ。」",["rei","chi"]],[497,19,1,"堯曰：「咨！爾舜！天之暦数在爾躬，允執其中！四海困窮，天禄永終。」舜亦以命禹。曰：「予小子履，敢用玄牡，敢昭吿于皇皇后帝：有罪不敢赦。帝臣不蔽，簡在帝心！朕躬有罪，無以万方；万方有罪，罪在朕躬。」「周有大賚，善人是富。」「雖有周親，不如仁人；百姓有過，在予一人。」謹権量，審法度，脩廢官，四方之政行焉。興滅国，継絕世，挙逸民，天下之民帰心焉。所重：民、食、喪、祭。寬則得眾，信則民任焉，敏則有功，公則説。","堯曰く、咨、爾舜、天の暦数、爾の躬に在り。允に其の中を執れ。四海困窮せば、天禄永く終えん。舜も亦以て禹に命ず。曰く、予小子履、敢えて玄牡を用いて、敢えて昭らかに皇皇たる后帝に告ぐ。罪有るは敢えて赦さず。帝臣蔽わず、簡ぶこと帝の心に在り。朕が躬に罪有らば、万方を以てすること無かれ。万方に罪有らば、罪は朕が躬に在り。周に大いなる賚有り、善人是れ富めり。周親有りと雖も、仁人に如かず。百姓過ち有らば、予一人に在り。権量を謹み、法度を審らかにし、廃官を修むれば、四方の政行わる。滅国を興し、絶世を継ぎ、逸民を挙ぐれば、天下の民、心を帰す。重んずる所は、民、食、喪、祭。寛なれば則ち衆を得、信なれば則ち民任ず、敏なれば則ち功有り、公なれば則ち説ぶ。","古の聖王の言葉。民の過ちは我が責任。寛・信・敏・公が政治の要。","組織の失敗を「自分一人の責任」と引き受けられるか。",["lead","fail"],[],1,"堯帝が天子の位を舜帝に譲られたとき、いわれた。――\n「ああ、汝、舜よ。天命今や汝の身に下って、ここに汝に帝位をゆずる。よく中道をふんで政を行え。もし天下万民を困窮せしめることがあれば、天の恵みは永久に汝の身を去るであろう。」\n　舜帝が夏の禹王に位を譲られるときにも、同じ言葉をもってせられた。\n　夏は桀王にいたって無道であったため、殷の湯王がこれを伐ち、天命をうけて天子となったが、その時、湯王は天帝に告げていわれた。\n「小さき者、履、つつしんで黒き牡牛をいけにえにして、敢て至高至大なる天帝にことあげいたします。私はみ旨を奉じ万民の苦悩を救わんがために、天帝に罪を得た者を誅しました。天帝のみ心に叶う臣下はすべてその徳が蔽われないよう致したいと思います。私は天帝のみ心のまにまに私の進むべき道を選ぶのみであります。」\n　更に諸侯に告げていわれた。――\n「もしわが身に罪あらば、それはわれひとりの罪であって、万民の罪ではない。もし万民に罪あらば、それは万民の罪でなくて、われひとりの罪である。」\n　殷は紂王にいたって無道であったため、周の武王がこれを伐ち、天命をうけて天子となったが、その時、武王は天帝に誓っていわれた。――\n「周に下された大きな御賜物を感謝いたします。周には何と善人が多いことでございましょう。いかに親しい身内のものが居りましょうとも、仁人の多きには及びませぬ。かように仁人に恵まれて、なお百姓に罪がありますならば、それは私ひとりの罪でございます。」\n　武王はこうして、度量衡を厳正にし、礼楽制度をととのえ、すたれた官職を復活して、四方の政治に治績を挙げられた。また、滅亡した国を復興し、断絶した家を再建し、野にあった賢者を挙用して、天下の民心を帰服せしめられた。とりわけ重んじられたのは、民の食と喪と祭とであった。\n　かように、君たる者が寛大であれば衆望を得、信実であれば民は信頼し、勤敏であれば功績があがり、公正であれば民は悦ぶ。これが政治の要道であり、堯帝・舜帝・禹王・湯王・武王の残された道である。",["shin","jin"]],[498,19,2,"子張問於孔子曰：「何如斯可以従政矣？」子曰：「尊五美，屛四悪，斯可以従政矣。」子張曰：「何謂五美？」子曰：「君子惠而不費，労而不怨，欲而不貪，泰而不驕，威而不猛。」子張曰：「何謂惠而不費？」子曰：「因民之所利而利之，斯不亦惠而不費乎！択可労而労之，又誰怨？欲仁而得仁，又焉貪？君子無眾寡，無小大，無敢慢，斯不亦泰而不驕乎？君子正其衣冠，尊其瞻視，儼然人望而畏之，斯不亦威而不猛乎！」子張曰：「何謂四悪？」子曰：「不教而殺謂之虐；不戒視成謂之暴；慢令致期謂之賊；猶之与人也，出納之吝，謂之有司。」","子張、孔子に問いて曰く、何如なれば斯れ以て政に従うべき。子曰く、五美を尊び、四悪を屏くれば、斯れ以て政に従うべし。子張曰く、何をか五美と謂う。子曰く、君子は恵して費やさず、労して怨みず、欲して貪らず、泰にして驕らず、威にして猛からず。子張曰く、何をか恵して費やさずと謂う。子曰く、民の利とする所に因りて之を利す、斯れ亦恵して費やさざるにあらずや。労すべきを択びて之を労す、又誰をか怨みん。仁を欲して仁を得たり、又焉んぞ貪らん。君子は衆寡と無く、小大と無く、敢えて慢ること無し、斯れ亦泰にして驕らざるにあらずや。君子は其の衣冠を正し、其の瞻視を尊くし、儼然として人望みて之を畏る、斯れ亦威にして猛からざるにあらずや。子張曰く、何をか四悪と謂う。子曰く、教えずして殺す、之を虐と謂う。戒めずして成るを視る、之を暴と謂う。令を慢りにして期を致す、之を賊と謂う。猶しく之れ人に与うるなり、出納の吝かなる、之を有司と謂う。","教えずに罰し、予告なく成果を求め、期限だけ厳しくするのは上に立つ者の悪。","教えもせず、予告もせずに、結果だけを責めていないか。",["lead","grow","self"],["怒り"],2,"子張が先師にたずねていった。――\n「どんな心がけであれば政治の任にあたることが出来ましょうか。」\n　先師がこたえられた。――\n「五つの美を尊んで四つの悪をしりぞけることが出来たら、政治の任にあたることが出来るであろう。」\n　子張がたずねた。――\n「五つの美というのは、どういうことでございましょう。」\n　先師がこたえられた。――\n「君子は恩恵を施すのに費用をかけない。民に労役を課して怨まれない。欲することはあるが貪ることはない。泰然としているが驕慢ではない。威厳はあるが猛々しくはない。これが五つの美だ。」\n　子張がその説明を求めた。先師はこたえられた。――\n「人民自ら利とするところによって人民を利する、いいかえると安んじて生業にいそしませる、それが何よりの恩恵で、それには徒らに財物を恵むような失費を必要としないであろう。正当な労役や人民が喜ぶような労役をえらんで課するならば、誰を人民が怨みよう。欲することが仁であり、得ることが仁であるならば、貪るということにはならないではないか。君子は相手の数の多少にかかわらず、また事の大小にかかわらず、慢心をおこさないで慎重に任務に当る。これが泰然として驕慢でないということではないか。君子は服装を正しくし、容姿を厳粛にするので、自然に人に畏敬される。これが威厳があって猛々しくないということではないか。」\n　子張がたずねた。――\n「四つの悪というのは、どういうことでございましょう。」\n　先師がこたえられた。――\n「民を教化しないで罪を犯すものがあると殺す、それは残虐というものだ。何の予告も与えないでやにわに成績をしらべる、それは無茶というものだ。命令を出す時をいい加減にして、実行の期限だけをきびしくする。それは人民をわなにかけるというものだ。どうせ出すものは出さなければならないのに、勿体をつけて出し惜しみをする、それは小役人根性というものだ。」",["jin","rei"]],[499,19,3,"子曰：「不知命，無以為君子也；不知礼，無以立也；不知言，無以知人也。」","子曰く、命を知らざれば、以て君子たること無きなり。礼を知らざれば、以て立つこと無きなり。言を知らざれば、以て人を知ること無きなり。","天命を知り、礼を知り、言葉を知る。それが人の上に立つ土台。","相手の言葉から、その人の本心を聞き取れているか。",["vision","judge","self"],["迷い"],2,"先師がいわれた。――\n「天命を知らないでは君子たる資格がない。礼を知らないでは世に立つことが出来ない。言葉を知らないでは人を知ることが出来ない。」",["chi","rei"]]];

const $=s=>document.querySelector(s);
const view=$("#view");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem("rongo-fav")||"[]"))}catch(e){}
const saveFav=()=>{try{localStorage.setItem("rongo-fav",JSON.stringify([...favs]))}catch(e){}};
const st={tab:"home",scene:null,emo:null,toku:null,tf:null,sf:null,book:0,q:"",open:new Set(),limit:20};

const ref=d=>`${BOOKS[d[1]]}第${d[1]+1}・${d[2]}章`;
function rank(list,scene){
  return list.slice().sort((a,b)=>{
    if(scene){const ia=a[7].indexOf(scene),ib=b[7].indexOf(scene);
      const sa=a[9]*2-(ia<0?9:ia), sb=b[9]*2-(ib<0?9:ib); if(sb!==sa)return sb-sa}
    else if(b[9]!==a[9])return b[9]-a[9];
    return a[0]-b[0]});
}
function card(d){
  const open=st.open.has(d[0]),fav=favs.has(d[0]);
  return `<article class="card" data-n="${d[0]}">
   <div class="meta">${d[9]===3?'<span class="seal">名句</span>':''}<span>${ref(d)}</span>${(d[11]||[]).map(t=>`<button class="tbadge t-${t}" data-toku="${t}" title="${tk(t)[1]}徳の章を見る">${tk(t)[1]}</button>`).join("")}</div>
   <p class="hito">${esc(d[5])}</p>
   <p class="kaki ${open?'':'clamp'}">${esc(d[4])}</p>
   ${d[6]?`<p class="toi">${esc(d[6])}</p>`:''}
   ${open?`<div class="more">
     <div><h3>現代語訳（下村湖人）</h3><p>${esc(d[10])}</p></div>
     ${d[3]?`<div><h3>原文</h3><p class="gen">${esc(d[3])}</p></div>`:''}
     ${d[7].length?`<div class="chips">${d[7].map(s=>`<button class="chip" data-go="${s}">${SCENES.find(x=>x[0]===s)[1]}</button>`).join("")}</div>`:''}
   </div>`:''}
   <div class="actions"><button data-act="open">${open?'閉じる':'現代語訳と原文を読む'}</button>
   <button class="fav" data-act="fav" aria-pressed="${fav}">${fav?'しおり済み':'しおりを挟む'}</button></div>
  </article>`;
}
function listHtml(items){
  if(!items.length)return `<p class="empty">当てはまる章がありません。言葉を変えるか、悩みの入口から探してください。</p>`;
  const shown=items.slice(0,st.limit);
  return `<div class="list">${shown.map(card).join("")}</div>`+(items.length>st.limit?`<button class="morebtn" data-act="more">続きを見る（残り${items.length-st.limit}章）</button>`:'');
}
function search(q){
  const hitScenes=Object.keys(HINTS).filter(k=>HINTS[k].some(w=>q.includes(w)));
  const hitTokus=TOKUS.filter(t=>q.includes(t[1]+"徳")).map(t=>t[0]);
  const words=q.split(/[\s　、。]+/).filter(Boolean);
  const scored=[];
  for(const d of D){
    let s=0;const hay=d[5]+d[4]+d[6]+d[10]+d[3];
    for(const w of words) if(hay.includes(w)) s+=4;
    hitScenes.forEach(k=>{const i=d[7].indexOf(k); if(i>=0) s+=3-i});
    hitTokus.forEach(k=>{const i=(d[11]||[]).indexOf(k); if(i>=0) s+=5-i*2});
    if(s>0) scored.push([s+d[9],d]);
  }
  scored.sort((a,b)=>b[0]-a[0]||a[1][0]-b[1][0]);
  return {items:scored.map(x=>x[1]),hitScenes,hitTokus};
}
function today(){
  const top=D.filter(d=>d[9]===3&&d[4].length<90); if(!top.length)return "";
  const now=new Date(),k=now.getFullYear()*372+now.getMonth()*31+now.getDate();
  const d=top[k%top.length];
  return `<section class="today"><span class="label">今日の一章　${ref(d)}</span>
    <div class="tate">${esc(d[4])}</div><p class="hito">${esc(d[5])}</p>
    <button class="linkish" data-jump="${d[0]}">この章を読む</button></section>`;
}
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===st.tab));
  let h="";
  if(st.q){
    const r=search(st.q);
    h=`<div class="resulthead"><h2>「${esc(st.q)}」で見つかった章　${r.items.length}</h2>
      ${r.hitScenes.length||r.hitTokus.length?`<div class="chips">${r.hitScenes.map(s=>`<button class="chip" data-go="${s}">${SCENES.find(x=>x[0]===s)[1]}</button>`).join("")}${r.hitTokus.map(t=>`<button class="chip" data-toku="${t}">${tk(t)[1]}徳</button>`).join("")}</div>`:''}</div>`+listHtml(r.items);
  }else if(st.tab==="home"&&!st.scene){
    h=today()+`<section class="stack" style="gap:12px"><h2>いま、何に悩んでいますか</h2>
      <div class="scenes">${SCENES.map(s=>`<button class="scene" data-go="${s[0]}"><span><b>${s[1]}</b><span class="sub">${s[2]}</span></span><span class="cnt">${D.filter(d=>d[9]>0&&d[7].includes(s[0])).length}章</span></button>`).join("")}</div></section>`;
  }else if(st.tab==="home"){
    const s=SCENES.find(x=>x[0]===st.scene);
    let items=D.filter(d=>d[9]>0&&d[7].includes(st.scene));
    const emos=EMOS.filter(e=>items.some(d=>d[8].includes(e)));
    const tc={};items.forEach(d=>(d[11]||[]).forEach((t,i)=>tc[t]=(tc[t]||0)+(i?1:2)));
    const domi=Object.keys(tc).sort((a,b)=>tc[b]-tc[a]).slice(0,2);
    if(st.emo)items=items.filter(d=>d[8].includes(st.emo));
    if(st.tf)items=items.filter(d=>(d[11]||[]).includes(st.tf));
    h=`<div class="resulthead"><button class="back" data-act="back">← 悩みの一覧へ</button><h2>${s[1]}</h2><p class="lead">${s[2]}。効きそうな順に並べています。${domi.length?`この悩みで多く説かれるのは ${domi.map(t=>`<span class="tbadge t-${t}">${tk(t)[1]}徳</span>`).join(" と ")} です。`:''}</p>
      <div class="chips"><span class="chiplabel">五徳</span>${TOKUS.map(t=>`<button class="chip" data-tf="${t[0]}" aria-pressed="${st.tf===t[0]}">${t[1]}</button>`).join("")}</div>
      <div class="chips"><span class="chiplabel">感情</span>${emos.map(e=>`<button class="chip" data-emo="${e}" aria-pressed="${st.emo===e}">${e}</button>`).join("")}</div></div>`+listHtml(rank(items,st.scene));
  }else if(st.tab==="toku"&&!st.toku){
    h=`<section class="stack" style="gap:12px"><h2>五徳から引く</h2>
      <p class="lead">徳とは「生まれたままの素直な心で生きること」。そこに行動があってこそ徳になります。磨きたい徳を選んでください。</p>
      <div class="tokus">${TOKUS.map((t,i)=>`<button class="toku t-${t[0]} ${i===0?'base':''}" data-toku="${t[0]}"><span class="kanji">${t[1]}</span><span class="gyo">${t[2]}・${t[3]}${i===0?'　すべての徳の土台':''}　${D.filter(d=>(d[11]||[])[0]===t[0]).length}章</span><b>${t[4]}</b><span class="sub">${t[5]}</span></button>`).join("")}</div></section>
      <section class="chuyo"><h3>中庸であれ</h3><p>仁を欠いた徳は、独り歩きします。</p>
      <ul><li>仁のない義は「正義のためには手段を選ばず」になる</li><li>仁のない礼は、実のこもらない虚礼になる</li><li>仁のない智は、自分さえ良ければという利己の知恵になる</li><li>仁のない信は、狂信になる</li></ul></section>`;
  }else if(st.tab==="toku"){
    const t=tk(st.toku);
    let items=D.filter(d=>(d[11]||[]).includes(st.toku));
    const scs=SCENES.filter(s=>items.some(d=>d[9]>0&&d[7].includes(s[0])));
    if(st.sf)items=items.filter(d=>d[9]>0&&d[7].includes(st.sf));
    items=items.slice().sort((a,b)=>((b[11][0]===st.toku)-(a[11][0]===st.toku))||(b[9]-a[9])||(a[0]-b[0]));
    h=`<div class="resulthead"><button class="back" data-act="back">← 五徳の一覧へ</button>
      <div class="tokuhead t-${t[0]}"><span class="kanji">${t[1]}</span><div><h2>${t[1]}徳　${t[4]}</h2><p class="lead">${t[2]}・${t[3]}。${t[5]}。</p></div></div>
      <div class="chips"><span class="chiplabel">悩みと掛け合わせる</span>${scs.map(s=>`<button class="chip" data-sf="${s[0]}" aria-pressed="${st.sf===s[0]}">${s[1]}</button>`).join("")}</div></div>`+listHtml(items);
  }else if(st.tab==="all"){
    const items=D.filter(d=>d[1]===st.book);
    h=`<div class="books">${BOOKS.map((b,i)=>`<button class="chip" data-book="${i}" aria-pressed="${st.book===i}">${b}</button>`).join("")}</div>`+listHtml(items);
  }else{
    h=`<h2>しおりを挟んだ章</h2><p class="lead">しおりはこの端末のブラウザに保存されます。</p>`+listHtml(D.filter(d=>favs.has(d[0])));
  }
  view.innerHTML=h;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.dataset.tab){st.tab=t.dataset.tab;st.scene=null;st.emo=null;st.toku=null;st.tf=null;st.sf=null;st.q="";$("#q").value="";st.limit=20}
  else if(t.dataset.toku){st.tab="toku";st.toku=t.dataset.toku;st.sf=null;st.q="";$("#q").value="";st.limit=20;window.scrollTo(0,0)}
  else if(t.dataset.tf){st.tf=st.tf===t.dataset.tf?null:t.dataset.tf;st.limit=20}
  else if(t.dataset.sf){st.sf=st.sf===t.dataset.sf?null:t.dataset.sf;st.limit=20}
  else if(t.dataset.go){st.tab="home";st.scene=t.dataset.go;st.emo=null;st.tf=null;st.q="";$("#q").value="";st.limit=20;window.scrollTo(0,0)}
  else if(t.dataset.emo){st.emo=st.emo===t.dataset.emo?null:t.dataset.emo;st.limit=20}
  else if(t.dataset.book){st.book=+t.dataset.book;st.limit=20}
  else if(t.dataset.jump){const d=D.find(x=>x[0]===+t.dataset.jump);st.tab="all";st.book=d[1];st.limit=999;st.open.add(d[0]);render();
    const el=document.querySelector(`[data-n="${d[0]}"]`);if(el)el.scrollIntoView({block:"start"});return}
  else if(t.dataset.act==="back"){st.scene=null;st.emo=null;st.toku=null;st.tf=null;st.sf=null}
  else if(t.dataset.act==="more"){st.limit+=20}
  else if(t.dataset.act){const n=+t.closest(".card").dataset.n;
    if(t.dataset.act==="open"){st.open.has(n)?st.open.delete(n):st.open.add(n)}
    else{favs.has(n)?favs.delete(n):favs.add(n);saveFav()}}
  else return;
  render();
});
let timer;$("#q").addEventListener("input",e=>{clearTimeout(timer);timer=setTimeout(()=>{st.q=e.target.value.trim();st.limit=20;render()},200)});
render();
</script>
