<title>経営者の論語</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#F6F7F5; --surface:#FFFFFF; --ink:#1A1E23; --muted:#5E6870; --line:#D9DEDC;
  --ai:#1F3A5F; --shu:#B3362C; --on-ink:#FFFFFF;
  --moku:#2C6A58; --ka:#B3362C; --do:#94701C; --gon:#5F6770; --sui:#1F3A5F;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12161B; --surface:#1A2027; --ink:#E8EBE6; --muted:#98A2AB; --line:#2C353F;
    --ai:#9DB8DE; --shu:#E5766A; --on-ink:#12161B;
    --moku:#7DC0A5; --ka:#E5766A; --do:#D5B25E; --gon:#B5BCC4; --sui:#8FB0DC;
  }
}
:root[data-theme="dark"]{
  --ground:#12161B; --surface:#1A2027; --ink:#E8EBE6; --muted:#98A2AB; --line:#2C353F;
  --ai:#9DB8DE; --shu:#E5766A; --on-ink:#12161B;
  --moku:#7DC0A5; --ka:#E5766A; --do:#D5B25E; --gon:#B5BCC4; --sui:#8FB0DC;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.8;padding-inline:20px;padding-block:20px calc(88px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
p{margin:0}
.mincho{font-family:var(--mincho)}
.muted{color:var(--muted)}
.t-jin{--tc:var(--moku)}.t-gi{--tc:var(--gon)}.t-rei{--tc:var(--ka)}.t-chi{--tc:var(--sui)}.t-shin{--tc:var(--do)}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--mincho);font-weight:700;font-size:1.1rem;letter-spacing:.12em}
.date{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.link{color:var(--ai);font-size:.85rem;min-height:44px;display:inline-flex;align-items:center;align-self:flex-start}
.seal{font-family:var(--mincho);font-size:.7rem;color:var(--shu);border:1px solid var(--shu);padding:0 6px;line-height:1.6;letter-spacing:.08em;white-space:nowrap}
.tmark{font-family:var(--mincho);font-weight:700;color:var(--tc);border-bottom:1px solid var(--tc);line-height:1.3;font-size:.9rem;padding:0 1px}
h2{font-family:var(--mincho);font-weight:700;font-size:1rem;margin:0;letter-spacing:.06em;text-wrap:balance}
.lbl{font-size:.7rem;color:var(--muted);letter-spacing:.25em}

/* 五徳の環 */
.ring{position:relative;width:100%;max-width:390px;aspect-ratio:390/300;align-self:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:1.5px solid var(--tc);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tc);text-align:center;transition:background .15s,color .15s}
.node:hover{background:var(--tc);color:var(--surface)}
.node:hover small{color:var(--surface)}
.node b{font-family:var(--mincho);font-size:30px;line-height:1.05}
.node small{font-size:9px;color:var(--muted);letter-spacing:.04em;line-height:1.4}
.ring .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.ring .center b{font-family:var(--mincho);font-size:13px;color:var(--moku)}
.ring .center small{font-size:10px;color:var(--muted)}

/* 今朝の一章 */
.today{background:var(--surface);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px}
.today .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.week{display:flex;gap:4px}
.week span{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}
.week span.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.today .body{display:flex;gap:14px;color:var(--ink);text-decoration:none}
.today .body .hito{flex:1;font-family:var(--mincho);font-weight:700;font-size:1.05rem;line-height:1.7;text-wrap:pretty}
.today .body .tate{writing-mode:vertical-rl;font-family:var(--mincho);font-size:15px;line-height:1.8;max-height:130px;color:var(--muted)}
.today .ref{font-size:.72rem;color:var(--muted)}

/* 問いに答える */
.ask{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.ask label{font-size:.95rem;line-height:1.75}
.ask .row{display:flex;gap:8px}
.ask input{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:2px;background:var(--ground);font:inherit;font-size:.9rem;color:var(--ink)}
.ask input::placeholder{color:var(--muted)}
.btn-ink{height:44px;padding:0 18px;border-radius:2px;background:var(--ink);color:var(--on-ink);font-weight:700;font-size:.9rem;white-space:nowrap}
.done{font-size:.92rem;line-height:1.7}
.done .when{font-size:.72rem;color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}
.redo{color:var(--ai);font-size:.8rem;margin-left:6px}
.past{display:flex;flex-direction:column;gap:4px;font-size:.85rem;line-height:1.6}
.past div{display:flex;gap:10px}
.past span:first-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

ruby rt{font-size:.5em;font-weight:400;color:var(--muted);letter-spacing:0}
.ftog{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:14px;padding:0 10px;min-height:28px}
.ftog[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

/* 昨日の振り返り */
.review{background:var(--surface);border:1px solid var(--ink);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.review .a{font-family:var(--mincho);font-weight:700;font-size:1rem;line-height:1.7}
.review .ref{font-size:.72rem;color:var(--muted)}
.review .pick{display:flex;gap:8px}
.review .pick button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:2px;background:var(--ground);font-size:.9rem;text-align:center}
.review .pick button.yes{background:var(--ink);color:var(--on-ink);border-color:var(--ink);font-weight:700}
.rate{font-size:.85rem;line-height:1.7}
.mark{font-size:.72rem;color:var(--muted);margin-left:6px}
.mark.on{color:var(--moku)}

/* 行リスト */
.rows{display:flex;flex-direction:column}
.rowlink{display:flex;flex-direction:column;gap:5px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;color:var(--ink)}
.rowlink .meta{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--muted);flex-wrap:wrap}
.rowlink .hito{font-family:var(--mincho);font-weight:700;font-size:1rem;line-height:1.65;text-wrap:pretty}
.rowlink .kaki{font-family:var(--mincho);font-size:.82rem;line-height:1.7;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rowlink:hover .hito{color:var(--ai)}
.scene{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 0;border-bottom:1px solid var(--line);width:100%}
.scene b{font-weight:500;display:block;line-height:1.5}
.scene small{display:block;font-size:.75rem;color:var(--muted);line-height:1.5}
.scene .cnt{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.more{align-self:center;color:var(--ai);border:1px solid var(--line);background:var(--surface);padding:10px 22px;font-size:.85rem}
.empty{color:var(--muted);font-size:.9rem;padding:16px 0}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:.78rem;min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:17px;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--tc,var(--ink));border-color:var(--tc,var(--ink));color:var(--on-ink);font-weight:700}
.chiplabel{font-size:.7rem;color:var(--muted);letter-spacing:.12em;margin-right:2px}

.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:2px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:.9rem;color:var(--ink)}
.search input::placeholder{color:var(--muted)}

/* 徳の見出し */
.tokuhead{display:flex;gap:16px;align-items:center}
.tokuhead .big{font-family:var(--mincho);font-weight:700;font-size:56px;line-height:1;color:var(--tc)}
.tokuhead b{font-family:var(--mincho);font-size:1.05rem;display:block}
.tokuhead small{font-size:.78rem;color:var(--muted);line-height:1.6;display:block}
.note{padding:12px 14px;background:var(--surface);border:1px solid var(--line);font-size:.8rem;line-height:1.7;color:var(--muted)}
.note b{font-family:var(--mincho);color:var(--moku)}

/* 章を読む */
.chhead{display:flex;align-items:center;justify-content:space-between}
.bm{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.bm path{stroke:var(--shu);fill:transparent}
.bm[aria-pressed="true"] path{fill:var(--shu)}
.lead-side{display:flex;gap:18px;align-items:stretch}
.lead-side .l{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-width:0}
.lead-side .tate{writing-mode:vertical-rl;font-family:var(--mincho);font-size:24px;line-height:1.9;letter-spacing:.08em;max-height:250px}
.metaline{display:flex;flex-direction:column;gap:6px}
.metaline .ref{font-size:.75rem;color:var(--muted);letter-spacing:.1em}
.metaline .marks{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ch-hito{font-family:var(--mincho);font-weight:700;font-size:1.08rem;line-height:1.75;text-wrap:pretty}
.tate-full{writing-mode:vertical-rl;font-family:var(--mincho);font-size:21px;line-height:1.95;letter-spacing:.05em;max-height:280px;overflow-x:auto;max-width:100%;align-self:flex-end;padding-bottom:6px}
.yoko{font-family:var(--mincho);font-size:1.02rem;line-height:1.95}
.qbox{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.qbox .ask{border-top:0;padding-top:0}
.qbox .ask input{background:var(--surface)}
.seg{display:flex;gap:20px;font-size:.85rem}
.seg button{padding-bottom:4px;color:var(--muted);border-bottom:2px solid transparent;min-height:36px}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.text{font-size:.9rem;line-height:1.95;white-space:pre-wrap}
.gen{font-family:var(--mincho);font-size:1rem;letter-spacing:.05em;line-height:1.9}
.src{font-size:.72rem;color:var(--muted)}
.pager{display:flex;border-top:1px solid var(--line);margin-inline:-20px}
.pager button{flex:1;min-height:52px;padding:0 20px;font-size:.85rem;color:var(--muted)}
.pager button:last-child{text-align:right;color:var(--ink);font-weight:700}
.pager button:disabled{opacity:.35;cursor:default}

/* 記録 */
.panel{background:var(--surface);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px}
.bars{display:flex;align-items:flex-end;gap:16px;height:130px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar i{display:block;width:100%;background:var(--tc);min-height:2px}
.bar span{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar b{font-family:var(--mincho);font-size:1rem;color:var(--tc)}
.logrow{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.logrow .d{width:40px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.logrow .c{display:flex;flex-direction:column;gap:2px;min-width:0}
.logrow .c small{font-size:.72rem;color:var(--muted)}
.logrow .c span{font-size:.9rem;line-height:1.6}

/* 下タブ */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--ground);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabbar .in{max-width:560px;margin-inline:auto;display:flex}
nav.tabbar button{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;color:var(--muted);text-align:center}
nav.tabbar button b{font-family:var(--mincho);font-size:18px;line-height:1;font-weight:500}
nav.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabbar button[aria-current="page"] b{font-weight:700}
footer{border-top:1px solid var(--line);padding-top:14px;font-size:.7rem;color:var(--muted);line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <main id="view" class="stack"></main>
  <footer>
    現代語訳は下村湖人『現代訳論語』（青空文庫・著作権保護期間満了）、原文はウィキソース『論語』に拠ります。
    五徳（仁・義・礼・智・信）の考え方は服部真人の研修体系に基づきます。
    書き下し文・一言訳・問い・悩みと五徳の分類は服部真人が作成した参考情報で、学術的な定訳ではありません。
    答えとしおりは、この端末のブラウザにだけ保存されます。
  </footer>
</div>
<nav class="tabbar" aria-label="メニュー"><div class="in">
  <button data-tab="home"><b>環</b>五徳</button>
  <button data-tab="scenes"><b>悩</b>悩み</button>
  <button data-tab="all"><b>篇</b>全章</button>
  <button data-tab="record"><b>録</b>記録</button>
</div></nav>

<script>
const SCENES=[
 ["lonely","孤独だ・理解されない","誰も分かってくれない、評価されない"],
 ["lead","人が動かない・ついてこない","指示しても響かない、求心力が落ちた"],
 ["grow","人を育てたい・任せられない","教え方、伸ばし方、任せどき"],
 ["judge","人を見抜けない","採用・登用・誰と組むか"],
 ["trust","人間関係がこじれた","対立、裏切り、批判、言葉の行き違い"],
 ["vision","志・目標がブレた","何のためにやっているのか"],
 ["decide","決断できない・迷っている","進むか退くか、やり過ぎか不足か"],
 ["profit","利益と筋の板挟み","金・地位・名声と、義や信用"],
 ["fail","失敗した・逆境で折れそう","過ち、不遇、続かない"],
 ["self","自分を整えたい","怒り、驕り、焦り、言行不一致"]
];
// [id, 徳, 五行, 本能, 標語, 説明, 仁を欠いたときの戒め, 環での座標(390x300)]
const TOKUS=[
 ["jin","仁","木","守備本能","人を思いやることに素直にあれ","相手の立場に立ち、よく聞く。すべての徳の土台。","",[88,115]],
 ["rei","礼","火","伝達本能","礼を尽くすに素直にあれ","仁を形にして伝える。礼儀、節度、自分を律する所作。","仁のない礼は、実のこもらない虚礼になる。",[195,38]],
 ["shin","信","土","魅力本能","人を信じるに素直にあれ","心と言葉と行いの一致。四徳が整えば自ずとついてくる。","仁のない信は、狂信になる。",[302,115]],
 ["gi","義","金","攻撃本能","正義を貫くに素直にあれ","筋道と道理のある行動。逆境で折れない勇気と決断。","仁のない義は「正義のためには手段を選ばず」になる。",[261,241]],
 ["chi","智","水","習得本能","知恵を磨くに素直にあれ","学び、聞き、偏らずに物事と人を正しく判断する。","仁のない智は、自分さえ良ければという利己の知恵になる。",[129,241]]
];
const tk=id=>TOKUS.find(t=>t[0]===id);
const EMOS=["不安","怒り","孤独","迷い","焦り","落胆","慢心","疲れ"];
const BOOKS=["学而","為政","八佾","里仁","公冶長","雍也","述而","泰伯","子罕","郷党","先進","顔淵","子路","憲問","衛霊公","季氏","陽貨","微子","子張","堯曰"];
const KANSU=["〇","一","二","三","四","五","六","七","八","九"];
const HINTS={
 lonely:["孤独","ひとり","一人","理解され","分かってくれ","わかってくれ","評価され","認められ","報われ"],
 lead:["動かない","動いてくれ","ついてこ","言うことを聞","統率","リーダー","求心力","組織","士気","指示"],
 grow:["育て","育成","任せ","教え","後継","部下","若手","成長","研修","指導"],
 judge:["採用","登用","抜擢","人選","見抜","面接","見極め","誰と","付き合う","友人"],
 trust:["人間関係","裏切","対立","批判","悪口","揉め","もめ","こじれ","喧嘩","信頼","陰口","嫌われ"],
 vision:["志","目標","ブレ","ぶれ","理念","ビジョン","何のため","やる気","学び","初心"],
 decide:["決断","迷","決められ","撤退","判断","優先","進退","やめるか","辞めるか"],
 profit:["利益","お金","金","儲","売上","値引","名声","地位","信用","誠実","筋","不正"],
 fail:["失敗","逆境","挫折","折れ","落ち込","不遇","続かない","諦め","あきらめ","苦し","ミス"],
 self:["怒","イライラ","いらいら","驕","焦","慢心","感情","反省","言い過ぎ","口だけ","自分を"]
};
// [n, 篇index, 篇内番号, 原文, 書き下し, 一言訳, 問い, scenes, emo, rel, 下村訳, 五徳]
const D=/*DATA*/[];
const byN=n=>D[n-1];

/* ---------- 保存（この端末のみ） ---------- */
const KEY="rongo-v2";
let store={answers:{},fav:[],today:null,ruby:true};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) store=Object.assign(store,s);
  else{const old=JSON.parse(localStorage.getItem("rongo-fav")||"[]"); if(old.length) store.fav=old}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const favs=()=>new Set(store.fav);

/* ---------- 日付 ---------- */
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=dkey(new Date());
const WD="日月火水木金土";
const kanDate=d=>{const k=n=>n<10?KANSU[n]:n<20?"十"+(n%10?KANSU[n%10]:""):KANSU[Math.floor(n/10)]+"十"+(n%10?KANSU[n%10]:"");return `${k(d.getMonth()+1)}月${k(d.getDate())}日　${WD[d.getDay()]}曜`};
const md=s=>{const [,m,d]=s.split("-");return `${+m}/${+d}`};

/* ---------- 答え ---------- */
function allAnswers(){const a=[];for(const n in store.answers)for(const x of store.answers[n])a.push({n:+n,...x});return a.sort((p,q)=>q.d<p.d?-1:q.d>p.d?1:0)}
function answerDays(){return new Set(allAnswers().map(a=>a.d))}
function streak(){const days=answerDays();let c=0;const d=new Date();if(!days.has(dkey(d)))d.setDate(d.getDate()-1);
  while(days.has(dkey(d))){c++;d.setDate(d.getDate()-1)}return c}
function tokuCounts(days=30){const since=new Date();since.setDate(since.getDate()-days);const s=dkey(since);const c={jin:0,gi:0,rei:0,chi:0,shin:0};
  for(const a of allAnswers()){if(a.d<s)continue;const t=(byN(a.n)[11]||[])[0];if(t)c[t]++}return c}
function addAnswer(n,text){text=text.trim();if(!text)return;const arr=store.answers[n]||(store.answers[n]=[]);
  const i=arr.findIndex(x=>x.d===today);if(i>=0)arr[i].t=text;else arr.push({d:today,t:text});save()}

/* ---------- 今朝の一章 ---------- */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function pickToday(){
  if(store.today&&store.today.d===today&&byN(store.today.n))return byN(store.today.n);
  const answered=new Set(Object.keys(store.answers).map(Number));
  let pool=D.filter(d=>d[9]===3&&!answered.has(d[0]));
  const c=tokuCounts(),total=Object.values(c).reduce((a,b)=>a+b,0);
  if(total>=5){const least=Object.keys(c).sort((a,b)=>c[a]-c[b])[0];
    const p2=D.filter(d=>d[9]>=2&&d[11][0]===least&&!answered.has(d[0]));if(p2.length)pool=p2}
  if(!pool.length)pool=D.filter(d=>d[9]===3);
  const d=pool[hash(today)%pool.length];store.today={d:today,n:d[0]};save();return d;
}

function pendingReview(){return allAnswers().find(a=>a.d!==today&&a.done===undefined)||null}
function setDone(n,d,v){const arr=store.answers[n]||[];const x=arr.find(y=>y.d===d);if(x){x.done=v;save()}}
function doneRate(days=30){const since=new Date();since.setDate(since.getDate()-days);const s=dkey(since);
  let done=0,judged=0;for(const a of allAnswers()){if(a.d<s||a.done===undefined)continue;judged++;if(a.done)done++}return {done,judged}}

const $=s=>document.querySelector(s);
const view=$("#view");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ref=d=>`${BOOKS[d[1]]}第${d[1]+1}・${d[2]}章`;
const tmarks=d=>(d[11]||[]).map(t=>`<span class="tmark t-${t}">${tk(t)[1]}徳</span>`).join("");
const seal=d=>d[9]===3?'<span class="seal">名句</span>':'';
function rubyHtml(s,on){
  if(!s)return "";
  if(!on)return esc(s.replace(/《[^》]*》|｜/g,""));
  let out="",pend="",mark=false;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(c==="｜"){out+=esc(pend);pend="";mark=true;continue}
    if(c==="《"){
      const j=s.indexOf("》",i);if(j<0){pend+=c;continue}
      const rt=s.slice(i+1,j);i=j;
      let base=pend,before="";
      if(!mark){const m=pend.match(/[\u4e00-\u9fff\u3400-\u4dbf々〆ヶ]+$/);
        if(m){base=m[0];before=pend.slice(0,pend.length-base.length)}}
      out+=esc(before)+"<ruby>"+esc(base)+"<rt>"+esc(rt)+"</rt></ruby>";
      pend="";mark=false;continue}
    pend+=c;
  }
  return out+esc(pend);
}
const kakiPlain=d=>(d[12]||d[4]).replace(/《[^》]*》|｜/g,"");
const kakiHtml=d=>rubyHtml(d[12]||d[4],store.ruby!==false);
const qtext=d=>d[6]||"この章から、今日の自分に持ち帰ることは何か。";

function weekDots(){const days=answerDays();let h="";const d=new Date();d.setDate(d.getDate()-6);
  for(let i=0;i<7;i++){h+=`<span class="${days.has(dkey(d))?"on":""}" title="${md(dkey(d))}">${WD[d.getDay()]}</span>`;d.setDate(d.getDate()+1)}
  return `<div class="week" aria-label="この7日間に答えた日">${h}</div>`}

function askBlock(d,id){
  const mine=(store.answers[d[0]]||[]).find(x=>x.d===today);
  const editing=st.editing===d[0];
  if(mine&&!editing) return `<div class="ask"><label>${esc(qtext(d))}</label>
    <p class="done"><span class="when">今日</span>${esc(mine.t)}<button class="redo" data-act="redo" data-n="${d[0]}">書き直す</button></p></div>`;
  return `<div class="ask"><label for="${id}">${esc(qtext(d))}</label>
    <form class="row" data-form="${d[0]}"><input id="${id}" type="text" maxlength="200" placeholder="一行で答える" value="${mine?esc(mine.t):""}" autocomplete="off"><button class="btn-ink" type="submit">記す</button></form></div>`;
}

function rowItem(d,ctx){
  return `<button class="rowlink" data-open="${d[0]}" data-ctx="${ctx}">
    <span class="meta">${seal(d)}<span>${ref(d)}</span>${tmarks(d)}</span>
    <span class="hito">${esc(d[5])}</span><span class="kaki">${esc(kakiPlain(d))}</span></button>`}
function rowsHtml(items,ctxName){
  st.ctxs[ctxName]=items.map(d=>d[0]);
  if(!items.length)return `<p class="empty">当てはまる章がありません。</p>`;
  const lim=st.limit;
  return `<div class="rows">${items.slice(0,lim).map(d=>rowItem(d,ctxName)).join("")}</div>`+
    (items.length>lim?`<button class="more" data-act="more">続きを見る（残り${items.length-lim}章）</button>`:"")}

function rank(list,scene){
  return list.slice().sort((a,b)=>{
    if(scene){const ia=a[7].indexOf(scene),ib=b[7].indexOf(scene);
      const sa=a[9]*2-(ia<0?9:ia), sb=b[9]*2-(ib<0?9:ib); if(sb!==sa)return sb-sa}
    else if(b[9]!==a[9])return b[9]-a[9];
    return a[0]-b[0]});
}
function search(q){
  const hitScenes=Object.keys(HINTS).filter(k=>HINTS[k].some(w=>q.includes(w)));
  const hitTokus=TOKUS.filter(t=>q.includes(t[1]+"徳")).map(t=>t[0]);
  const words=q.split(/[\s　、。]+/).filter(Boolean);
  const scored=[];
  for(const d of D){
    let s=0;const hay=d[5]+d[4]+d[6]+d[10]+d[3];
    for(const w of words) if(hay.includes(w)) s+=4;
    hitScenes.forEach(k=>{const i=d[7].indexOf(k); if(i>=0) s+=3-i});
    hitTokus.forEach(k=>{const i=(d[11]||[]).indexOf(k); if(i>=0) s+=5-i*2});
    if(s>0) scored.push([s+d[9],d]);
  }
  scored.sort((a,b)=>b[0]-a[0]||a[1][0]-b[1][0]);
  return {items:scored.map(x=>x[1]),hitScenes,hitTokus};
}

function render(keepScroll){
  const c=cur();
  view.innerHTML=V[c.v](c);
  const tab=tabOf(c.v);
  document.querySelectorAll("nav.tabbar button").forEach(b=>b.toggleAttribute("aria-current",false)||(tab===b.dataset.tab&&b.setAttribute("aria-current","page")));
  if(!keepScroll)window.scrollTo(0,0);
}
function go(v,opts={}){st.limit=30;st.editing=null;if(v.v==="ch")st.seg="yaku";st.stack.push(v);render()}
function replaceTop(v){st.limit=30;st.editing=null;st.stack[st.stack.length-1]=v;render()}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t||t.getAttribute("type")==="submit")return;
  const ds=t.dataset;
  if(ds.tab){st.stack=[{v:ds.tab}];st.limit=30;render();return}
  if(ds.open){const ctx=ds.ctx||"x";if(ctx==="today")st.ctxs.today=[+ds.open];if(ctx==="log")st.ctxs.log=allAnswers().map(a=>a.n).filter((n,i,a)=>a.indexOf(n)===i);go({v:"ch",n:+ds.open,ctx});return}
  if(ds.goCh){replaceTop({...cur(),n:+ds.goCh});return}
  if(ds.toku){go({v:"toku",id:ds.toku});return}
  if(ds.scene){go({v:"scene",id:ds.scene});return}
  if(ds.sf!==undefined){cur().sf=ds.sf||null;st.limit=30;render(true);return}
  if(ds.tf){const c=cur();c.tf=c.tf===ds.tf?null:ds.tf;st.limit=30;render(true);return}
  if(ds.emo){const c=cur();c.emo=c.emo===ds.emo?null:ds.emo;st.limit=30;render(true);return}
  if(ds.book){cur().book=+ds.book;st.limit=30;render(true);return}
  if(ds.seg){st.seg=ds.seg;render(true);return}
  if(ds.act==="back"){if(st.stack.length>1)st.stack.pop();else st.stack=[{v:"home"}];st.editing=null;render();return}
  if(ds.act==="more"){st.limit+=30;render(true);return}
  if(ds.act==="redo"){st.editing=+ds.n;render(true);const i=view.querySelector(".ask input");if(i)i.focus();return}
  if(ds.did!==undefined){setDone(+ds.rn,ds.rd,ds.did==="1");render(true);return}
  if(ds.act==="ruby"){store.ruby=!(store.ruby!==false);save();render(true);return}
  if(ds.act==="fav"){const n=+ds.n,f=favs();f.has(n)?f.delete(n):f.add(n);store.fav=[...f];save();render(true);return}
});
document.addEventListener("submit",e=>{
  const f=e.target;e.preventDefault();
  if(f.dataset.form){const n=+f.dataset.form;addAnswer(n,f.querySelector("input").value);st.editing=null;render(true);return}
  if(f.hasAttribute("data-search")){const q=f.querySelector("input").value.trim();if(q)go({v:"search",q})}
});
render();
</script>
